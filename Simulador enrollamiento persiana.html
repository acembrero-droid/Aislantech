<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Cinemático de Enrollamiento</title>
    <style>
        :root {
            --bg: #1e293b;
            --panel: #0f172a;
            --text: #f8fafc;
            --accent: #3b82f6;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #60a5fa; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .range-header { display: flex; justify-content: space-between; }
        .val-display { color: #38bdf8; font-weight: bold; }
        
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background-color: #2563eb; }
        button.paused { background-color: #eab308; }
        
        #results {
            margin-top: 15px;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
        }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .result-row strong { color: #fff; }
        .highlight-data { font-size: 1.4rem; color: #10b981; font-weight: bold; display: block; margin-top: 5px; text-align: right; }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #334155 0%, #0f172a 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #cbd5e1;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Parámetros de Lama</h2>
    
    <div class="control-group">
        <div class="range-header">
            <label>Diámetro del Eje</label>
            <span id="val_eje" class="val-display">60 mm</span>
        </div>
        <input type="range" id="param_eje" min="40" max="150" value="60" oninput="actualizarParams()">
    </div>

    <div class="control-group">
        <div class="range-header">
            <label>Altura de Lama (h)</label>
            <span id="val_alto" class="val-display">45 mm</span>
        </div>
        <input type="range" id="param_alto" min="30" max="70" value="45" oninput="actualizarParams()">
    </div>

    <div class="control-group">
        <div class="range-header">
            <label>Espesor Enrollamiento (e)</label>
            <span id="val_espesor" class="val-display">9 mm</span>
        </div>
        <input type="range" id="param_espesor" min="5" max="20" value="9" step="0.5" oninput="actualizarParams()">
    </div>

    <div class="control-group">
        <div class="range-header">
            <label>Número de Lamas</label>
            <span id="val_lamas" class="val-display">40</span>
        </div>
        <input type="range" id="param_lamas" min="10" max="80" value="40" oninput="actualizarParams()">
    </div>

    <button id="btnAnimar" onclick="toggleAnimacion()">Animar Enrollamiento</button>

    <div id="results">
        <h3 style="margin-top:0; margin-bottom:15px; font-size:1rem; color:#94a3b8; border-bottom:1px solid #334155; padding-bottom:5px;">Datos del Cajón en Vivo</h3>
        <div class="result-row"><span>Lamas enrolladas:</span> <strong id="res_lamas">0 / 40</strong></div>
        <div class="result-row"><span>Altura del paño:</span> <strong id="res_altura">0 mm</strong></div>
        <div class="result-row" style="margin-top: 15px;">
            <span>Ø Exterior del Rollo:</span> 
            <span id="res_diametro" class="highlight-data">60.0 mm</span>
        </div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="simCanvas"></canvas>
    <div id="instructions">El cálculo se realiza mediante la Espiral Discreta de Arquímedes.</div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Estado de la simulación
    let params = { eje: 60, alto: 45, espesor: 9, lamas: 40 };
    let spiralPath = []; 
    
    // Variables de animación
    let lamasEnrolladas = 0; // K: Puede ser decimal para animación suave
    let isAnimating = true;
    let animDirection = 1; // 1 = enrollando, -1 = desenrollando
    let animSpeed = 0.2; // Velocidad de enrollamiento (lamas por frame)

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        dibujarFrame();
    }
    window.addEventListener('resize', resizeCanvas);

    // Lee los inputs y recalcula la espiral base
    function actualizarParams() {
        params.eje = parseFloat(document.getElementById('param_eje').value);
        params.alto = parseFloat(document.getElementById('param_alto').value);
        params.espesor = parseFloat(document.getElementById('param_espesor').value);
        params.lamas = parseInt(document.getElementById('param_lamas').value);

        document.getElementById('val_eje').innerText = params.eje + " mm";
        document.getElementById('val_alto').innerText = params.alto + " mm";
        document.getElementById('val_espesor').innerText = params.espesor + " mm";
        document.getElementById('val_lamas').innerText = params.lamas;

        // Si reducimos las lamas y estábamos por encima, ajustamos K
        if(lamasEnrolladas > params.lamas) lamasEnrolladas = params.lamas;

        precalcularEspiral();
        if(!isAnimating) dibujarFrame();
    }

    // Calcula la posición de cada lama como si toda la persiana estuviera enrollada
    function precalcularEspiral() {
        spiralPath = [];
        let r = params.eje / 2;
        let theta = 0;
        
        // La primera lama se ancla al eje
        spiralPath.push({ r: r, theta: theta });

        for (let i = 1; i <= params.lamas; i++) {
            // Delta ángulo aproximado según la longitud del arco (h) y el radio actual
            let dTheta = params.alto / r; 
            theta += dTheta;
            
            // Fórmula Arquímedes: El radio aumenta el espesor (e) por cada 2*PI radianes (vuelta completa)
            r = (params.eje / 2) + (params.espesor * (theta / (2 * Math.PI)));
            
            spiralPath.push({ r: r, theta: theta });
        }
    }

    function toggleAnimacion() {
        isAnimating = !isAnimating;
        const btn = document.getElementById('btnAnimar');
        if (isAnimating) {
            btn.innerText = "Pausar Simulación";
            btn.classList.remove('paused');
            loop();
        } else {
            btn.innerText = "Reanudar Animación";
            btn.classList.add('paused');
        }
    }

    // Dibuja el perfil cóncavo-convexo de la lama (simulación visual)
    function dibujarPerfilLama(ctx, h, e) {
        ctx.beginPath();
        const w = e * 1.5; // Ampliamos visualmente un poco el espesor para que el perfil luzca mejor
        
        // Coordenadas relativas (origen en el centro de la lama, dibujada en vertical)
        ctx.moveTo(-w/4, -h/2); // Enganche superior
        ctx.lineTo(w/4, -h/2);
        
        // Lado Convexo (Exterior)
        ctx.bezierCurveTo(w, -h/4, w, h/4, w/4, h/2);
        
        // Enganche inferior
        ctx.lineTo(-w/4, h/2);
        
        // Lado Cóncavo (Interior hacia el eje)
        ctx.bezierCurveTo(w/2, h/4, w/2, -h/4, -w/4, -h/2);
        
        ctx.closePath();
        
        // Gradiente metálico
        let grd = ctx.createLinearGradient(-w, 0, w, 0);
        grd.addColorStop(0, "#64748b");
        grd.addColorStop(0.5, "#cbd5e1");
        grd.addColorStop(1, "#475569");
        
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = "#1e293b";
        ctx.stroke();
    }

    function dibujarFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- CALCULAR ESCALA Y CÁMARA ---
        // Queremos que el rollo quede centrado en el tercio superior de la pantalla
        let maxR = spiralPath[spiralPath.length - 1].r;
        let scale = (canvas.width / 4) / maxR; 
        if (scale > 8) scale = 8; // Limite de zoom máximo
        if (scale < 2) scale = 2; // Limite de zoom mínimo

        const cx = canvas.width / 2;
        const cy = canvas.height * 0.35; // Eje posicionado algo más arriba

        // --- INTERPOLACIÓN DE K (Lamas enrolladas) ---
        let fk = Math.floor(lamasEnrolladas);
        let t = lamasEnrolladas - fk;
        
        let r_k, theta_k;
        if (fk >= params.lamas) {
            r_k = spiralPath[params.lamas].r;
            theta_k = spiralPath[params.lamas].theta;
        } else {
            // Interpolar entre el índice inferior y superior para suavidad
            r_k = spiralPath[fk].r * (1-t) + spiralPath[fk+1].r * t;
            theta_k = spiralPath[fk].theta * (1-t) + spiralPath[fk+1].theta * t;
        }

        // --- ACTUALIZAR DATOS UI ---
        document.getElementById('res_lamas').innerText = `${Math.round(lamasEnrolladas)} / ${params.lamas}`;
        document.getElementById('res_altura').innerText = `${((params.lamas - lamasEnrolladas) * params.alto).toFixed(0)} mm`;
        document.getElementById('res_diametro').innerText = `${(r_k * 2).toFixed(1)} mm`;

        // --- DIBUJO ---
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        // 1. Dibujar el Eje Octogonal/Redondo
        ctx.beginPath();
        ctx.arc(0, 0, params.eje / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#475569";
        ctx.fill();
        ctx.lineWidth = 1/scale;
        ctx.strokeStyle = "#f8fafc";
        ctx.stroke();
        // Marca en el eje para ver rotación
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo((params.eje/2) * Math.cos(-theta_k), (params.eje/2) * Math.sin(-theta_k));
        ctx.stroke();

        // 2. Dibujar las lamas
        for (let i = 0; i < params.lamas; i++) {
            let x, y, anguloLama;

            if (i <= lamasEnrolladas) {
                // LAMA EN EL ROLLO (Espiral)
                // Restamos theta_k para que todo el sistema gire haciendo que el punto tangente se quede a la derecha
                let anguloRelativo = spiralPath[i].theta - theta_k;
                
                x = spiralPath[i].r * Math.cos(anguloRelativo);
                y = spiralPath[i].r * Math.sin(anguloRelativo);
                
                // La rotación de la lama es tangente al círculo (angulo + 90 grados)
                anguloLama = anguloRelativo + (Math.PI / 2);
                
            } else {
                // LAMA COLGANDO (Paño desplegado)
                // Cuelga desde el punto tangente actual (r_k)
                x = r_k; 
                y = (i - lamasEnrolladas) * params.alto; // Cae en Y según la distancia sobrante
                anguloLama = 0; // Cuelga totalmente recta en vertical
            }

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(anguloLama);
            dibujarPerfilLama(ctx, params.alto, params.espesor);
            ctx.restore();
        }

        ctx.restore();
    }

    function loop() {
        if (!isAnimating) return;

        lamasEnrolladas += animSpeed * animDirection;

        // Cambio de dirección al llegar a los extremos
        if (lamasEnrolladas >= params.lamas) {
            lamasEnrolladas = params.lamas;
            animDirection = -1; // Comienza a desenrollar
        } else if (lamasEnrolladas <= 0) {
            lamasEnrolladas = 0;
            animDirection = 1;  // Comienza a enrollar
        }

        dibujarFrame();
        requestAnimationFrame(loop);
    }

    // Inicialización
    actualizarParams();
    toggleAnimacion(); // Arranca en pausa por defecto si la quitamos, la llamamos para iniciar
    resizeCanvas();
</script>
</body>
</html>
