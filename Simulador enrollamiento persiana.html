<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Persiana Físico - Avanzado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; background: #1a1a1a; color: white; height: 100vh; overflow: hidden; }
        #menu { width: 340px; padding: 20px; background: #252525; border-right: 1px solid #444; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        #canvas-container { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #0f0f0f; }
        input, button { padding: 10px; border-radius: 4px; border: none; width: 100%; box-sizing: border-box; }
        input[type="number"] { background: #333; color: white; border: 1px solid #555; }
        .btn-start { background: #10b981; color: white; font-weight: bold; cursor: pointer; }
        .btn-motor { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; user-select: none; margin-top: 10px; }
        .btn-motor:active { background: #2563eb; transform: scale(0.98); }
        .panel { background: #333; padding: 15px; border-radius: 6px; font-size: 0.85rem; }
        .data-big { font-size: 1.5rem; color: #60a5fa; font-weight: bold; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div id="menu">
    <h2>Simulador Físico V2</h2>
    
    <label>Archivo DXF (Opcional):</label>
    <input type="file" id="dxfInput" accept=".dxf">
    
    <div style="display: flex; gap: 10px;">
        <div>
            <label>Eje (mm):</label>
            <input type="number" id="ejeDiam" value="60">
        </div>
        <div>
            <label>Nº Lamas:</label>
            <input type="number" id="numLamas" value="40">
        </div>
    </div>

    <button class="btn-start" onclick="iniciarMundo()">Generar Paño</button>

    <div class="panel">
        <strong>Control del Motor:</strong>
        <p style="font-size: 0.75rem; color: #aaa; margin: 5px 0;">Mantén presionado para enrollar.</p>
        <button class="btn-motor" id="btnEnrollar">⬆ MANTENER PARA ENROLLAR</button>
        <button class="btn-motor" style="background:#eab308;" id="btnDesenrollar">⬇ MANTENER PARA DESENROLLAR</button>
    </div>

    <div class="panel">
        <strong>Diámetro de Enrollamiento:</strong>
        <div class="data-big" id="displayDiametro">0.0 mm</div>
    </div>
</div>

<div id="canvas-container"></div>

<script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Body, Events, Vector } = Matter;

    let engine, render, runner;
    let ejeMotor;
    let lamasFisicas = [];
    let centroEscena = { x: 500, y: 300 };
    let escala = 3; // 1mm = 3px
    
    // Dimensiones por defecto (se sobrescriben si subes DXF)
    let dimLama = { alto: 45.9, espesor: 9.0 };

    // Lector de DXF
    document.getElementById('dxfInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const dxf = new DxfParser().parseSync(e.target.result);
                if(dxf.header.$EXTMAX) {
                    dimLama.alto = dxf.header.$EXTMAX.y - dxf.header.$EXTMIN.y;
                    // Forzamos un espesor estándar si el DXF es solo una línea simple
                    dimLama.espesor = (dxf.header.$EXTMAX.x - dxf.header.$EXTMIN.x) || 9.0; 
                    alert(`DXF Cargado: Alto ${dimLama.alto.toFixed(1)}mm`);
                }
            } catch(err) { console.error("Error DXF", err); }
        };
        reader.readAsText(file);
    });

    // Crear un cuerpo compuesto (cóncavo) simulando la forma de la lama
    function crearLamaMultigono(x, y, alto, espesor) {
        const h = alto * escala;
        const t = espesor * escala;
        
        // Dividimos la lama en 3 segmentos angulados para formar una curva "C"
        const tercioH = h / 2.8; 
        const offsetCurva = t * 0.6;
        const anguloCurva = 0.25; // Radianes
        
        // Los 3 polígonos que conforman una sola lama
        const top = Bodies.rectangle(x - offsetCurva, y - tercioH, t, tercioH*1.2, { angle: -anguloCurva });
        const mid = Bodies.rectangle(x, y, t, tercioH*1.2, { angle: 0 });
        const bot = Bodies.rectangle(x - offsetCurva, y + tercioH, t, tercioH*1.2, { angle: anguloCurva });

        return Body.create({
            parts: [top, mid, bot],
            friction: 0.6,          // Fricción entre lamas para que se agarren al enrollar
            restitution: 0.0,       // Sin rebote
            density: 0.002,         // Masa realista
            frictionAir: 0.02,      // Resistencia al aire para que no pendulen locamente
            render: { fillStyle: '#60a5fa', strokeStyle: '#1e3a8a', lineWidth: 1 }
        });
    }

    function iniciarMundo() {
        if (engine) {
            Engine.clear(engine);
            Render.stop(render);
            Runner.stop(runner);
            document.getElementById('canvas-container').innerHTML = '';
        }

        const dEje = parseFloat(document.getElementById('ejeDiam').value);
        const nLamas = parseInt(document.getElementById('numLamas').value);

        // Aumentamos iteraciones para que la "cadena" sea más rígida y no se estire
        engine = Engine.create({ positionIterations: 10, velocityIterations: 10 });
        
        render = Render.create({
            element: document.getElementById('canvas-container'),
            engine: engine,
            options: { width: 1000, height: 800, wireframes: false, background: '#0f0f0f' }
        });

        const rEjePx = (dEje / 2) * escala;

        // 1. Crear Eje Dinámico (Con masa pero anclado al fondo)
        ejeMotor = Bodies.circle(centroEscena.x, centroEscena.y, rEjePx, {
            friction: 1, density: 0.05,
            render: { fillStyle: '#555', strokeStyle: '#888', lineWidth: 2 }
        });

        // Anclar el eje al centro (Pivote)
        const anclaEje = Constraint.create({
            pointA: { x: centroEscena.x, y: centroEscena.y },
            bodyB: ejeMotor,
            length: 0,
            stiffness: 1
        });

        Composite.add(engine.world, [ejeMotor, anclaEje]);

        // 2. Crear las Lamas y unirlas
        lamasFisicas = [];
        let cuerpoAnterior = ejeMotor;
        
        for (let i = 0; i < nLamas; i++) {
            // Posición inicial: Colgando desde el borde derecho del eje
            const x = centroEscena.x + rEjePx + (dimLama.espesor * escala / 2);
            const y = centroEscena.y + rEjePx + (i * dimLama.alto * escala);

            const lama = crearLamaMultigono(x, y, dimLama.alto, dimLama.espesor);
            lamasFisicas.push(lama);

            // Restricción (Bisagra)
            let configEnganche = {
                bodyA: cuerpoAnterior,
                bodyB: lama,
                pointB: { x: 0, y: -(dimLama.alto * escala / 2) }, // Arriba de la nueva lama
                stiffness: 0.9,
                length: 0
            };

            // El primer enganche va pegado a la superficie exterior derecha del eje
            if (i === 0) {
                configEnganche.pointA = { x: rEjePx, y: 0 }; 
            } else {
                configEnganche.pointA = { x: 0, y: (dimLama.alto * escala / 2) }; // Abajo de la lama anterior
            }

            Composite.add(engine.world, [lama, Constraint.create(configEnganche)]);
            cuerpoAnterior = lama;
        }

        // Bucle de actualización para medir el diámetro constantemente
        Events.on(engine, 'afterUpdate', medirDiametro);

        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);
    }

    // --- LÓGICA DEL MOTOR Y CONTROLES ---
    let velocidadMotor = 0;

    document.getElementById('btnEnrollar').addEventListener('mousedown', () => velocidadMotor = -0.06); // Gira anti-horario
    document.getElementById('btnEnrollar').addEventListener('mouseup', () => velocidadMotor = 0);
    document.getElementById('btnEnrollar').addEventListener('mouseleave', () => velocidadMotor = 0);

    document.getElementById('btnDesenrollar').addEventListener('mousedown', () => velocidadMotor = 0.06); // Gira horario
    document.getElementById('btnDesenrollar').addEventListener('mouseup', () => velocidadMotor = 0);
    document.getElementById('btnDesenrollar').addEventListener('mouseleave', () => velocidadMotor = 0);

    // Aplicar torque al eje en cada fotograma
    Events.on(engine, 'beforeUpdate', function() {
        if (ejeMotor) {
            // Utilizamos Velocidad Angular para que arrastre físicamente el peso de las lamas
            Body.setAngularVelocity(ejeMotor, velocidadMotor);
        }
    });

    // Función para calcular el tamaño del rollo en tiempo real
    function medirDiametro() {
        if (!ejeMotor || lamasFisicas.length === 0) return;
        
        let distanciaMaxPx = 0;
        
        // Medir la distancia desde el centro del eje hasta la lama más alejada
        for (let lama of lamasFisicas) {
            const dx = lama.position.x - centroEscena.x;
            const dy = lama.position.y - centroEscena.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > distanciaMaxPx) distanciaMaxPx = dist;
        }

        // El radio real es la distancia máxima al centro + la mitad del espesor de la lama
        const radioRolloMm = (distanciaMaxPx / escala) + (dimLama.espesor / 2);
        const diametroTotal = radioRolloMm * 2;

        document.getElementById('displayDiametro').innerText = diametroTotal.toFixed(1) + " mm";
    }

    // Iniciar automáticamente al cargar
    window.onload = iniciarMundo;
</script>
</body>
</html>
