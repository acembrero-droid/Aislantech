<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador Físico de Persiana</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; background: #1a1a1a; color: white; height: 100vh; }
        #menu { width: 320px; padding: 20px; background: #252525; border-right: 1px solid #444; display: flex; flex-direction: column; gap: 15px; }
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        input, button { padding: 10px; border-radius: 4px; border: none; width: 100%; box-sizing: border-box; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        .data-panel { font-size: 0.8rem; background: #333; padding: 10px; border-radius: 4px; }
        table { width: 100%; font-size: 0.75rem; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #444; padding: 5px; text-align: left; }
    </style>
</head>
<body>

<div id="menu">
    <h2>Simulador Físico</h2>
    <label>Archivo DXF de Lama:</label>
    <input type="file" id="dxfInput" accept=".dxf">
    
    <label>Diámetro Eje (mm):</label>
    <input type="number" id="ejeDiam" value="60">

    <label>Número de Lamas:</label>
    <input type="number" id="numLamas" value="25">

    <button onclick="iniciarSimulacion()">Iniciar Motor Físico</button>

    <div class="data-panel">
        <strong>Resultados en Tiempo Real:</strong>
        <div id="stats">Esperando inicio...</div>
        <table id="tablaFisica">
            <thead>
                <tr><th>Lama</th><th>Radio (mm)</th><th>Ø Total</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="canvas-container">
    <div id="sim-info" style="position:absolute; top:10px; left:10px; color:#aaa;">Motor: Matter.js</div>
</div>

<script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Vector, Body } = Matter;

    let engine, render, runner;
    let dimensionesLama = { alto: 45.9, espesor: 9.0 }; // Valores por defecto

    // Carga de DXF
    document.getElementById('dxfInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const dxf = new DxfParser().parseSync(e.target.result);
            if(dxf.header.$EXTMAX) {
                dimensionesLama.alto = dxf.header.$EXTMAX.y - dxf.header.$EXTMIN.y;
                dimensionesLama.espesor = 9; // El espesor suele ser la cara corta, pero para colisión usamos un valor nominal
                console.log("Dimensiones cargadas:", dimensionesLama);
            }
        };
        reader.readAsText(file);
    });

    function iniciarSimulacion() {
        if (engine) { // Resetear si ya existe
            Engine.clear(engine);
            Render.stop(render);
            Runner.stop(runner);
            render.canvas.remove();
        }

        const dEje = parseFloat(document.getElementById('ejeDiam').value);
        const nLamas = parseInt(document.getElementById('numLamas').value);
        
        // 1. Crear Motor
        engine = Engine.create({ gravity: { x: 0, y: 1 } });
        render = Render.create({
            element: document.getElementById('canvas-container'),
            engine: engine,
            options: { width: 800, height: 800, wireframes: false, background: '#111' }
        });

        // 2. Crear Eje (Cuerpo estático que rota)
        const escala = 3; // Píxeles por mm para visualización
        const eje = Bodies.circle(400, 400, (dEje / 2) * escala, { 
            isStatic: true, 
            render: { fillStyle: '#444' } 
        });

        // 3. Crear Lamas y Conectarlas
        let lamas = [];
        let prevLama = null;

        for (let i = 0; i < nLamas; i++) {
            // Creamos la lama como un rectángulo con la forma del DXF
            // Posición inicial: desplegada hacia abajo
            const x = 400 + (dEje / 2) * escala;
            const y = 400 + (i * dimensionesLama.alto * escala);
            
            const lama = Bodies.rectangle(x, y, dimensionesLama.espesor * escala, dimensionesLama.alto * escala, {
                chamfer: { radius: 2 },
                friction: 0.5,
                restitution: 0.1,
                render: { fillStyle: i % 2 === 0 ? '#3b82f6' : '#60a5fa' }
            });

            // Conectar al eje o a la lama anterior (Efecto bisagra)
            if (i === 0) {
                const joint = Constraint.create({
                    bodyA: eje,
                    pointA: { x: (dEje / 2) * escala, y: 0 },
                    bodyB: lama,
                    pointB: { x: 0, y: -(dimensionesLama.alto / 2) * escala },
                    stiffness: 0.8,
                    length: 0
                });
                Composite.add(engine.world, joint);
            } else {
                const joint = Constraint.create({
                    bodyA: prevLama,
                    pointA: { x: 0, y: (dimensionesLama.alto / 2) * escala },
                    bodyB: lama,
                    pointB: { x: 0, y: -(dimensionesLama.alto / 2) * escala },
                    stiffness: 0.8,
                    length: 2 // Pequeño juego en la articulación
                });
                Composite.add(engine.world, joint);
            }

            lamas.push(lama);
            prevLama = lama;
        }

        Composite.add(engine.world, [eje, ...lamas]);

        // 4. Lógica de Rotación (Enrollamiento)
        let torque = 0.05;
        Matter.Events.on(engine, 'beforeUpdate', () => {
            // Hacemos que el eje rote lentamente para enrollar
            Body.setAngle(eje, eje.angle + 0.02);
            
            // Actualizar tabla cada cierto tiempo
            if (engine.timing.timestamp % 100 < 20) actualizarDatos(lamas, eje, escala);
        });

        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);
    }

    function actualizarDatos(lamas, eje, escala) {
        const tbody = document.querySelector('#tablaFisica tbody');
        tbody.innerHTML = "";
        
        // Calculamos el radio máximo actual midiendo la distancia de las lamas al centro del eje
        let maxR = 0;
        lamas.forEach((lama, index) => {
            const dist = Math.sqrt(Math.pow(lama.position.x - 400, 2) + Math.pow(lama.position.y - 400, 2)) / escala;
            if (dist > maxR) maxR = dist;

            if (index % 5 === 0 || index === lamas.length - 1) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${index+1}</td><td>${dist.toFixed(1)}</td><td>${(dist*2).toFixed(1)}</td>`;
                tbody.appendChild(tr);
            }
        });
        document.getElementById('stats').innerText = `Ø Máximo actual: ${(maxR * 2).toFixed(2)} mm`;
    }
</script>
</body>
</html>
