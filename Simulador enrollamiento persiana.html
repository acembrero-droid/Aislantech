<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Cinemático PRO - Calibración Libre</title>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --border: #334155; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }
        #sidebar { width: 380px; background: var(--panel); padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid var(--border); overflow-y: auto; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        h2 { margin: 0; color: #60a5fa; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        h3 { margin: 10px 0 5px 0; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; }
        label { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 4px; }
        input[type="file"], input[type="number"], input[type="range"], select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: white; box-sizing: border-box; }
        
        .control-box { background: #0f172a; border: 1px solid #3b82f6; border-radius: 6px; padding: 10px; }
        .btn-action { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #2563eb; }
        .material-box { background: #1e293b; border: 1px dashed #64748b; border-radius: 6px; padding: 10px; margin-top: 10px; }
        .material-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
        .material-item label { margin: 0; font-size: 0.8rem; color: #cbd5e1; flex-shrink: 0; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .checkbox-group input { width: 16px; height: 16px; cursor: pointer; }
        .checkbox-group label { margin: 0; cursor: pointer; font-size: 0.8rem; font-weight: normal; }
        
        .data-panel { background: var(--bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.9rem; margin-top: auto; }
        .highlight { color: #10b981; font-weight: bold; font-size: 1.1rem; }
        .status { padding: 8px; border-radius: 4px; font-size: 0.8rem; background: #334155; color: #94a3b8; text-align: center; margin-top: 5px; }
        .status.ok { background: #064e3b; color: #34d399; }
        
        #canvas-container { flex-grow: 1; position: relative; display: flex; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); cursor: crosshair; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #instructionOverlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #3b82f6; color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; display: none; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 20; font-size: 1.1rem; border: 2px solid #fff; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Persianas PRO - Calibración Libre</h2>
    
    <div>
        <h3>1. Diseño DXF</h3>
        <input type="file" id="fileDxf" accept=".dxf">
        <div id="dxfStatus" class="status">Esperando archivo...</div>
    </div>

    <div class="control-box">
        <label style="color:#60a5fa;">Ajustes de Lama</label>
        <button id="btnRecalibrar" class="btn-action" onclick="iniciarCalibracion()" style="display:none; margin-bottom:10px;">📐 Re-seleccionar Puntos de Giro</button>
        
        <div style="margin-top: 5px;">
            <label>Giro Reposo Bisagra: <strong id="outGiro" style="color:#38bdf8;">0º</strong></label>
            <input type="range" id="valAjusteGiro" min="-45" max="45" step="1" value="0" oninput="document.getElementById('outGiro').innerText = this.value + 'º'; if(appState==='SIMULATING') simular();">
        </div>
        <div class="checkbox-group" style="margin-top: 10px;">
            <input type="checkbox" id="chkFlipX" onchange="if(appState==='SIMULATING') simular();">
            <label for="chkFlipX">Invertir Cara (Interior/Exterior)</label>
        </div>
    </div>

    <div id="panelMateriales" class="material-box" style="display: none;">
        <label style="color:#fde047; border-bottom:1px solid #334155; padding-bottom:5px; margin-bottom:10px;">Asignación de Materiales</label>
        <div id="listaMateriales"></div>
    </div>

    <div>
        <h3>2. Paño y Eje</h3>
        <label>Diámetro del Eje (mm)</label>
        <input type="number" id="valEje" value="60" oninput="if(appState==='SIMULATING') simular();">
    </div>
    <div>
        <label>Espesor Crecimiento por Vuelta (mm)</label>
        <input type="number" id="valEspesor" value="9" step="0.1" oninput="if(appState==='SIMULATING') simular();">
    </div>
    <div>
        <label>Número de Lamas: <strong id="outLamas" style="color:#38bdf8;">35</strong></label>
        <input type="range" id="valLamas" min="5" max="80" value="35" oninput="document.getElementById('outLamas').innerText = this.value; if(appState==='SIMULATING') simular();">
    </div>

    <div class="data-panel">
        <div style="margin-bottom: 8px; display:flex; justify-content:space-between;">
            <span>Alto útil (Distancia Bisagras):</span> <strong id="infoAlto">-- mm</strong>
        </div>
        <div style="margin-bottom: 8px; display:flex; justify-content:space-between;">
            <span>Altura total paño:</span> <strong id="infoPaño">-- mm</strong>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
            <span>Ø Exterior Cajón:</span> <span id="infoDiam" class="highlight">-- mm</span>
        </div>
    </div>
</div>

<div id="canvas-container">
    <div id="instructionOverlay">Paso 1: Selecciona el PUNTO DE GIRO SUPERIOR</div>
    <canvas id="simCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    let dxfPoligons = []; 
    let allVertices = [];
    let bbox = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
    let escalaGlobal = 4;

    let appState = 'IDLE'; 
    let pSup = null; 
    let pInf = null; 
    let hoverPoint = null; 

    let calibConfig = { cx: 0, cy: 0, scale: 1, midX: 0, midY: 0 };

    const MATERIALES = [
        { id: 'transparente', nombre: 'Hueco / Ninguno', color: 'rgba(0,0,0,0)', stroke: '#94a3b8' },
        { id: 'aluminio_blanco', nombre: 'Aluminio Lacado', color: '#f8fafc', stroke: '#cbd5e1' },
        { id: 'aluminio_gris', nombre: 'Aluminio Anodizado', color: '#94a3b8', stroke: '#475569' },
        { id: 'espuma', nombre: 'Espuma Poliuretano', color: '#fef08a', stroke: '#ca8a04' },
        { id: 'pvc_negro', nombre: 'Goma / PVC Negro', color: '#334155', stroke: '#0f172a' }
    ];

    window.addEventListener('resize', () => {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        if (appState === 'SIMULATING') simular();
        else if (appState.startsWith('CALIBRATING')) { updateCalibConfig(); renderCalibracion(); }
    });
    canvas.width = document.getElementById('canvas-container').clientWidth;
    canvas.height = document.getElementById('canvas-container').clientHeight;

    // 1. EXTRACTOR DE DXF
    document.getElementById('fileDxf').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const dxfData = new DxfParser().parseSync(evt.target.result);
                let segmentos = extraerSegmentosRaw(dxfData.entities, dxfData.blocks);
                dxfPoligons = construirPoligonos(segmentos);
                
                allVertices = [];
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                dxfPoligons.forEach(pol => pol.pts.forEach(p => {
                    allVertices.push(p);
                    if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
                    if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
                }));

                if (dxfPoligons.length > 0) bbox = { minX, maxX, minY, maxY };
                
                document.getElementById('dxfStatus').className = "status ok";
                document.getElementById('dxfStatus').innerText = `Geometría OK: ${dxfPoligons.length} capas`;
                
                generarInterfazMateriales();
                iniciarCalibracion(); 
            } catch(err) {
                console.error(err); alert("Error al leer el DXF.");
            }
        };
        reader.readAsText(file);
    });

    function extraerSegmentosRaw(entities, blocks, offsetX = 0, offsetY = 0) {
        let segs = [];
        if(!entities) return segs;
        entities.forEach(ent => {
            if (ent.type === 'LINE') segs.push({ p1: {x: ent.vertices[0].x+offsetX, y: ent.vertices[0].y+offsetY}, p2: {x: ent.vertices[1].x+offsetX, y: ent.vertices[1].y+offsetY} });
            else if (ent.type === 'LWPOLYLINE' || ent.type === 'POLYLINE') {
                for(let i=0; i<ent.vertices.length-1; i++) segs.push({ p1: {x: ent.vertices[i].x+offsetX, y: ent.vertices[i].y+offsetY}, p2: {x: ent.vertices[i+1].x+offsetX, y: ent.vertices[i+1].y+offsetY} });
                if (ent.shape || ent.closed) segs.push({ p1: {x: ent.vertices[ent.vertices.length-1].x+offsetX, y: ent.vertices[ent.vertices.length-1].y+offsetY}, p2: {x: ent.vertices[0].x+offsetX, y: ent.vertices[0].y+offsetY} });
            } else if (ent.type === 'ARC' || ent.type === 'CIRCLE') {
                let cx = ent.center.x + offsetX, cy = ent.center.y + offsetY, r = ent.radius;
                let sa = ent.startAngle || 0, ea = ent.endAngle || (Math.PI*2);
                if (ea < sa) ea += Math.PI * 2;
                let lastP = {x: cx + r*Math.cos(sa), y: cy + r*Math.sin(sa)};
                for(let i=1; i<=15; i++) { let newP = {x: cx + r*Math.cos(sa + (ea-sa)*(i/15)), y: cy + r*Math.sin(sa + (ea-sa)*(i/15))}; segs.push({ p1: lastP, p2: newP }); lastP = newP; }
            } else if (ent.type === 'INSERT' && blocks && blocks[ent.name]) {
                let pos = ent.position || {x:0, y:0};
                segs = segs.concat(extraerSegmentosRaw(blocks[ent.name].entities, blocks, pos.x + offsetX, pos.y + offsetY));
            }
        });
        return segs;
    }

    function construirPoligonos(segmentosRaw) {
        const tolerancia = 0.05; 
        let pool = [...segmentosRaw], poligonos = [];
        while(pool.length > 0) {
            let path = []; let current = pool.shift(); path.push(current.p1, current.p2);
            let conectando = true;
            while(conectando && pool.length > 0) {
                conectando = false; let head = path[0], tail = path[path.length - 1];
                for(let i=0; i<pool.length; i++) {
                    let s = pool[i];
                    if (Math.hypot(tail.x-s.p1.x, tail.y-s.p1.y) < tolerancia) { path.push(s.p2); pool.splice(i,1); conectando = true; break; }
                    if (Math.hypot(tail.x-s.p2.x, tail.y-s.p2.y) < tolerancia) { path.push(s.p1); pool.splice(i,1); conectando = true; break; }
                    if (Math.hypot(head.x-s.p1.x, head.y-s.p1.y) < tolerancia) { path.unshift(s.p2); pool.splice(i,1); conectando = true; break; }
                    if (Math.hypot(head.x-s.p2.x, head.y-s.p2.y) < tolerancia) { path.unshift(s.p1); pool.splice(i,1); conectando = true; break; }
                }
            }
            let cerrado = Math.hypot(path[0].x-path[path.length-1].x, path[0].y-path[path.length-1].y) < tolerancia;
            let area = 0;
            if (cerrado) { for (let i = 0; i < path.length - 1; i++) area += path[i].x * path[i+1].y - path[i+1].x * path[i].y; area = Math.abs(area / 2); }
            poligonos.push({ pts: path, closed: cerrado, area: area, materialId: 'transparente' });
        }
        return poligonos.sort((a, b) => b.area - a.area);
    }

    function generarInterfazMateriales() {
        const contenedor = document.getElementById('listaMateriales');
        contenedor.innerHTML = ""; let areasCerradas = 0;
        dxfPoligons.forEach((pol, index) => {
            if (!pol.closed) return;
            areasCerradas++;
            if (areasCerradas === 1) pol.materialId = 'aluminio_gris';
            else if (areasCerradas === 2) pol.materialId = 'espuma';

            const div = document.createElement('div'); div.className = 'material-item';
            const select = document.createElement('select');
            MATERIALES.forEach(mat => { let opt = document.createElement('option'); opt.value = mat.id; opt.innerText = mat.nombre; if (mat.id === pol.materialId) opt.selected = true; select.appendChild(opt); });
            select.onchange = (e) => { pol.materialId = e.target.value; if(appState==='SIMULATING') simular(); };
            
            let label = document.createElement('label'); label.innerText = `Capa ${index + 1}`;
            div.appendChild(label); div.appendChild(select); contenedor.appendChild(div);
        });
        document.getElementById('panelMateriales').style.display = areasCerradas > 0 ? 'block' : 'none';
    }

    // 2. SISTEMA DE CALIBRACIÓN LIBRE Y SOFT-SNAP
    function updateCalibConfig() {
        calibConfig.cx = canvas.width / 2;
        calibConfig.cy = canvas.height / 2;
        // Zoom generoso para que haya espacio para clicar fuera de la pieza
        calibConfig.scale = Math.min(canvas.width / (bbox.maxX - bbox.minX), canvas.height / (bbox.maxY - bbox.minY)) * 0.6;
        calibConfig.midX = (bbox.minX + bbox.maxX) / 2;
        calibConfig.midY = (bbox.minY + bbox.maxY) / 2;
    }

    function toScreen(pt) {
        return {
            x: calibConfig.cx + (pt.x - calibConfig.midX) * calibConfig.scale,
            y: calibConfig.cy - (pt.y - calibConfig.midY) * calibConfig.scale 
        };
    }

    // Transformación Inversa (Pantalla a DXF)
    function fromScreen(sx, sy) {
        return {
            x: calibConfig.midX + (sx - calibConfig.cx) / calibConfig.scale,
            y: calibConfig.midY - (sy - calibConfig.cy) / -calibConfig.scale // - porque invertimos Y en toScreen
        };
    }

    function getPuntoLibreOSnap(sx, sy) {
        let puntoReal = fromScreen(sx, sy);
        let minDistScreen = 15; // 15 píxeles de imán
        let closestVertex = null;

        allVertices.forEach(pt => {
            let sp = toScreen(pt);
            let dist = Math.hypot(sp.x - sx, sp.y - sy);
            if (dist < minDistScreen) { 
                minDistScreen = dist; 
                closestVertex = pt; 
            }
        });

        // Si encontró uno cerca, devuelve ese vértice, si no, devuelve exactamente donde está el ratón
        return closestVertex ? closestVertex : puntoReal;
    }

    function iniciarCalibracion() {
        if(dxfPoligons.length === 0) return;
        appState = 'CALIBRATING_P1';
        pSup = null; pInf = null;
        document.getElementById('instructionOverlay').style.display = 'block';
        document.getElementById('instructionOverlay').innerText = "📍 Paso 1: Clic en PUNTO DE GIRO SUPERIOR";
        document.getElementById('instructionOverlay').style.backgroundColor = '#3b82f6';
        document.getElementById('btnRecalibrar').style.display = 'none';
        updateCalibConfig();
        renderCalibracion();
    }

    document.getElementById('simCanvas').addEventListener('mousemove', (e) => {
        if (appState === 'SIMULATING') return;
        const rect = canvas.getBoundingClientRect();
        hoverPoint = getPuntoLibreOSnap(e.clientX - rect.left, e.clientY - rect.top);
        renderCalibracion();
    });

    document.getElementById('simCanvas').addEventListener('mousedown', (e) => {
        if (appState === 'SIMULATING' || !hoverPoint) return;
        
        if (appState === 'CALIBRATING_P1') {
            pSup = hoverPoint;
            appState = 'CALIBRATING_P2';
            document.getElementById('instructionOverlay').innerText = "📍 Paso 2: Clic en PUNTO DE GIRO INFERIOR";
            document.getElementById('instructionOverlay').style.backgroundColor = '#ef4444';
        } else if (appState === 'CALIBRATING_P2') {
            pInf = hoverPoint;
            appState = 'SIMULATING';
            document.getElementById('instructionOverlay').style.display = 'none';
            document.getElementById('btnRecalibrar').style.display = 'block';
            
            let altoLama = Math.hypot(pInf.x - pSup.x, pInf.y - pSup.y);
            document.getElementById('infoAlto').innerText = altoLama.toFixed(2) + " mm";
            simular();
        }
    });

    function renderCalibracion() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(calibConfig.cx, calibConfig.cy);
        ctx.scale(calibConfig.scale, -calibConfig.scale); 
        ctx.translate(-calibConfig.midX, -calibConfig.midY);

        dxfPoligons.forEach(pol => {
            ctx.beginPath();
            ctx.moveTo(pol.pts[0].x, pol.pts[0].y);
            for(let k=1; k<pol.pts.length; k++) ctx.lineTo(pol.pts[k].x, pol.pts[k].y);
            ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
            ctx.lineWidth = 1.5 / calibConfig.scale;
            ctx.stroke();
        });
        ctx.restore();

        // Dibujar cruz/punto activo
        if (hoverPoint) {
            let hp = toScreen(hoverPoint);
            
            // Dibujar cruz de precisión
            ctx.beginPath(); ctx.moveTo(hp.x - 10, hp.y); ctx.lineTo(hp.x + 10, hp.y);
            ctx.moveTo(hp.x, hp.y - 10); ctx.lineTo(hp.x, hp.y + 10);
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();

            ctx.beginPath(); ctx.arc(hp.x, hp.y, 6, 0, Math.PI*2); 
            ctx.fillStyle = appState === 'CALIBRATING_P1' ? '#3b82f6' : '#ef4444'; 
            ctx.fill();

            if (pSup && appState === 'CALIBRATING_P2') {
                let sp = toScreen(pSup);
                ctx.beginPath(); ctx.moveTo(sp.x, sp.y); ctx.lineTo(hp.x, hp.y);
                ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        if (pSup) {
            let sp = toScreen(pSup);
            ctx.beginPath(); ctx.arc(sp.x, sp.y, 6, 0, Math.PI*2); ctx.fillStyle = '#3b82f6'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();
        }
    }

    // 3. MOTOR DE SIMULACIÓN
    function simular() {
        if(appState !== 'SIMULATING' || !pSup || !pInf) return;

        const dEje = parseFloat(document.getElementById('valEje').value) || 60;
        const eLama = parseFloat(document.getElementById('valEspesor').value) || 9;
        const numLamas = parseInt(document.getElementById('valLamas').value) || 35;
        const offsetGiroRad = (parseFloat(document.getElementById('valAjusteGiro').value) || 0) * (Math.PI / 180);
        const flipCara = document.getElementById('chkFlipX').checked ? -1 : 1;

        const altoLama = Math.hypot(pInf.x - pSup.x, pInf.y - pSup.y);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const radioEstimado = (dEje / 2) + (numLamas * eLama / 2) + 20;
        escalaGlobal = Math.min(canvas.width / (radioEstimado*2.5), canvas.height / (radioEstimado*2.5));
        if (escalaGlobal < 1) escalaGlobal = 1;

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(escalaGlobal, escalaGlobal);

        ctx.beginPath(); ctx.arc(0, 0, dEje / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#1e293b"; ctx.fill();
        ctx.lineWidth = 1.5 / escalaGlobal; ctx.strokeStyle = "#475569"; ctx.stroke();

        let bisagras = [{ x: dEje/2, y: 0, thetaGlobal: 0 }];
        let radioMaximo = dEje / 2;

        for (let i = 0; i < numLamas; i++) {
            let pAnt = bisagras[i];
            let rActual = Math.hypot(pAnt.x, pAnt.y);
            let dTheta = 0.005, dist = 0, targetX = 0, targetY = 0;
            let testTheta = pAnt.thetaGlobal;
            
            while (dist < altoLama) {
                testTheta += 0.005;
                let rTest = rActual + (eLama * ((testTheta - pAnt.thetaGlobal) / (2 * Math.PI)));
                targetX = rTest * Math.cos(testTheta);
                targetY = rTest * Math.sin(testTheta);
                dist = Math.hypot(targetX - pAnt.x, targetY - pAnt.y);
            }

            let anguloBase = Math.atan2(targetY - pAnt.y, targetX - pAnt.x);
            let anguloReal = anguloBase + offsetGiroRad;

            let pNuevo = {
                x: pAnt.x + altoLama * Math.cos(anguloReal),
                y: pAnt.y + altoLama * Math.sin(anguloReal),
                thetaGlobal: testTheta
            };

            bisagras.push(pNuevo);
            if (Math.hypot(pNuevo.x, pNuevo.y) > radioMaximo) radioMaximo = Math.hypot(pNuevo.x, pNuevo.y);
        }

        // --- MAGIA: Enlazar DXF al punto de giro seleccionado ---
        for (let i = 0; i < numLamas; i++) {
            let p1 = bisagras[i], p2 = bisagras[i+1];

            ctx.save();
            ctx.translate(p1.x, p1.y);
            ctx.rotate(Math.atan2(p2.y - p1.y, p2.x - p1.x));
            ctx.scale(1, flipCara); 
            ctx.scale(1, -1);       

            let dxfAngle = Math.atan2(pInf.y - pSup.y, pInf.x - pSup.x);
            ctx.rotate(dxfAngle);
            
            // TRASLACIÓN CRÍTICA: Llevamos el punto seleccionado libremente por el usuario al (0,0) de la bisagra
            ctx.translate(-pSup.x, -pSup.y);

            dxfPoligons.forEach(pol => {
                ctx.beginPath();
                ctx.moveTo(pol.pts[0].x, pol.pts[0].y);
                for(let k=1; k<pol.pts.length; k++) ctx.lineTo(pol.pts[k].x, pol.pts[k].y);
                
                let material = MATERIALES.find(m => m.id === pol.materialId) || MATERIALES[0];
                if (pol.closed) { ctx.fillStyle = material.color; ctx.fill(); }
                
                ctx.strokeStyle = material.stroke;
                ctx.lineWidth = 1.0 / escalaGlobal;
                ctx.stroke();
            });
            ctx.restore();
            
            ctx.beginPath(); ctx.arc(p1.x, p1.y, 1.5 / escalaGlobal, 0, Math.PI*2);
            ctx.fillStyle = "#ef4444"; ctx.fill();
        }

        ctx.restore();

        document.getElementById('infoPaño').innerText = (altoLama * numLamas).toFixed(0) + " mm";
        document.getElementById('infoDiam').innerText = ((radioMaximo * 2) + eLama).toFixed(1) + " mm";
    }

</script>
</body>
</html>
