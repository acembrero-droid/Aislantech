<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador Cinemático con Render DXF</title>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #1e293b; color: #f8fafc; }
        #sidebar { width: 320px; background: #0f172a; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #334155; }
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #334155, #0f172a); }
        canvas { border: 1px solid #475569; border-radius: 8px; background: #fff; }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; }
        input[type="file"], input[type="number"], input[type="range"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; margin-top: 5px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        .data-panel { background: #1e293b; padding: 15px; border-radius: 6px; border: 1px solid #334155; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="color: #60a5fa; margin-top: 0;">Simulador de Cadena</h2>
    
    <div>
        <label>1. Importar diseño de lama (.dxf)</label>
        <input type="file" id="fileDxf" accept=".dxf">
    </div>

    <div>
        <label>Diámetro del Eje (mm)</label>
        <input type="number" id="valEje" value="60">
    </div>

    <div>
        <label>Espesor de enrollamiento (mm)</label>
        <input type="number" id="valEspesor" value="9" step="0.5">
    </div>

    <div>
        <label>Nº de Lamas</label>
        <input type="range" id="valLamas" min="5" max="60" value="30" oninput="document.getElementById('outLamas').innerText = this.value; simular();">
        <span id="outLamas">30</span>
    </div>

    <div class="data-panel">
        <div style="margin-bottom: 8px;">Altura de lama: <strong id="infoAlto">-- mm</strong></div>
        <div style="margin-bottom: 8px;">Altura paño: <strong id="infoPaño">-- mm</strong></div>
        <div style="color: #10b981;">Ø Enrollamiento: <strong id="infoDiam">-- mm</strong></div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="simCanvas" width="800" height="800"></canvas>
</div>

<script>
    let dxfData = null;
    let dxfEntities = [];
    let lamaH = 45; // Altura por defecto
    let boundingBox = { minX: 0, maxX: 0, minY: 0, maxY: 0 };

    // 1. Cargar y procesar el DXF
    document.getElementById('fileDxf').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const parser = new DxfParser();
                dxfData = parser.parseSync(evt.target.result);
                procesarGeometriaDXF();
                simular();
            } catch(err) {
                alert("Error al leer el DXF. Asegúrate de que sea formato ASCII.");
                console.error(err);
            }
        };
        reader.readAsText(file);
    });

    // Extrae entidades dibujables y la altura real
    function procesarGeometriaDXF() {
        dxfEntities = [];
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

        dxfData.entities.forEach(ent => {
            if (ent.type === 'LINE' || ent.type === 'POLYLINE' || ent.type === 'LWPOLYLINE') {
                dxfEntities.push(ent);
                let vertices = ent.vertices || [ent];
                vertices.forEach(v => {
                    if (v.x < minX) minX = v.x;
                    if (v.x > maxX) maxX = v.x;
                    if (v.y < minY) minY = v.y;
                    if (v.y > maxY) maxY = v.y;
                });
            }
        });

        boundingBox = { minX, maxX, minY, maxY };
        lamaH = maxY - minY;
        document.getElementById('infoAlto').innerText = lamaH.toFixed(2) + " mm";
    }

    // Dibuja las entidades del DXF en el contexto actual
    function dibujarDXF(ctx) {
        ctx.beginPath();
        dxfEntities.forEach(ent => {
            if (ent.vertices && ent.vertices.length > 0) {
                ctx.moveTo(ent.vertices[0].x, ent.vertices[0].y);
                for (let i = 1; i < ent.vertices.length; i++) {
                    ctx.lineTo(ent.vertices[i].x, ent.vertices[i].y);
                }
            } else if (ent.type === 'LINE') {
                ctx.moveTo(ent.startPoint.x, ent.startPoint.y);
                ctx.lineTo(ent.endPoint.x, ent.endPoint.y);
            }
        });
        ctx.strokeStyle = "#1e3a8a";
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }

    // 2. Simulación de la Cadena Cinemática
    function simular() {
        const dEje = parseFloat(document.getElementById('valEje').value);
        const eLama = parseFloat(document.getElementById('valEspesor').value);
        const numLamas = parseInt(document.getElementById('valLamas').value);

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Centro y Escala visual
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const scale = 5; 

        // Dibujar Eje
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(0, 0, dEje / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#e2e8f0";
        ctx.fill();
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 1/scale;
        ctx.stroke();
        ctx.restore();

        let puntosBisagra = [];
        let rActual = dEje / 2;
        let thetaActual = 0;
        
        // El primer punto (enganche al eje)
        puntosBisagra.push({ x: rActual, y: 0, r: rActual, theta: thetaActual });

        // Encontrar los siguientes puntos de la cadena
        for (let i = 0; i < numLamas; i++) {
            let pAnt = puntosBisagra[i];
            
            // Buscar un ángulo dTheta tal que la distancia lineal al punto anterior sea exactamente la altura de la lama (lamaH)
            let dTheta = 0.01;
            let dist = 0;
            let pNuevo = {x:0, y:0};
            let rNuevo = pAnt.r;

            // Incrementamos el ángulo poco a poco hasta que el segmento mida "lamaH"
            while (dist < lamaH) {
                dTheta += 0.01;
                let thetaTest = pAnt.theta + dTheta;
                // El radio crece según el espesor por vuelta
                rNuevo = (dEje / 2) + (eLama * (thetaTest / (2 * Math.PI)));
                
                pNuevo.x = rNuevo * Math.cos(thetaTest);
                pNuevo.y = rNuevo * Math.sin(thetaTest);
                
                // Distancia euclidiana entre bisagras
                dist = Math.sqrt(Math.pow(pNuevo.x - pAnt.x, 2) + Math.pow(pNuevo.y - pAnt.y, 2));
            }

            puntosBisagra.push({ x: pNuevo.x, y: pNuevo.y, r: rNuevo, theta: pAnt.theta + dTheta });
        }

        // 3. Renderizado de las lamas y el DXF
        let diametroMax = dEje;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        for (let i = 0; i < numLamas; i++) {
            let p1 = puntosBisagra[i];
            let p2 = puntosBisagra[i+1];

            if (p2.r * 2 > diametroMax) diametroMax = p2.r * 2;

            // Ángulo de inclinación de este eslabón específico
            let anguloEslabon = Math.atan2(p2.y - p1.y, p2.x - p1.x);

            ctx.save();
            // Trasladar al punto de inicio (p1)
            ctx.translate(p1.x, p1.y);
            
            // Rotar para alinear el eje Y con el siguiente punto (p2)
            // Restamos PI/2 porque normalmente en el DXF el alto se dibuja en el eje Y
            ctx.rotate(anguloEslabon - Math.PI/2);

            // Si hay un DXF cargado, lo dibujamos
            if (dxfEntities.length > 0) {
                // Alineamos el bounding box del DXF para que empiece en el (0,0) de nuestra bisagra
                ctx.translate(-boundingBox.minX, -boundingBox.minY);
                dibujarDXF(ctx);
            } else {
                // Placeholder curvo si no hay DXF
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(eLama*2, lamaH/2, 0, lamaH);
                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = eLama;
                ctx.stroke();
            }

            // Dibujar los puntos de articulación (bisagras) para visualización técnica
            ctx.restore();
            
            ctx.beginPath();
            ctx.arc(p1.x, p1.y, 1/scale, 0, Math.PI*2);
            ctx.fillStyle = "red";
            ctx.fill();
        }

        ctx.restore();

        // Actualizar UI
        document.getElementById('infoPaño').innerText = (lamaH * numLamas).toFixed(0) + " mm";
        document.getElementById('infoDiam').innerText = (diametroMax + eLama).toFixed(1) + " mm";
    }

    // Inicializar inputs
    document.getElementById('valEje').addEventListener('input', simular);
    document.getElementById('valEspesor').addEventListener('input', simular);
    simular();
</script>

</body>
</html>
