<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aislantech · Análisis Térmico Pro (ISO 10077-2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #EDD00E; --color-primary-dark: #B8860B; --color-primary-light: #FFF8DC;
            --color-secondary: #3E3E3E; --color-light: #F5F5F5; --color-dark: #333333; --color-gray: #666666; 
            --transition: all 0.2s ease; --border-radius: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Open Sans',sans-serif; background:var(--color-light); color:var(--color-gray); overflow-x: hidden; }
        h1,h2,h3,.card-title,.btn { font-family:'Montserrat',sans-serif; font-weight:600; color:var(--color-dark); }
        .container { width:100%; max-width:1450px; margin:0 auto; padding:20px; }
        
        .header-container { display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom: 2px solid var(--color-primary); margin-bottom: 20px;}
        .logo-aislan { color:var(--color-secondary); font-size:1.5rem; font-weight:700; }
        .logo-tech { color:var(--color-primary); font-size:1.5rem; font-weight:800; }

        .card { background:white; border-radius:var(--border-radius); box-shadow:0 5px 15px rgba(0,0,0,0.05); margin-bottom:20px; border-top:4px solid var(--color-primary); }
        .card-body { padding:1.2rem; }
        
        .controls-grid { display:flex; flex-wrap:wrap; gap:1.2rem; align-items:flex-end;}
        .control-group { display:flex; flex-direction:column; gap:6px; flex: 1; min-width: 150px;}
        label { font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--color-secondary); }
        input, select { padding:8px 12px; border:1px solid #ddd; border-radius:var(--border-radius); font-size:0.85rem; }
        
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:var(--border-radius); font-weight:700; border:none; cursor:pointer; transition:var(--transition); font-size:0.85rem; }
        .btn-primary { background:var(--color-primary); color:var(--color-dark); }
        .btn-success { background:#2e7d32; color:white; }
        .btn-outline { background:transparent; border:2px solid #ddd; color:var(--color-secondary); }
        .btn-edit { background:#0288d1; color:white; }
        
        .mode-switch { display:flex; background:#eee; border-radius:var(--border-radius); overflow:hidden; border:1px solid #ddd; }
        .mode-btn { flex:1; padding:10px; font-weight:700; font-size:0.8rem; border:none; background:transparent; cursor:pointer; color: #666; }
        .mode-btn.active { background:var(--color-secondary); color:white; }
        
        .status-bar { background:var(--color-primary-light); border-left:4px solid var(--color-primary); padding:12px 16px; border-radius:var(--border-radius); margin:15px 0; font-weight:600; font-size:0.85rem; display: flex; align-items: center; gap: 10px;}
        
        .canvas-wrapper { position:relative; background:#fff; border-radius:var(--border-radius); border:1px solid #ddd; overflow:hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        canvas { display:block; width:100%; height:auto; cursor:crosshair; background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 20px 20px; }
        canvas.grabbing { cursor: grabbing !important; }
        
        .legend-panel { display:flex; flex-wrap:wrap; gap:0.5rem; background:white; padding:12px; border-radius:var(--border-radius); margin:15px 0; align-items:center; border:1px solid #ddd; }
        .legend-item { display:flex; align-items:center; gap:8px; font-size:0.75rem; cursor:pointer; padding: 6px 10px; border-radius: 4px; transition: var(--transition); }
        .legend-item:hover { background: #f0f0f0; }
        .legend-color { width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); }
        
        .boundary-legend { display:flex; gap:1rem; align-items:center; margin-left:auto; font-size:0.75rem; font-weight:700; border-left: 1px solid #ddd; padding-left: 15px; }
        .boundary-swatch { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid #000; }
        
        #customMatPanel { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; margin-bottom: 15px; display: none; }
        .result-card { display:none; background:#2e7d32; color:white; padding:20px; border-radius:var(--border-radius); margin-top:20px; text-align:center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <div><span class="logo-aislan">AISLAN</span><span class="logo-tech">TECH</span> <small style="margin-left:10px; opacity:0.6;">ISO 10077-2 Analysis</small></div>
        <div id="solverStatus" style="font-weight: bold; color: #d32f2f; display:none;"><i class="fas fa-circle-notch fa-spin"></i> Analizando flujo de calor...</div>
    </div>
    
    <div class="card">
        <div class="card-body">
            <div class="controls-grid">
                <div class="control-group" style="flex: 1.5;">
                    <label>Herramienta Activa</label>
                    <div class="mode-switch">
                        <button id="btnModeMat" class="mode-btn active"><i class="fas fa-fill-drip"></i> Materiales</button>
                        <button id="btnModeBound" class="mode-btn"><i class="fas fa-vector-square"></i> Contornos</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Resolución</label>
                    <select id="gridRes">
                        <option value="80">Baja (80x80)</option>
                        <option value="120" selected>Estándar (120x120)</option>
                        <option value="200">Alta (200x200)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Archivo DXF</label>
                    <input type="file" id="dxfFile" accept=".dxf">
                </div>

                <div class="control-group">
                    <label>bf (mm)</label>
                    <input type="number" id="LpInput" value="100">
                </div>

                <div class="control-group" style="flex: 2;">
                    <label>Acciones</label>
                    <div style="display:flex; gap:5px;">
                        <button id="btnRotate" class="btn btn-outline btn-sm"><i class="fas fa-sync-alt"></i> 90º</button>
                        <button id="btnZoomReset" class="btn btn-outline btn-sm"><i class="fas fa-compress-arrows-alt"></i> Centrar</button>
                        <button id="btnBackToEdit" class="btn btn-edit" style="display:none;"><i class="fas fa-pencil-alt"></i> Volver</button>
                        <button id="calcBtn" class="btn btn-success" disabled><i class="fas fa-play-circle"></i> CALCULAR Uf</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="customMatPanel">
        <div style="display:flex; gap:15px; align-items:flex-end;">
            <div class="control-group"><label>Nombre</label><input type="text" id="customMatName" placeholder="Espuma PUR"></div>
            <div class="control-group"><label>Conductividad (λ)</label><input type="number" id="customMatK" step="0.001" value="0.035"></div>
            <div class="control-group"><label>Color</label><input type="color" id="customMatColor" value="#ff9800" style="height:38px; padding:0;"></div>
            <button id="btnAddCustomMat" class="btn btn-primary">Crear</button>
        </div>
    </div>

    <div class="status-bar" id="status"><i class="fas fa-info-circle"></i> <span>Esperando archivo DXF...</span></div>

    <div class="legend-panel" id="legend"></div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="1100" height="650"></canvas>
    </div>

    <div id="result" class="result-card"></div>
</div>

<script>
(function() {
    // ──── MATERIALES ────
    let materials = [
        { name: "Cámara Aire", k: 0.026, color: "#ecf0f1" },
        { name: "Aluminio", k: 160.0, color: "#95a5a6" },
        { name: "Poliamida 25% FV", k: 0.30, color: "#d35400" },
        { name: "PVC Rígido", k: 0.17, color: "#9b59b6" },
        { name: "EPDM / Juntas", k: 0.25, color: "#2c3e50" },
        { name: "Aislante (XPS)", k: 0.035, color: "#f1c40f" },
        { name: "Vidrio", k: 1.0, color: "#81d4fa" }
    ];

    let polygons = [], boundaryEdges = [], boundaryAdj = [];
    let minX, maxX, minY, maxY;
    let selectedPoly = -1, hoveredPolyIdx = -1, hoveredEdgeIdx = -1;
    let editMode = 'MATERIAL';

    // Zoom y Pan Corregidos
    let zoomLevel = 1, offsetX = 0, offsetY = 0, baseScale = 1;
    let isDragging = false, dragStartX = 0, dragStartY = 0, hasDragged = false;

    // Thermal Engine
    let T = null, kGrid = null, dx, dy, isExt, isIntMeas, isIntSec;
    let showThermalMap = false;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.querySelector('#status span');

    // ──── GESTIÓN DE VISTA (ZOOM AL PUNTERO) ────
    function getTransform() {
        const cw = canvas.width, ch = canvas.height;
        const cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        return {
            s: baseScale * zoomLevel,
            tx: x => offsetX + cw / 2 + (x - cxW) * baseScale * zoomLevel,
            ty: y => offsetY + ch / 2 - (y - cyW) * baseScale * zoomLevel
        };
    }

    function getWorld(sx, sy) {
        const cw = canvas.width, ch = canvas.height;
        const cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        return {
            x: cxW + (sx - offsetX - cw / 2) / (baseScale * zoomLevel),
            y: cyW - (sy - offsetY - ch / 2) / (baseScale * zoomLevel)
        };
    }

    canvas.onwheel = e => {
        e.preventDefault();
        if (!polygons.length) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        const wBefore = getWorld(mx, my);
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomLevel = Math.max(0.1, Math.min(zoomLevel * factor, 50));
        
        const wAfter = getWorld(mx, my);
        offsetX += (wAfter.x - wBefore.x) * baseScale * zoomLevel;
        offsetY -= (wAfter.y - wBefore.y) * baseScale * zoomLevel;
        draw();
    };

    // ──── DXF PARSER COMPLETO ────
    document.getElementById('dxfFile').onchange = e => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const segments = parseDXF(ev.target.result);
                polygons = buildTopology(segments, 0.5);
                recalcBounds();
                boundaryEdges = extractBoundaryEdges(polygons);
                document.getElementById('calcBtn').disabled = false;
                showThermalMap = false;
                setStatus("DXF Cargado. Selecciona materiales y contornos.");
                draw();
            } catch(err) { setStatus("Error DXF: " + err.message); }
        };
        reader.readAsText(file);
    };

    function parseDXF(text) {
        const lines = text.split(/\r?\n/);
        let idx = 0, inEntities = false, segments = [];
        let curE = null;

        const getP = () => {
            if (idx >= lines.length - 1) return null;
            const c = parseInt(lines[idx++].trim()), v = lines[idx++].trim();
            return [c, v];
        };

        while (idx < lines.length - 1) {
            const pair = getP(); if (!pair) break;
            const [c, v] = pair;
            if (c === 0 && v === 'SECTION') { if (getP()[1] === 'ENTITIES') inEntities = true; continue; }
            if (c === 0 && v === 'ENDSEC') { inEntities = false; continue; }
            if (!inEntities) continue;

            if (c === 0) {
                if (curE) flushE(curE);
                curE = (v === 'LINE' || v === 'LWPOLYLINE' || v === 'CIRCLE' || v === 'ARC') ? {type: v, vertices: []} : null;
            } else if (curE) {
                const val = parseFloat(v);
                if (curE.type === 'LINE') {
                    if (c === 10) curE.x1 = val; if (c === 20) curE.y1 = val;
                    if (c === 11) curE.x2 = val; if (c === 21) curE.y2 = val;
                } else if (curE.type === 'LWPOLYLINE') {
                    if (c === 70) curE.closed = (parseInt(v) & 1) !== 0;
                    if (c === 10) curE.vertices.push({x: val, y: 0, bulge: 0});
                    if (c === 20) curE.vertices[curE.vertices.length-1].y = val;
                    if (c === 42) curE.vertices[curE.vertices.length-1].bulge = val;
                } else if (curE.type === 'CIRCLE' || curE.type === 'ARC') {
                    if (c === 10) curE.cx = val; if (c === 20) curE.cy = val; 
                    if (c === 40) curE.r = val; if (c === 50) curE.start = val; if (c === 51) curE.end = val;
                }
            }
        }
        function flushE(e) {
            if (e.type === 'LINE') segments.push({x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2});
            else if (e.type === 'LWPOLYLINE') {
                for (let i=0; i<e.vertices.length-1; i++) addB(e.vertices[i], e.vertices[i+1], e.vertices[i].bulge);
                if (e.closed && e.vertices.length > 2) addB(e.vertices[e.vertices.length-1], e.vertices[0], e.vertices[e.vertices.length-1].bulge);
            } else if (e.type === 'CIRCLE' || e.type === 'ARC') {
                let rs = (e.start||0)*Math.PI/180, re = (e.end||360)*Math.PI/180;
                if (re <= rs) re += 2*Math.PI;
                const steps = Math.max(12, Math.floor(Math.abs(re-rs)*e.r/2));
                for (let i=0; i<steps; i++){
                    const a1 = rs + (re-rs)*i/steps, a2 = rs + (re-rs)*(i+1)/steps;
                    segments.push({x1: e.cx+e.r*Math.cos(a1), y1: e.cy+e.r*Math.sin(a1), x2: e.cx+e.r*Math.cos(a2), y2: e.cy+e.r*Math.sin(a2)});
                }
            }
        }
        function addB(p1, p2, b) {
            if (!b || Math.abs(b) < 1e-4) segments.push({x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y});
            else {
                const d = Math.hypot(p2.x-p1.x, p2.y-p1.y), th = 4*Math.atan(b), r = Math.abs(d/(2*Math.sin(th/2)));
                const cx = (p1.x+p2.x)/2 + (-(p2.y-p1.y)/d*(b>0?1:-1))*r*Math.cos(th/2), cy = (p1.y+p2.y)/2 + ((p2.x-p1.x)/d*(b>0?1:-1))*r*Math.cos(th/2);
                let a1 = Math.atan2(p1.y-cy, p1.x-cx), a2 = Math.atan2(p2.y-cy, p2.x-cx);
                if (b>0 && a2<=a1) a2+=2*Math.PI; if (b<0 && a2>=a1) a2-=2*Math.PI;
                const steps = Math.max(6, Math.floor(Math.abs(a2-a1)*r/2));
                for (let i=0; i<steps; i++) {
                    const ang1 = a1+(a2-a1)*i/steps, ang2 = a1+(a2-a1)*(i+1)/steps;
                    segments.push({x1: cx+r*Math.cos(ang1), y1: cy+r*Math.sin(ang1), x2: cx+r*Math.cos(ang2), y2: cy+r*Math.sin(ang2)});
                }
            }
        }
        return segments;
    }

    function buildTopology(raw, tol) {
        const pts = []; raw.forEach(s => { pts.push({x: s.x1, y: s.y1}); pts.push({x: s.x2, y: s.y2}); });
        const segments = [];
        for (let i=0; i<raw.length; i++) {
            const s = raw[i], tV = [0, 1], l2 = (s.x2-s.x1)**2+(s.y2-s.y1)**2;
            pts.forEach(p => {
                const t = ((p.x-s.x1)*(s.x2-s.x1)+(p.y-s.y1)*(s.y2-s.y1))/l2;
                if (t > 0.01 && t < 0.99 && Math.hypot(p.x-(s.x1+t*(s.x2-s.x1)), p.y-(s.y1+t*(s.y2-s.y1))) < tol) tV.push(t);
            });
            tV.sort((a,b) => a-b);
            for (let k=0; k<tV.length-1; k++) {
                if (tV[k+1]-tV[k] > 0.001) segments.push({x1: s.x1+tV[k]*(s.x2-s.x1), y1: s.y1+tV[k]*(s.y2-s.y1), x2: s.x1+tV[k+1]*(s.x2-s.x1), y2: s.y1+tV[k+1]*(s.y2-s.y1)});
            }
        }
        const vertices = [], grid = new Map();
        const getV = (x, y) => {
            const k = `${Math.round(x/0.1)},${Math.round(y/0.1)}`;
            if (grid.has(k)) return grid.get(k);
            const v = {id: vertices.length, x, y, adj: []}; vertices.push(v); grid.set(k, v); return v;
        };
        const uniqueE = new Map();
        segments.forEach(s => {
            const v1 = getV(s.x1, s.y1), v2 = getV(s.x2, s.y2);
            if (v1.id === v2.id) return;
            uniqueE.set(v1.id < v2.id ? `${v1.id}-${v2.id}` : `${v2.id}-${v1.id}`, {v1, v2});
        });
        const halfE = [];
        uniqueE.forEach(e => {
            const h1 = {from: e.v1, to: e.v2, angle: Math.atan2(e.v2.y-e.v1.y, e.v2.x-e.v1.x), used: false};
            const h2 = {from: e.v2, to: e.v1, angle: Math.atan2(e.v1.y-e.v2.y, e.v1.x-e.v2.x), used: false};
            h1.rev = h2; h2.rev = h1; e.v1.adj.push(h1); e.v2.adj.push(h2); halfE.push(h1, h2);
        });
        vertices.forEach(v => v.adj.sort((a,b) => a.angle - b.angle));
        const faces = [];
        halfE.forEach(h => {
            if (h.used) return;
            const p = []; let cur = h;
            while (!cur.used) { cur.used = true; p.push({x: cur.from.x, y: cur.from.y}); const idx = cur.to.adj.indexOf(cur.rev); cur = cur.to.adj[(idx-1+cur.to.adj.length)%cur.to.adj.length]; }
            if (p.length > 2) {
                let a = 0; for(let i=0; i<p.length; i++) a += (p[i].x*p[(i+1)%p.length].y - p[(i+1)%p.length].x*p[i].y);
                faces.push({pts: p, signedArea: a/2, area: Math.abs(a/2), matIdx: 1});
            }
        });
        let maxA = -1, sign = 1; faces.forEach(f => { if(f.area > maxA){ maxA = f.area; sign = Math.sign(f.signedArea); } });
        return faces.filter(f => Math.sign(f.signedArea) !== sign && f.area > 0.1).sort((a,b) => b.area - a.area);
    }

    function extractBoundaryEdges(polys) {
        const m = new Map();
        polys.forEach(poly => {
            for(let i=0; i<poly.pts.length; i++){
                const p1 = poly.pts[i], p2 = poly.pts[(i+1)%poly.pts.length];
                const k1 = `${p1.x.toFixed(3)},${p1.y.toFixed(3)}-${p2.x.toFixed(3)},${p2.y.toFixed(3)}`;
                const k2 = `${p2.x.toFixed(3)},${p2.y.toFixed(3)}-${p1.x.toFixed(3)},${p1.y.toFixed(3)}`;
                if(m.has(k1)) m.get(k1).count++; else if(m.has(k2)) m.get(k2).count++;
                else m.set(k1, {p1, p2, count: 1, type: 0});
            }
        });
        const edges = Array.from(m.values()).filter(e => e.count === 1).map(e => ({p1:e.p1, p2:e.p2, type:0}));
        boundaryAdj = edges.map(() => []);
        for(let i=0; i<edges.length; i++){
            for(let j=i+1; j<edges.length; j++){
                if(Math.hypot(edges[i].p1.x-edges[j].p1.x, edges[i].p1.y-edges[j].p1.y) < 0.1 || Math.hypot(edges[i].p1.x-edges[j].p2.x, edges[i].p1.y-edges[j].p2.y) < 0.1 || Math.hypot(edges[i].p2.x-edges[j].p1.x, edges[i].p2.y-edges[j].p1.y) < 0.1 || Math.hypot(edges[i].p2.x-edges[j].p2.x, edges[i].p2.y-edges[j].p2.y) < 0.1) {
                    boundaryAdj[i].push(j); boundaryAdj[j].push(i);
                }
            }
        }
        return edges;
    }

    // ──── DIBUJO Y SELECCIÓN ────
    function recalcBounds() {
        const all = polygons.flatMap(p => p.pts);
        minX = Math.min(...all.map(p => p.x)); maxX = Math.max(...all.map(p => p.x));
        minY = Math.min(...all.map(p => p.y)); maxY = Math.max(...all.map(p => p.y));
        document.getElementById('LpInput').value = Math.round(maxY-minY);
        const pad = 60;
        baseScale = Math.min((canvas.width-pad*2)/(maxX-minX||1), (canvas.height-pad*2)/(maxY-minY||1));
        zoomLevel = 1; offsetX = 0; offsetY = 0;
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(!polygons.length) return;
        const {tx, ty, s} = getTransform();

        if(showThermalMap && T) {
            const res = parseInt(document.getElementById('gridRes').value);
            const cw = (maxX-minX)/res*s, ch = (maxY-minY)/res*s;
            for(let i=0; i<res; i++) {
                for(let j=0; j<res; j++) {
                    if(kGrid[i][j] > 0) {
                        const f = Math.max(0, Math.min(1, (T[i][j]-0)/(20-0||1)));
                        ctx.fillStyle = `hsl(${(1-f)*240}, 75%, 50%)`;
                        ctx.fillRect(tx(minX+j*dx), ty(minY+i*dy)-ch, cw+0.6, ch+0.6);
                    }
                }
            }
        }

        ctx.globalAlpha = showThermalMap ? 0.2 : 1.0;
        polygons.forEach((p, i) => {
            ctx.beginPath(); ctx.moveTo(tx(p.pts[0].x), ty(p.pts[0].y));
            p.pts.forEach(pt => ctx.lineTo(tx(pt.x), ty(pt.y))); ctx.closePath();
            ctx.fillStyle = materials[p.matIdx].color; ctx.fill();
            ctx.strokeStyle = i === selectedPoly ? "red" : "rgba(0,0,0,0.2)";
            ctx.lineWidth = i === selectedPoly ? 3 : 1; ctx.stroke();
        });
        ctx.globalAlpha = 1.0;

        boundaryEdges.forEach((edge, i) => {
            if(edge.type === 0 && showThermalMap) return;
            ctx.beginPath(); ctx.moveTo(tx(edge.p1.x), ty(edge.p1.y)); ctx.lineTo(tx(edge.p2.x), ty(edge.p2.y));
            let color = "rgba(0,0,0,0.1)";
            if(edge.type === 1) color = "#1976d2"; if(edge.type === 2) color = "#d32f2f"; if(edge.type === 4) color = "#ff9800";
            ctx.strokeStyle = color; ctx.lineWidth = (editMode==='BOUNDARY' && i===hoveredEdgeIdx) ? 8 : (edge.type!==0 ? 5 : 2);
            ctx.stroke();
        });
    }

    // ──── INTERACCIONES ────
    canvas.onmousedown = e => {
        const rect = canvas.getBoundingClientRect();
        isDragging = true; hasDragged = false;
        dragStartX = (e.clientX-rect.left)*(canvas.width/rect.width) - offsetX;
        dragStartY = (e.clientY-rect.top)*(canvas.height/rect.height) - offsetY;
    };
    canvas.onmousemove = e => {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX-rect.left)*(canvas.width/rect.width), my = (e.clientY-rect.top)*(canvas.height/rect.height);
        if(isDragging){ offsetX = mx-dragStartX; offsetY = my-dragStartY; hasDragged = true; draw(); canvas.classList.add('grabbing'); return; }
        
        const w = getWorld(mx, my);
        if(editMode === 'BOUNDARY') {
            let minD = Infinity; hoveredEdgeIdx = -1;
            boundaryEdges.forEach((edge, i) => {
                const dx = edge.p2.x-edge.p1.x, dy = edge.p2.y-edge.p1.y, l2 = dx*dx+dy*dy;
                let t = Math.max(0, Math.min(1, ((w.x-edge.p1.x)*dx+(w.y-edge.p1.y)*dy)/l2));
                let dist = Math.hypot(w.x-(edge.p1.x+t*dx), w.y-(edge.p1.y+t*dy));
                if(dist < minD){ minD = dist; hoveredEdgeIdx = i; }
            });
            if(minD > 15/(baseScale*zoomLevel)) hoveredEdgeIdx = -1;
        } else {
            hoveredPolyIdx = -1;
            for(let i=polygons.length-1; i>=0; i--){
                let inside = false, pts = polygons[i].pts;
                for (let k = 0, j = pts.length - 1; k < pts.length; j = k++) {
                    if (((pts[k].y > w.y) !== (pts[j].y > w.y)) && (w.x < (pts[j].x - pts[k].x) * (w.y - pts[k].y) / (pts[j].y - pts[k].y) + pts[k].x)) inside = !inside;
                }
                if(inside){ hoveredPolyIdx = i; break; }
            }
        }
        draw();
    };
    canvas.onmouseup = e => {
        isDragging = false; canvas.classList.remove('grabbing');
        if(hasDragged || !polygons.length) return;
        const rect = canvas.getBoundingClientRect();
        const w = getWorld((e.clientX-rect.left)*(canvas.width/rect.width), (e.clientY-rect.top)*(canvas.height/rect.height));

        if(editMode === 'BOUNDARY' && hoveredEdgeIdx !== -1) {
            if(e.shiftKey) {
                let q = [[hoveredEdgeIdx, [hoveredEdgeIdx]]], v = new Set([hoveredEdgeIdx]), path = null;
                while(q.length > 0){
                    let [c, p] = q.shift();
                    if(boundaryEdges[c].type !== 0 && c !== hoveredEdgeIdx){ path = p; break; }
                    boundaryAdj[c].forEach(n => { if(!v.has(n)){ v.add(n); q.push([n, [...p, n]]); } });
                }
                if(path){ let type = boundaryEdges[path[path.length-1]].type; path.forEach(id => boundaryEdges[id].type = type); }
            } else boundaryEdges[hoveredEdgeIdx].type = (boundaryEdges[hoveredEdgeIdx].type + 1) % 5;
            draw(); return;
        }
        selectedPoly = hoveredPolyIdx;
        draw();
    };

    // ──── SOLVER E ISO 10077-2 ────
    document.getElementById('calcBtn').onclick = () => {
        const res = parseInt(document.getElementById('gridRes').value);
        const lp = (+document.getElementById('LpInput').value || 100) / 1000;
        document.getElementById('solverStatus').style.display = "block";
        
        setTimeout(() => {
            dx = (maxX-minX)/res; dy = (maxY-minY)/res;
            kGrid = Array.from({length:res}, (_,i)=> Array.from({length:res}, (_,j)=> {
                const x = minX+j*dx+dx/2, y = minY+i*dy+dy/2;
                const p = polygons.find(poly => {
                    let inside = false, pts = poly.pts;
                    for (let k = 0, l = pts.length - 1; k < pts.length; l = k++) {
                        if (((pts[k].y > y) !== (pts[l].y > y)) && (x < (pts[l].x - pts[k].x) * (y - pts[k].y) / (pts[l].y - pts[k].y) + pts[k].x)) inside = !inside;
                    } return inside;
                }); return p ? materials[p.matIdx].k : 0;
            }));

            T = Array.from({length:res}, () => new Array(res).fill(10));
            isExt = Array.from({length:res}, () => new Array(res).fill(false));
            isIntMeas = Array.from({length:res}, () => new Array(res).fill(false));
            isIntSec = Array.from({length:res}, () => new Array(res).fill(false));

            boundaryEdges.forEach(e => {
                if(e.type===0 || e.type===3) return;
                const steps = Math.ceil(Math.hypot(e.p2.x-e.p1.x, e.p2.y-e.p1.y)/Math.min(dx,dy)*2);
                for(let s=0; s<=steps; s++){
                    const px = e.p1.x + (s/steps)*(e.p2.x-e.p1.x), py = e.p1.y + (s/steps)*(e.p2.y-e.p1.y);
                    const j = Math.floor((px-minX)/dx), i = Math.floor((py-minY)/dy);
                    if(i>=0 && i<res && j>=0 && j<res){
                        if(e.type===1) isExt[i][j]=true; if(e.type===2) isIntMeas[i][j]=true; if(e.type===4) isIntSec[i][j]=true;
                        if(kGrid[i][j]===0) kGrid[i][j] = 0.026;
                    }
                }
            });

            for(let it=0; it<2000; it++){
                for(let i=0; i<res; i++){
                    for(let j=0; j<res; j++){
                        if(kGrid[i][j]===0) continue;
                        if(isExt[i][j]){ T[i][j] = (0 + T[i][j]*(kGrid[i][j]*0.04/dx)) / (1 + (kGrid[i][j]*0.04/dx)); continue; }
                        if(isIntMeas[i][j] || isIntSec[i][j]){ T[i][j] = (20 + T[i][j]*(kGrid[i][j]*0.13/dx)) / (1 + (kGrid[i][j]*0.13/dx)); continue; }
                        let n=0, d=0;
                        if(j>0 && kGrid[i][j-1]>0){ n += kGrid[i][j-1]*T[i][j-1]; d += kGrid[i][j-1]; }
                        if(j<res-1 && kGrid[i][j+1]>0){ n += kGrid[i][j+1]*T[i][j+1]; d += kGrid[i][j+1]; }
                        if(i>0 && kGrid[i-1][j]>0){ n += kGrid[i-1][j]*T[i-1][j]; d += kGrid[i-1][j]; }
                        if(i<res-1 && kGrid[i+1][j]>0){ n += kGrid[i+1][j]*T[i+1][j]; d += kGrid[i+1][j]; }
                        if(d>0) T[i][j] = n/d;
                    }
                }
            }

            let flux = 0;
            for(let i=0; i<res; i++){
                for(let j=0; j<res; j++){
                    if(isIntMeas[i][j]){
                        if(j>0 && !isIntMeas[i][j-1] && kGrid[i][j-1]>0) flux += kGrid[i][j]*(20 - T[i][j]) / (kGrid[i][j]*0.13 + dx/2);
                        if(j<res-1 && !isIntMeas[i][j+1] && kGrid[i][j+1]>0) flux += kGrid[i][j]*(20 - T[i][j]) / (kGrid[i][j]*0.13 + dx/2);
                        if(i>0 && !isIntMeas[i-1][j] && kGrid[i-1][j]>0) flux += kGrid[i][j]*(20 - T[i][j]) / (kGrid[i][j]*0.13 + dy/2);
                        if(i<res-1 && !isIntMeas[i+1][j] && kGrid[i+1][j]>0) flux += kGrid[i][j]*(20 - T[i][j]) / (kGrid[i][j]*0.13 + dy/2);
                    }
                }
            }
            const U = Math.abs(flux) / (lp * 20);
            document.getElementById('result').style.display="block";
            document.getElementById('result').innerHTML=`<h2>Uf = ${U.toFixed(3)} W/m²K</h2><p>Flujo: ${Math.abs(flux).toFixed(3)} W/m |bf: ${lp*1000}mm</p>`;
            showThermalMap=true; document.getElementById('btnBackToEdit').style.display="inline-flex";
            document.getElementById('solverStatus').style.display="none"; draw();
        }, 100);
    };

    document.getElementById('btnZoomReset').onclick = () => recalcBounds() || draw();
    document.getElementById('btnRotate').onclick = () => {
        const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
        polygons.forEach(p => p.pts.forEach(pt => { const dx = pt.x-cx, dy = pt.y-cy; pt.x = cx - dy; pt.y = cy + dx; }));
        recalcBounds(); boundaryEdges = extractBoundaryEdges(polygons); draw();
    };

    updateLegend();
})();
</script>
</body>
</html>
