<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aislantech · Análisis Térmico Pro (ISO 10077-2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #EDD00E; --color-primary-dark: #B8860B; --color-primary-light: #FFF8DC;
            --color-secondary: #3E3E3E; --color-light: #F5F5F5; --color-dark: #333333; --color-gray: #666666; 
            --transition: all 0.2s ease; --border-radius: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Open Sans',sans-serif; background:var(--color-light); color:var(--color-gray); overflow-x: hidden; }
        h1,h2,h3,.card-title,.btn { font-family:'Montserrat',sans-serif; font-weight:600; color:var(--color-dark); }
        .container { width:100%; max-width:1450px; margin:0 auto; padding:20px; }
        
        .header-container { display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom: 2px solid var(--color-primary); margin-bottom: 20px;}
        .logo-aislan { color:var(--color-secondary); font-size:1.5rem; font-weight:700; }
        .logo-tech { color:var(--color-primary); font-size:1.5rem; font-weight:800; }

        .card { background:white; border-radius:var(--border-radius); box-shadow:0 5px 15px rgba(0,0,0,0.05); margin-bottom:20px; border-top:4px solid var(--color-primary); }
        .card-body { padding:1.2rem; }
        
        .controls-grid { display:flex; flex-wrap:wrap; gap:1.2rem; align-items:flex-start;}
        .control-group { display:flex; flex-direction:column; gap:6px; flex: 1; min-width: 150px;}
        label { font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--color-secondary); }
        input, select { padding:8px 12px; border:1px solid #ddd; border-radius:var(--border-radius); font-size:0.85rem; }
        
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:var(--border-radius); font-weight:700; border:none; cursor:pointer; transition:var(--transition); font-size:0.85rem; }
        .btn-primary { background:var(--color-primary); color:var(--color-dark); }
        .btn-success { background:#2e7d32; color:white; }
        .btn-outline { background:transparent; border:2px solid #ddd; color:var(--color-secondary); }
        .btn-edit { background:#0288d1; color:white; }
        
        .mode-switch { display:flex; background:#eee; border-radius:var(--border-radius); overflow:hidden; border:1px solid #ddd; }
        .mode-btn { flex:1; padding:10px; font-weight:700; font-size:0.8rem; border:none; background:transparent; cursor:pointer; color: #666; transition:var(--transition); }
        .mode-btn.active { background:var(--color-secondary); color:white; }
        
        .status-bar { background:var(--color-primary-light); border-left:4px solid var(--color-primary); padding:12px 16px; border-radius:var(--border-radius); margin:15px 0; font-weight:600; font-size:0.85rem; display: flex; align-items: center; gap: 10px;}
        
        .canvas-wrapper { position:relative; background:#fff; border-radius:var(--border-radius); border:1px solid #ddd; overflow:hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        canvas { display:block; width:100%; height:auto; cursor:crosshair; background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 20px 20px; }
        canvas.grabbing { cursor: grabbing !important; }
        
        .legend-panel { display:flex; flex-wrap:wrap; gap:0.5rem; background:white; padding:12px; border-radius:var(--border-radius); margin:15px 0; align-items:center; border:1px solid #ddd; }
        .legend-item { display:flex; align-items:center; gap:8px; font-size:0.75rem; cursor:pointer; padding: 6px 10px; border-radius: 4px; transition: var(--transition); }
        .legend-item:hover { background: #f0f0f0; }
        .legend-color { width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); }
        
        .boundary-legend { display:flex; gap:1rem; align-items:center; margin-left:auto; font-size:0.75rem; font-weight:700; border-left: 1px solid #ddd; padding-left: 15px; }
        .boundary-swatch { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid #000; }
        
        #customMatPanel { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; margin-bottom: 15px; display: none; }
        .result-card { display:none; background:#2e7d32; color:white; padding:20px; border-radius:var(--border-radius); margin-top:20px; text-align:center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <div><span class="logo-aislan">AISLAN</span><span class="logo-tech">TECH</span> <small style="margin-left:10px; opacity:0.6; font-weight: 400;">Thermal Analysis 2.0</small></div>
        <div id="solverStatus" style="font-weight: bold; color: #d32f2f; display:none;"><i class="fas fa-circle-notch fa-spin"></i> Procesando malla térmica...</div>
    </div>
    
    <div class="card">
        <div class="card-body">
            <div class="controls-grid">
                <div class="control-group" style="flex: 1.5;">
                    <label>1. Herramienta Activa</label>
                    <div class="mode-switch">
                        <button id="btnModeMat" class="mode-btn active"><i class="fas fa-fill-drip"></i> Materiales</button>
                        <button id="btnModeBound" class="mode-btn"><i class="fas fa-vector-square"></i> Contornos</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>2. Resolución</label>
                    <select id="gridRes">
                        <option value="80">Baja (80x80)</option>
                        <option value="120" selected>Estándar (120x120)</option>
                        <option value="200">Alta (200x200)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>3. Cargar DXF</label>
                    <input type="file" id="dxfFile" accept=".dxf">
                </div>

                <div class="control-group">
                    <label>bf (Ancho mm)</label>
                    <input type="number" id="LpInput" value="100">
                </div>

                <div class="control-group" style="flex: 2;">
                    <label>Acciones</label>
                    <div style="display:flex; gap:5px;">
                        <button id="btnRotate" class="btn btn-outline btn-sm" title="Rotar 90º"><i class="fas fa-sync-alt"></i></button>
                        <button id="btnZoomReset" class="btn btn-outline btn-sm" title="Centrar"><i class="fas fa-compress-arrows-alt"></i></button>
                        <button id="btnBackToEdit" class="btn btn-edit" style="display:none;"><i class="fas fa-pencil-alt"></i> Editar</button>
                        <button id="calcBtn" class="btn btn-success" disabled><i class="fas fa-play-circle"></i> CALCULAR Uf</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="customMatPanel">
        <div style="display:flex; gap:15px; align-items:flex-end;">
            <div class="control-group"><label>Nombre</label><input type="text" id="customMatName" placeholder="Material X"></div>
            <div class="control-group"><label>Conductividad (λ)</label><input type="number" id="customMatK" step="0.001" value="0.050"></div>
            <div class="control-group"><label>Color</label><input type="color" id="customMatColor" value="#ff9800" style="height:38px; padding:0;"></div>
            <button id="btnAddCustomMat" class="btn btn-primary">Añadir Material</button>
            <button onclick="document.getElementById('customMatPanel').style.display='none'" class="btn btn-outline">Cancelar</button>
        </div>
    </div>

    <div class="status-bar" id="status"><i class="fas fa-info-circle"></i> <span>Esperando archivo DXF...</span></div>

    <div class="legend-panel" id="legend"></div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="1100" height="650"></canvas>
    </div>

    <div id="result" class="result-card"></div>
</div>

<script>
(function() {
    // ──── MATERIALES Y CONSTANTES ────
    let materials = [
        { name: "Cámara Aire", k: 0.026, color: "#ecf0f1" },
        { name: "Aluminio", k: 160.0, color: "#95a5a6" },
        { name: "Acero Inox", k: 17.0, color: "#b0bec5" },
        { name: "Poliamida 25% FV", k: 0.30, color: "#d35400" },
        { name: "PVC Rígido", k: 0.17, color: "#9b59b6" },
        { name: "EPDM / Juntas", k: 0.25, color: "#2c3e50" },
        { name: "Silicona", k: 0.35, color: "#00bcd4" },
        { name: "Aislante (XPS)", k: 0.035, color: "#f1c40f" },
        { name: "Vidrio", k: 1.0, color: "#81d4fa" }
    ];

    const Rse = 0.04; // Exterior ISO 6946
    const Rsi = 0.13; // Interior ISO 6946

    let polygons = [], boundaryEdges = [], boundaryAdj = [];
    let minX, maxX, minY, maxY;
    let selectedPoly = -1, hoveredPolyIdx = -1, hoveredEdgeIdx = -1;
    let editMode = 'MATERIAL';

    // Zoom y Pan
    let zoomLevel = 1, offsetX = 0, offsetY = 0, baseScale = 1;
    let isDragging = false, dragStartX = 0, dragStartY = 0, hasDragged = false;

    // Thermal Engine
    let T = null, kGrid = null, dx, dy, isExt, isIntMeas, isIntSec;
    let showThermalMap = false;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.querySelector('#status span');

    // ──── INTERFAZ Y MODOS ────
    document.getElementById('btnModeMat').onclick = function() {
        editMode = 'MATERIAL'; this.classList.add('active');
        document.getElementById('btnModeBound').classList.remove('active');
        setStatus("Modo Materiales: Selecciona un área y elige el material de la leyenda.");
        draw();
    };
    document.getElementById('btnModeBound').onclick = function() {
        editMode = 'BOUNDARY'; this.classList.add('active');
        document.getElementById('btnModeMat').classList.remove('active');
        setStatus("Modo Contornos: Haz clic en las líneas (Usa SHIFT+Clic para seleccionar tramos continuos).");
        draw();
    };
    document.getElementById('btnBackToEdit').onclick = function() {
        showThermalMap = false; this.style.display = 'none'; draw();
    };

    function updateLegend() {
        const lp = document.getElementById('legend');
        lp.innerHTML = materials.map((m, i) => `
            <div class="legend-item" onclick="applyMaterial(${i})">
                <div class="legend-color" style="background:${m.color}"></div>
                <span>${m.name}</span>
            </div>
        `).join('') + `
            <div class="legend-item" onclick="document.getElementById('customMatPanel').style.display='block'">
                <div class="legend-color" style="background:#fff; border:1px dashed #666; display:flex; align-items:center; justify-content:center; font-size:10px;">+</div>
                <span style="color:var(--color-primary-dark); font-weight:bold;">Añadir...</span>
            </div>
            <div class="boundary-legend">
                <span><span class="boundary-swatch" style="background:#1976d2"></span> Ext (Rse)</span>
                <span><span class="boundary-swatch" style="background:#d32f2f"></span> Int (Uf)</span>
                <span><span class="boundary-swatch" style="background:#ff9800"></span> Int Sec.</span>
            </div>`;
    }

    window.applyMaterial = (idx) => {
        if (selectedPoly !== -1) { polygons[selectedPoly].matIdx = idx; draw(); }
    };

    document.getElementById('btnAddCustomMat').onclick = function() {
        const name = document.getElementById('customMatName').value || "Nuevo Mat";
        const k = parseFloat(document.getElementById('customMatK').value) || 0.1;
        const color = document.getElementById('customMatColor').value;
        materials.push({name, k, color});
        updateLegend();
        document.getElementById('customMatPanel').style.display = 'none';
        if (selectedPoly !== -1) { polygons[selectedPoly].matIdx = materials.length - 1; draw(); }
        setStatus(`Material "${name}" añadido a la biblioteca.`);
    };

    function setStatus(msg, type = 'info') {
        statusText.textContent = msg;
        const bar = document.getElementById('status');
        bar.className = `status-bar ${type}`;
        bar.querySelector('i').className = type === 'error' ? 'fas fa-exclamation-triangle' : type === 'success' ? 'fas fa-check-circle' : 'fas fa-info-circle';
    }

    // ──── DXF PARSER ROBUSTO (RESTAURADO) ────
    document.getElementById('dxfFile').onchange = e => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const segments = parseDXF(ev.target.result);
                if(segments.length === 0) throw new Error("No se encontraron entidades 2D válidas. (Asegúrate de explotar los bloques)");
                polygons = buildTopology(segments, 0.5);
                if(polygons.length) {
                    recalcBounds();
                    boundaryEdges = extractBoundaryEdges(polygons);
                    document.getElementById('calcBtn').disabled = false;
                    showThermalMap = false;
                    setStatus("✅ DXF Importado correctamente. Asigna materiales y contornos para calcular la transmitancia térmica.");
                    draw();
                } else {
                    throw new Error("No se detectaron áreas cerradas. Comprueba el DXF.");
                }
            } catch(err) { setStatus("Error al leer DXF: " + err.message, "error"); }
        };
        reader.readAsText(file);
    };

    function parseDXF(text) {
        const lines = text.split(/\r?\n/);
        let idx = 0, inEntities = false, segments = [];
        let currentEntity = null, currentPolyline = null;

        function getPair() {
            while (idx < lines.length - 1) {
                const codeStr = lines[idx].trim();
                const valueStr = lines[idx + 1].trim();
                idx += 2;
                if (codeStr !== '') return [parseInt(codeStr), valueStr];
            }
            return null;
        }

        function addBulgeSegments(p1, p2, bulge) {
            if (!bulge || Math.abs(bulge) < 1e-5) { segments.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }); return; }
            const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.hypot(dx, dy);
            if (dist < 1e-6) return;
            const theta = 4 * Math.atan(bulge);
            const radius = Math.abs(dist / (2 * Math.sin(theta / 2)));
            const dir = bulge > 0 ? 1 : -1;
            const cx = (p1.x + p2.x) / 2 + (-dy / dist * dir) * radius * Math.cos(theta / 2);
            const cy = (p1.y + p2.y) / 2 + (dx / dist * dir) * radius * Math.cos(theta / 2);
            let a1 = Math.atan2(p1.y - cy, p1.x - cx), a2 = Math.atan2(p2.y - cy, p2.x - cx);
            if (bulge > 0 && a2 <= a1) a2 += 2 * Math.PI;
            if (bulge < 0 && a2 >= a1) a2 -= 2 * Math.PI;
            const N = Math.max(6, Math.floor(Math.abs(a2 - a1) * radius / 2));
            let prevX = p1.x, prevY = p1.y;
            for (let i = 1; i <= N; i++) {
                const a = a1 + (a2 - a1) * (i / N), x = cx + radius * Math.cos(a), y = cy + radius * Math.sin(a);
                segments.push({ x1: prevX, y1: prevY, x2: x, y2: y }); prevX = x; prevY = y;
            }
        }

        function flushEntity(ent) {
            if (!ent || ent.ignore) return;
            if (ent.type === 'VERTEX' && currentPolyline) {
                currentPolyline.vertices.push({ x: ent.x, y: ent.y, bulge: ent.bulge });
            }
            if (ent.type === 'LINE' && ent.x1 !== undefined && ent.x2 !== undefined) {
                segments.push({ x1: ent.x1, y1: ent.y1, x2: ent.x2, y2: ent.y2 });
            }
            if ((ent.type === 'CIRCLE' || ent.type === 'ARC') && ent.r > 0) {
                let start = ent.startAngle !== undefined ? ent.startAngle : 0;
                let end = ent.endAngle !== undefined ? ent.endAngle : 360;
                let rs = start * Math.PI / 180, re = end * Math.PI / 180;
                if (ent.type === 'ARC' && re <= rs) re += 2 * Math.PI;
                const N = Math.max(12, Math.floor(Math.abs(re - rs) * ent.r / 2));
                let px = ent.cx + ent.r * Math.cos(rs), py = ent.cy + ent.r * Math.sin(rs);
                for (let i = 1; i <= N; i++) {
                    const a = rs + (re - rs) * (i / N), x = ent.cx + ent.r * Math.cos(a), y = ent.cy + ent.r * Math.sin(a);
                    segments.push({ x1: px, y1: py, x2: x, y2: y }); px = x; py = y;
                }
            }
            if ((ent.type === 'LWPOLYLINE' || ent.type === 'POLYLINE') && ent.vertices && ent.vertices.length > 0) {
                for (let i = 0; i < ent.vertices.length - 1; i++) {
                    addBulgeSegments(ent.vertices[i], ent.vertices[i + 1], ent.vertices[i].bulge);
                }
                if (ent.closed && ent.vertices.length > 2) {
                    addBulgeSegments(ent.vertices[ent.vertices.length - 1], ent.vertices[0], ent.vertices[ent.vertices.length - 1].bulge);
                }
            }
            if (ent.type === 'SPLINE' && ent.pts && ent.pts.length > 1) {
                for (let i = 0; i < ent.pts.length - 1; i++) {
                    segments.push({ x1: ent.pts[i].x, y1: ent.pts[i].y, x2: ent.pts[i + 1].x, y2: ent.pts[i + 1].y });
                }
                if (ent.closed && ent.pts.length > 2) {
                    segments.push({ x1: ent.pts[ent.pts.length - 1].x, y1: ent.pts[ent.pts.length - 1].y, x2: ent.pts[0].x, y2: ent.pts[0].y });
                }
            }
        }

        while (idx < lines.length) {
            const pair = getPair(); if (!pair) break;
            const [code, value] = pair;

            if (code === 0 && value === 'SECTION') { const next = getPair(); if (next && next[1] === 'ENTITIES') inEntities = true; continue; }
            if (code === 0 && value === 'ENDSEC') { inEntities = false; continue; }
            if (!inEntities) continue;

            if (code === 0) {
                if (currentEntity && currentEntity.type !== 'POLYLINE') flushEntity(currentEntity);
                
                if (value === 'LWPOLYLINE') { currentEntity = { type: 'LWPOLYLINE', vertices: [], closed: false, ignore: false }; } 
                else if (value === 'POLYLINE') {
                    if (currentPolyline) flushEntity(currentPolyline);
                    currentPolyline = { type: 'POLYLINE', vertices: [], closed: false, ignore: false }; currentEntity = currentPolyline;
                } else if (value === 'VERTEX' && currentPolyline) { currentEntity = { type: 'VERTEX', x: 0, y: 0, bulge: 0, ignore: false }; } 
                else if (value === 'SEQEND' && currentPolyline) { flushEntity(currentPolyline); currentPolyline = null; currentEntity = null; } 
                else if (['LINE', 'CIRCLE', 'ARC'].includes(value)) { currentEntity = { type: value, ignore: false }; } 
                else if (value === 'SPLINE') { currentEntity = { type: 'SPLINE', pts: [], ignore: false, closed: false }; } 
                else { currentEntity = null; }
            } else if (currentEntity) {
                if (code === 67 && value === '1') currentEntity.ignore = true; 
                
                const v = parseFloat(value);
                if (currentEntity.type === 'LWPOLYLINE') {
                    if (code === 70) currentEntity.closed = (parseInt(value) & 1) !== 0;
                    else if (code === 10) currentEntity.vertices.push({ x: v, y: 0, bulge: 0 });
                    else if (code === 20 && currentEntity.vertices.length > 0) currentEntity.vertices[currentEntity.vertices.length - 1].y = v;
                    else if (code === 42 && currentEntity.vertices.length > 0) currentEntity.vertices[currentEntity.vertices.length - 1].bulge = v;
                } else if (currentEntity.type === 'POLYLINE') {
                    if (code === 70) currentEntity.closed = (parseInt(value) & 1) !== 0;
                } else if (currentEntity.type === 'VERTEX') {
                    if (code === 10) currentEntity.x = v; else if (code === 20) currentEntity.y = v; else if (code === 42) currentEntity.bulge = v;
                } else if (currentEntity.type === 'LINE') {
                    if (code === 10) currentEntity.x1 = v; else if (code === 20) currentEntity.y1 = v; 
                    else if (code === 11) currentEntity.x2 = v; else if (code === 21) currentEntity.y2 = v;
                } else if (currentEntity.type === 'CIRCLE' || currentEntity.type === 'ARC') {
                    if (code === 10) currentEntity.cx = v; else if (code === 20) currentEntity.cy = v; else if (code === 40) currentEntity.r = v;
                    else if (code === 50) currentEntity.startAngle = v; else if (code === 51) currentEntity.endAngle = v;
                } else if (currentEntity.type === 'SPLINE') {
                    if (code === 70) currentEntity.closed = (parseInt(value) & 1) !== 0;
                    else if (code === 10) currentEntity.pts.push({ x: v, y: 0 });
                    else if (code === 20 && currentEntity.pts.length > 0) currentEntity.pts[currentEntity.pts.length - 1].y = v;
                }
            }
        }
        if (currentEntity && currentEntity.type !== 'POLYLINE') flushEntity(currentEntity);
        if (currentPolyline) flushEntity(currentPolyline);
        return segments.filter(s => Math.hypot(s.x2 - s.x1, s.y2 - s.y1) > 1e-9);
    }

    function buildTopology(raw, tol) {
        const pts = []; raw.forEach(s => { pts.push({x: s.x1, y: s.y1}); pts.push({x: s.x2, y: s.y2}); });
        const segments = [];
        for (let i=0; i<raw.length; i++) {
            const s = raw[i], tV = [0, 1], l2 = (s.x2-s.x1)**2+(s.y2-s.y1)**2;
            pts.forEach(p => {
                const t = ((p.x-s.x1)*(s.x2-s.x1)+(p.y-s.y1)*(s.y2-s.y1))/l2;
                if (t > 0.01 && t < 0.99 && Math.hypot(p.x-(s.x1+t*(s.x2-s.x1)), p.y-(s.y1+t*(s.y2-s.y1))) < tol) tV.push(t);
            });
            tV.sort((a,b) => a-b);
            for (let k=0; k<tV.length-1; k++) {
                if (tV[k+1]-tV[k] > 0.001) segments.push({x1: s.x1+tV[k]*(s.x2-s.x1), y1: s.y1+tV[k]*(s.y2-s.y1), x2: s.x1+tV[k+1]*(s.x2-s.x1), y2: s.y1+tV[k+1]*(s.y2-s.y1)});
            }
        }
        const vertices = [], grid = new Map();
        const getV = (x, y) => {
            const k = `${Math.round(x/0.1)},${Math.round(y/0.1)}`;
            if (grid.has(k)) return grid.get(k);
            const v = {id: vertices.length, x, y, adj: []}; vertices.push(v); grid.set(k, v); return v;
        };
        const uniqueE = new Map();
        segments.forEach(s => {
            const v1 = getV(s.x1, s.y1), v2 = getV(s.x2, s.y2);
            if (v1.id === v2.id) return;
            uniqueE.set(v1.id < v2.id ? `${v1.id}-${v2.id}` : `${v2.id}-${v1.id}`, {v1, v2});
        });
        const halfE = [];
        uniqueE.forEach(e => {
            const h1 = {from: e.v1, to: e.v2, angle: Math.atan2(e.v2.y-e.v1.y, e.v2.x-e.v1.x), used: false};
            const h2 = {from: e.v2, to: e.v1, angle: Math.atan2(e.v1.y-e.v2.y, e.v1.x-e.v2.x), used: false};
            h1.rev = h2; h2.rev = h1; e.v1.adj.push(h1); e.v2.adj.push(h2); halfE.push(h1, h2);
        });
        vertices.forEach(v => v.adj.sort((a,b) => a.angle - b.angle));
        const faces = [];
        halfE.forEach(h => {
            if (h.used) return;
            const p = []; let cur = h, loops = 0;
            while (!cur.used && loops < 10000) { 
                cur.used = true; p.push({x: cur.from.x, y: cur.from.y}); 
                const idx = cur.to.adj.indexOf(cur.rev); 
                cur = cur.to.adj[(idx-1+cur.to.adj.length)%cur.to.adj.length];
                loops++;
            }
            if (p.length > 2) {
                let a = 0; for(let i=0; i<p.length; i++) a += (p[i].x*p[(i+1)%p.length].y - p[(i+1)%p.length].x*p[i].y);
                faces.push({pts: p, signedArea: a/2, area: Math.abs(a/2), matIdx: 1}); // Por defecto Aluminio
            }
        });
        let maxA = -1, sign = 1; faces.forEach(f => { if(f.area > maxA){ maxA = f.area; sign = Math.sign(f.signedArea); } });
        return faces.filter(f => Math.sign(f.signedArea) !== sign && f.area > 0.1).sort((a,b) => b.area - a.area);
    }

    function extractBoundaryEdges(polys) {
        const m = new Map();
        polys.forEach(poly => {
            for(let i=0; i<poly.pts.length; i++){
                const p1 = poly.pts[i], p2 = poly.pts[(i+1)%poly.pts.length];
                const k1 = `${p1.x.toFixed(3)},${p1.y.toFixed(3)}-${p2.x.toFixed(3)},${p2.y.toFixed(3)}`;
                const k2 = `${p2.x.toFixed(3)},${p2.y.toFixed(3)}-${p1.x.toFixed(3)},${p1.y.toFixed(3)}`;
                if(m.has(k1)) m.get(k1).count++; else if(m.has(k2)) m.get(k2).count++;
                else m.set(k1, {p1, p2, count: 1, type: 0});
            }
        });
        const edges = Array.from(m.values()).filter(e => e.count === 1).map(e => ({p1:e.p1, p2:e.p2, type:0}));
        
        // Grafo de Adyacencia para Shift+Click
        boundaryAdj = edges.map(() => []);
        for(let i=0; i<edges.length; i++){
            for(let j=i+1; j<edges.length; j++){
                if(Math.hypot(edges[i].p1.x-edges[j].p1.x, edges[i].p1.y-edges[j].p1.y) < 0.1 || 
                   Math.hypot(edges[i].p1.x-edges[j].p2.x, edges[i].p1.y-edges[j].p2.y) < 0.1 || 
                   Math.hypot(edges[i].p2.x-edges[j].p1.x, edges[i].p2.y-edges[j].p1.y) < 0.1 || 
                   Math.hypot(edges[i].p2.x-edges[j].p2.x, edges[i].p2.y-edges[j].p2.y) < 0.1) {
                    boundaryAdj[i].push(j); boundaryAdj[j].push(i);
                }
            }
        }
        return edges;
    }

    // ──── GESTIÓN DE VISTA (ZOOM AL PUNTERO ABSOLUTO) ────
    function recalcBounds() {
        if(!polygons.length) return;
        const all = polygons.flatMap(p => p.pts);
        minX = Math.min(...all.map(p => p.x)); maxX = Math.max(...all.map(p => p.x));
        minY = Math.min(...all.map(p => p.y)); maxY = Math.max(...all.map(p => p.y));
        document.getElementById('LpInput').value = Math.round(maxY-minY);
        
        const pad = 60, cw = canvas.width, ch = canvas.height;
        baseScale = Math.min((cw-pad*2)/(maxX-minX||1), (ch-pad*2)/(maxY-minY||1));
        zoomLevel = 1; offsetX = 0; offsetY = 0;
    }

    function getTransform() {
        const cw = canvas.width, ch = canvas.height;
        const cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        return {
            s: baseScale * zoomLevel,
            tx: x => offsetX + cw / 2 + (x - cxW) * baseScale * zoomLevel,
            ty: y => offsetY + ch / 2 - (y - cyW) * baseScale * zoomLevel
        };
    }

    function getWorld(sx, sy) {
        const cw = canvas.width, ch = canvas.height;
        const cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        return {
            x: cxW + (sx - offsetX - cw / 2) / (baseScale * zoomLevel),
            y: cyW - (sy - offsetY - ch / 2) / (baseScale * zoomLevel)
        };
    }

    canvas.onwheel = e => {
        e.preventDefault();
        if (!polygons.length) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        const wBefore = getWorld(mx, my);
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomLevel = Math.max(0.1, Math.min(zoomLevel * factor, 50));
        
        // Ajuste matemático exacto para anclar el zoom
        const cw = canvas.width, ch = canvas.height;
        const cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        
        offsetX = mx - cw / 2 - (wBefore.x - cxW) * baseScale * zoomLevel;
        offsetY = my - ch / 2 + (wBefore.y - cyW) * baseScale * zoomLevel;
        
        draw();
    };

    document.getElementById('btnZoomReset').onclick = () => { zoomLevel = 1; offsetX = 0; offsetY = 0; draw(); };

    // ──── INTERACCIONES (PAN Y CLIC) ────
    canvas.onmousedown = e => {
        if(!polygons.length) return;
        const rect = canvas.getBoundingClientRect();
        isDragging = true; hasDragged = false;
        dragStartX = (e.clientX-rect.left)*(canvas.width/rect.width) - offsetX;
        dragStartY = (e.clientY-rect.top)*(canvas.height/rect.height) - offsetY;
        canvas.classList.add('grabbing');
    };

    canvas.onmousemove = e => {
        if(!polygons.length || showThermalMap) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX-rect.left)*(canvas.width/rect.width), my = (e.clientY-rect.top)*(canvas.height/rect.height);
        if(isDragging){ offsetX = mx-dragStartX; offsetY = my-dragStartY; hasDragged = true; draw(); return; }
        
        const w = getWorld(mx, my);
        if(editMode === 'BOUNDARY') {
            let minD = Infinity; hoveredEdgeIdx = -1;
            boundaryEdges.forEach((edge, i) => {
                const dx = edge.p2.x-edge.p1.x, dy = edge.p2.y-edge.p1.y, l2 = dx*dx+dy*dy;
                let t = Math.max(0, Math.min(1, ((w.x-edge.p1.x)*dx+(w.y-edge.p1.y)*dy)/l2));
                let dist = Math.hypot(w.x-(edge.p1.x+t*dx), w.y-(edge.p1.y+t*dy));
                if(dist < minD){ minD = dist; hoveredEdgeIdx = i; }
            });
            if(minD > 12/(baseScale*zoomLevel)) hoveredEdgeIdx = -1;
        } else {
            hoveredPolyIdx = -1;
            for(let i=polygons.length-1; i>=0; i--){
                let inside = false, pts = polygons[i].pts;
                for (let k = 0, j = pts.length - 1; k < pts.length; j = k++) {
                    if (((pts[k].y > w.y) !== (pts[j].y > w.y)) && (w.x < (pts[j].x - pts[k].x) * (w.y - pts[k].y) / (pts[j].y - pts[k].y) + pts[k].x)) inside = !inside;
                }
                if(inside){ hoveredPolyIdx = i; break; }
            }
        }
        draw();
    };

    canvas.onmouseup = e => {
        isDragging = false; canvas.classList.remove('grabbing');
        if(hasDragged || !polygons.length || showThermalMap) return;
        
        if(editMode === 'BOUNDARY' && hoveredEdgeIdx !== -1) {
            if(e.shiftKey) {
                let path = bfsFindNearestAssigned(hoveredEdgeIdx);
                if(path){ let type = boundaryEdges[path[path.length-1]].type; path.forEach(id => boundaryEdges[id].type = type); }
            } else {
                boundaryEdges[hoveredEdgeIdx].type = (boundaryEdges[hoveredEdgeIdx].type + 1) % 5;
            }
            draw(); return;
        }
        
        if (editMode === 'MATERIAL') {
            selectedPoly = hoveredPolyIdx;
            if(selectedPoly !== -1) setStatus(`Región seleccionada. Elige el material en la leyenda.`);
            draw();
        }
    };

    function bfsFindNearestAssigned(startIdx) {
        let queue = [[startIdx, [startIdx]]];
        let visited = new Set([startIdx]);

        while(queue.length > 0) {
            let [curr, path] = queue.shift();
            // Retorna si encuentra un borde coloreado
            if (boundaryEdges[curr].type !== 0 && curr !== startIdx) return path;
            for (let n of boundaryAdj[curr]) {
                if (!visited.has(n)) { visited.add(n); queue.push([n, [...path, n]]); }
            }
        }
        return null;
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(!polygons.length) return;
        const {tx, ty, s} = getTransform();

        if(showThermalMap && T) {
            const res = parseInt(document.getElementById('gridRes').value);
            const te = +document.getElementById('tExt').value, ti = +document.getElementById('tInt').value;
            const cw = (maxX-minX)/res*s, ch = (maxY-minY)/res*s;
            for(let i=0; i<res; i++) {
                for(let j=0; j<res; j++) {
                    if(kGrid[i][j] > 0 || isExt[i][j] || isIntMeas[i][j] || isIntSec[i][j]) {
                        const f = Math.max(0, Math.min(1, (T[i][j]-te)/(ti-te||1)));
                        ctx.fillStyle = `hsl(${(1-f)*240}, 75%, 50%)`;
                        ctx.fillRect(tx(minX+j*dx), ty(minY+i*dy)-ch, cw+0.6, ch+0.6);
                    }
                }
            }
        }

        ctx.globalAlpha = showThermalMap ? 0.3 : 1.0;
        polygons.forEach((p, i) => {
            ctx.beginPath(); ctx.moveTo(tx(p.pts[0].x), ty(p.pts[0].y));
            p.pts.forEach(pt => ctx.lineTo(tx(pt.x), ty(pt.y))); ctx.closePath();
            ctx.fillStyle = materials[p.matIdx].color; ctx.fill();
            if (editMode === 'MATERIAL' && i === hoveredPolyIdx) { ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.fill(); } 
            ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.stroke();
        });
        ctx.globalAlpha = 1.0;

        boundaryEdges.forEach((edge, i) => {
            if(edge.type === 0 && showThermalMap) return;
            ctx.beginPath(); ctx.moveTo(tx(edge.p1.x), ty(edge.p1.y)); ctx.lineTo(tx(edge.p2.x), ty(edge.p2.y));
            let color = "rgba(0,0,0,0.1)";
            if(edge.type === 1) color = "#1976d2"; if(edge.type === 2) color = "#d32f2f"; 
            if(edge.type === 3) color = "#757575"; if(edge.type === 4) color = "#ff9800";
            ctx.strokeStyle = color; 
            ctx.lineWidth = (editMode==='BOUNDARY' && i===hoveredEdgeIdx) ? 8 : (edge.type!==0 ? 4 : 1.5);
            ctx.stroke();
        });
    }

    document.getElementById('btnRotate').onclick = () => {
        if(!polygons.length) return;
        const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
        polygons.forEach(p => p.pts.forEach(pt => {
            const dxx = pt.x-cx, dyy = pt.y-cy;
            pt.x = cx - dyy; pt.y = cy + dxx;
        }));
        recalcBounds(); boundaryEdges = extractBoundaryEdges(polygons); draw();
    };

    // ──── SOLVER TÉRMICO Y CÁLCULO DE U ────
    document.getElementById('calcBtn').onclick = () => {
        if(!polygons.length) return;
        if(!boundaryEdges.some(e => e.type===1) || !boundaryEdges.some(e => e.type===2)) {
            setStatus('❌ Falta marcar al menos un borde Exterior (azul) e Interior de Medición (rojo).', 'error'); return;
        }
        
        const res = parseInt(document.getElementById('gridRes').value);
        const lp = (+document.getElementById('LpInput').value || 100) / 1000;
        document.getElementById('solverStatus').style.display = "block";
        
        setTimeout(() => {
            dx = (maxX-minX)/res; dy = (maxY-minY)/res;
            kGrid = Array.from({length:res}, (_,i)=> Array.from({length:res}, (_,j)=> {
                const x = minX+j*dx+dx/2, y = minY+i*dy+dy/2;
                const p = polygons.find(poly => {
                    let inside = false, pts = poly.pts;
                    for (let k = 0, l = pts.length - 1; k < pts.length; l = k++) {
                        if (((pts[k].y > y) !== (pts[l].y > y)) && (x < (pts[l].x - pts[k].x) * (y - pts[k].y) / (pts[l].y - pts[k].y) + pts[k].x)) inside = !inside;
                    } return inside;
                }); return p ? materials[p.matIdx].k : 0;
            }));

            const te = +document.getElementById('tExt').value, ti = +document.getElementById('tInt').value;
            T = Array.from({length:res}, () => new Array(res).fill((te+ti)/2));
            isExt = Array.from({length:res}, () => new Array(res).fill(false));
            isIntMeas = Array.from({length:res}, () => new Array(res).fill(false));
            isIntSec = Array.from({length:res}, () => new Array(res).fill(false));

            boundaryEdges.forEach(e => {
                if(e.type===0 || e.type===3) return;
                const steps = Math.ceil(Math.hypot(e.p2.x-e.p1.x, e.p2.y-e.p1.y)/Math.min(dx,dy)*2);
                for(let s=0; s<=steps; s++){
                    const px = e.p1.x + (s/steps)*(e.p2.x-e.p1.x), py = e.p1.y + (s/steps)*(e.p2.y-e.p1.y);
                    const j = Math.floor((px-minX)/dx), i = Math.floor((py-minY)/dy);
                    if(i>=0 && i<res && j>=0 && j<res){
                        if(e.type===1) isExt[i][j]=true; if(e.type===2) isIntMeas[i][j]=true; if(e.type===4) isIntSec[i][j]=true;
                        if(kGrid[i][j]===0) kGrid[i][j] = 0.026; 
                    }
                }
            });

            const iter = res === 200 ? 3000 : 1500;
            for(let it=0; it<iter; it++){
                for(let i=0; i<res; i++){
                    for(let j=0; j<res; j++){
                        if(kGrid[i][j]===0) continue;
                        
                        // Resistencias Superficiales (Rs)
                        if(isExt[i][j]){ T[i][j] = (te + T[i][j]*(kGrid[i][j]*Rse/dx)) / (1 + (kGrid[i][j]*Rse/dx)); continue; }
                        if(isIntMeas[i][j] || isIntSec[i][j]){ T[i][j] = (ti + T[i][j]*(kGrid[i][j]*Rsi/dx)) / (1 + (kGrid[i][j]*Rsi/dx)); continue; }
                        
                        let n=0, d=0;
                        if(j>0 && kGrid[i][j-1]>0){ n += kGrid[i][j-1]*T[i][j-1]; d += kGrid[i][j-1]; }
                        if(j<res-1 && kGrid[i][j+1]>0){ n += kGrid[i][j+1]*T[i][j+1]; d += kGrid[i][j+1]; }
                        if(i>0 && kGrid[i-1][j]>0){ n += kGrid[i-1][j]*T[i-1][j]; d += kGrid[i-1][j]; }
                        if(i<res-1 && kGrid[i+1][j]>0){ n += kGrid[i+1][j]*T[i+1][j]; d += kGrid[i+1][j]; }
                        if(d>0) T[i][j] = n/d;
                    }
                }
            }

            let flux = 0;
            for(let i=0; i<res; i++){
                for(let j=0; j<res; j++){
                    if(isIntMeas[i][j]){
                        if(j>0 && !isIntMeas[i][j-1] && kGrid[i][j-1]>0) flux += kGrid[i][j]*(ti - T[i][j]) / (kGrid[i][j]*Rsi + dx/2);
                        if(j<res-1 && !isIntMeas[i][j+1] && kGrid[i][j+1]>0) flux += kGrid[i][j]*(ti - T[i][j]) / (kGrid[i][j]*Rsi + dx/2);
                        if(i>0 && !isIntMeas[i-1][j] && kGrid[i-1][j]>0) flux += kGrid[i][j]*(ti - T[i][j]) / (kGrid[i][j]*Rsi + dy/2);
                        if(i<res-1 && !isIntMeas[i+1][j] && kGrid[i+1][j]>0) flux += kGrid[i][j]*(ti - T[i][j]) / (kGrid[i][j]*Rsi + dy/2);
                    }
                }
            }
            
            const deltaT = Math.abs(ti - te) || 1;
            const U = Math.abs(flux) / (lp * deltaT);
            document.getElementById('result').style.display="block";
            document.getElementById('result').innerHTML=`<h2>Uf = ${U.toFixed(3)} W/(m²·K)</h2><p>Flujo lineal (Q): ${Math.abs(flux).toFixed(3)} W/m | Malla: ${res}x${res}</p>`;
            
            showThermalMap=true; 
            document.getElementById('btnBackToEdit').style.display="inline-flex";
            document.getElementById('solverStatus').style.display="none"; 
            draw();
            setStatus("✅ Análisis térmico completado con éxito.", "success");
        }, 50);
    };

    updateMaterialUI();
    updateLegend();
})();
</script>
</body>
</html>
