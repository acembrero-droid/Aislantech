<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aislantherm · Análisis Térmico (ISO 10077-2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #EDD00E; --primary-dark: #B8860B; --primary-light: #FFF8DC;
            --secondary: #3E3E3E; --light: #F5F5F5; --dark: #333; --gray: #666;
            --radius: 8px; --transition: all 0.2s ease;
            --blue: #1976d2; --red: #d32f2f; --green: #2e7d32; --orange: #ff9800;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Open Sans',sans-serif; background:var(--light); color:var(--gray); overflow-x:hidden; }
        h1,h2,h3,.card-title,.btn { font-family:'Montserrat',sans-serif; font-weight:600; color:var(--dark); }
        .container { width:100%; max-width:1600px; margin:0 auto; padding:20px; }
        .header-container { display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:2px solid var(--primary); margin-bottom:20px; flex-wrap:wrap; }
        .logo-aislan { color:var(--secondary); font-size:1.5rem; font-weight:700; } .logo-tech { color:var(--primary); font-size:1.5rem; font-weight:800; }
        .main-layout { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
        .sidebar { flex:0 0 340px; display:flex; flex-direction:column; gap:15px; }
        .workspace { flex:1; min-width:500px; } .workspace-inner { max-width:850px; margin:0 auto; }
        @media (max-width:950px) { .sidebar,.workspace { flex:1 1 100%; min-width:100%; } .workspace-inner { max-width:100%; } }

        .card { background:#fff; border-radius:var(--radius); box-shadow:0 5px 15px rgba(0,0,0,0.05); border-top:4px solid var(--primary); }
        .card-body { padding:1.2rem; }
        .controls-stack { display:flex; flex-direction:column; gap:1.2rem; }
        .control-group { display:flex; flex-direction:column; gap:6px; }
        label { font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--secondary); }
        input,select { padding:8px 12px; border:1px solid #ddd; border-radius:var(--radius); font-size:0.85rem; width:100%; background:#fdfdfd; transition:var(--transition); }
        input:focus,select:focus { border-color:var(--primary); outline:none; background:#fff; box-shadow:0 0 0 3px var(--primary-light); }

        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:var(--radius); font-weight:700; border:none; cursor:pointer; transition:var(--transition); font-size:0.85rem; width:100%; }
        .btn-primary { background:var(--primary); color:var(--dark); } .btn-primary:hover { background:var(--primary-dark); color:#fff; }
        .btn-success { background:var(--green); color:#fff; font-size:1rem; padding:15px; } .btn-success:hover:not(:disabled) { background:#1b5e20; transform:translateY(-2px); box-shadow:0 4px 8px rgba(46,125,50,0.3); }
        .btn-outline { background:transparent; border:2px solid #ddd; color:var(--secondary); } .btn-outline:hover { background:#f0f0f0; border-color:#ccc; }
        .btn-edit { background:#0288d1; color:#fff; } .btn-edit:hover { background:#01579b; }
        .btn-pdf { background:var(--red); color:#fff; } .btn-pdf:hover { background:#b71c1c; }
        button:disabled { opacity:0.5; cursor:not-allowed; }

        .mode-switch { display:flex; background:#eee; border-radius:var(--radius); overflow:hidden; border:1px solid #ddd; }
        .mode-btn { flex:1; padding:8px 2px; font-weight:700; font-size:0.75rem; border:none; background:transparent; cursor:pointer; color:#666; transition:var(--transition); }
        .mode-btn.active { background:var(--secondary); color:#fff; }

        .tabs-header { display:flex; align-items:flex-end; border-bottom:2px solid var(--primary); background:#e8e8e8; padding:8px 10px 0; border-radius:8px 8px 0 0; }
        .tabs-list { display:flex; overflow-x:auto; flex:1; gap:4px; }
        .tabs-list::-webkit-scrollbar { height:4px; } .tabs-list::-webkit-scrollbar-thumb { background:#ccc; border-radius:2px; }
        .tab-item { background:#dcdcdc; color:#666; padding:10px 14px; border-radius:6px 6px 0 0; cursor:pointer; font-size:0.85rem; font-weight:600; display:flex; align-items:center; gap:6px; transition:0.2s; border:1px solid transparent; border-bottom:none; position:relative; bottom:-2px; }
        .tab-item:hover:not(.active) { background:#ebebeb; color:#333; }
        .tab-item.active { background:#fff; color:var(--primary-dark); font-weight:700; border-color:#ddd; border-top:3px solid var(--primary); border-bottom:2px solid #fff; z-index:2; }
        .tab-name { display:inline-block; min-width:40px; cursor:text; outline:none; }
        .tab-icon-btn { color:#aaa; cursor:pointer; font-size:0.75rem; padding:3px; border-radius:4px; transition:0.2s; margin-left:2px; }
        .tab-icon-btn:hover { color:#333; background:#e0e0e0; } .tab-close:hover { color:var(--red); background:rgba(211,47,47,0.1); }
        .global-tab-actions { display:flex; gap:5px; padding-left:10px; padding-bottom:6px; }
        .global-tab-btn { background:#fff; border:1px solid #ccc; color:#555; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:0.8rem; font-weight:600; transition:0.2s; }
        .global-tab-btn:hover { background:#f5f5f5; border-color:var(--primary); color:var(--primary-dark); }

        .status-bar { background:var(--primary-light); border-left:4px solid var(--primary); padding:10px 15px; border-radius:0 0 var(--radius) var(--radius); font-weight:600; font-size:0.85rem; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:15px; }
        .canvas-wrapper { position:relative; background:#fff; border:1px solid #ddd; overflow:hidden; box-shadow:inset 0 0 10px rgba(0,0,0,0.05); border-top:none; }
        canvas { display:block; width:100%; height:auto; cursor:crosshair; background-image:radial-gradient(#ddd 1px,transparent 1px); background-size:20px 20px; }
        canvas.grabbing { cursor:grabbing !important; }

        .legend-panel { display:flex; flex-wrap:wrap; gap:0.5rem; background:#fff; padding:12px; border-radius:var(--radius); align-items:center; border:1px solid #ddd; margin-bottom:15px; }
        .legend-item { display:flex; align-items:center; gap:8px; font-size:0.75rem; cursor:pointer; padding:6px 10px; border-radius:4px; transition:var(--transition); border:1px solid transparent; }
        .legend-item:hover { background:#f0f0f0; border-color:#ddd; } .legend-item.active { background:var(--primary-light); border-color:var(--primary); font-weight:600; }
        .legend-color { width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); }
        .boundary-legend { display:flex; gap:1rem; align-items:center; margin-left:auto; font-size:0.75rem; font-weight:700; border-left:1px solid #ddd; padding-left:15px; }
        .boundary-swatch { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid #000; }

        #customMatPanel { background:#fafafa; padding:15px; border-radius:8px; border:1px dashed #ccc; margin-top:10px; display:none; }
        .result-card { display:none; background:var(--green); color:#fff; padding:20px; border-radius:var(--radius); text-align:center; margin-bottom:20px; }
        hr.divider { border:none; border-top:1px solid #eee; margin:5px 0; }
        .btn-group-row { display:flex; gap:10px; flex-wrap:wrap; }
        .btn-sm { padding:8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-container">
        <div>
            <span class="logo-aislan">AISLAN</span><span class="logo-tech">THERM</span>
            <small style="margin-left:10px;opacity:0.6;font-weight:400;border-left:1px solid #ccc;padding-left:10px;">Aislantes técnicos del Mediterráneo</small>
        </div>
        <div id="solverStatus" style="font-weight:bold;color:var(--red);display:none;">
            <i class="fas fa-circle-notch fa-spin"></i> Calculando... <span id="calcProgress">0%</span>
        </div>
    </div>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="card"><div class="card-body controls-stack">
                <div class="control-group">
                    <label><i class="fas fa-file-upload"></i> 1. Archivo / Proyecto</label>
                    <div class="btn-group-row">
                        <label class="btn btn-outline" style="flex:1;padding:8px;cursor:pointer;text-align:center;margin:0;"><i class="fas fa-upload"></i> Importar DXF<input type="file" id="dxfFile" accept=".dxf" style="display:none;"></label>
                        <label class="btn btn-outline" style="flex:1;padding:8px;cursor:pointer;text-align:center;margin:0;"><i class="fas fa-folder-open"></i> Cargar (.json)<input type="file" id="jsonFile" accept=".json" style="display:none;"></label>
                    </div>
                    <button id="btnSaveProject" class="btn btn-primary btn-sm"><i class="fas fa-save"></i> Guardar Proyecto</button>
                </div>
                <div class="control-group"><label title="Ajusta si el DXF tiene huecos">Tolerancia de Unión (mm)</label><input type="number" id="tolInput" value="0.1" step="0.1"></div>
                <hr class="divider">
                <div class="control-group">
                    <label><i class="fas fa-mouse-pointer"></i> 2. Herramientas</label>
                    <div class="mode-switch">
                        <button id="btnModeMat" class="mode-btn active" title="Pintar Materiales"><i class="fas fa-fill-drip"></i></button>
                        <button id="btnModeBound" class="mode-btn" title="Pintar Contornos"><i class="fas fa-vector-square"></i></button>
                        <button id="btnModeCrop" class="mode-btn" title="Recortar Área"><i class="fas fa-crop-alt"></i></button>
                        <button id="btnModePan" class="mode-btn" title="Mover Vista"><i class="fas fa-hand-paper"></i></button>
                    </div>
                </div>
                <div class="control-group" style="background:#f9f9f9;padding:15px;border-radius:var(--radius);border:1px solid #eee;">
                    <label id="brushLabel">3. Acción Activa</label>
                    <div id="matBrushContainer"><select id="matSelect"></select><button id="btnShowCustomMat" class="btn btn-outline btn-sm"><i class="fas fa-plus"></i> Crear Nuevo Material</button></div>
                    <div id="customMatPanel">
                        <div class="control-group"><label>Nombre</label><input type="text" id="customMatName" placeholder="Ej: Espuma PUR"></div>
                        <div class="control-group"><label>Conductividad (λ) W/m·K</label><input type="number" id="customMatK" step="0.001" value="0.035"></div>
                        <div class="control-group"><label>Color</label><input type="color" id="customMatColor" value="#ff9800" style="height:38px;padding:0;width:100%;"></div>
                        <div class="btn-group-row" style="margin-top:10px;"><button id="btnCancelCustomMat" class="btn btn-outline" style="flex:1">Cancelar</button><button id="btnAddCustomMat" class="btn btn-primary" style="flex:1">Guardar</button></div>
                    </div>
                    <select id="boundSelect" style="display:none;font-weight:bold;">
                        <option value="1" style="color:var(--blue);">Exterior (Frío + Rse)</option>
                        <option value="2" style="color:var(--red);">Interior (Medir Uf + Rsi)</option>
                        <option value="4" style="color:var(--orange);">Interior Secundario</option>
                        <option value="3" style="color:#757575;">Adiabático (Cortar flujo)</option>
                        <option value="0" style="color:#000;">Borrar Contorno</option>
                    </select>
                    <div id="cropHelpText" style="display:none;font-size:0.75rem;color:#666;"><i class="fas fa-info-circle"></i> Arrastra en el lienzo para delimitar la zona de simulación.</div>
                    <div id="panHelpText" style="display:none;font-size:0.75rem;color:#666;"><i class="fas fa-hand-paper"></i> Arrastra para mover la vista del perfil.</div>
                </div>
                <hr class="divider">
                <div class="control-group">
                    <label><i class="fas fa-sliders-h"></i> 4. Condiciones de Ensayo</label>
                    <div class="btn-group-row">
                        <div class="control-group" style="flex:1"><label>T. Ext (ºC)</label><input type="number" id="tExt" value="0"></div>
                        <div class="control-group" style="flex:1"><label>T. Int (ºC)</label><input type="number" id="tInt" value="20"></div>
                    </div>
                    <div class="btn-group-row" style="margin-top:5px;">
                        <div class="control-group" style="flex:1"><label>Ancho b<sub>f</sub> (mm)</label><input type="number" id="LpInput" value="100"></div>
                        <div class="control-group" style="flex:1"><label>Emisividad (ε)</label><input type="number" id="emissInput" value="0.90" step="0.05" min="0.05" max="1.0"></div>
                    </div>
                </div>
                <div class="control-group"><label>Resolución de Malla (FDM)</label><select id="gridRes" style="font-weight:600;"><option value="200">Mínima (200x200)</option><option value="400" selected>Media (400x400)</option><option value="600">Alta (600x600)</option><option value="1000">Ultra (1000x1000) - Lento</option></select></div>
                <div class="control-group" style="margin-top:10px;"><button id="calcBtn" class="btn btn-success" disabled><i class="fas fa-play-circle"></i> EJECUTAR SIMULACIÓN</button></div>
            </div></div>
        </aside>

        <main class="workspace"><div class="workspace-inner">
            <div class="tabs-header">
                <div class="tabs-list" id="tabsContainer"></div>
                <div class="global-tab-actions">
                    <button class="global-tab-btn" id="btnAddTab"><i class="fas fa-plus"></i> Nuevo</button>
                    <button class="global-tab-btn" id="btnDuplicateTab"><i class="fas fa-copy"></i> Duplicar</button>
                </div>
            </div>
            <div class="canvas-wrapper"><canvas id="canvas" width="1100" height="700"></canvas></div>
            <div class="status-bar" id="status"><div><i class="fas fa-info-circle"></i> <span id="statusText">Esperando archivo DXF...</span></div>
                <div class="btn-group-row">
                    <button id="btnRotate" class="btn btn-outline btn-sm" title="Rotar 90º"><i class="fas fa-sync-alt"></i></button>
                    <button id="btnZoomReset" class="btn btn-outline btn-sm" title="Centrar Vista"><i class="fas fa-compress-arrows-alt"></i></button>
                </div>
            </div>
            <div class="legend-panel" id="legend"></div>
            <div class="btn-group-row" style="justify-content:center;margin-bottom:20px;">
                <button id="btnToggleIso" class="btn btn-outline" style="display:none;"><i class="fas fa-water"></i> Isotermas</button>
                <button id="btnBackToEdit" class="btn btn-edit" style="display:none;"><i class="fas fa-pencil-alt"></i> Editar Geometría</button>
                <button id="btnPdf" class="btn btn-pdf" style="display:none;"><i class="fas fa-file-pdf"></i> Generar Informe PDF</button>
            </div>
            <div id="result" class="result-card"></div>
        </div></main>
    </div>
</div>

<script>
// =========================== APLICACIÓN PRINCIPAL ===========================
const App = (() => {
    // ─── CONSTANTES Y CATÁLOGO ───
    const Rse = 0.04, Rsi = 0.13, Rsi_cond = 0.25, SIGMA = 5.67e-8, Tm = 283;
    const HR_BASE = 4 * SIGMA * Math.pow(Tm, 3);
    const materials = [
        { name: "Cámara Aire (No ventilada)", k: 0.026, color: "#ecf0f1" },
        { name: "Cámara Aire (Lig. ventilada)", k: 0.120, color: "#d5dbdb" },
        { name: "Aluminio", k: 160.0, color: "#95a5a6" },
        { name: "Acero (Carbono)", k: 50.0, color: "#546e7a" },
        { name: "Acero Inoxidable", k: 17.0, color: "#b0bec5" },
        { name: "Poliamida 25% FV", k: 0.30, color: "#d35400" },
        { name: "PVC Rígido", k: 0.17, color: "#9b59b6" },
        { name: "EPDM / Juntas", k: 0.25, color: "#2c3e50" },
        { name: "Silicona", k: 0.35, color: "#00bcd4" },
        { name: "Madera Blanda", k: 0.13, color: "#d3a36a" },
        { name: "Madera Dura", k: 0.18, color: "#8d6e63" },
        { name: "Vidrio Sódico", k: 1.0, color: "#81d4fa" },
        { name: "Ladrillo Macizo (CTE)", k: 0.87, color: "#d84315" },
        { name: "Aislante XPS (CTE)", k: 0.034, color: "#f1c40f" },
        { name: "Aislante EPS (CTE)", k: 0.039, color: "#ffee58" },
        { name: "Poliuretano PUR (CTE)", k: 0.028, color: "#f39c12" },
        { name: "Lana Mineral MW (CTE)", k: 0.035, color: "#a1887f" }
    ];

    // ─── WORKSPACE FACTORY ───
    const createWS = (name) => ({
        name, polygons: [], boundaryEdges: [], boundaryAdj: [],
        minX: 0, maxX: 0, minY: 0, maxY: 0, cropRect: null, calcBounds: null,
        zoomLevel: 1, offsetX: 0, offsetY: 0, baseScale: 1,
        T: null, kGrid: null, showThermalMap: false, showIsotherms: false,
        lastU: 0, lastFlux: 0, lastL2D: 0, lastFRsi: 0, lastTsiMin: 0,
        lastTsiMinX: null, lastTsiMinY: null, lastAlgo: "FDM Métrico (ISO 10077-2)",
        settings: { tol: 0.1, Lp: 100, tExt: 0, tInt: 20, res: 400, emiss: 0.90 }
    });

    // ─── ESTADO GLOBAL ───
    let workspaces = [createWS("Perfil 1")], currentWsIdx = 0, wsCounter = 1;
    let ws = () => workspaces[currentWsIdx];
    let polygons = [], boundaryEdges = [], boundaryAdj = [];
    let minX, maxX, minY, maxY, cropRect, calcBounds, zoomLevel = 1, offsetX = 0, offsetY = 0, baseScale = 1;
    let T = null, kGrid = null, showThermalMap = false, showIsotherms = false;
    let lastU = 0, lastFlux = 0, lastL2D = 0, lastFRsi = 0, lastTsiMin = 0, lastTsiMinX = null, lastTsiMinY = null, lastAlgo = "FDM Métrico";
    let selectedPoly = -1, hoveredPolyIdx = -1, hoveredEdgeIdx = -1, editMode = 'MATERIAL';
    let isDragging = false, dragStartX = 0, dragStartY = 0, hasDragged = false;
    let isCropping = false, cropStartX = 0, cropStartY = 0;
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

    // ─── UTILIDADES ───
    const $ = id => document.getElementById(id);
    const getVal = (id, fallback) => { const el = $(id); return el ? parseFloat(el.value) || fallback : fallback; };
    const setStatus = (msg, type = 'info') => {
        const st = $('statusText'), bar = $('status');
        if (st) st.textContent = msg;
        if (bar) {
            bar.className = `status-bar ${type}`;
            const icons = { error: 'fa-exclamation-triangle', success: 'fa-check-circle', info: 'fa-info-circle' };
            const icon = bar.querySelector('i'); if (icon) icon.className = `fas ${icons[type] || icons.info}`;
        }
    };

    // ─── SYNC STATE ←→ WORKSPACE ───
    const saveState = () => {
        const w = ws(); if (!w) return;
        Object.assign(w, { polygons, boundaryEdges, boundaryAdj, minX, maxX, minY, maxY, cropRect, calcBounds, zoomLevel, offsetX, offsetY, baseScale, T, kGrid, showThermalMap, showIsotherms, lastU, lastFlux, lastL2D, lastFRsi, lastTsiMin, lastTsiMinX, lastTsiMinY, lastAlgo });
        w.settings = { tol: getVal('tolInput', 0.1), Lp: getVal('LpInput', 100), tExt: getVal('tExt', 0), tInt: getVal('tInt', 20), res: parseInt($('gridRes').value) || 400, emiss: getVal('emissInput', 0.9) };
    };

    const loadState = (idx, skipSave = false) => {
        if (!skipSave) saveState();
        currentWsIdx = idx; const w = ws();
        ({ polygons, boundaryEdges, boundaryAdj, minX, maxX, minY, maxY, cropRect, calcBounds, zoomLevel, offsetX, offsetY, baseScale, T, kGrid, showThermalMap, showIsotherms, lastU, lastFlux, lastL2D, lastFRsi, lastTsiMin, lastTsiMinX, lastTsiMinY, lastAlgo } = w);
        if (w.settings) {
            $('tolInput').value = w.settings.tol; $('LpInput').value = w.settings.Lp;
            $('tExt').value = w.settings.tExt; $('tInt').value = w.settings.tInt;
            $('gridRes').value = w.settings.res; $('emissInput').value = w.settings.emiss;
        }
        updateResultUI(); updateCalcButton(); updatePdfButton(); renderTabs(); draw();
    };

    // ─── ACTUALIZACIÓN DE UI ───
    const updateCalcButton = () => { $('calcBtn').disabled = polygons.length === 0; };
    const updatePdfButton = () => {
        const hasResults = workspaces.some(w => w.T !== null);
        $('btnPdf').style.display = hasResults ? 'inline-flex' : 'none';
        $('btnPdf').innerHTML = workspaces.filter(w => w.T !== null).length > 1
            ? '<i class="fas fa-file-pdf"></i> Generar Informe Comparativo'
            : '<i class="fas fa-file-pdf"></i> Generar Informe PDF';
    };
    const updateResultUI = () => {
        const res = $('result'), back = $('btnBackToEdit'), iso = $('btnToggleIso');
        if (showThermalMap) {
            res.style.display = 'block';
            res.innerHTML = `<h2>U<sub>f</sub> = ${lastU.toFixed(3)} W/(m²K)</h2><h3>f<sub>Rsi</sub> = ${lastFRsi.toFixed(3)} (T<sub>min</sub> = ${lastTsiMin.toFixed(1)}ºC)</h3>`;
            back.style.display = 'inline-flex'; iso.style.display = 'inline-flex';
            iso.classList.toggle('active', showIsotherms);
        } else {
            res.style.display = 'none'; back.style.display = 'none'; iso.style.display = 'none'; iso.classList.remove('active');
        }
    };
    const updateLegendUI = () => {
        const activeIdx = parseInt($('matSelect').value) || 0;
        $('legend').innerHTML = materials.map((m, i) =>
            `<div class="legend-item ${i === activeIdx ? 'active' : ''}" onclick="App.setBrush(${i})">
                <div class="legend-color" style="background:${m.color}"></div><span>${m.name}</span>
            </div>`).join('') +
            `<div class="boundary-legend"><span><span class="boundary-swatch" style="background:#1976d2"></span> Ext.</span><span><span class="boundary-swatch" style="background:#d32f2f"></span> Int.</span></div>`;
    };
    const updateMaterialUI = () => {
        const sel = $('matSelect'), current = sel.value;
        sel.innerHTML = materials.map((m, i) => `<option value="${i}">${m.name} (λ=${m.k})</option>`).join('') + '<option value="CUSTOM">+ Nuevo Material...</option>';
        if (current && parseInt(current) < materials.length) sel.value = current; else sel.value = "0";
        updateLegendUI();
    };

    // ─── PESTAÑAS ───
    const renderTabs = () => {
        $('tabsContainer').innerHTML = workspaces.map((w, i) => `
            <div class="tab-item ${i === currentWsIdx ? 'active' : ''}" onclick="App.switchTab(${i})">
                ${w.T ? '<i class="fas fa-check-circle" style="color:#2e7d32"></i>' : '<i class="fas fa-drafting-compass"></i>'}

    };

    // ─── TRANSFORMACIONES ───
    const getTransform = () => {
        const cw = canvas.width, ch = canvas.height, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, s = baseScale * zoomLevel;
        return { s, tx: x => offsetX + cw / 2 + (x - cx) * s, ty: y => offsetY + ch / 2 - (y - cy) * s };
    };

    // ─── RECÁLCULO DE LÍMITES ───
    const recalcBounds = () => {
        if (!polygons.length) return;

        $('LpInput').value = Math.round(h);
        baseScale = Math.min((canvas.width - 80) / (maxX - minX || 1), (canvas.height - 80) / (maxY - minY || 1));

    };

    // ─── PARSER DXF OPTIMIZADO ───
    const parseDXF = (text) => {
        const lines = text.split(/\r?\n/); let idx = 0, segments = [], curE = null, curPoly = null;
        const getP = () => (idx < lines.length - 1) ? [parseInt(lines[idx++].trim()), lines[idx++].trim()] : null;
        const addBulge = (p1, p2, bulge) => {
            if (!bulge || Math.abs(bulge) < 1e-5) { segments.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }); return; }
            const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.hypot(dx, dy); if (dist < 1e-6) return;
            const theta = 4 * Math.atan(bulge), r = Math.abs(dist / (2 * Math.sin(theta / 2))), dir = bulge > 0 ? 1 : -1;
            const cx = (p1.x + p2.x) / 2 + (-dy / dist * dir) * r * Math.cos(theta / 2), cy = (p1.y + p2.y) / 2 + (dx / dist * dir) * r * Math.cos(theta / 2);
            let a1 = Math.atan2(p1.y - cy, p1.x - cx), a2 = Math.atan2(p2.y - cy, p2.x - cx);

            const N = Math.max(6, Math.floor(Math.abs(a2 - a1) * r / 2));

            for (let i = 1; i <= N; i++) { const a = a1 + (a2 - a1) * i / N; segments.push({ x1: px, y1: py, x2: cx + r * Math.cos(a), y2: cy + r * Math.sin(a) }); px = segments[segments.length - 1].x2; py = segments[segments.length - 1].y2; }
        };
        const flushE = (e) => {
            if (!e || e.ignore) return;
            if (e.type === 'VERTEX' && curPoly) curPoly.vertices.push({ x: e.x || 0, y: e.y || 0, bulge: e.bulge || 0 });
            else if (e.type === 'LINE' && e.x1 !== undefined) segments.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2 });
            else if ((e.type === 'CIRCLE' || e.type === 'ARC') && e.r > 0) {

                if (e.type === 'ARC' && re <= rs) re += 2 * Math.PI;
                const N = Math.max(12, Math.floor(Math.abs(re - rs) * e.r / 2));

                for (let i = 1; i <= N; i++) { const a = rs + (re - rs) * i / N; segments.push({ x1: px, y1: py, x2: e.cx + e.r * Math.cos(a), y2: e.cy + e.r * Math.sin(a) }); px = segments[segments.length - 1].x2; py = segments[segments.length - 1].y2; }
            } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length) {

        while (idx < lines.length) {

                else if (v === 'VERTEX') curE = { type: 'VERTEX', x: 0, y: 0, bulge: 0 };

                    LWPOLYLINE: {}, POLYLINE: {}, VERTEX: { 10: 'x', 20: 'y', 42: 'bulge' }

                    else if (c === 10 && curE.type === 'LWPOLYLINE') curE.vertices.push({ x: val, y: 0, bulge: 0 });
                    else if (c === 20 && curE.type === 'LWPOLYLINE' && curE.vertices.length) curE.vertices[curE.vertices.length - 1].y = val;
                    else if (c === 42 && curE.type === 'LWPOLYLINE' && curE.vertices.length) curE.vertices[curE.vertices.length - 1].bulge = val;

    };

    // ─── TOPOLOGÍA ───
    const buildTopology = (raw, tol) => {
        const pts = []; raw.forEach(s => { pts.push({ x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 }); });
        for (let i = 0; i < raw.length; i++) {
            const s1 = raw[i];
            for (let j = i + 1; j < raw.length; j++) {
                const s2 = raw[j], den = (s1.x2 - s1.x1) * (s2.y2 - s2.y1) - (s1.y2 - s1.y1) * (s2.x2 - s2.x1);
                if (Math.abs(den) > 1e-7) {
                    const u = ((s2.x1 - s1.x1) * (s2.y2 - s2.y1) - (s2.y1 - s1.y1) * (s2.x2 - s2.x1)) / den;
                    const v = ((s2.x1 - s1.x1) * (s1.y2 - s1.y1) - (s2.y1 - s1.y1) * (s1.x2 - s1.x1)) / den;
                    if (u > -1e-5 && u < 1 + 1e-5 && v > -1e-5 && v < 1 + 1e-5) pts.push({ x: s1.x1 + u * (s1.x2 - s1.x1), y: s1.y1 + u * (s1.y2 - s1.y1) });
                }
            }
        }
        const segments = [];
        raw.forEach(s => {
            const tVals = [0, 1], l2 = (s.x2 - s.x1) ** 2 + (s.y2 - s.y1) ** 2; if (l2 < 1e-7) return;
            pts.forEach(p => { const t = ((p.x - s.x1) * (s.x2 - s.x1) + (p.y - s.y1) * (s.y2 - s.y1)) / l2; if (t > 1e-5 && t < 1 - 1e-5 && Math.hypot(p.x - (s.x1 + t * (s.x2 - s.x1)), p.y - (s.y1 + t * (s.y2 - s.y1))) <= tol) tVals.push(t); });
            tVals.sort((a, b) => a - b); let prevT = tVals[0];
            for (let k = 1; k < tVals.length; k++) { if (tVals[k] - prevT < 1e-5) continue; segments.push({ x1: s.x1 + prevT * (s.x2 - s.x1), y1: s.y1 + prevT * (s.y2 - s.y1), x2: s.x1 + tVals[k] * (s.x2 - s.x1), y2: s.y1 + tVals[k] * (s.y2 - s.y1) }); prevT = tVals[k]; }
        });
        const vertices = [], grid = new Map();
        const getV = (x, y) => {
            const gx = Math.round(x / tol), gy = Math.round(y / tol);
            for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const key = `${gx + dx},${gy + dy}`; if (grid.has(key)) for (const v of grid.get(key)) if (Math.hypot(v.x - x, v.y - y) <= tol) return v; }
            const v = { id: vertices.length, x, y, adj: [] }; vertices.push(v); const k = `${gx},${gy}`; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(v); return v;
        };
        const uniqueEdges = new Map();
        segments.forEach(s => { const v1 = getV(s.x1, s.y1), v2 = getV(s.x2, s.y2); if (v1.id !== v2.id) uniqueEdges.set(`${Math.min(v1.id, v2.id)}-${Math.max(v1.id, v2.id)}`, { v1, v2 }); });
        const adj = new Map();
        uniqueEdges.forEach((_, key) => { const [id1, id2] = key.split('-').map(Number); if (!adj.has(id1)) adj.set(id1, new Set()); if (!adj.has(id2)) adj.set(id2, new Set()); adj.get(id1).add(id2); adj.get(id2).add(id1); });
        let pruned = true;
        while (pruned) { pruned = false; for (const [vId, neighbors] of adj.entries()) { if (neighbors.size === 1) { const nId = Array.from(neighbors)[0]; neighbors.delete(nId); if (adj.has(nId)) adj.get(nId).delete(vId); uniqueEdges.delete(`${Math.min(vId, nId)}-${Math.max(vId, nId)}`); pruned = true; } } }
        const halfEdges = [];
        uniqueEdges.forEach(e => {
            const h1 = { from: e.v1, to: e.v2, angle: Math.atan2(e.v2.y - e.v1.y, e.v2.x - e.v1.x), used: false };
            const h2 = { from: e.v2, to: e.v1, angle: Math.atan2(e.v1.y - e.v2.y, e.v1.x - e.v2.x), used: false };

        const rawFaces = [];
        halfEdges.forEach(he => { if (he.used) return; const pts = []; let curr = he, loops = 0; while (!curr.used && loops < 10000) { curr.used = true; pts.push({ x: curr.from.x, y: curr.from.y }); curr = curr.to.adj[(curr.to.adj.indexOf(curr.rev) - 1 + curr.to.adj.length) % curr.to.adj.length]; loops++; } if (pts.length > 2) { let area = 0; for (let i = 0; i < pts.length; i++) area += pts[i].x * pts[(i + 1) % pts.length].y - pts[(i + 1) % pts.length].x * pts[i].y; rawFaces.push({ pts, signedArea: area / 2, area: Math.abs(area / 2), matIdx: 2 }); } });
        let maxA = -1, sign = 1;
        rawFaces.forEach(f => { if (f.area > maxA) { maxA = f.area; sign = Math.sign(f.signedArea); } });

    };

    const extractBoundaryEdges = (polys, tol) => {
        const map = new Map(), rT = v => Math.round(v / tol) * tol;

            for (let i = 0; i < poly.pts.length; i++) {
                const p1 = poly.pts[i], p2 = poly.pts[(i + 1) % poly.pts.length];
                const k1 = `${rT(p1.x)},${rT(p1.y)}-${rT(p2.x)},${rT(p2.y)}`, k2 = `${rT(p2.x)},${rT(p2.y)}-${rT(p1.x)},${rT(p1.y)}`;
                if (map.has(k1)) map.get(k1).count++; else if (map.has(k2)) map.get(k2).count++; else map.set(k1, { p1, p2, count: 1, type: 0 });
            }

        const edges = Array.from(map.values()).filter(e => e.count === 1).map(e => ({ p1: e.p1, p2: e.p2, type: 0 }));
        boundaryAdj = edges.map(() => []);
        for (let i = 0; i < edges.length; i++) {
            for (let j = i + 1; j < edges.length; j++) {

                const d2 = Math.hypot(edges[i].p1.x - edges[j].p2.x, edges[i].p1.y - edges[j].p2.y);
                const d3 = Math.hypot(edges[i].p2.x - edges[j].p1.x, edges[i].p2.y - edges[j].p1.y);
                const d4 = Math.hypot(edges[i].p2.x - edges[j].p2.x, edges[i].p2.y - edges[j].p2.y);

            }

    };

    // ─── DIBUJO ───
    const draw = (opts = {}) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (!polygons.length) return;
        const { tx, ty, s } = getTransform();
        const drawThermal = opts.drawThermal ?? (showThermalMap && T && calcBounds);
        const drawIsos = opts.drawIsos ?? (showIsotherms && T && calcBounds);
        const drawMarker = opts.drawMarker ?? (showThermalMap && lastTsiMinX !== null);
        const res = ws().settings.res || 400;
        const dx = calcBounds ? (calcBounds.maxX - calcBounds.minX) / res : 0.001;
        const dy = calcBounds ? (calcBounds.maxY - calcBounds.minY) / res : 0.001;

        if (drawThermal && kGrid) {
            const te = ws().settings.tExt, ti = ws().settings.tInt;
            const cw = dx * s, ch = dy * s;
            for (let i = 0; i < res; i++) {
                for (let j = 0; j < res; j++) {
                    if (kGrid[i][j] > 0) {
                        const f = Math.max(0, Math.min(1, (T[i][j] - te) / (ti - te || 1)));
                        ctx.fillStyle = `hsl(${(1 - f) * 240}, 75%, 50%)`;
                        ctx.fillRect(tx(calcBounds.minX + j * dx), ty(calcBounds.minY + i * dy) - ch, cw + 0.6, ch + 0.6);
                    }

            p.pts.forEach(pt => ctx.lineTo(tx(pt.x), ty(pt.y))); ctx.closePath();

            ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();

            const colors = { 1: '#1976d2', 2: '#d32f2f', 3: '#757575', 4: '#ff9800' };
            ctx.strokeStyle = colors[edge.type] || 'rgba(0,0,0,0.1)';
            ctx.lineWidth = (!drawThermal && editMode === 'BOUNDARY' && i === hoveredEdgeIdx) ? 8 : (edge.type ? 4 : 1.5);
            ctx.stroke();

            const te = ws().settings.tExt, ti = ws().settings.tInt, ch = dy * s, isos = new Set([13]);
            for (let t = Math.ceil(te); t <= Math.floor(ti); t += 2) isos.add(t);
            ctx.font = '300 9px "Open Sans", sans-serif';
            for (let i = 0; i < res; i++) for (let j = 0; j < res; j++) if (kGrid[i][j] > 0) for (const iso of isos) {
                if (j < res - 1 && ((T[i][j] <= iso && T[i][j + 1] > iso) || (T[i][j] >= iso && T[i][j + 1] < iso))) { const px = tx(calcBounds.minX + j * dx + dx / 2), py = ty(calcBounds.minY + i * dy) - ch / 2; ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(px, py, 1.2, 1.2); if (i % 45 === 0) { ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillText(iso + '°', px + 3, py - 2); } }
                if (i < res - 1 && ((T[i][j] <= iso && T[i + 1][j] > iso) || (T[i][j] >= iso && T[i + 1][j] < iso))) { const px = tx(calcBounds.minX + j * dx), py = ty(calcBounds.minY + i * dy + dy / 2) - ch; ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(px, py, 1.2, 1.2); if (j % 45 === 0) { ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillText(iso + '°', px + 3, py - 2); } }
            }

    // ─── SOLVER FDM OPTIMIZADO ───
    const runSolver = () => {
        if (!polygons.length || !boundaryEdges.some(e => e.type === 1) || !boundaryEdges.some(e => e.type === 2)) {

            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);
            const wBefore = getWorld(mx, my);
            zoomLevel = Math.max(0.1, Math.min(zoomLevel * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 50));
            const cw = canvas.width, ch = canvas.height, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            offsetX = mx - cw / 2 - (wBefore.x - cx) * baseScale * zoomLevel;
            offsetY = my - ch / 2 + (wBefore.y - cy) * baseScale * zoomLevel;
            draw();
        };
        $('canvas').onmousedown = e => {
            if (!polygons.length) return;
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);
            const w = getWorld(mx, my);
            if (editMode === 'CROP' && !showThermalMap && e.button === 0) { isCropping = true; cropStartX = w.x; cropStartY = w.y; cropRect = { x1: w.x, y1: w.y, x2: w.x, y2: w.y }; return; }
            isDragging = true; hasDragged = false; dragStartX = mx - offsetX; dragStartY = my - offsetY;
            canvas.classList.add('grabbing');
            canvas._dragStartClient = { x: e.clientX, y: e.clientY };
        };
        $('canvas').onmousemove = e => {
            if (!polygons.length) return;
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);
            if (isDragging) {
                const ds = canvas._dragStartClient;
                if (ds && Math.hypot(e.clientX - ds.x, e.clientY - ds.y) > 3) hasDragged = true;
                if (editMode === 'PAN' || showThermalMap || editMode === 'MATERIAL' || editMode === 'BOUNDARY') { offsetX = mx - dragStartX; offsetY = my - dragStartY; draw(); }
                return;
            }
            if (showThermalMap || editMode === 'PAN') return;
            const w = getWorld(mx, my);
            if (isCropping) { cropRect.x2 = w.x; cropRect.y2 = w.y; draw(); return; }
            let updated = false;
            if (editMode === 'BOUNDARY') {
                let minD = Infinity, hE = -1;
                boundaryEdges.forEach((edge, i) => {
                    const dx = edge.p2.x - edge.p1.x, dy = edge.p2.y - edge.p1.y, l2 = dx * dx + dy * dy;
                    const t = Math.max(0, Math.min(1, ((w.x - edge.p1.x) * dx + (w.y - edge.p1.y) * dy) / l2));
                    const dist = Math.hypot(w.x - (edge.p1.x + t * dx), w.y - (edge.p1.y + t * dy));
                    if (dist < minD) { minD = dist; hE = i; }
                });
                if (minD > 12 / (baseScale * zoomLevel)) hE = -1;
                if (hE !== hoveredEdgeIdx) { hoveredEdgeIdx = hE; updated = true; }
            } else if (editMode === 'MATERIAL') {
                let hP = -1;
                for (let i = polygons.length - 1; i >= 0; i--) { let inside = false; const pts = polygons[i].pts; for (let k = 0, l = pts.length - 1; k < pts.length; l = k++) if (((pts[k].y > w.y) !== (pts[l].y > w.y)) && (w.x < (pts[l].x - pts[k].x) * (w.y - pts[k].y) / (pts[l].y - pts[k].y) + pts[k].x)) inside = !inside; if (inside) { hP = i; break; } }
                if (hP !== hoveredPolyIdx) { hoveredPolyIdx = hP; updated = true; }
            }
            if (updated) draw();
        };
        $('canvas').onmouseup = e => {
            if (!polygons.length) return;
            isDragging = false; canvas.classList.remove('grabbing');
            if (hasDragged) return;
            if (showThermalMap || editMode === 'PAN') return;
            if (isCropping) {
                isCropping = false;
                if (Math.hypot(cropRect.x1 - cropRect.x2, cropRect.y1 - cropRect.y2) < 5 / baseScale / zoomLevel) { cropRect = null; calcBounds = null; setStatus('Área restablecida.'); }
                else { const m = 5 / baseScale / zoomLevel; calcBounds = { minX: Math.min(cropRect.x1, cropRect.x2) - m, maxX: Math.max(cropRect.x1, cropRect.x2) + m, minY: Math.min(cropRect.y1, cropRect.y2) - m, maxY: Math.max(cropRect.y1, cropRect.y2) + m }; setStatus('Área acotada.'); }
                draw(); return;
            }
            if (editMode === 'BOUNDARY' && hoveredEdgeIdx !== -1) {
                const activeType = parseInt($('boundSelect').value);
                if (e.shiftKey) {
                    let queue = [[hoveredEdgeIdx, [hoveredEdgeIdx]]], visited = new Set([hoveredEdgeIdx]);
                    while (queue.length) { const [curr, path] = queue.shift(); if (boundaryEdges[curr].type && curr !== hoveredEdgeIdx) { path.forEach(id => boundaryEdges[id].type = activeType); break; } for (const n of boundaryAdj[curr]) if (!visited.has(n)) { visited.add(n); queue.push([n, [...path, n]]); } }
                } else boundaryEdges[hoveredEdgeIdx].type = activeType;
                draw();
            }
            if (editMode === 'MATERIAL' && hoveredPolyIdx !== -1) { const mat = parseInt($('matSelect').value); if (!isNaN(mat)) { polygons[hoveredPolyIdx].matIdx = mat; selectedPoly = hoveredPolyIdx; draw(); } }
        };
        document.querySelectorAll('#tolInput, #LpInput, #tExt, #tInt, #gridRes, #emissInput').forEach(el => el.onchange = () => { if (ws()) saveState(); });
        updateMaterialUI(); renderTabs(); draw();
    };

    // ─── API PÚBLICA ───
    return {
        switchTab: loadState, addTab, duplicateTab, removeTab, renameTab, saveTabName,
        setBrush: setBrushMaterial, init, setStatus, updateSettings: () => { if (ws()) saveState(); }
    };
})();

// Inicializar al cargar
window.addEventListener('DOMContentLoaded', () => { App.init(); window.setStatus = App.setStatus; });
</script>
</body>
