<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aislantech · Análisis Térmico Pro (ISO 10077-2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería para generar el PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --color-primary: #EDD00E; --color-primary-dark: #B8860B; --color-primary-light: #FFF8DC;
            --color-secondary: #3E3E3E; --color-light: #F5F5F5; --color-dark: #333333; --color-gray: #666666; 
            --transition: all 0.2s ease; --border-radius: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Open Sans',sans-serif; background:var(--color-light); color:var(--color-gray); overflow-x: hidden; }
        h1,h2,h3,.card-title,.btn { font-family:'Montserrat',sans-serif; font-weight:600; color:var(--color-dark); }
        .container { width:100%; max-width:1600px; margin:0 auto; padding:20px; }
        
        .header-container { display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom: 2px solid var(--color-primary); margin-bottom: 20px;}
        .logo-aislan { color:var(--color-secondary); font-size:1.5rem; font-weight:700; }
        .logo-tech { color:var(--color-primary); font-size:1.5rem; font-weight:800; }

        /* Layout Izquierda/Derecha */
        .main-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
        .sidebar { flex: 0 0 340px; display: flex; flex-direction: column; gap: 15px; }
        .workspace { flex: 1; min-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        @media (max-width: 950px) {
            .sidebar { flex: 1 1 100%; }
            .workspace { flex: 1 1 100%; min-width: 100%; }
        }

        .card { background:white; border-radius:var(--border-radius); box-shadow:0 5px 15px rgba(0,0,0,0.05); border-top:4px solid var(--color-primary); }
        .card-body { padding:1.2rem; }
        
        .controls-stack { display:flex; flex-direction:column; gap:1.2rem; }
        .control-group { display:flex; flex-direction:column; gap:6px; }
        label { font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--color-secondary); }
        input, select { padding:10px 12px; border:1px solid #ddd; border-radius:var(--border-radius); font-size:0.85rem; width:100%; background: #fdfdfd; transition: var(--transition); }
        input:focus, select:focus { border-color: var(--color-primary); outline: none; background: #fff; box-shadow: 0 0 0 3px var(--color-primary-light); }
        
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:var(--border-radius); font-weight:700; border:none; cursor:pointer; transition:var(--transition); font-size:0.85rem; width: 100%; }
        .btn-primary { background:var(--color-primary); color:var(--color-dark); }
        .btn-primary:hover { background:var(--color-primary-dark); color:#fff; }
        .btn-success { background:#2e7d32; color:white; font-size: 1rem; padding: 15px; }
        .btn-success:hover:not(:disabled) { background:#1b5e20; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(46,125,50,0.3); }
        .btn-outline { background:transparent; border:2px solid #ddd; color:var(--color-secondary); }
        .btn-outline:hover { background:#f0f0f0; border-color:#ccc; }
        .btn-edit { background:#0288d1; color:white; }
        .btn-edit:hover { background:#01579b; }
        .btn-pdf { background:#d32f2f; color:white; }
        .btn-pdf:hover { background:#b71c1c; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .mode-switch { display:flex; background:#eee; border-radius:var(--border-radius); overflow:hidden; border:1px solid #ddd; flex-wrap: wrap;}
        .mode-btn { flex:1; padding:10px 5px; font-weight:700; font-size:0.75rem; border:none; background:transparent; cursor:pointer; color: #666; transition:var(--transition); min-width: 30%; text-align: center;}
        .mode-btn.active { background:var(--color-secondary); color:white; }
        
        .status-bar { background:var(--color-primary-light); border-left:4px solid var(--color-primary); padding:12px 16px; border-radius:var(--border-radius); font-weight:600; font-size:0.85rem; display: flex; align-items: center; justify-content: space-between; gap: 10px;}
        
        .canvas-wrapper { position:relative; background:#fff; border-radius:var(--border-radius); border:1px solid #ddd; overflow:hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        canvas { display:block; width:100%; height:auto; cursor:crosshair; background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 20px 20px; }
        canvas.grabbing { cursor: grabbing !important; }
        
        .legend-panel { display:flex; flex-wrap:wrap; gap:0.5rem; background:white; padding:12px; border-radius:var(--border-radius); align-items:center; border:1px solid #ddd; }
        .legend-item { display:flex; align-items:center; gap:8px; font-size:0.75rem; cursor:pointer; padding: 6px 10px; border-radius: 4px; transition: var(--transition); border: 1px solid transparent; }
        .legend-item:hover { background: #f0f0f0; border-color: #ddd; }
        .legend-item.active { background: var(--color-primary-light); border-color: var(--color-primary); font-weight: 600; }
        .legend-color { width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); }
        
        .boundary-legend { display:flex; gap:1rem; align-items:center; margin-left:auto; font-size:0.75rem; font-weight:700; border-left: 1px solid #ddd; padding-left: 15px; }
        .boundary-swatch { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid #000; }
        
        #customMatPanel { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; margin-top: 10px; display: none; }
        .result-card { display:none; background:#2e7d32; color:white; padding:20px; border-radius:var(--border-radius); text-align:center; position: relative;}

        hr.divider { border:none; border-top:1px solid #eee; margin: 5px 0; }
        .btn-group-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <div>
            <span class="logo-aislan">AISLAN</span><span class="logo-tech">TECH</span> 
            <small style="margin-left:10px; opacity:0.6; font-weight: 400; border-left: 1px solid #ccc; padding-left: 10px;">Thermal Simulator ISO 10077-2 / CTE</small>
        </div>
        <div id="solverStatus" style="font-weight: bold; color: #d32f2f; display:none;">
            <i class="fas fa-circle-notch fa-spin"></i> Calculando FDM Termodinámico... <span id="calcProgress">0%</span>
        </div>
    </div>
    
    <div class="main-layout">
        <!-- BARRA LATERAL (CONTROLES) -->
        <aside class="sidebar">
            <div class="card">
                <div class="card-body controls-stack">
                    
                    <div class="control-group">
                        <label><i class="fas fa-file-upload"></i> 1. Importar Geometría (DXF)</label>
                        <input type="file" id="dxfFile" accept=".dxf">
                    </div>

                    <div class="control-group">
                        <label title="Ajusta si el DXF tiene huecos (ej: 0.1, 0.5)">Tolerancia de Unión (mm)</label>
                        <input type="number" id="tolInput" value="0.1" step="0.1">
                    </div>

                    <hr class="divider">

                    <div class="control-group">
                        <label><i class="fas fa-mouse-pointer"></i> 2. Herramienta de Trabajo</label>
                        <div class="mode-switch">
                            <button id="btnModeMat" class="mode-btn active"><i class="fas fa-fill-drip"></i> Material</button>
                            <button id="btnModeBound" class="mode-btn"><i class="fas fa-vector-square"></i> Contornos</button>
                            <button id="btnModeCrop" class="mode-btn"><i class="fas fa-crop-alt"></i> Área</button>
                        </div>
                    </div>

                    <div class="control-group" style="background: #f9f9f9; padding: 15px; border-radius: var(--border-radius); border: 1px solid #eee;">
                        <label id="brushLabel">3. Pincel Activo / Asignación</label>
                        
                        <!-- Panel Materiales -->
                        <div id="matBrushContainer" style="display:flex; flex-direction:column; gap:5px;">
                            <select id="matSelect"></select>
                            <button id="btnShowCustomMat" class="btn btn-outline btn-sm" style="padding:8px;"><i class="fas fa-plus"></i> Crear Nuevo Material</button>
                        </div>

                        <!-- Creador de Materiales -->
                        <div id="customMatPanel">
                            <div class="control-group"><label>Nombre</label><input type="text" id="customMatName" placeholder="Ej: Espuma PUR"></div>
                            <div class="control-group"><label>Conductividad (λ) W/m·K</label><input type="number" id="customMatK" step="0.001" value="0.035"></div>
                            <div class="control-group"><label>Color</label><input type="color" id="customMatColor" value="#ff9800" style="height:38px; padding:0; width:100%;"></div>
                            <div class="btn-group-row" style="margin-top:10px;">
                                <button id="btnCancelCustomMat" class="btn btn-outline" style="flex:1">Cancelar</button>
                                <button id="btnAddCustomMat" class="btn btn-primary" style="flex:1">Guardar</button>
                            </div>
                        </div>

                        <!-- Panel Contornos -->
                        <select id="boundSelect" style="display:none; font-weight:bold;">
                            <option value="1" style="color:#1976d2;">Exterior (Frío + Rse)</option>
                            <option value="2" style="color:#d32f2f;">Interior (Medir Uf + Rsi)</option>
                            <option value="4" style="color:#ff9800;">Interior Secundario</option>
                            <option value="3" style="color:#757575;">Adiabático (Cortar flujo)</option>
                            <option value="0" style="color:#000;">Borrar Contorno</option>
                        </select>
                        <div id="cropHelpText" style="display:none; font-size:0.75rem; color: #666; line-height:1.4;">
                            <i class="fas fa-info-circle"></i> Haz clic y arrastra en el lienzo para delimitar la zona exacta a simular. Un clic normal borrará el recorte.
                        </div>
                    </div>

                    <hr class="divider">

                    <div class="control-group">
                        <label><i class="fas fa-sliders-h"></i> 4. Condiciones de Ensayo</label>
                        <div class="btn-group-row">
                            <div class="control-group" style="flex:1"><label>T. Ext (ºC)</label><input type="number" id="tExt" value="0"></div>
                            <div class="control-group" style="flex:1"><label>T. Int (ºC)</label><input type="number" id="tInt" value="20"></div>
                        </div>
                        <div class="control-group" style="margin-top:5px;">
                            <label>Ancho de sección b<sub>f</sub> (mm)</label>
                            <input type="number" id="LpInput" value="100" title="Ancho proyectado perpendicular al flujo térmico">
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Resolución de Malla (FDM)</label>
                        <select id="gridRes" style="font-weight: 600;">
                            <option value="200">Mínima (200x200) - Rápido</option>
                            <option value="400" selected>Media (400x400) - Estándar</option>
                            <option value="600">Alta (600x600) - Preciso</option>
                            <option value="1000">Ultra (1000x1000) - Lento</option>
                        </select>
                    </div>

                    <div class="control-group" style="margin-top: 10px;">
                        <button id="calcBtn" class="btn btn-success" disabled><i class="fas fa-play-circle"></i> EJECUTAR SIMULACIÓN</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL (LIENZO Y RESULTADOS) -->
        <main class="workspace">
            <div class="status-bar" id="status">
                <div><i class="fas fa-info-circle"></i> <span id="statusText">Esperando archivo DXF...</span></div>
                <div class="btn-group-row">
                    <button id="btnRotate" class="btn btn-outline btn-sm" title="Rotar 90º"><i class="fas fa-sync-alt"></i></button>
                    <button id="btnZoomReset" class="btn btn-outline btn-sm" title="Centrar Vista"><i class="fas fa-compress-arrows-alt"></i></button>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="canvas" width="1100" height="700"></canvas>
            </div>

            <div class="legend-panel" id="legend"></div>

            <div class="btn-group-row" style="justify-content: center; margin-top: -5px;">
                <button id="btnToggleIso" class="btn btn-outline" style="display:none; flex:0 0 auto;"><i class="fas fa-water"></i> Ver / Ocultar Isotermas</button>
                <button id="btnBackToEdit" class="btn btn-edit" style="display:none; flex:0 0 auto;"><i class="fas fa-pencil-alt"></i> Editar Perfil</button>
                <button id="btnPdf" class="btn btn-pdf" style="display:none; flex:0 0 auto;"><i class="fas fa-file-pdf"></i> Descargar Informe PDF</button>
            </div>

            <div id="result" class="result-card"></div>
        </main>
    </div>
</div>

<script>
(function() {
    // ──── CATÁLOGO DE MATERIALES (CTE Y ESTÁNDARES) ────
    let materials = [
        { name: "Cámara Aire (No ventilada)", k: 0.026, color: "#ecf0f1" },
        { name: "Cámara Aire (Lig. ventilada)", k: 0.120, color: "#d5dbdb" },
        { name: "Aluminio", k: 160.0, color: "#95a5a6" },
        { name: "Acero (Carbono)", k: 50.0, color: "#546e7a" },
        { name: "Acero Inoxidable", k: 17.0, color: "#b0bec5" },
        { name: "Poliamida 25% FV", k: 0.30, color: "#d35400" },
        { name: "PVC Rígido", k: 0.17, color: "#9b59b6" },
        { name: "EPDM / Juntas", k: 0.25, color: "#2c3e50" },
        { name: "Silicona", k: 0.35, color: "#00bcd4" },
        { name: "Madera Blanda", k: 0.13, color: "#d3a36a" },
        { name: "Madera Dura", k: 0.18, color: "#8d6e63" },
        { name: "Vidrio Sódico", k: 1.0, color: "#81d4fa" },
        // --- MATERIALES CTE ---
        { name: "Ladrillo Macizo (CTE)", k: 0.87, color: "#d84315" },
        { name: "Ladrillo Perforado (CTE)", k: 0.53, color: "#e64a19" },
        { name: "Hormigón Armado (CTE)", k: 2.00, color: "#78909c" },
        { name: "Mortero Cemento (CTE)", k: 1.30, color: "#b0bec5" },
        { name: "Yeso / Escayola (CTE)", k: 0.30, color: "#f5f5f5" },
        { name: "Aislante XPS (CTE)", k: 0.034, color: "#f1c40f" },
        { name: "Aislante EPS (CTE)", k: 0.039, color: "#ffee58" },
        { name: "Poliuretano PUR (CTE)", k: 0.028, color: "#f39c12" },
        { name: "Lana Mineral MW (CTE)", k: 0.035, color: "#a1887f" }
    ];

    const Rse = 0.04; 
    const Rsi = 0.13; 

    let polygons = [], boundaryEdges = [], boundaryAdj = [];
    let minX, maxX, minY, maxY;
    let selectedPoly = -1, hoveredPolyIdx = -1, hoveredEdgeIdx = -1;
    let editMode = 'MATERIAL';

    // Area Crop
    let cropRect = null; 
    let isCropping = false;
    let cropStartX = 0, cropStartY = 0;
    let calcBounds = null; 

    // Variables Zoom & Pan
    let zoomLevel = 1, offsetX = 0, offsetY = 0, baseScale = 1;
    let isDragging = false, dragStartX = 0, dragStartY = 0, hasDragged = false;

    // Solver Data
    let T = null, kGrid = null, dx, dy, isExt, isIntMeas, isIntSec;
    let showThermalMap = false, showIsotherms = false;
    let lastU = 0, lastFlux = 0, lastL2D = 0, lastAlgo = "FDM";
    let lastFRsi = 0, lastTsiMin = 0;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusText = document.querySelector('#statusText');

    // ──── INTERFAZ Y MODOS ────
    function updateMaterialUI() {
        const sel = document.getElementById('matSelect');
        sel.innerHTML = materials.map((m,i) => `<option value="${i}">${m.name} (λ=${m.k})</option>`).join('');
        
        const activeIdx = parseInt(sel.value) || 0;

        document.getElementById('legend').innerHTML = materials.map((m,i)=>
            `<div class="legend-item ${i === activeIdx ? 'active' : ''}" onclick="setBrushMaterial(${i})" title="Pincel: ${m.name}">
                <div class="legend-color" style="background:${m.color}"></div> 
                <span>${m.name}</span>
            </div>`).join('') + `
            <div class="boundary-legend">
                <span><span class="boundary-swatch" style="background:#1976d2"></span> Ext.</span>
                <span><span class="boundary-swatch" style="background:#d32f2f"></span> Int (Uf)</span>
                <span><span class="boundary-swatch" style="background:#ff9800"></span> Int Sec.</span>
            </div>`;
    }

    document.getElementById('btnModeMat').onclick = function() {
        editMode = 'MATERIAL'; 
        this.classList.add('active'); 
        document.getElementById('btnModeBound').classList.remove('active');
        document.getElementById('btnModeCrop').classList.remove('active');
        document.getElementById('matBrushContainer').style.display = 'flex';
        document.getElementById('boundSelect').style.display = 'none';
        document.getElementById('cropHelpText').style.display = 'none';
        setStatus("Modo Materiales: Selecciona el material en la paleta y pinta el perfil.");
        draw();
    };

    document.getElementById('btnModeBound').onclick = function() {
        editMode = 'BOUNDARY'; 
        this.classList.add('active'); 
        document.getElementById('btnModeMat').classList.remove('active');
        document.getElementById('btnModeCrop').classList.remove('active');
        document.getElementById('matBrushContainer').style.display = 'none';
        document.getElementById('boundSelect').style.display = 'block';
        document.getElementById('cropHelpText').style.display = 'none';
        setStatus("Modo Contornos: SHIFT+Clic en una línea para pintar contornos continuos.");
        draw();
    };

    document.getElementById('btnModeCrop').onclick = function() {
        editMode = 'CROP'; 
        this.classList.add('active'); 
        document.getElementById('btnModeMat').classList.remove('active');
        document.getElementById('btnModeBound').classList.remove('active');
        document.getElementById('matBrushContainer').style.display = 'none';
        document.getElementById('boundSelect').style.display = 'none';
        document.getElementById('cropHelpText').style.display = 'block';
        setStatus("Modo Área: Haz clic y arrastra para definir la zona exacta a simular.");
        draw();
    };

    document.getElementById('btnShowCustomMat').onclick = () => {
        document.getElementById('customMatPanel').style.display = 'block';
    };

    document.getElementById('btnCancelCustomMat').onclick = () => {
        document.getElementById('customMatPanel').style.display = 'none';
    };
    
    document.getElementById('btnAddCustomMat').onclick = function() {
        const name = document.getElementById('customMatName').value || "Material Especial";
        const k = parseFloat(document.getElementById('customMatK').value) || 0.1;
        const color = document.getElementById('customMatColor').value;
        materials.push({name, k, color});
        
        document.getElementById('matSelect').value = materials.length - 1; 
        updateMaterialUI();
        document.getElementById('matSelect').value = materials.length - 1; 

        document.getElementById('customMatPanel').style.display = 'none';
        setStatus(`Material "${name}" añadido a la paleta.`);
    };

    document.getElementById('matSelect').onchange = function() {
        updateMaterialUI(); // Para actualizar la clase 'active' en la leyenda
    };

    window.setBrushMaterial = (idx) => {
        if (editMode !== 'MATERIAL') document.getElementById('btnModeMat').click();
        document.getElementById('matSelect').value = idx;
        updateMaterialUI();
        setStatus(`Pincel activo: ${materials[idx].name}`);
    };

    document.getElementById('btnBackToEdit').onclick = function() {
        showThermalMap = false;
        showIsotherms = false;
        this.style.display = 'none';
        document.getElementById('btnPdf').style.display = 'none';
        document.getElementById('btnToggleIso').style.display = 'none';
        document.getElementById('btnToggleIso').classList.remove('active');
        document.getElementById('result').style.display = 'none';
        document.getElementById('calcBtn').disabled = false;
        setStatus("Modo de edición activado.", "info");
        draw();
    };

    document.getElementById('btnToggleIso').onclick = function() {
        showIsotherms = !showIsotherms;
        if(showIsotherms) this.classList.add('active');
        else this.classList.remove('active');
        draw();
    };

    function setStatus(msg, type = 'info') {
        statusText.textContent = msg;
        const bar = document.getElementById('status');
        bar.className = `status-bar ${type}`;
        
        let icon = 'fas fa-info-circle';
        if(type === 'error') icon = 'fas fa-exclamation-triangle';
        if(type === 'success') icon = 'fas fa-check-circle';
        bar.querySelector('i').className = icon;
    }

    // ──── LECTOR DXF Y TOPOLOGÍA ────
    document.getElementById('dxfFile').onchange = e => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const tol = parseFloat(document.getElementById('tolInput').value) || 0.1;
                const segments = parseDXF(ev.target.result);
                if(segments.length === 0) throw new Error("No hay entidades 2D válidas. Asegúrate de explotar los bloques en tu CAD.");
                
                polygons = buildTopology(segments, tol);
                
                if(polygons.length) {
                    recalcBounds();
                    cropRect = null; 
                    calcBounds = null;
                    boundaryEdges = extractBoundaryEdges(polygons, tol);
                    document.getElementById('calcBtn').disabled = false;
                    showThermalMap = false;
                    showIsotherms = false;
                    document.getElementById('result').style.display = 'none';
                    document.getElementById('btnBackToEdit').style.display = 'none';
                    document.getElementById('btnPdf').style.display = 'none';
                    document.getElementById('btnToggleIso').style.display = 'none';
                    setStatus(`✅ DXF Importado (${polygons.length} áreas). Pinta los materiales.`, "success");
                    draw();
                } else throw new Error("No se formaron áreas cerradas. Ajusta la Tolerancia.");
            } catch(err) { setStatus("Error DXF: " + err.message, "error"); }
        };
        reader.readAsText(file);
    };

    function parseDXF(text) {
        const lines = text.split(/\r?\n/);
        let idx = 0, inEntities = false, segments = [];
        let curE = null, curPoly = null;

        const getP = () => {
            while (idx < lines.length - 1) {
                const c = parseInt(lines[idx++].trim()), v = lines[idx++].trim();
                return [c, v];
            } return null;
        };

        function addB(p1, p2, bulge) {
            if (!bulge || Math.abs(bulge) < 1e-5) { segments.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }); return; }
            const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.hypot(dx, dy); if (dist < 1e-6) return;
            const theta = 4 * Math.atan(bulge), radius = Math.abs(dist / (2 * Math.sin(theta / 2))), dir = bulge > 0 ? 1 : -1;
            const cx = (p1.x + p2.x) / 2 + (-dy / dist * dir) * radius * Math.cos(theta / 2);
            const cy = (p1.y + p2.y) / 2 + (dx / dist * dir) * radius * Math.cos(theta / 2);
            let a1 = Math.atan2(p1.y - cy, p1.x - cx), a2 = Math.atan2(p2.y - cy, p2.x - cx);
            if (bulge > 0 && a2 <= a1) a2 += 2 * Math.PI; if (bulge < 0 && a2 >= a1) a2 -= 2 * Math.PI;
            const N = Math.max(6, Math.floor(Math.abs(a2 - a1) * radius / 2));
            let px = p1.x, py = p1.y;
            for (let i = 1; i <= N; i++) {
                const a = a1 + (a2 - a1) * (i / N), x = cx + radius * Math.cos(a), y = cy + radius * Math.sin(a);
                segments.push({ x1: px, y1: py, x2: x, y2: y }); px = x; py = y;
            }
        }

        function flushE(e) {
            if (!e || e.ignore) return;
            if (e.type === 'VERTEX' && curPoly) curPoly.vertices.push({ x: e.x || 0, y: e.y || 0, bulge: e.bulge || 0 });
            else if (e.type === 'LINE' && e.x1 !== undefined && e.x2 !== undefined) segments.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2 });
            else if ((e.type === 'CIRCLE' || e.type === 'ARC') && e.r > 0) {
                let start = e.startAngle !== undefined ? e.startAngle : 0, end = e.endAngle !== undefined ? e.endAngle : 360;
                let rs = start * Math.PI / 180, re = end * Math.PI / 180;
                if (e.type === 'ARC' && re <= rs) re += 2 * Math.PI;
                const N = Math.max(12, Math.floor(Math.abs(re - rs) * e.r / 2));
                let px = e.cx + e.r * Math.cos(rs), py = e.cy + e.r * Math.sin(rs);
                for (let i = 1; i <= N; i++) {
                    const a = rs + (re - rs) * (i / N), x = e.cx + e.r * Math.cos(a), y = e.cy + e.r * Math.sin(a);
                    segments.push({ x1: px, y1: py, x2: x, y2: y }); px = x; py = y;
                }
            } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices && e.vertices.length > 0) {
                for (let i = 0; i < e.vertices.length - 1; i++) addB(e.vertices[i], e.vertices[i + 1], e.vertices[i].bulge);
                if (e.closed && e.vertices.length > 2) addB(e.vertices[e.vertices.length - 1], e.vertices[0], e.vertices[e.vertices.length - 1].bulge);
            }
        }

        while (idx < lines.length) {
            const pair = getP(); if (!pair) break; const [c, v] = pair;
            if (c === 0) {
                flushE(curE);
                if (v === 'LINE' || v === 'CIRCLE' || v === 'ARC' || v === 'LWPOLYLINE') curE = { type: v, vertices: [] };
                else if (v === 'POLYLINE') { curE = { type: v, vertices: [], closed: false }; curPoly = curE; }
                else if (v === 'VERTEX') curE = { type: 'VERTEX', x: 0, y: 0, bulge: 0 };
                else if (v === 'SEQEND') { if (curPoly) { curE = curPoly; curE.type = 'LWPOLYLINE'; flushE(curE); curPoly = null; curE = null; } }
                else curE = null;
            } else if (curE) {
                if (c === 67 && v === '1') curE.ignore = true; 
                const val = parseFloat(v);
                if (curE.type === 'LINE') {
                    if (c === 10) curE.x1 = val; else if (c === 20) curE.y1 = val; else if (c === 11) curE.x2 = val; else if (c === 21) curE.y2 = val;
                } else if (curE.type === 'CIRCLE' || curE.type === 'ARC') {
                    if (c === 10) curE.cx = val; else if (c === 20) curE.cy = val; else if (c === 40) curE.r = val; else if (c === 50) curE.startAngle = val; else if (c === 51) curE.endAngle = val;
                } else if (curE.type === 'LWPOLYLINE' || curE.type === 'POLYLINE') {
                    if (c === 70) curE.closed = (parseInt(v) & 1) !== 0;
                    else if (c === 10 && curE.type === 'LWPOLYLINE') curE.vertices.push({ x: val, y: 0, bulge: 0 });
                    else if (c === 20 && curE.type === 'LWPOLYLINE' && curE.vertices.length > 0) curE.vertices[curE.vertices.length - 1].y = val;
                    else if (c === 42 && curE.type === 'LWPOLYLINE' && curE.vertices.length > 0) curE.vertices[curE.vertices.length - 1].bulge = val;
                } else if (curE.type === 'VERTEX') {
                    if (c === 10) curE.x = val; else if (c === 20) curE.y = val; else if (c === 42) curE.bulge = val;
                }
            }
        }
        flushE(curE);
        return segments.filter(s => Math.hypot(s.x2 - s.x1, s.y2 - s.y1) > 1e-6);
    }

    function buildTopology(raw, tol) {
        const pts = []; raw.forEach(s => { pts.push({x: s.x1, y: s.y1}); pts.push({x: s.x2, y: s.y2}); });
        for(let i=0; i<raw.length; i++) {
            const s1 = raw[i];
            for(let j=i+1; j<raw.length; j++) {
                const s2 = raw[j];
                const den = (s1.x2 - s1.x1)*(s2.y2 - s2.y1) - (s1.y2 - s1.y1)*(s2.x2 - s2.x1);
                if (Math.abs(den) > 1e-7) {
                    const u = ((s2.x1 - s1.x1)*(s2.y2 - s2.y1) - (s2.y1 - s1.y1)*(s2.x2 - s2.x1)) / den;
                    const v = ((s2.x1 - s1.x1)*(s1.y2 - s1.y1) - (s2.y1 - s1.y1)*(s1.x2 - s1.x1)) / den;
                    if (u > -1e-5 && u < 1+1e-5 && v > -1e-5 && v < 1+1e-5) pts.push({ x: s1.x1 + u*(s1.x2 - s1.x1), y: s1.y1 + u*(s1.y2 - s1.y1) });
                }
            }
        }

        const segments = [];
        for(let i=0; i<raw.length; i++) {
            const s = raw[i], tVals = [0, 1], l2 = (s.x2 - s.x1)**2 + (s.y2 - s.y1)**2;
            if (l2 < 1e-7) continue;
            pts.forEach(p => {
                const t = ((p.x - s.x1)*(s.x2 - s.x1) + (p.y - s.y1)*(s.y2 - s.y1)) / l2;
                if (t > 1e-5 && t < 1-1e-5) {
                    if (Math.hypot(p.x - (s.x1 + t*(s.x2-s.x1)), p.y - (s.y1 + t*(s.y2-s.y1))) <= tol) tVals.push(t);
                }
            });
            tVals.sort((a,b) => a - b); let prevT = tVals[0];
            for(let k=1; k<tVals.length; k++) {
                if (tVals[k] - prevT < 1e-5) continue;
                segments.push({
                    x1: s.x1 + prevT*(s.x2-s.x1), y1: s.y1 + prevT*(s.y2-s.y1),
                    x2: s.x1 + tVals[k]*(s.x2-s.x1), y2: s.y1 + tVals[k]*(s.y2-s.y1)
                }); prevT = tVals[k];
            }
        }

        const vertices = [], grid = new Map();
        const getV = (x, y) => {
            const gx = Math.round(x / tol), gy = Math.round(y / tol);
            for(let dx=-1; dx<=1; dx++) {
                for(let dy=-1; dy<=1; dy++) {
                    const key = `${gx+dx},${gy+dy}`;
                    if(grid.has(key)) {
                        for(const v of grid.get(key)) { if (Math.hypot(v.x - x, v.y - y) <= tol) return v; }
                    }
                }
            }
            const newV = {id: vertices.length, x, y, adj: []}; vertices.push(newV);
            const key = `${gx},${gy}`; if(!grid.has(key)) grid.set(key, []); grid.get(key).push(newV);
            return newV;
        };

        const uniqueEdges = new Map();
        segments.forEach(s => {
            const v1 = getV(s.x1, s.y1), v2 = getV(s.x2, s.y2);
            if (v1.id === v2.id) return;
            uniqueEdges.set(`${Math.min(v1.id, v2.id)}-${Math.max(v1.id, v2.id)}`, {v1, v2}); 
        });

        const adj = new Map();
        uniqueEdges.forEach((_, key) => {
            const [id1, id2] = key.split('-').map(Number);
            if(!adj.has(id1)) adj.set(id1, new Set()); if(!adj.has(id2)) adj.set(id2, new Set());
            adj.get(id1).add(id2); adj.get(id2).add(id1);
        });

        let pruned = true;
        while(pruned) {
            pruned = false;
            for (const [vId, neighbors] of adj.entries()) {
                if(neighbors.size === 1) {
                    const nId = Array.from(neighbors)[0];
                    neighbors.delete(nId);
                    if(adj.has(nId)) adj.get(nId).delete(vId);
                    uniqueEdges.delete(`${Math.min(vId, nId)}-${Math.max(vId, nId)}`);
                    pruned = true;
                }
            }
        }

        const halfEdges = [];
        uniqueEdges.forEach(e => {
            const h1 = {from: e.v1, to: e.v2, angle: Math.atan2(e.v2.y - e.v1.y, e.v2.x - e.v1.x), used: false};
            const h2 = {from: e.v2, to: e.v1, angle: Math.atan2(e.v1.y - e.v2.y, e.v1.x - e.v2.x), used: false};
            h1.rev = h2; h2.rev = h1; e.v1.adj.push(h1); e.v2.adj.push(h2); halfEdges.push(h1, h2);
        });
        vertices.forEach(v => v.adj.sort((a, b) => a.angle - b.angle));

        const rawFaces = [];
        halfEdges.forEach(he => {
            if(he.used) return;
            const pts = []; let curr = he, loops = 0;
            while(!curr.used && loops < 10000) {
                curr.used = true; pts.push({x: curr.from.x, y: curr.from.y});
                curr = curr.to.adj[(curr.to.adj.indexOf(curr.rev) - 1 + curr.to.adj.length) % curr.to.adj.length];
                loops++;
            }
            if(pts.length > 2) {
                let area = 0; for(let i=0; i<pts.length; i++) area += (pts[i].x * pts[(i+1)%pts.length].y - pts[(i+1)%pts.length].x * pts[i].y);
                rawFaces.push({pts, signedArea: area/2, area: Math.abs(area/2), matIdx: 2}); // Aluminio por defecto
            }
        });

        let maxA = -1, sign = 1;
        rawFaces.forEach(f => { if (f.area > maxA) { maxA = f.area; sign = Math.sign(f.signedArea); } });
        return rawFaces.filter(f => Math.sign(f.signedArea) !== sign && f.area > 1e-4).sort((a,b) => b.area - a.area);
    }

    function extractBoundaryEdges(polys, tol) {
        const map = new Map(), rT = (val) => Math.round(val / tol) * tol;
        polys.forEach(poly => {
            for(let i=0; i<poly.pts.length; i++) {
                const p1 = poly.pts[i], p2 = poly.pts[(i+1)%poly.pts.length];
                const k1 = `${rT(p1.x)},${rT(p1.y)}-${rT(p2.x)},${rT(p2.y)}`, k2 = `${rT(p2.x)},${rT(p2.y)}-${rT(p1.x)},${rT(p1.y)}`;
                if(map.has(k1)) map.get(k1).count++; else if(map.has(k2)) map.get(k2).count++; else map.set(k1, {p1, p2, count: 1, type: 0});
            }
        });
        const edges = Array.from(map.values()).filter(e => e.count === 1).map(e => ({p1:e.p1, p2:e.p2, type:0}));
        
        boundaryAdj = edges.map(() => []);
        for(let i=0; i<edges.length; i++){
            for(let j=i+1; j<edges.length; j++){
                if(Math.hypot(edges[i].p1.x-edges[j].p1.x, edges[i].p1.y-edges[j].p1.y) < tol*2 || Math.hypot(edges[i].p1.x-edges[j].p2.x, edges[i].p1.y-edges[j].p2.y) < tol*2 || Math.hypot(edges[i].p2.x-edges[j].p1.x, edges[i].p2.y-edges[j].p1.y) < tol*2 || Math.hypot(edges[i].p2.x-edges[j].p2.x, edges[i].p2.y-edges[j].p2.y) < tol*2) {
                    boundaryAdj[i].push(j); boundaryAdj[j].push(i);
                }
            }
        }
        return edges;
    }

    // ──── VISTA Y EVENTOS DE RATÓN ────
    function recalcBounds() {
        if(!polygons.length) return;
        const all = polygons.flatMap(p => p.pts);
        minX = Math.min(...all.map(p => p.x)); maxX = Math.max(...all.map(p => p.x));
        minY = Math.min(...all.map(p => p.y)); maxY = Math.max(...all.map(p => p.y));
        document.getElementById('LpInput').value = Math.round(maxY-minY);
        const pad = 60, cw = canvas.width, ch = canvas.height;
        baseScale = Math.min((cw-pad*2)/(maxX-minX||1), (ch-pad*2)/(maxY-minY||1));
        zoomLevel = 1; offsetX = 0; offsetY = 0;
    }

    function getTransform() {
        const cw = canvas.width, ch = canvas.height, cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        return { s: baseScale * zoomLevel, tx: x => offsetX + cw / 2 + (x - cxW) * baseScale * zoomLevel, ty: y => offsetY + ch / 2 - (y - cyW) * baseScale * zoomLevel };
    }

    function getWorld(sx, sy) {
        const cw = canvas.width, ch = canvas.height, cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        return { x: cxW + (sx - offsetX - cw / 2) / (baseScale * zoomLevel), y: cyW - (sy - offsetY - ch / 2) / (baseScale * zoomLevel) };
    }

    canvas.onwheel = e => {
        e.preventDefault(); if (!polygons.length) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width), my = (e.clientY - rect.top) * (canvas.height / rect.height);
        const wBefore = getWorld(mx, my);
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomLevel = Math.max(0.1, Math.min(zoomLevel * factor, 50));
        const cw = canvas.width, ch = canvas.height, cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
        offsetX = mx - cw / 2 - (wBefore.x - cxW) * baseScale * zoomLevel;
        offsetY = my - ch / 2 + (wBefore.y - cyW) * baseScale * zoomLevel;
        draw();
    };

    document.getElementById('btnZoomReset').onclick = () => { zoomLevel = 1; offsetX = 0; offsetY = 0; draw(); };

    canvas.onmousedown = e => {
        if(!polygons.length) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX-rect.left)*(canvas.width/rect.width), my = (e.clientY-rect.top)*(canvas.height/rect.height);
        const w = getWorld(mx, my);

        if (editMode === 'CROP') { isCropping = true; cropStartX = w.x; cropStartY = w.y; cropRect = {x1: w.x, y1: w.y, x2: w.x, y2: w.y}; return; }
        isDragging = true; hasDragged = false; dragStartX = mx - offsetX; dragStartY = my - offsetY; canvas.classList.add('grabbing');
    };

    canvas.onmousemove = e => {
        if(!polygons.length || showThermalMap) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX-rect.left)*(canvas.width/rect.width), my = (e.clientY-rect.top)*(canvas.height/rect.height);
        
        if(isDragging){ offsetX = mx-dragStartX; offsetY = my-dragStartY; hasDragged = true; draw(); return; }
        
        const w = getWorld(mx, my);
        if (isCropping) { cropRect.x2 = w.x; cropRect.y2 = w.y; draw(); return; }

        let updated = false;
        if(editMode === 'BOUNDARY') {
            let minD = Infinity, hE = -1;
            boundaryEdges.forEach((edge, i) => {
                const dx = edge.p2.x-edge.p1.x, dy = edge.p2.y-edge.p1.y, l2 = dx*dx+dy*dy;
                let t = Math.max(0, Math.min(1, ((w.x-edge.p1.x)*dx+(w.y-edge.p1.y)*dy)/l2));
                let dist = Math.hypot(w.x-(edge.p1.x+t*dx), w.y-(edge.p1.y+t*dy));
                if(dist < minD){ minD = dist; hE = i; }
            });
            if(minD > 12/(baseScale*zoomLevel)) hE = -1;
            if (hE !== hoveredEdgeIdx) { hoveredEdgeIdx = hE; updated = true; }
        } else if (editMode === 'MATERIAL') {
            let hP = -1;
            for(let i=polygons.length-1; i>=0; i--){
                let inside = false, pts = polygons[i].pts;
                for (let k = 0, j = pts.length - 1; k < pts.length; j = k++) {
                    if (((pts[k].y > w.y) !== (pts[j].y > w.y)) && (w.x < (pts[j].x - pts[k].x) * (w.y - pts[k].y) / (pts[j].y - pts[k].y) + pts[k].x)) inside = !inside;
                }
                if(inside){ hP = i; break; }
            }
            if (hP !== hoveredPolyIdx) { hoveredPolyIdx = hP; updated = true; }
        }
        if (updated) draw();
    };

    canvas.onmouseup = e => {
        if(!polygons.length) return;
        isDragging = false; canvas.classList.remove('grabbing');
        if(hasDragged || showThermalMap) return;

        if (isCropping) {
            isCropping = false;
            const dist = Math.hypot(cropRect.x1 - cropRect.x2, cropRect.y1 - cropRect.y2);
            if (dist < 5 / baseScale / zoomLevel) {
                cropRect = null; calcBounds = null; setStatus("Área de cálculo restablecida al total del perfil.", "success");
            } else {
                calcBounds = {
                    minX: Math.min(cropRect.x1, cropRect.x2), maxX: Math.max(cropRect.x1, cropRect.x2),
                    minY: Math.min(cropRect.y1, cropRect.y2), maxY: Math.max(cropRect.y1, cropRect.y2)
                };
                setStatus("Área de cálculo acotada. El solver ignorará lo que esté fuera.", "success");
            }
            draw(); return;
        }
        
        if(editMode === 'BOUNDARY' && hoveredEdgeIdx !== -1) {
            const activeType = parseInt(document.getElementById('boundSelect').value);
            if(e.shiftKey) {
                let path = bfsFindNearestAssigned(hoveredEdgeIdx);
                if(path){ path.forEach(id => boundaryEdges[id].type = activeType); }
                else boundaryEdges[hoveredEdgeIdx].type = activeType;
            } else boundaryEdges[hoveredEdgeIdx].type = activeType;
            draw(); return;
        }
        
        if (editMode === 'MATERIAL' && hoveredPolyIdx !== -1) {
            const activeMat = parseInt(document.getElementById('matSelect').value);
            if (!isNaN(activeMat)) { polygons[hoveredPolyIdx].matIdx = activeMat; selectedPoly = hoveredPolyIdx; draw(); }
        }
    };

    function bfsFindNearestAssigned(startIdx) {
        let queue = [[startIdx, [startIdx]]], visited = new Set([startIdx]);
        while(queue.length > 0) {
            let [curr, path] = queue.shift();
            if (boundaryEdges[curr].type !== 0 && curr !== startIdx) return path;
            for (let n of boundaryAdj[curr]) { if (!visited.has(n)) { visited.add(n); queue.push([n, [...path, n]]); } }
        } return null;
    }

    // ──── RENDERING (ISOTERMAS AÑADIDAS) ────
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(!polygons.length) return;
        const {tx, ty, s} = getTransform();

        if(showThermalMap && T && calcBounds) {
            const res = parseInt(document.getElementById('gridRes').value);
            const te = +document.getElementById('tExt').value, ti = +document.getElementById('tInt').value;
            const cw = (calcBounds.maxX - calcBounds.minX) / res * s;
            const ch = (calcBounds.maxY - calcBounds.minY) / res * s;
            
            // Map de color
            for(let i=0; i<res; i++) {
                for(let j=0; j<res; j++) {
                    if(kGrid[i][j] > 0 || isExt[i][j] || isIntMeas[i][j] || isIntSec[i][j]) {
                        const f = Math.max(0, Math.min(1, (T[i][j]-te)/(ti-te||1)));
                        ctx.fillStyle = `hsl(${(1-f)*240}, 75%, 50%)`;
                        ctx.fillRect(tx(calcBounds.minX + j*dx), ty(calcBounds.minY + i*dy) - ch, cw+0.6, ch+0.6);
                    }
                }
            }

            // Isotermas
            if (showIsotherms) {
                ctx.fillStyle = 'black';
                let isos = new Set([13]); // Siempre incluir punto de rocío típico
                for(let t = Math.ceil(te); t <= Math.floor(ti); t += 2) isos.add(t);
                
                for(let i=0; i<res; i++) {
                    for(let j=0; j<res; j++) {
                        if(kGrid[i][j] > 0 || isExt[i][j] || isIntMeas[i][j] || isIntSec[i][j]) {
                            let val = T[i][j];
                            for(let iso of isos) {
                                if (j < res-1 && ((val <= iso && T[i][j+1] > iso) || (val >= iso && T[i][j+1] < iso))) {
                                    ctx.fillRect(tx(calcBounds.minX + j*dx + dx/2), ty(calcBounds.minY + i*dy) - ch/2, 2, 2);
                                }
                                if (i < res-1 && ((val <= iso && T[i+1][j] > iso) || (val >= iso && T[i+1][j] < iso))) {
                                    ctx.fillRect(tx(calcBounds.minX + j*dx), ty(calcBounds.minY + i*dy + dy/2) - ch, 2, 2);
                                }
                            }
                        }
                    }
                }
            }
        }

        ctx.globalAlpha = showThermalMap ? 0.3 : 1.0;
        polygons.forEach((p, i) => {
            ctx.beginPath(); ctx.moveTo(tx(p.pts[0].x), ty(p.pts[0].y));
            p.pts.forEach(pt => ctx.lineTo(tx(pt.x), ty(pt.y))); ctx.closePath();
            ctx.fillStyle = materials[p.matIdx].color; ctx.fill();
            if (editMode === 'MATERIAL' && i === hoveredPolyIdx) { ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.fill(); } 
            ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.stroke();
        });
        ctx.globalAlpha = 1.0;

        boundaryEdges.forEach((edge, i) => {
            if(edge.type === 0 && showThermalMap) return;
            ctx.beginPath(); ctx.moveTo(tx(edge.p1.x), ty(edge.p1.y)); ctx.lineTo(tx(edge.p2.x), ty(edge.p2.y));
            let color = "rgba(0,0,0,0.1)";
            if(edge.type === 1) color = "#1976d2"; if(edge.type === 2) color = "#d32f2f"; 
            if(edge.type === 3) color = "#757575"; if(edge.type === 4) color = "#ff9800";
            ctx.strokeStyle = color; 
            ctx.lineWidth = (editMode==='BOUNDARY' && i===hoveredEdgeIdx) ? 8 : (edge.type!==0 ? 4 : 1.5);
            ctx.stroke();
        });

        if (cropRect || calcBounds) {
            ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(231, 76, 60, 0.05)';
            const box = cropRect ? {
                minX: Math.min(cropRect.x1, cropRect.x2), maxX: Math.max(cropRect.x1, cropRect.x2),
                minY: Math.min(cropRect.y1, cropRect.y2), maxY: Math.max(cropRect.y1, cropRect.y2)
            } : calcBounds;
            const tX1 = tx(box.minX), tX2 = tx(box.maxX), tY1 = ty(box.maxY), tY2 = ty(box.minY); 
            ctx.fillRect(tX1, tY1, tX2 - tX1, tY2 - tY1); ctx.strokeRect(tX1, tY1, tX2 - tX1, tY2 - tY1); ctx.restore();
        }
    }

    document.getElementById('btnRotate').onclick = () => {
        if(!polygons.length) return;
        const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
        polygons.forEach(p => p.pts.forEach(pt => {
            const dxx = pt.x-cx, dyy = pt.y-cy; pt.x = cx - dyy; pt.y = cy + dxx;
        }));
        recalcBounds(); calcBounds = null; 
        boundaryEdges = extractBoundaryEdges(polygons, parseFloat(document.getElementById('tolInput').value) || 0.1); draw();
    };

    // ──── SOLVER FDM 2.0 ────
    document.getElementById('calcBtn').onclick = () => {
        if(!polygons.length) return;
        if(!boundaryEdges.some(e => e.type===1) || !boundaryEdges.some(e => e.type===2)) {
            setStatus('❌ Falta marcar Borde Exterior (azul) e Interior de Medición (rojo).', 'error'); return;
        }
        
        const res = parseInt(document.getElementById('gridRes').value);
        const lp = (+document.getElementById('LpInput').value || 100) / 1000;
        document.getElementById('solverStatus').style.display = "block";
        document.getElementById('calcBtn').disabled = true;
        
        setTimeout(() => {
            calcBounds = calcBounds ? calcBounds : { minX, maxX, minY, maxY };
            
            dx = (calcBounds.maxX - calcBounds.minX) / res || 0.001; 
            dy = (calcBounds.maxY - calcBounds.minY) / res || 0.001;
            
            kGrid = Array.from({length:res}, (_,i)=> Array.from({length:res}, (_,j)=> {
                const x = calcBounds.minX + j*dx + dx/2, y = calcBounds.minY + i*dy + dy/2;
                const p = polygons.find(poly => {
                    let inside = false, pts = poly.pts;
                    for (let k = 0, l = pts.length - 1; k < pts.length; l = k++) {
                        if (((pts[k].y > y) !== (pts[l].y > y)) && (x < (pts[l].x - pts[k].x) * (y - pts[k].y) / (pts[l].y - pts[k].y) + pts[k].x)) inside = !inside;
                    } return inside;
                }); return p ? materials[p.matIdx].k : 0;
            }));

            const te = +document.getElementById('tExt').value, ti = +document.getElementById('tInt').value;
            T = Array.from({length:res}, () => new Array(res).fill((te+ti)/2));
            isExt = Array.from({length:res}, () => new Array(res).fill(false));
            isIntMeas = Array.from({length:res}, () => new Array(res).fill(false));
            isIntSec = Array.from({length:res}, () => new Array(res).fill(false));

            boundaryEdges.forEach(e => {
                if(e.type===0 || e.type===3) return;
                const steps = Math.ceil(Math.hypot(e.p2.x-e.p1.x, e.p2.y-e.p1.y)/Math.min(dx,dy)*2);
                for(let s=0; s<=steps; s++){
                    const px = e.p1.x + (s/steps)*(e.p2.x-e.p1.x), py = e.p1.y + (s/steps)*(e.p2.y-e.p1.y);
                    const j = Math.floor((px - calcBounds.minX) / dx);
                    const i = Math.floor((py - calcBounds.minY) / dy);
                    if(i>=0 && i<res && j>=0 && j<res){
                        if(e.type===1) isExt[i][j]=true; if(e.type===2) isIntMeas[i][j]=true; if(e.type===4) isIntSec[i][j]=true;
                        if(kGrid[i][j]===0) kGrid[i][j] = 0.026; 
                    }
                }
            });

            let iter = 2500;
            let chunkSize = 400;
            let omega = 1.4; 

            if (res === 400) { iter = 6000; chunkSize = 200; omega = 1.6; lastAlgo = "FDM SOR Estándar"; }
            if (res === 600) { iter = 10000; chunkSize = 100; omega = 1.7; lastAlgo = "FDM SOR Alta"; }
            if (res === 1000) { iter = 20000; chunkSize = 40; omega = 1.8; lastAlgo = "FDM SOR Ultra"; } 
            
            let done = 0;
            
            const c_solid = (k1, k2, ratio) => (2 * k1 * k2 / (k1 + k2)) * ratio;
            const c_surf = (k, Rs, ratio, delta) => ratio / (Rs/delta + 1/(2*k));
            const rx = dy/dx, ry = dx/dy;

            function chunk() {
                const end = Math.min(done+chunkSize, iter);
                for(let it=done; it<end; it++){
                    for(let i=0; i<res; i++){
                        for(let j=0; j<res; j++){
                            if(kGrid[i][j]===0) continue;
                            
                            if(isExt[i][j]){ T[i][j] = te; continue; }
                            if(isIntMeas[i][j] || isIntSec[i][j]){ T[i][j] = ti; continue; }
                            
                            let n=0, d=0;
                            if(j>0) {
                                if(isExt[i][j-1]) { let C = c_surf(kGrid[i][j], Rse, rx, dx); n += C*te; d += C; }
                                else if(isIntMeas[i][j-1] || isIntSec[i][j-1]) { let C = c_surf(kGrid[i][j], Rsi, rx, dx); n += C*ti; d += C; }
                                else if(kGrid[i][j-1]>0) { let C = c_solid(kGrid[i][j], kGrid[i][j-1], rx); n += C*T[i][j-1]; d += C; }
                            }
                            if(j<res-1) {
                                if(isExt[i][j+1]) { let C = c_surf(kGrid[i][j], Rse, rx, dx); n += C*te; d += C; }
                                else if(isIntMeas[i][j+1] || isIntSec[i][j+1]) { let C = c_surf(kGrid[i][j], Rsi, rx, dx); n += C*ti; d += C; }
                                else if(kGrid[i][j+1]>0) { let C = c_solid(kGrid[i][j], kGrid[i][j+1], rx); n += C*T[i][j+1]; d += C; }
                            }
                            if(i>0) {
                                if(isExt[i-1][j]) { let C = c_surf(kGrid[i][j], Rse, ry, dy); n += C*te; d += C; }
                                else if(isIntMeas[i-1][j] || isIntSec[i-1][j]) { let C = c_surf(kGrid[i][j], Rsi, ry, dy); n += C*ti; d += C; }
                                else if(kGrid[i-1][j]>0) { let C = c_solid(kGrid[i][j], kGrid[i-1][j], ry); n += C*T[i-1][j]; d += C; }
                            }
                            if(i<res-1) {
                                if(isExt[i+1][j]) { let C = c_surf(kGrid[i][j], Rse, ry, dy); n += C*te; d += C; }
                                else if(isIntMeas[i+1][j] || isIntSec[i+1][j]) { let C = c_surf(kGrid[i][j], Rsi, ry, dy); n += C*ti; d += C; }
                                else if(kGrid[i+1][j]>0) { let C = c_solid(kGrid[i][j], kGrid[i+1][j], ry); n += C*T[i+1][j]; d += C; }
                            }
                            if(d>0) {
                                let t_new = n/d;
                                T[i][j] = T[i][j] + omega * (t_new - T[i][j]);
                            }
                        }
                    }
                }
                done = end;
                document.getElementById('calcProgress').innerText = Math.round((done/iter)*100) + '%';
                
                if(done < iter) setTimeout(chunk, 0); 
                else finishSolver();
            }

            function finishSolver() {
                let flux = 0;
                let minTsi = Infinity;

                for(let i=0; i<res; i++){
                    for(let j=0; j<res; j++){
                        if(isIntMeas[i][j] || isIntSec[i][j]){
                            
                            if(j>0 && kGrid[i][j-1]>0 && !isIntMeas[i][j-1] && !isIntSec[i][j-1] && !isExt[i][j-1]) {
                                let q_den = (ti - T[i][j-1]) / (Rsi + (dx/2)/kGrid[i][j-1]);
                                let t_surf = ti - q_den * Rsi;
                                if(t_surf < minTsi) minTsi = t_surf;
                                if(isIntMeas[i][j]) flux += q_den * dy; 
                            }
                            if(j<res-1 && kGrid[i][j+1]>0 && !isIntMeas[i][j+1] && !isIntSec[i][j+1] && !isExt[i][j+1]) {
                                let q_den = (ti - T[i][j+1]) / (Rsi + (dx/2)/kGrid[i][j+1]);
                                let t_surf = ti - q_den * Rsi;
                                if(t_surf < minTsi) minTsi = t_surf;
                                if(isIntMeas[i][j]) flux += q_den * dy; 
                            }
                            if(i>0 && kGrid[i-1][j]>0 && !isIntMeas[i-1][j] && !isIntSec[i-1][j] && !isExt[i-1][j]) {
                                let q_den = (ti - T[i-1][j]) / (Rsi + (dy/2)/kGrid[i-1][j]);
                                let t_surf = ti - q_den * Rsi;
                                if(t_surf < minTsi) minTsi = t_surf;
                                if(isIntMeas[i][j]) flux += q_den * dx; 
                            }
                            if(i<res-1 && kGrid[i+1][j]>0 && !isIntMeas[i+1][j] && !isIntSec[i+1][j] && !isExt[i+1][j]) {
                                let q_den = (ti - T[i+1][j]) / (Rsi + (dy/2)/kGrid[i+1][j]);
                                let t_surf = ti - q_den * Rsi;
                                if(t_surf < minTsi) minTsi = t_surf;
                                if(isIntMeas[i][j]) flux += q_den * dx; 
                            }
                        }
                    }
                }
                
                const deltaT = Math.abs(ti - te) || 1;
                const L2D = Math.abs(flux) / deltaT;
                const U = L2D / lp;
                
                let fRsi = (minTsi - te) / deltaT;

                lastU = U; lastFlux = flux; lastL2D = L2D;
                lastFRsi = fRsi; lastTsiMin = minTsi;
                
                document.getElementById('result').style.display="block";
                document.getElementById('result').innerHTML=`
                    <h2>U<sub>f</sub> = ${U.toFixed(3)} W/(m²·K)</h2>
                    <h3 style="margin: 10px 0; color:#FFD54F;">f<sub>Rsi</sub> = ${fRsi.toFixed(3)} (T<sub>si,min</sub> = ${minTsi.toFixed(1)} ºC)</h3>
                    <p>Cálculo analítico iterativo (${lastAlgo}) s/ ISO 10077-2</p>
                    <p style="opacity:0.9; margin-top:5px; font-size:0.85rem;">
                        <small>Flujo lineal (Q): ${Math.abs(flux).toFixed(3)} W/m &nbsp;|&nbsp; L<sup>2D</sup>: ${L2D.toFixed(3)} W/(m·K) &nbsp;|&nbsp; b<sub>f</sub>: ${lp*1000} mm</small>
                    </p>
                `;
                
                showThermalMap=true; 
                document.getElementById('btnBackToEdit').style.display="inline-flex";
                document.getElementById('btnPdf').style.display="inline-flex";
                document.getElementById('btnToggleIso').style.display="inline-flex";
                document.getElementById('solverStatus').style.display="none"; 
                document.getElementById('calcBtn').disabled = false;
                
                zoomLevel = 1; offsetX = 0; offsetY = 0;
                draw();
                setStatus("✅ Análisis completado de forma estable e independiente a la resolución.", "success");
            }
            chunk();

        }, 50);
    };

    // ──── INFORME PDF ────
    document.getElementById('btnPdf').onclick = () => {
        const lp = document.getElementById('LpInput').value;
        const resLabel = document.getElementById('gridRes').options[document.getElementById('gridRes').selectedIndex].text;
        
        let usedMats = new Set();
        polygons.forEach(p => {
            if (calcBounds) {
                let inside = false;
                for(let pt of p.pts) {
                    if(pt.x >= calcBounds.minX && pt.x <= calcBounds.maxX && pt.y >= calcBounds.minY && pt.y <= calcBounds.maxY) {
                        inside = true; break;
                    }
                }
                if (inside) usedMats.add(p.matIdx);
            } else {
                usedMats.add(p.matIdx);
            }
        });
        
        let matListHTML = Array.from(usedMats).map(idx => 
            `<li style="width: 48%; margin-bottom: 5px;"><span style="display:inline-block; width:12px; height:12px; background:${materials[idx].color}; border:1px solid #000; margin-right:5px; vertical-align: middle;"></span> 
            ${materials[idx].name} (λ = ${materials[idx].k} W/m·K)</li>`
        ).join('');

        const tExt = document.getElementById('tExt').value, tInt = document.getElementById('tInt').value;
        const deltaT = Math.abs(tInt - tExt);

        const report = document.createElement('div');
        report.innerHTML = `
            <div style="font-family: 'Open Sans', Arial, sans-serif; padding: 40px; color: #333; max-width: 800px; margin: auto; font-size: 12px; line-height: 1.5;">
                <div style="border-bottom: 3px solid #EDD00E; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <h1 style="color: #3E3E3E; margin:0; font-size: 24px;">INFORME DE TRANSMITANCIA Y CONDENSACIONES</h1>
                        <h3 style="color: #666; margin: 5px 0 0 0; font-size: 14px;">Evaluación Pericial mediante FDM 2D</h3>
                    </div>
                    <div style="text-align: right; font-size: 10px; color: #999;">
                        Generado el: ${new Date().toLocaleDateString()}<br>Aislantech Thermal Simulator
                    </div>
                </div>
                
                <h4 style="color: #1976d2; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 0;">1. Resultados Principales</h4>
                <table style="width: 100%; margin-bottom: 20px; font-size: 14px; background: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #eee;">
                    <tr>
                        <td style="padding: 5px; width: 60%;"><strong>Transmitancia Térmica del Marco (U<sub>f</sub>):</strong></td>
                        <td style="padding: 5px; font-size: 18px; font-weight: bold; color: #2e7d32;">${lastU.toFixed(3)} W/(m²·K)</td>
                    </tr>
                    <tr>
                        <td style="padding: 5px; border-top: 1px dotted #ccc;">Flujo Térmico Lineal (Q):</td>
                        <td style="padding: 5px; border-top: 1px dotted #ccc;">${Math.abs(lastFlux).toFixed(3)} W/m</td>
                    </tr>
                    <tr>
                        <td style="padding: 5px;">Conductancia Térmica 2D (L<sup>2D</sup>):</td>
                        <td style="padding: 5px;">${lastL2D.toFixed(3)} W/(m·K)</td>
                    </tr>
                    <tr>
                        <td style="padding: 5px;">Ancho Proyectado (b<sub>f</sub>):</td>
                        <td style="padding: 5px;">${lp} mm</td>
                    </tr>
                </table>

                <h4 style="color: #1976d2; border-bottom: 1px solid #ccc; padding-bottom: 5px;">2. Riesgo de Condensación Superficial</h4>
                <div style="margin-bottom: 20px;">
                    <p style="margin-bottom: 10px;">Según el DB-HE del CTE o normativas equivalentes, el factor de temperatura de la superficie interior ($f_{Rsi}$) debe ser superior al límite reglamentario (normalmente $>0.70$) para evitar mohos y condensaciones.</p>
                    <ul style="list-style: none; padding: 10px; background: #e3f2fd; border-radius: 4px; border-left: 4px solid #1976d2;">
                        <li><strong>Temperatura superficial mínima (T<sub>si,min</sub>):</strong> ${lastTsiMin.toFixed(1)} ºC</li>
                        <li><strong>Factor de temperatura interior (f<sub>Rsi</sub>):</strong> <span style="font-weight:bold; font-size:16px;">${lastFRsi.toFixed(3)}</span></li>
                    </ul>
                </div>

                <h4 style="color: #1976d2; border-bottom: 1px solid #ccc; padding-bottom: 5px;">3. Geometría e Isotermas</h4>
                <div style="text-align: center; margin: 15px 0;">
                    <img src="${canvas.toDataURL('image/png')}" style="max-height: 280px; width: auto; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                </div>

                <h4 style="color: #1976d2; border-bottom: 1px solid #ccc; padding-bottom: 5px;">4. Materiales Aplicados</h4>
                <ul style="list-style: none; padding: 0; margin-bottom: 20px; display: flex; flex-wrap: wrap;">${matListHTML}</ul>

                <h4 style="color: #1976d2; border-bottom: 1px solid #ccc; padding-bottom: 5px;">5. Marco Normativo</h4>
                <p style="text-align: justify; margin-bottom: 20px; color: #555;">
                    Cálculo basado en <strong>UNE-EN ISO 10077-2</strong> y <strong>EN 13788</strong> para condensaciones. 
                    <br><br>
                    <strong>Propiedades de los Materiales:</strong> Los materiales indicados con el sufijo "(CTE)" adoptan las conductividades térmicas de diseño especificadas en el <em>Catálogo de Elementos Constructivos</em> y el Documento de Apoyo del <em>Código Técnico de la Edificación</em> (España). Los materiales personalizados han sido declarados explícitamente por el usuario.
                    <br><br>
                    Resistencias térmicas superficiales acorde a <strong>ISO 6946</strong> para flujo horizontal:
                    <br>
                    • <strong>R<sub>se</sub></strong> (Exterior): 0.04 m²·K/W a ${tExt} ºC.<br>
                    • <strong>R<sub>si</sub></strong> (Interior): 0.13 m²·K/W a ${tInt} ºC.<br>
                    • Salto térmico total ($\Delta T$): ${deltaT} K.
                </p>

                <h4 style="color: #1976d2; border-bottom: 1px solid #ccc; padding-bottom: 5px;">6. Análisis Crítico Pericial</h4>
                <div style="text-align: justify; background: #fff3e0; padding: 15px; border-left: 4px solid #ff9800; border-radius: 0 4px 4px 0; color: #444;">
                    <strong>Idoneidad Técnica del Modelo:</strong> Emplea el algoritmo ${lastAlgo} con resolución <strong>${resLabel}</strong> y cálculo de fronteras mediante Media Armónica para garantizar la conservación del calor en contactos metálicos.<br><br>
                    1. <strong>Discretización y Convergencia:</strong> Validar el cumplimiento de la norma requiere duplicar la resolución de la malla y certificar que la variación de L<sup>2D</sup> es menor al 2%. La estabilización armónica utilizada permite lograr esta convergencia de forma independiente al tamaño de celda.<br><br>
                    2. <strong>Cámaras de Aire (CRÍTICO):</strong> Este análisis computa conductividad constante para el aire. La ISO 10077-2 exige sustituir cavidades por una conductividad térmica equivalente iterativa (λ<sub>eq</sub>) evaluando radiación y convección. Los resultados presentes constituyen, por tanto, una aproximación teórica que tiende a ser optimista frente a un ensayo oficial.<br><br>
                    <strong>Conclusión:</strong> El resultado es altamente fiable para <em>A/B testing y diseño de I+D</em>. Para el Marcado CE oficial, el valor U<sub>f</sub> final debe validarse mediante software de cálculo avanzado de radiación acoplada en cavidades.
                </div>
            </div>
        `;

        setStatus("Generando informe justificado en PDF...", "info");
        html2pdf().from(report).set({
            margin: [10, 10, 10, 10],
            filename: 'Aislantech_Condensaciones_Uf.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).save().then(() => setStatus("✅ Informe PDF descargado correctamente.", "success"));
    };

    updateMaterialUI();
})();
</script>
</body>
</html>
