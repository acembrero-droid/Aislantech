                showTooltipAt(event.event.clientX, event.event.clientY, `Radio: ${newR.toFixed(3)}`);
            }
            renderGrips();
            return;
        }

        if (state.isDragging && state.selectedItems.length) {
            if (!state.hasMoved) saveState();
            const resolved = resolvePoint(event.point, state.dragStartPoint, 'MOVE', state.selectedItems);
            const moveDelta = resolved.subtract(state.dragStartPoint);
            state.selectedItems.forEach((item, idx) => item.position = state.originalPositions[idx].add(moveDelta));
            state.hasMoved = true;
            const dist = moveDelta.length;
            const ang = moveDelta.length > 0 ? (-moveDelta.angle) : 0;
            showTooltipAt(event.event.clientX, event.event.clientY, `Distancia: ${dist.toFixed(3)}  ∠: ${ang.toFixed(1)}°`);
            renderTrackingGuides(state.trackGuides, resolved, state.dragStartPoint);
            return;
        }

        if (state.selecting) {
            state.selectionRect = new Rectangle(state.selectStartPoint, event.point);
            if (event.point.x > state.selectStartPoint.x) state.selectMode = 'window';
            else state.selectMode = 'crossing';
            drawSelectionRect();
        }
    }

    function onMouseUp(event) {
        if (state.pickingPrintWindow) {
            state.pickingPrintWindow = false;
            selectionLayer.removeChildren();
            const rect = state.printPickRect;
            state.printPickStart = null;
            state.printPickRect = null;
            if (rect && rect.width > 1 && rect.height > 1) {
                setPrompt('Generando vista de impresión…');
                generatePrintView(rect);
            } else {
                setPrompt('Ventana de impresión no válida (demasiado pequeña)');
            }
            return;
        }
        if (state.panning) { state.panning = false; drawGrid(); return; }

        if (state.gripDrag) {
            state.gripDrag = null;
            state.gripDragStart = null;
            state.gripOriginalSegments = null;
            guideLayer.removeChildren();
            const dt = document.getElementById('dynamic-tooltip');
            if (dt) dt.style.display = 'none';
            renderGrips();
            setPrompt('Listo');
            view.update();
            updateProperties();
            return;
        }
        if (state.isDragging) {
            state.isDragging = false;
            state.dragStartPoint = null;
            state.originalPositions = [];
            state.hasMoved = false;
            state.dynamicLastPoint = null;
            guideLayer.removeChildren();
            const dt = document.getElementById('dynamic-tooltip');
            if (dt) dt.style.display = 'none';
            previewLayer.removeChildren();
            return;
        }
        if (state.selecting) {
            state.selecting = false;
            if (state.selectionRect && state.selectStartPoint) {
                const rect = state.selectionRect;
                if (!state.pendingCommand) clearSelection();
                const isWindow = state.selectMode === 'window';
                for (let internal in layers) {
                    const layer = layers[internal];
                    if (!layer.data.visible || layer.data.locked) continue;
                    if (layer === gridLayer || layer === guideLayer || layer === snapLayer ||
                        layer === selectionLayer || layer === previewLayer || layer === gripLayer) continue;
                    layer.children.forEach(item => {
                        if (item.bounds) {
                            if (isWindow) {
                                if (rect.contains(item.bounds)) addToSelection(item, true);
                            } else {
                                if (rect.intersects(item.bounds)) addToSelection(item, true);
                            }
                        }
                    });
                }
                selectionLayer.removeChildren();
                state.selectionRect = null;
                state.selectStartPoint = null;
                if (state.pendingCommand) {
                    setPrompt(`${state.pendingCommand}: Selecciona objetos — ${state.selectedItems.length} encontrado(s) (Enter para terminar)`);
                } else {
                    setPrompt(`Seleccionados: ${state.selectedItems.length}`);
                }
                updateProperties();
                renderGrips();
                refreshSelectionHighlight();
            }
        }
    }

    function onMouseMove(event) {
        state.lastMousePoint = event.point;
        state.lastClientX = event.event.clientX;
        state.lastClientY = event.event.clientY;
        updateCoords(event.point);
        guideLayer.removeChildren();
        updateDynamicPreview(event);

        const moveExclude = ((state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') && state.step >= 2) ?
            state.selectedItems : null;

        if (snapMarker) { snapMarker.remove(); snapMarker = null; }
        const snap = (state.snapEnabled && !state.selecting) ? getSnapPoint(event.point, moveExclude) : null;
        updateTrackAcquisition(snap);

        if (state.currentCommand && state.expectingPoint && state.dynamicLastPoint) {
            const base = state.dynamicLastPoint;
            const cursor = resolvePoint(event.point, base, state.currentCommand, moveExclude);
            const guideLine = new Path.Line(base, cursor);
            guideLine.strokeColor = 'gray';
            guideLine.strokeWidth = 1 / view.zoom;
            guideLayer.addChild(guideLine);
            renderTrackingGuides(state.trackGuides, cursor);
        } else {
            renderAcquiredMarkers();
        }

        if (snap) {
            const r = 5 / view.zoom;
            const p = snap.point;
            let marker;
            if (snap.type === 'endpoint') {
                marker = new Path.Rectangle(new paper.Rectangle(p.x - r, p.y - r, r * 2, r * 2));
            } else if (snap.type === 'midpoint') {
                marker = new Path([
                    p.add(new Point(0, -r * 1.15)),
                    p.add(new Point(r * 1.15, r * 0.85)),
                    p.add(new Point(-r * 1.15, r * 0.85))
                ]);
                marker.closed = true;
            } else {
                marker = new Path.Circle(p, r);
            }
            marker.strokeColor = new Color(0.91, 0.64, 0.24);
            marker.strokeWidth = 1.6 / view.zoom;
            marker.fillColor = null;
            snapLayer.addChild(marker);
            snapMarker = marker;
        }

        if (!state.currentCommand && !state.pendingCommand && !state.selecting && !state.isDragging && !state.gripDrag) {
            const hit = hitTestContent(event.point);
            const newHover = (hit && hit.item) ? hit.item : null;
            if (newHover !== state.hoveredItem) {
                if (state.hoveredItem && !state.selectedItems.includes(state.hoveredItem)) state.hoveredItem.shadowColor = null;
                if (newHover && !state.selectedItems.includes(newHover)) {
                    newHover.shadowColor = new Color('#7FDBFF');
                    newHover.shadowBlur = 6;
                    newHover.shadowOffset = new Point(0, 0);
                }
                state.hoveredItem = newHover;
            }
        } else if (state.hoveredItem) {
            if (!state.selectedItems.includes(state.hoveredItem)) state.hoveredItem.shadowColor = null;
            state.hoveredItem = null;
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // [24] VISTA PREVIA DINÁMICA
    //      Ángulos y ΔY mostrados en convenio usuario (CCW, Y+ arriba)
    // ═══════════════════════════════════════════════════════════════
    function updateDynamicPreview(event) {
        previewLayer.removeChildren();
        const pt = event.point;

        if (state.currentCommand === 'OFFSET' && state.step === 3 && state.offsetTarget) {
            const item = state.offsetTarget;
            const dist = state.offsetDistance;
            let preview = null;
            if (isLineItem(item)) {
                const p1 = item.segments[0].point;
                const p2 = item.segments[1].point;
                const dir = p2.subtract(p1).normalize();
                const normal = dir.rotate(90).multiply(dist);
                const mid = p1.add(p2).divide(2);
                const side = pt.subtract(mid).dot(normal) > 0 ? 1 : -1;
                const offsetNormal = normal.multiply(side);
                preview = new Path.Line(p1.add(offsetNormal), p2.add(offsetNormal));
            } else if (isCircleItem(item)) {
                const r0 = getCircleRadius(item);
                const inside = pt.getDistance(item.position) < r0;
                const newRadius = inside ? r0 - dist : r0 + dist;
                if (newRadius > 0) preview = new Path.Circle(item.position, newRadius);
            } else if (isPolylineItem(item)) {
                preview = offsetPolyline(item, dist, pt);
            }
            if (preview) {
                preview.strokeColor = new Color('#E8A33D');
                preview.strokeWidth = 1.2 / view.zoom;
                preview.dashArray = [5, 4];
                preview.fillColor = null;
                previewLayer.addChild(preview);
            }
            showTooltipAt(event.event.clientX, event.event.clientY, `Offset: ${dist}`);
            return;
        }

        if (state.currentCommand && state.expectingPoint && state.dynamicLastPoint) {
            const base = state.dynamicLastPoint;
            const moveExclude = ((state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') && state.step >= 2) ?
                state.selectedItems : null;
            const cursor = resolvePoint(pt, base, state.currentCommand, moveExclude);
            const dx = cursor.x - base.x;
            const dy = cursor.y - base.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            if (state.currentCommand === 'LINE') {
                const line = new Path.Line(base, cursor);
                line.strokeColor = new Color(0, 0.75, 1, 0.6);
                line.strokeWidth = 1 / view.zoom;
                line.dashArray = [4, 4];
                previewLayer.addChild(line);
                showTooltipAt(event.event.clientX, event.event.clientY - 30,
                    `L: ${dist.toFixed(2)}  ∠: ${(-angle).toFixed(1)}°  ΔX: ${dx.toFixed(2)}  ΔY: ${(-dy).toFixed(2)}`);
            } else if (state.currentCommand === 'CIRCLE') {
                const r = state.circleDiameterMode ? dist / 2 : dist;
                const circle = new Path.Circle(base, r);
                circle.strokeColor = new Color(0, 0.75, 1, 0.6);
                circle.strokeWidth = 1 / view.zoom;
                circle.dashArray = [4, 4];
                previewLayer.addChild(circle);
                const text = state.circleDiameterMode ? `Diámetro: ${dist.toFixed(2)}  (Radio: ${r.toFixed(2)})` : `Radio: ${dist.toFixed(2)}`;
                showTooltipAt(event.event.clientX, event.event.clientY - 30, text);
            } else if (state.currentCommand === 'RECTANG') {
                const rect = new Path.Rectangle(base, cursor);
                rect.strokeColor = new Color(0, 0.75, 1, 0.6);
                rect.strokeWidth = 1 / view.zoom;
                rect.dashArray = [4, 4];
                previewLayer.addChild(rect);
                showTooltipAt(event.event.clientX, event.event.clientY - 30, `Ancho: ${Math.abs(cursor.x - base.x).toFixed(2)}  Alto: ${Math.abs(cursor.y - base.y).toFixed(2)}`);
            } else if (state.currentCommand === 'ARC') {
                if (state.step === 2) {
                    const guide = new Path.Line(base, cursor);
                    guide.strokeColor = new Color(0, 0.75, 1, 0.6);
                    guide.strokeWidth = 1 / view.zoom;
                    guide.dashArray = [4, 4];
                    previewLayer.addChild(guide);
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, `Dist: ${dist.toFixed(2)}`);
                } else if (state.step === 3) {
                    try {
                        const arcPreview = new Path.Arc(state.collectedPoints[0], state.collectedPoints[1], cursor);
                        arcPreview.strokeColor = new Color(0, 0.75, 1, 0.6);
                        arcPreview.strokeWidth = 1 / view.zoom;
                        arcPreview.dashArray = [4, 4];
                        arcPreview.fillColor = null;
                        previewLayer.addChild(arcPreview);
                    } catch (err) {}
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, `Dist: ${dist.toFixed(2)}`);
                }
            } else if (state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') {
                const line = new Path.Line(base, cursor);
                line.strokeColor = new Color(0, 0.75, 1, 0.6);
                line.strokeWidth = 1 / view.zoom;
                line.dashArray = [4, 4];
                previewLayer.addChild(line);
                const previewSource = (state.currentCommand === 'COPY' && state.copySourceItems.length) ?
                    state.copySourceItems : state.selectedItems;
                previewSource.forEach((item) => {
                    const clone = item.clone({ insert: false });
                    clone.position = clone.position.add(cursor.subtract(base));
                    clone.strokeColor = new Color(0, 0.75, 1, 0.6);
                    clone.dashArray = [4, 4];
                    clone.fillColor = null;
                    previewLayer.addChild(clone);
                });
                showTooltipAt(event.event.clientX, event.event.clientY - 30,
                    `Distancia: ${dist.toFixed(2)}  ∠: ${(-angle).toFixed(1)}°`);
            } else if (state.currentCommand === 'ROTATE') {
                const guideLine = new Path.Line(state.basePoint, cursor);
                guideLine.strokeColor = new Color(0, 0.75, 1, 0.4);
                guideLine.strokeWidth = 1 / view.zoom;
                guideLine.dashArray = [3, 3];
                previewLayer.addChild(guideLine);
                const currentAngle = cursor.subtract(state.basePoint).angle;
                const delta = currentAngle - state.startAngle;
                state.selectedItems.forEach(item => {
                    const clone = item.clone({ insert: false });
                    clone.rotate(delta, state.basePoint);
                    clone.strokeColor = new Color(0, 0.75, 1, 0.6);
                    clone.dashArray = [4, 4];
                    clone.fillColor = null;
                    previewLayer.addChild(clone);
                });
                let angleDeg = (-delta) % 360;
                if (angleDeg < 0) angleDeg += 360;
                showTooltipAt(event.event.clientX, event.event.clientY - 30, `Ángulo: ${angleDeg.toFixed(2)}° (CCW)`);
            } else if (state.currentCommand === 'SCALE') {
                const guideLine = new Path.Line(state.basePoint, cursor);
                guideLine.strokeColor = new Color(0, 0.75, 1, 0.4);
                guideLine.strokeWidth = 1 / view.zoom;
                guideLine.dashArray = [3, 3];
                previewLayer.addChild(guideLine);
                const refDist = state.referencePoint.subtract(state.basePoint).length || 1;
                const curDist = cursor.subtract(state.basePoint).length;
                const sf = curDist / refDist;
                state.selectedItems.forEach(item => {
                    const clone = item.clone({ insert: false });
                    clone.scale(sf, state.basePoint);
                    clone.strokeColor = new Color(0, 0.75, 1, 0.6);
                    clone.dashArray = [4, 4];
                    clone.fillColor = null;
                    previewLayer.addChild(clone);
                });
                showTooltipAt(event.event.clientX, event.event.clientY - 30, `Escala: ${sf.toFixed(3)}x`);
            } else if (state.currentCommand === 'MIRROR') {
                const axisLine = new Path.Line(base, cursor);
                axisLine.strokeColor = new Color(0.91, 0.64, 0.24);
                axisLine.strokeWidth = 1 / view.zoom;
                axisLine.dashArray = [6 / view.zoom, 4 / view.zoom];
                previewLayer.addChild(axisLine);
                if (base.getDistance(cursor) > 1e-6 && state.selectedItems.length) {
                    try {
                        const matrix = reflectMatrix(base, cursor);
                        state.selectedItems.forEach(item => {
                            const clone = item.clone({ insert: false });
                            clone.transform(matrix);
                            clone.strokeColor = new Color(0, 0.75, 1, 0.6);
                            clone.strokeWidth = 1 / view.zoom;
                            clone.dashArray = [4, 4];
                            clone.fillColor = null;
                            previewLayer.addChild(clone);
                        });
                    } catch (err) {}
                }
                const axisAngle = cursor.subtract(base).angle;
                showTooltipAt(event.event.clientX, event.event.clientY - 30,
                    `Eje  L: ${dist.toFixed(2)}  ∠: ${(-axisAngle).toFixed(1)}°`);
            }
        }
    }

    function showTooltipAt(clientX, clientY, text) {
        const el = document.getElementById('dynamic-tooltip');
        if (!el) return;
        el.style.left = (clientX + 15) + 'px';
        el.style.top = (clientY - 20) + 'px';
        el.textContent = text;
        el.style.display = 'block';
    }

    // ═══════════════════════════════════════════════════════════════
    // [25] COORDENADAS Y CAJA DE SELECCIÓN
    //      Barra inferior muestra Y-usuario (Y+ = arriba).
    // ═══════════════════════════════════════════════════════════════
    function updateCoords(pt) {
        document.getElementById('coords-display').textContent =
            `X: ${pt.x.toFixed(3)}, Y: ${(-pt.y).toFixed(3)}`;
        document.getElementById('zoom-display').textContent = `Zoom: ${view.zoom.toFixed(2)}x`;
    }
    function drawSelectionRect() {
        selectionLayer.removeChildren();
        if (state.selectionRect && state.selecting) {
            const rect = state.selectionRect;
            const path = new Path.Rectangle(rect);
            const isWindow = state.selectMode === 'window';
            path.fillColor = isWindow ? new Color(0, 0, 1, 0.1) : new Color(0, 1, 0, 0.1);
            path.strokeColor = isWindow ? 'blue' : 'green';
            path.strokeWidth = 1 / view.zoom;
            selectionLayer.addChild(path);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // [26] CUADRÍCULA
    //      La flecha del eje Y apunta hacia ARRIBA (Y+ usuario).
    // ═══════════════════════════════════════════════════════════════
    function drawGrid() {
        gridLayer.removeChildren();
        if (!state.gridVisible) return;
        const bounds = view.bounds;
        const zoom = view.zoom;
        const targetPixels = 40;
        const pixelPerUnit = view.viewSize.width / (bounds.width || 1);
        let spacing = targetPixels / pixelPerUnit;
        const exp = Math.floor(Math.log10(spacing));
        const mant = spacing / Math.pow(10, exp);
        let rounded;
        if (mant < 1.5) rounded = 1;
        else if (mant < 3.5) rounded = 2;
        else if (mant < 7.5) rounded = 5;
        else rounded = 10;
        const gridSpacing = rounded * Math.pow(10, exp);

        const left   = Math.floor(bounds.left / gridSpacing) * gridSpacing - gridSpacing;
        const right  = Math.ceil(bounds.right / gridSpacing) * gridSpacing + gridSpacing;
        const yMin   = Math.min(bounds.top, bounds.bottom);
        const yMax   = Math.max(bounds.top, bounds.bottom);
        const bottom = Math.floor(yMin / gridSpacing) * gridSpacing - gridSpacing;
        const top    = Math.ceil(yMax / gridSpacing) * gridSpacing + gridSpacing;

        const pixelThin = 0.5, pixelThick = 0.8, pixelAxis = 1.2;
        const thinWidth  = Math.min(pixelThin  / zoom, 2);
        const thickWidth = Math.min(pixelThick / zoom, 2);
        const axisWidth  = Math.min(pixelAxis  / zoom, 2.5);
        const thinColor  = new Color(0.25, 0.25, 0.25);
        const thickColor = new Color(0.35, 0.35, 0.35);
        const majorSpacing = gridSpacing * 5;

        for (let x = left; x <= right; x += gridSpacing) {
            const isMajor = (Math.abs(x) % majorSpacing < 0.001);
            const line = new Path.Line(new Point(x, bottom), new Point(x, top));
            line.strokeColor = (Math.abs(x) < 0.001) ? new Color(0.6, 0.6, 0.6) : (isMajor ? thickColor : thinColor);
            line.strokeWidth = (Math.abs(x) < 0.001) ? axisWidth : (isMajor ? thickWidth : thinWidth);
            gridLayer.addChild(line);
        }
        for (let y = bottom; y <= top; y += gridSpacing) {
            const isMajor = (Math.abs(y) % majorSpacing < 0.001);
            const line = new Path.Line(new Point(left, y), new Point(right, y));
            line.strokeColor = (Math.abs(y) < 0.001) ? new Color(0.6, 0.6, 0.6) : (isMajor ? thickColor : thinColor);
            line.strokeWidth = (Math.abs(y) < 0.001) ? axisWidth : (isMajor ? thickWidth : thinWidth);
            gridLayer.addChild(line);
        }
        const originColor = new Color(0.6, 0.6, 0.6);
        const axisX = new Path.Line(new Point(left, 0), new Point(right, 0));
        axisX.strokeColor = originColor; axisX.strokeWidth = axisWidth; gridLayer.addChild(axisX);
        const axisY = new Path.Line(new Point(0, bottom), new Point(0, top));
        axisY.strokeColor = originColor; axisY.strokeWidth = axisWidth; gridLayer.addChild(axisY);

        if (zoom > 0.3) {
            const size = 20 / zoom;
            const origin = new Point(bounds.left + size * 1.5, bounds.bottom - size * 1.5);

            const xArrow = new Path.Line(origin, new Point(origin.x + size, origin.y));
            xArrow.strokeColor = new Color(0.8, 0.2, 0.2);
            xArrow.strokeWidth = axisWidth;
            gridLayer.addChild(xArrow);

            // En coordenadas internas, Y+ usuario = hacia arriba = -y interno
            const yArrow = new Path.Line(origin, new Point(origin.x, origin.y - size));
            yArrow.strokeColor = new Color(0.2, 0.8, 0.2);
            yArrow.strokeWidth = axisWidth;
            gridLayer.addChild(yArrow);

            const labelX = new PointText(new Point(origin.x + size + 4, origin.y - 2));
            labelX.content = 'X';
            labelX.fillColor = new Color(0.8, 0.2, 0.2);
            labelX.fontSize = Math.max(8, 10 / zoom);
            gridLayer.addChild(labelX);

            const labelY = new PointText(new Point(origin.x - 2, origin.y - size - 6));
            labelY.content = 'Y';
            labelY.fillColor = new Color(0.2, 0.8, 0.2);
            labelY.fontSize = Math.max(8, 10 / zoom);
            gridLayer.addChild(labelY);
        }
    }
    let _lastGridDrawTime = 0;
    function drawGridThrottled() {
        const now = Date.now();
        if (now - _lastGridDrawTime < 50) return;
        _lastGridDrawTime = now;
        drawGrid();
    }

    // ═══════════════════════════════════════════════════════════════
    // [27] ZOOM
    // ═══════════════════════════════════════════════════════════════
    function zoomExtents() {
        let allBounds = null;
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                layer === previewLayer || layer === gripLayer) continue;
            if (layer.children.length > 0) {
                const b = layer.bounds;
                if (b.width > 0 || b.height > 0) allBounds = allBounds ? allBounds.unite(b) : b;
            }
        }
        if (allBounds) {
            const pad = 50;
            const sx = (view.size.width - pad * 2) / allBounds.width;
            const sy = (view.size.height - pad * 2) / allBounds.height;
            view.zoom = Math.min(sx, sy);
            view.center = allBounds.center;
        } else { view.zoom = 1; view.center = new Point(0, 0); }
        drawGrid(); refreshStrokeWidths(); renderGrips(); view.update();
    }
    function onMouseWheel(event) {
        event.preventDefault();
        const mousePos = view.getEventPoint(event);
        if (!mousePos) return;
        const delta = Math.sign(event.deltaY) * -0.01;
        const oldZoom = view.zoom;
        let newZoom = oldZoom * (1 + delta);
        newZoom = Math.max(0.01, Math.min(100, newZoom));
        const ratio = newZoom / oldZoom;
        const newCenter = mousePos.add(view.center.subtract(mousePos).multiply(1 / ratio));
        view.zoom = newZoom;
        view.center = newCenter;
        drawGrid(); refreshStrokeWidths(); renderGrips(); view.update();
    }

    // ═══════════════════════════════════════════════════════════════
    // [28] IMPORTAR DXF
    // ═══════════════════════════════════════════════════════════════
    function getCurrentDrawingBounds() {
        let allBounds = null;
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                layer === previewLayer || layer === gripLayer) continue;
            if (layer.children.length > 0) {
                const b = layer.bounds;
                if (b && (b.width > 0 || b.height > 0)) allBounds = allBounds ? allBounds.unite(b) : b;
            }
        }
        return allBounds;
    }
    function importDXF(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const result = parseDXF(ev.target.result);
                if (result && result.length > 0) {
                    invalidateSnapCache();
                    setPrompt(`DXF importado: ${result.length} entidades`);
                    zoomExtents();
                } else {
                    setPrompt('No se encontraron entidades válidas');
                }
            } catch (err) {
                console.error(err);
                setPrompt('Error al importar: ' + err.message);
            }
        };
        reader.readAsText(file);
    }
    function parseDXF(dxfText) {
        const lines = dxfText.split(/\r?\n/).map(l => l.trim());
        let i = 0;
        const itemsToAdd = [];
        while (i < lines.length && lines[i] !== 'ENTITIES' && lines[i] !== 'entities') i++;
        if (i >= lines.length) { setPrompt('No se encontró sección ENTITIES'); return []; }
        i++;
        while (i < lines.length && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') {
            if (lines[i] === '0') {
                const type = lines[i + 1] ? lines[i + 1].toUpperCase() : '';
                i += 2;
                const codes = [];
                while (i < lines.length && lines[i] !== '0' && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') {
                    const code = parseInt(lines[i], 10);
                    const value = lines[i + 1] || '';
                    if (!isNaN(code)) codes.push({ code, value });
                    i += 2;
                }
                const get = (c) => parseFloat(codes.find(p => p.code === c)?.value);
                const layerCode = codes.find(p => p.code === 8);
                const originalLayerName = layerCode ? layerCode.value : '0';
                try {
                    if (type === 'LINE') {
                        const x1 = get(10), y1 = get(20), x2 = get(11), y2 = get(21);
                        if (!isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
                            const line = new Path.Line(new Point(x1, -y1), new Point(x2, -y2));
                            line.strokeColor = 'white';
                            line.strokeWidth = currentStrokeWidth();
                            tagShape(line, 'line');
                            itemsToAdd.push({ item: line, layer: originalLayerName });
                        }
                    } else if (type === 'CIRCLE') {
                        const cx = get(10), cy = get(20), r = get(40);
                        if (!isNaN(cx) && !isNaN(cy) && !isNaN(r) && r > 0) {
                            const circle = new Path.Circle(new Point(cx, -cy), r);
                            circle.strokeColor = 'white';
                            circle.strokeWidth = currentStrokeWidth();
                            tagShape(circle, 'circle');
                            circle.data.radius = r;
                            itemsToAdd.push({ item: circle, layer: originalLayerName });
                        }
                    } else if (type === 'ARC') {
                        const cx = get(10), cy = get(20), r = get(40);
                        const sa = get(50), ea = get(51);
                        if (!isNaN(cx) && !isNaN(cy) && !isNaN(r) && r > 0 && !isNaN(sa) && !isNaN(ea)) {
                            const aRad = sa * Math.PI / 180;
                            const bRad = ea * Math.PI / 180;
                            let sweep = bRad - aRad;
                            if (sweep < 0) sweep += 2 * Math.PI;
                            const midRad = aRad + sweep / 2;
                            const fromDxf = new Point(cx + r * Math.cos(aRad), cy + r * Math.sin(aRad));
                            const toDxf   = new Point(cx + r * Math.cos(bRad), cy + r * Math.sin(bRad));
                            const midDxf  = new Point(cx + r * Math.cos(midRad), cy + r * Math.sin(midRad));
                            const arc = new Path.Arc(
                                new Point(fromDxf.x, -fromDxf.y),
                                new Point(midDxf.x,  -midDxf.y),
                                new Point(toDxf.x,   -toDxf.y)
                            );
                            arc.strokeColor = 'white';
                            arc.strokeWidth = currentStrokeWidth();
                            tagShape(arc, 'arc');
                            itemsToAdd.push({ item: arc, layer: originalLayerName });
                        }
                    } else if (type === 'LWPOLYLINE') {
                        const vertsDxf = [];
                        const bulges = [];
                        for (let j = 0; j < codes.length; j++) {
                            const c = codes[j];
                            if (c.code === 10) {
                                const x = parseFloat(c.value);
                                let y = 0, bulge = 0;
                                if (j + 1 < codes.length && codes[j + 1].code === 20) { y = parseFloat(codes[j + 1].value); j++; }
                                if (j + 1 < codes.length && codes[j + 1].code === 42) { bulge = parseFloat(codes[j + 1].value); j++; }
                                vertsDxf.push({ x, y });
                                bulges.push(isNaN(bulge) ? 0 : bulge);
                            }
                        }
                        const closed = (parseInt(codes.find(p => p.code === 70)?.value || '0', 10) & 1) === 1;
                        if (vertsDxf.length > 1) {
                            const poly = buildPolyline(vertsDxf, bulges, closed);
                            if (poly) {
                                poly.strokeColor = 'white';
                                poly.strokeWidth = currentStrokeWidth();
                                itemsToAdd.push({ item: poly, layer: originalLayerName });
                            }
                        }
                    } else if (type === 'POLYLINE') {
                        const closed = (parseInt(codes.find(p => p.code === 70)?.value || '0', 10) & 1) === 1;
                        const vertsDxf = [];
                        const bulges = [];
                        while (i < lines.length && lines[i] === '0') {
                            const subType = lines[i + 1] ? lines[i + 1].toUpperCase() : '';
                            if (subType === 'SEQEND') {
                                i += 2;
                                while (i < lines.length && lines[i] !== '0' && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') i += 2;
                                break;
                            }
                            if (subType !== 'VERTEX') break;
                            i += 2;
                            const vcodes = [];
                            while (i < lines.length && lines[i] !== '0' && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') {
                                const vcode = parseInt(lines[i], 10);
                                const vvalue = lines[i + 1] || '';
                                if (!isNaN(vcode)) vcodes.push({ code: vcode, value: vvalue });
                                i += 2;
                            }
                            const vx = parseFloat(vcodes.find(p => p.code === 10)?.value);
                            const vy = parseFloat(vcodes.find(p => p.code === 20)?.value);
                            const vbulge = parseFloat(vcodes.find(p => p.code === 42)?.value);
                            if (!isNaN(vx) && !isNaN(vy)) {
                                vertsDxf.push({ x: vx, y: vy });
                                bulges.push(isNaN(vbulge) ? 0 : vbulge);
                            }
                        }
                        if (vertsDxf.length > 1) {
                            const poly = buildPolyline(vertsDxf, bulges, closed);
                            if (poly) {
                                poly.strokeColor = 'white';
                                poly.strokeWidth = currentStrokeWidth();
                                itemsToAdd.push({ item: poly, layer: originalLayerName });
                            }
                        }
                    }
                } catch (err) { console.warn('Error al procesar entidad DXF:', err); }
            } else { i++; }
        }
        if (itemsToAdd.length === 0) return [];
        const currentBounds = getCurrentDrawingBounds();
        const tempGroup = new Group();
        itemsToAdd.forEach(({ item }) => tempGroup.addChild(item));
        const newBounds = tempGroup.bounds;
        tempGroup.removeChildren();
        tempGroup.remove();
        let offsetX = 0;
        if (currentBounds && newBounds && newBounds.width > 0) {
            const gap = 20;
            const targetLeft = currentBounds.right + gap;
            offsetX = targetLeft - newBounds.left;
        }
        if (offsetX !== 0) itemsToAdd.forEach(({ item }) => item.translate(new Point(offsetX, 0)));
        saveState();
        itemsToAdd.forEach(({ item, layer: originalLayerName }) => {
            const internal = safeName(originalLayerName);
            if (!layers[internal]) createLayer(internal);
            layers[internal].addChild(item);
        });
        renderLayerList();
        return itemsToAdd;
    }
    function buildPolyline(vertsDxf, bulges, closed) {
        if (vertsDxf.length < 2) return null;
        const path = new Path();
        path.moveTo(new Point(vertsDxf[0].x, -vertsDxf[0].y));
        for (let i = 0; i < vertsDxf.length; i++) {
            const nextIdx = (i + 1) % vertsDxf.length;
            if (i === vertsDxf.length - 1 && !closed) break;
            const bulge = bulges[i] || 0;
            if (i === vertsDxf.length - 1 && closed && bulge === 0) break;
            const p1 = vertsDxf[i], p2 = vertsDxf[nextIdx];
            const pt2 = new Point(p2.x, -p2.y);
            if (bulge === 0) {
                path.lineTo(pt2);
            } else {
                const chord = new Point(p2.x - p1.x, p2.y - p1.y);
                const chordLen = chord.length;
                if (chordLen < 1e-10) { path.lineTo(pt2); continue; }
                const sagitta = bulge * chordLen / 2;
                const radius = (chordLen * chordLen) / (8 * Math.abs(sagitta)) + Math.abs(sagitta) / 2;
                const midPoint = new Point((p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
                const perp = chord.rotate(bulge > 0 ? 90 : -90).normalize();
                const centerDist = radius - Math.abs(sagitta);
                const center = midPoint.add(perp.multiply(centerDist));
                const startAngle = Math.atan2(p1.y - center.y, p1.x - center.x);
                const endAngle = Math.atan2(p2.y - center.y, p2.x - center.x);
                let sweep = endAngle - startAngle;
                if (bulge > 0 && sweep < 0) sweep += 2 * Math.PI;
                else if (bulge < 0 && sweep > 0) sweep -= 2 * Math.PI;
                const midAngle = startAngle + sweep / 2;
                const midDxf = new Point(center.x + radius * Math.cos(midAngle), center.y + radius * Math.sin(midAngle));
                path.arcTo(new Point(midDxf.x, -midDxf.y), pt2);
            }
        }
        path.closed = closed;
        tagShape(path, 'polyline');
        return path;
    }

    // ═══════════════════════════════════════════════════════════════
    // [29] IMPRIMIR / PDF
    // ═══════════════════════════════════════════════════════════════
    function getContentBounds() {
        let bounds = null;
        for (let internal in layers) {
            const l = layers[internal];
            if (!l.data.visible) continue;
            l.children.forEach(item => {
                if (!item.bounds) return;
                bounds = bounds ? bounds.unite(item.bounds) : item.bounds.clone();
            });
        }
        if (!bounds || bounds.width === 0 || bounds.height === 0) {
            bounds = new paper.Rectangle(-100, -100, 200, 200);
        }
        const pad = Math.max(bounds.width, bounds.height) * 0.06 + 5;
        return new paper.Rectangle(bounds.x - pad, bounds.y - pad, bounds.width + pad * 2, bounds.height + pad * 2);
    }
    function isWhiteish(color) {
        try { return color.red > 0.85 && color.green > 0.85 && color.blue > 0.85; } catch (e) { return false; }
    }
    function generatePrintView(bounds) {
        const utilityLayers = [gridLayer, guideLayer, snapLayer, selectionLayer, previewLayer, gripLayer];
        const prevVisibility = utilityLayers.map(l => l.visible);
        utilityLayers.forEach(l => l.visible = false);
        const colorBackups = [];
        for (let internal in layers) {
            layers[internal].children.forEach(item => {
                if (item.strokeColor && isWhiteish(item.strokeColor)) {
                    colorBackups.push({ item, color: item.strokeColor });
                    item.strokeColor = new Color('black');
                }
            });
        }
        const shadowBackups = [];
        state.selectedItems.forEach(it => { shadowBackups.push({ item: it, color: it.shadowColor }); it.shadowColor = null; });
        if (state.hoveredItem) { shadowBackups.push({ item: state.hoveredItem, color: state.hoveredItem.shadowColor }); state.hoveredItem.shadowColor = null; }
        let svg;
        try {
            svg = project.exportSVG({ asString: true, bounds: bounds });
        } finally {
            utilityLayers.forEach((l, i) => l.visible = prevVisibility[i]);
            colorBackups.forEach(b => b.item.strokeColor = b.color);
            shadowBackups.forEach(b => b.item.shadowColor = b.color);
        }
        openPrintWindow(svg);
    }
    function openPrintWindow(svgString) {
        const win = window.open('', '_blank');
        if (!win) { setPrompt('El navegador bloqueó la ventana de impresión. Permite ventanas emergentes.'); return; }
        win.document.write(
            '<!DOCTYPE html><html><head><title>Imprimir dibujo</title><style>' +
            'html,body{margin:0;padding:0;background:#fff;}' +
            '.sheet{padding:24px;display:flex;align-items:center;justify-content:center;min-height:100vh;box-sizing:border-box;}' +
            'svg{max-width:100%;height:auto;}' +
            '@media print{.sheet{padding:0;min-height:0;}}' +
            '</style></head><body><div class="sheet">' + svgString + '</div>' +
            '<script>window.onload=function(){setTimeout(function(){window.print();},250);};<' + '/script>' +
            '</body></html>'
        );
        win.document.close();
    }
    function startPrintWindowPick() {
        state.pickingPrintWindow = true;
        state.printPickStart = null;
        state.printPickRect = null;
        setPrompt('Impresión: arrastra una ventana sobre el dibujo (ESC para cancelar)');
    }
    document.getElementById('qa-print').addEventListener('click', () => {
        showModal({
            title: 'Imprimir / Exportar a PDF',
            body: 'Elige qué parte del dibujo quieres imprimir. Se abrirá el diálogo de impresión del navegador, donde puedes elegir <b>Guardar como PDF</b>.',
            buttons: [
                { label: 'Cancelar' },
                { label: 'Ventana de selección', onClick: startPrintWindowPick },
                { label: 'Todo el dibujo', primary: true, onClick: () => generatePrintView(getContentBounds()) }
            ]
        });
    });

    // ═══════════════════════════════════════════════════════════════
    // [30] EXPORTAR DXF
    //      El DXF ya usa Y+ arriba; se niega la Y interna (que es Y-bajo).
    // ═══════════════════════════════════════════════════════════════
    function exportDXF() {
        const dxf = generateDXF();
        if (!dxf) { setPrompt('No hay entidades para exportar'); return; }
        const bom = '\uFEFF';
        const content = bom + dxf;
        const blob = new Blob([content], { type: 'application/dxf;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dibujo.dxf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setPrompt('DXF exportado correctamente (AutoCAD R12+)');
    }
    function writePolylineEntity(item, layerName) {
        const isCurved = item.curves.some(c => !c.isStraight());
        let pts;
        if (isCurved) {
            const steps = Math.max(8, Math.min(64, Math.round(item.length / 2)));
            pts = [];
            for (let i = 0; i <= steps; i++) pts.push(item.getPointAt((item.length * i) / steps));
            pts = pts.filter(Boolean);
        } else {
            pts = item.segments.map(s => s.point);
        }
        if (pts.length < 2) return '';
        let dxf = '';
        dxf += '0\nPOLYLINE\n';
        dxf += '8\n' + layerName + '\n';
        dxf += '66\n1\n';
        dxf += '70\n' + (item.closed ? 1 : 0) + '\n';
        dxf += '10\n0.0\n20\n0.0\n30\n0.0\n';
        pts.forEach(p => {
            dxf += '0\nVERTEX\n';
            dxf += '8\n' + layerName + '\n';
            dxf += '10\n' + p.x.toFixed(6) + '\n';
            dxf += '20\n' + (-p.y).toFixed(6) + '\n';
            dxf += '30\n0.0\n';
            dxf += '70\n0\n';
        });
        dxf += '0\nSEQEND\n';
        dxf += '8\n' + layerName + '\n';
        return dxf;
    }
    function generateDXF() {
        let dxf = '';
        dxf += '0\nSECTION\n2\nHEADER\n';
        dxf += '9\n$ACADVER\n1\nAC1009\n';
        dxf += '9\n$INSBASE\n10\n0.0\n20\n0.0\n30\n0.0\n';
        dxf += '9\n$EXTMIN\n10\n-1000.0\n20\n-1000.0\n30\n0.0\n';
        dxf += '9\n$EXTMAX\n10\n1000.0\n20\n1000.0\n30\n0.0\n';
        dxf += '9\n$LIMMIN\n10\n0.0\n20\n0.0\n';
        dxf += '9\n$LIMMAX\n10\n420.0\n20\n297.0\n';
        dxf += '0\nENDSEC\n';
        dxf += '0\nSECTION\n2\nTABLES\n';
        let layerNames = ['0'];
        for (let internal in layers) {
            const l = layers[internal];
            if (l !== gridLayer && l !== guideLayer && l !== snapLayer && l !== selectionLayer && l !== previewLayer && l !== gripLayer) {
                const name = l.data.originalName || '0';
                if (name !== '0' && !layerNames.includes(name)) layerNames.push(name);
            }
        }
        dxf += '0\nTABLE\n2\nLAYER\n70\n' + layerNames.length + '\n';
        layerNames.forEach(name => {
            dxf += '0\nLAYER\n';
            dxf += '2\n' + name + '\n';
            dxf += '70\n0\n';
            dxf += '62\n7\n';
            dxf += '6\nCONTINUOUS\n';
        });
        dxf += '0\nENDTAB\n';
        dxf += '0\nTABLE\n2\nLTYPE\n70\n1\n';
        dxf += '0\nLTYPE\n';
        dxf += '2\nCONTINUOUS\n';
        dxf += '70\n0\n';
        dxf += '3\nLínea continua\n';
        dxf += '72\n65\n';
        dxf += '73\n0\n';
        dxf += '40\n0.0\n';
        dxf += '0\nENDTAB\n';
        dxf += '0\nTABLE\n2\nSTYLE\n70\n1\n';
        dxf += '0\nSTYLE\n';
        dxf += '2\nSTANDARD\n';
        dxf += '70\n0\n';
        dxf += '40\n0.0\n';
        dxf += '41\n1.0\n';
        dxf += '50\n0.0\n';
        dxf += '71\n0\n';
        dxf += '42\n2.5\n';
        dxf += '3\narial.ttf\n';
        dxf += '4\n\n';
        dxf += '0\nENDTAB\n';
        dxf += '0\nENDSEC\n';
        dxf += '0\nSECTION\n2\nBLOCKS\n';
        dxf += '0\nENDSEC\n';
        dxf += '0\nSECTION\n2\nENTITIES\n';
        let hasEntities = false;
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                layer === previewLayer || layer === gripLayer) continue;
            const layerName = layer.data.originalName || '0';
            layer.children.forEach(item => {
                if (isLineItem(item)) {
                    const p1 = item.segments[0].point;
                    const p2 = item.segments[1].point;
                    dxf += '0\nLINE\n';
                    dxf += '8\n' + layerName + '\n';
                    dxf += '10\n' + p1.x.toFixed(6) + '\n';
                    dxf += '20\n' + (-p1.y).toFixed(6) + '\n';
                    dxf += '30\n0.0\n';
                    dxf += '11\n' + p2.x.toFixed(6) + '\n';
                    dxf += '21\n' + (-p2.y).toFixed(6) + '\n';
                    dxf += '31\n0.0\n';
                    hasEntities = true;
                } else if (isCircleItem(item)) {
                    const c = item.position;
                    dxf += '0\nCIRCLE\n';
                    dxf += '8\n' + layerName + '\n';
                    dxf += '10\n' + c.x.toFixed(6) + '\n';
                    dxf += '20\n' + (-c.y).toFixed(6) + '\n';
                    dxf += '30\n0.0\n';
                    dxf += '40\n' + getCircleRadius(item).toFixed(6) + '\n';
                    hasEntities = true;
                } else if (isArcItem(item) && item.segments.length > 1) {
                    const p0 = item.segments[0].point;
                    const p1 = item.segments[item.segments.length - 1].point;
                    const mid = item.getPointAt(item.length / 2) || item.segments[Math.floor(item.segments.length / 2)].point;
                    const center = circumcenter(p0, mid, p1);
                    let validArc = false, radius = 0;
                    if (center) {
                        radius = center.getDistance(p0);
                        const tol = Math.max(radius * 0.02, 0.05);
                        validArc = radius > 1e-6 && item.segments.every(s => Math.abs(s.point.getDistance(center) - radius) < tol);
                    }
                    if (validArc) {
                        const toDxfAngle = (p) => {
                            const dx = p.x - center.x;
                            const dy = -(p.y - center.y);
                            let a = Math.atan2(dy, dx) * 180 / Math.PI;
                            if (a < 0) a += 360;
                            return a;
                        };
                        let sa = toDxfAngle(p0);
                        let ea = toDxfAngle(p1);
                        const ma = toDxfAngle(mid);
                        let sweep = ea - sa;
                        if (sweep < 0) sweep += 360;
                        let midOffset = ma - sa;
                        if (midOffset < 0) midOffset += 360;
                        if (midOffset > sweep) {
                            const tmp = sa;
                            sa = ea; ea = tmp;
                            sweep = 360 - sweep;
                        }
                        dxf += '0\nARC\n';
                        dxf += '8\n' + layerName + '\n';
                        dxf += '10\n' + center.x.toFixed(6) + '\n';
                        dxf += '20\n' + (-center.y).toFixed(6) + '\n';
                        dxf += '30\n0.0\n';
                        dxf += '40\n' + radius.toFixed(6) + '\n';
                        dxf += '50\n' + sa.toFixed(6) + '\n';
                        dxf += '51\n' + ea.toFixed(6) + '\n';
                        hasEntities = true;
                    } else {
                        dxf += writePolylineEntity(item, layerName);
                        hasEntities = true;
                    }
                } else if (item instanceof Path && item.segments.length > 1) {
                    dxf += writePolylineEntity(item, layerName);
                    hasEntities = true;
                }
            });
        }
        dxf += '0\nENDSEC\n';
        dxf += '0\nEOF\n';
        return hasEntities ? dxf : null;
    }

                showModal({
                    title: 'Los archivos DWG no se pueden abrir directamente',
                    body: `DWG es el formato binario propietario de Autodesk y no puede leerse desde el navegador sin las librerías oficiales de Autodesk.<br><br>Para importar <b>${file.name}</b>, expórtalo primero como <code>.dxf</code> desde AutoCAD (o con una herramienta gratuita como <code>ODA File Converter</code>) y vuelve a importarlo aquí — DXF sí se abre directamente.`,
                    buttons: [{ label: 'Entendido', primary: true }]
                });
            } else {
                importDXF(file);
            }
        }
        e.target.value = '';
    });
    document.getElementById('ribbon-export').addEventListener('click', exportDXF);
    document.getElementById('qa-save').addEventListener('click', exportDXF);
    document.getElementById('qa-undo').addEventListener('click', undo);
    document.getElementById('qa-redo').addEventListener('click', redo);

    // ═══════════════════════════════════════════════════════════════
    // [34] LÍNEA DE COMANDOS + HISTÓRICO F2
    // ═══════════════════════════════════════════════════════════════
    const cmdInputEl = document.getElementById('cmd-input');

    function toggleCmdHistory() {
        const panel = document.getElementById('cmd-history-panel');
        const btn = document.getElementById('cmd-history-toggle');
        const open = panel.classList.toggle('open');
        btn.classList.toggle('active', open);
        if (open) renderCmdHistory();
    }
    document.getElementById('cmd-history-toggle').addEventListener('click', toggleCmdHistory);
    document.getElementById('cmd-history-close').addEventListener('click', toggleCmdHistory);

    function togglePanel(panelId, btnId) {
        const panel = document.getElementById(panelId);
        const btn = document.getElementById(btnId);
        const hidden = panel.style.display === 'none';
        panel.style.display = hidden ? '' : 'none';
        btn.classList.toggle('active', hidden);
    }
    document.getElementById('btn-layers-panel-toggle').addEventListener('click', () => {
        togglePanel('layer-panel', 'btn-layers-panel-toggle');
    });
    document.getElementById('btn-properties-panel-toggle').addEventListener('click', () => {
        togglePanel('properties-panel', 'btn-properties-panel-toggle');
    });

    cmdInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const input = cmdInputEl.value.trim();
            if (!input && state.pendingCommand) { finalizePendingSelection(); cmdInputEl.value = ''; e.preventDefault(); return; }
            if (!input && state.currentCommand === 'LINE' && state.expectingPoint && state.collectedPoints.length >= 2) {
                setPrompt('LINE finalizado'); resetStateCmd(); cmdInputEl.value = ''; e.preventDefault(); return;
            }
            if (input.toUpperCase() === 'C' && state.currentCommand === 'LINE' && state.expectingPoint && state.collectedPoints.length >= 2) {
                saveState();
                const last = state.collectedPoints[state.collectedPoints.length - 1];
                const first = state.collectedPoints[0];
                const closeLine = new Path.Line(last, first);
                closeLine.strokeColor = 'white';
                closeLine.strokeWidth = currentStrokeWidth();
                tagShape(closeLine, 'line');
                activeLayer.addChild(closeLine);
                setPrompt('LINE cerrado');
                resetStateCmd(); cmdInputEl.value = ''; e.preventDefault(); return;
            }
            if (input.toUpperCase() === 'U' && state.currentCommand === 'LINE' && state.expectingPoint && state.lineSegmentPaths.length > 0) {
                const lastPath = state.lineSegmentPaths.pop();
                lastPath.remove();
                state.collectedPoints.pop();
                invalidateSnapCache();
                state.history.pop();
                state.dynamicLastPoint = state.collectedPoints[state.collectedPoints.length - 1];
                setPrompt('LINE: Último tramo deshecho. Siguiente punto (U para seguir deshaciendo)');
                cmdInputEl.value = ''; e.preventDefault(); return;
            }
            if (input.toUpperCase() === 'D' && state.currentCommand === 'CIRCLE' && state.step === 2) {
                state.circleDiameterMode = true;
                setPrompt('CIRCLE: Diámetro');
                cmdInputEl.value = ''; e.preventDefault(); return;
            }
            if (!input && state.currentCommand && !state.expectingPoint &&
                (state.currentCommand === 'TRIM' || state.currentCommand === 'EXTEND')) {
                setPrompt(`${state.currentCommand} finalizado`);
                resetStateCmd(); cmdInputEl.value = ''; e.preventDefault(); return;
            }
            if (!input && state.currentCommand === 'COPY' && state.step === 2) {
                setPrompt('COPY finalizado'); resetStateCmd(); cmdInputEl.value = ''; e.preventDefault(); return;
            }
            if (!input && state.currentCommand === 'OFFSET' && state.step >= 2) {
                setPrompt('OFFSET finalizado'); resetStateCmd(); cmdInputEl.value = ''; e.preventDefault(); return;
            }
            if (input) {
                state.commandHistory.push(input);
                state.historyIdx = state.commandHistory.length;
                if (state.waitingForNumber) {
                    const dist = parseFloat(input);
                    if (!isNaN(dist) && dist > 0) {
                        state.offsetDistance = dist;
                        state.waitingForNumber = false;
                        state.step = 2;
                        setPrompt(`OFFSET: Distancia ${dist}. Selecciona objeto a desplazar (Enter/ESC para salir)`);
                        state.expectingPoint = false;
                    } else {
                        setPrompt('Distancia inválida. Introduce un número positivo.');
                    }
                    cmdInputEl.value = ''; e.preventDefault(); return;
                }
                if (state.currentCommand === 'ROTATE' && state.step === 2) {
                    const ang = parseFloat(input);
                    if (!isNaN(ang)) {
                        saveState();
                        state.selectedItems.forEach(i => i.rotate(-ang, state.basePoint)); // -ang: CCW positivo
                        resetStateCmd();
                        previewLayer.removeChildren();
                        const dt = document.getElementById('dynamic-tooltip');
                        if (dt) dt.style.display = 'none';
                        setPrompt(`Rotado ${ang}° (CCW)`);
                    } else setPrompt('Ángulo inválido. Introduce un número en grados.');
                    cmdInputEl.value = ''; e.preventDefault(); return;
                }
                if (state.currentCommand === 'SCALE' && state.step === 2) {
                    const sf = parseFloat(input);
                    if (!isNaN(sf) && sf > 0) {
                        saveState();
                        state.selectedItems.forEach(i => i.scale(sf, state.basePoint));
                        resetStateCmd();
                        previewLayer.removeChildren();
                        const dt = document.getElementById('dynamic-tooltip');
                        if (dt) dt.style.display = 'none';
                        setPrompt(`Escalado x${sf}`);
                    } else setPrompt('Factor de escala inválido. Introduce un número positivo.');
                    cmdInputEl.value = ''; e.preventDefault(); return;
                }
                if (state.currentCommand && state.expectingPoint) {
                    const pt = parseDynamicInput(input, state.dynamicLastPoint);
                    if (pt) handlePointInput(pt);
                    else setPrompt('Entrada no válida. Usa: X,Y  |  @dX,dY  |  @dist<ángulo  |  distancia');
                } else {
                    executeCommand(input);
                }
            }
            cmdInputEl.value = '';
            e.preventDefault();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (state.commandHistory.length > 0) {
                if (state.historyIdx > 0) state.historyIdx--;
                cmdInputEl.value = state.commandHistory[state.historyIdx] || '';
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (state.commandHistory.length > 0) {
                if (state.historyIdx < state.commandHistory.length - 1) state.historyIdx++;
                cmdInputEl.value = state.commandHistory[state.historyIdx] || '';
            }
        } else if (e.key === 'Escape') {
            const wasGathering = !!state.pendingCommand;
            resetStateCmd();
            if (wasGathering) clearSelection();
            previewLayer.removeChildren();
            const dt = document.getElementById('dynamic-tooltip');
            if (dt) dt.style.display = 'none';
            setPrompt('Comando cancelado');
        }
    });

    // ═══════════════════════════════════════════════════════════════
    // [35] ATAJOS DE TECLADO GLOBALES
    // ═══════════════════════════════════════════════════════════════
    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
        if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
        if (e.ctrlKey && e.key === 'n') { e.preventDefault(); document.getElementById('qa-new').click(); }
        if (e.key === 'F3')  { e.preventDefault(); setOsnap(!state.snapEnabled); }
        if (e.key === 'F8')  { e.preventDefault(); setOrtho(!state.ortho); }
        if (e.key === 'F10') { e.preventDefault(); setPolar(!state.polar); }
        if (e.key === 'F7')  { e.preventDefault(); document.getElementById('grid-toggle').click(); }
        if (e.key === 'F2')  { e.preventDefault(); toggleCmdHistory(); }
        if (e.ctrlKey && e.key === '1') { e.preventDefault(); document.getElementById('btn-properties-panel-toggle').click(); }
        if (e.ctrlKey && e.key === '2') { e.preventDefault(); document.getElementById('btn-layers-panel-toggle').click(); }
        if ((e.key === 'Delete' || e.key === 'Del') && state.selectedItems.length) {
            saveState();
            state.selectedItems.forEach(i => i.remove());
            clearSelection();
            setPrompt('Objetos borrados');
            updateProperties();
            if (document.activeElement === cmdInputEl) e.preventDefault();
        }
        if (e.key === 'Escape' && state.pickingPrintWindow) {
            state.pickingPrintWindow = false;
            state.printPickStart = null;
            state.printPickRect = null;
            selectionLayer.removeChildren();
            setPrompt('Impresión cancelada');
        }
        if (e.key === 'Escape' && state.currentCommand) {
            const wasGathering = !!state.pendingCommand;
            resetStateCmd();
            if (wasGathering) clearSelection();
            previewLayer.removeChildren();
            const dt = document.getElementById('dynamic-tooltip');
            if (dt) dt.style.display = 'none';
            setPrompt('Comando cancelado');
        }

        const active = document.activeElement;
        const alreadyTyping = active && active !== document.body &&
            (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
        if (!alreadyTyping && !e.ctrlKey && !e.metaKey && !e.altKey) {
            if ((e.key === 'Enter' || e.key === ' ') && !state.currentCommand) {
                if (state.lastCommand) { e.preventDefault(); executeCommand(state.lastCommand); }
            } else if ((e.key === 'Enter' || e.key === ' ') && state.pendingCommand) {
                e.preventDefault(); finalizePendingSelection();
            } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand === 'LINE' &&
                state.expectingPoint && state.collectedPoints.length >= 2) {
                e.preventDefault(); setPrompt('LINE finalizado'); resetStateCmd();
            } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand && !state.expectingPoint &&
                (state.currentCommand === 'TRIM' || state.currentCommand === 'EXTEND')) {
                e.preventDefault(); setPrompt(`${state.currentCommand} finalizado`); resetStateCmd();
            } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand === 'COPY' && state.step === 2) {
                e.preventDefault(); setPrompt('COPY finalizado'); resetStateCmd();
            } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand === 'OFFSET' && state.step >= 2) {
                e.preventDefault(); setPrompt('OFFSET finalizado'); resetStateCmd();
            } else if (/^[a-zA-Z0-9@.,\-<]$/.test(e.key)) {
                e.preventDefault();
                cmdInputEl.focus();
                cmdInputEl.value += e.key;
            }
        }
        if (e.key === 'Shift' && !state.shiftKeyDown) {
            state.shiftKeyDown = true;
            refreshActivePreview();
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'Shift') {
            state.shiftKeyDown = false;
            refreshActivePreview();
        }
    });
    function refreshActivePreview() {
        if (!state.currentCommand && !state.isDragging) return;
        const fakeEvent = { point: state.lastMousePoint, event: { clientX: state.lastClientX || 0, clientY: state.lastClientY || 0 } };
        if (state.isDragging) onMouseDrag(fakeEvent);
        else onMouseMove(fakeEvent);
    }

    // ═══════════════════════════════════════════════════════════════
    // [36] MENÚ CONTEXTUAL (clic derecho)
    // ═══════════════════════════════════════════════════════════════
    document.getElementById('canvas-container').addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openContextMenu(e.clientX, e.clientY);
    });
    function openContextMenu(x, y) {
        const menu = document.getElementById('context-menu');
        const hasSelection = state.selectedItems.length > 0;
        const inCommand = !!state.currentCommand;
        const items = [];
        if (inCommand) {
            items.push({ label: 'Intro', key: 'Enter', action: () => cmdInputEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })) });
            items.push({ label: 'Cancelar', key: 'Esc', action: cancelCurrentCommand });
            items.push({ sep: true });
        } else {
            items.push({ label: 'Repetir último comando', key: 'Enter', disabled: !state.lastCommand, action: () => state.lastCommand && executeCommand(state.lastCommand) });
            items.push({ sep: true });
        }
        if (!inCommand) {
            items.push({ label: 'Deshacer', key: 'Ctrl+Z', disabled: !state.history.length, action: undo });
            items.push({ label: 'Rehacer', key: 'Ctrl+Y', disabled: !state.redoStack.length, action: redo });
            items.push({ sep: true });
        }
        if (hasSelection && !inCommand) {
            items.push({ label: 'Mover',    key: 'M',  action: () => executeCommand('MOVE') });
            items.push({ label: 'Copiar',   key: 'CO', action: () => executeCommand('COPY') });
            items.push({ label: 'Rotar',    key: 'RO', action: () => executeCommand('ROTATE') });
            items.push({ label: 'Simetría', key: 'MI', action: () => executeCommand('MIRROR') });
            items.push({ label: 'Borrar',   key: 'Supr', action: () => { saveState(); state.selectedItems.forEach(i => i.remove()); clearSelection(); setPrompt('Objetos eliminados'); } });
            items.push({ sep: true });
            items.push({ label: 'Propiedades', action: () => document.getElementById('properties-panel').scrollIntoView({ block: 'nearest' }) });
            items.push({ label: 'Deseleccionar todo', key: 'Esc', action: clearSelection });
        } else if (!inCommand) {
            items.push({ label: 'Seleccionar todo', key: 'Ctrl+A', action: selectAllItems });
        }
        menu.innerHTML = '';
        items.forEach(it => {
            if (it.sep) {
                const sep = document.createElement('div');
                sep.className = 'cm-sep';
                menu.appendChild(sep);
                return;
            }
            const row = document.createElement('div');
            row.className = 'cm-item' + (it.disabled ? ' disabled' : '');
            row.innerHTML = `<span>${it.label}</span>${it.key ? `<span class="cm-key">${it.key}</span>` : ''}`;
            if (!it.disabled) row.addEventListener('click', () => { closeContextMenu(); it.action(); });
            menu.appendChild(row);
        });
        menu.style.display = 'block';
        const rect = menu.getBoundingClientRect();
        const maxX = window.innerWidth - rect.width - 6;
        const maxY = window.innerHeight - rect.height - 6;
        menu.style.left = Math.min(x, maxX) + 'px';
        menu.style.top = Math.min(y, maxY) + 'px';
    }
    function closeContextMenu() {
        document.getElementById('context-menu').style.display = 'none';
    }

    // ═══════════════════════════════════════════════════════════════
    // [37] NUEVO DIBUJO Y MODAL GENÉRICO
    // ═══════════════════════════════════════════════════════════════
    function newDrawing() {
        resetStateCmd();
        clearSelection();
        for (let internal in layers) {
            if (internal === '0') { layers[internal].removeChildren(); continue; }
            layers[internal].remove();
            delete layers[internal];
        }
        activeLayer = layers['0'];
        project.activeLayer = activeLayer;
        activeLayer.visible = true;
        activeLayer.data.visible = true;
        activeLayer.data.locked = false;
        activeLayer.data.color = '#FFFFFF';
        state.history = [];
        state.redoStack = [];
        invalidateSnapCache();
        view.zoom = 1;
        view.center = new Point(0, 0);
        drawGrid(); refreshStrokeWidths(); renderLayerList(); renderGrips(); updateProperties();
        setPrompt('Dibujo nuevo. Listo.');
        view.update();
    }
    document.getElementById('qa-new').addEventListener('click', () => {
        showModal({
            title: 'Nuevo dibujo',
            body: 'Se borrará todo el dibujo actual y no se podrá deshacer. ¿Quieres continuar?',
            buttons: [
                { label: 'Cancelar' },
                { label: 'Crear nuevo', primary: true, onClick: newDrawing }
            ]
        });
    });
    function showModal({ title, body, buttons }) {
        document.getElementById('app-modal-title').textContent = title;
        document.getElementById('app-modal-body').innerHTML = body;
        const actions = document.getElementById('app-modal-actions');
        actions.innerHTML = '';
        buttons.forEach(b => {
            const btn = document.createElement('button');
            btn.textContent = b.label;
            if (b.primary) btn.classList.add('primary');
            btn.addEventListener('click', () => { closeModal(); if (b.onClick) b.onClick(); });
            actions.appendChild(btn);
        });
        document.getElementById('app-modal-overlay').classList.add('open');
    }
    function closeModal() {
        document.getElementById('app-modal-overlay').classList.remove('open');
    }
    document.getElementById('app-modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'app-modal-overlay') closeModal();
    });

    function cancelCurrentCommand() {
        resetStateCmd();
        previewLayer.removeChildren();
        const dt = document.getElementById('dynamic-tooltip');
        if (dt) dt.style.display = 'none';
        setPrompt('Comando cancelado');
    }
    function selectAllItems() {
        clearSelection();
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer ||
                layer === selectionLayer || layer === previewLayer || layer === gripLayer) continue;
            if (!layer.data.visible || layer.data.locked) continue;
            layer.children.forEach(item => addToSelection(item, true));
        }
        updateProperties();
        renderGrips();
        refreshSelectionHighlight();
        setPrompt(`${state.selectedItems.length} objeto(s) seleccionados`);
    }

    window.addEventListener('click', (e) => {
        if (!e.target.closest('#context-menu')) closeContextMenu();
    });
    window.addEventListener('blur', closeContextMenu);

    // ═══════════════════════════════════════════════════════════════
    // [38] CROSSHAIR estilo AutoCAD
    // ═══════════════════════════════════════════════════════════════
    const crosshair = document.createElement('div');
    crosshair.className = 'crosshair';
    crosshair.style.display = 'none';
    crosshair.innerHTML = `
        <div class="crosshair-line h"></div>
        <div class="crosshair-line v"></div>
        <div class="crosshair-box"></div>
    `;
    document.body.appendChild(crosshair);
    const chH = crosshair.querySelector('.crosshair-line.h');
    const chV = crosshair.querySelector('.crosshair-line.v');
    const chBox = crosshair.querySelector('.crosshair-box');
    document.getElementById('canvas-container').addEventListener('mouseenter', () => { crosshair.style.display = 'block'; });
    document.getElementById('canvas-container').addEventListener('mouseleave', () => { crosshair.style.display = 'none'; });
    document.addEventListener('mousemove', (e) => {
        chH.style.top = e.clientY + 'px';

    // ═══════════════════════════════════════════════════════════════
    // [39] MINI MAPA (navigator)
    // ═══════════════════════════════════════════════════════════════
    const navBtn = document.getElementById('qa-navigator');
    const navContainer = document.getElementById('navigator');
    const navCanvas = document.getElementById('navCanvas');
    function toggleNavigator() {
        navContainer.classList.toggle('visible');
        document.getElementById('btn-navigator-toggle').classList.toggle('active', navContainer.classList.contains('visible'));
        if (navContainer.classList.contains('visible')) updateNavigator();
    }
    navBtn.addEventListener('click', toggleNavigator);
    document.getElementById('btn-navigator-toggle').addEventListener('click', toggleNavigator);
    function updateNavigator() {
        const ctx = navCanvas.getContext('2d');
        navCanvas.width = 150; navCanvas.height = 120;
        ctx.clearRect(0, 0, 150, 120);
        const bounds = getCurrentDrawingBounds();
        if (!bounds) {
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, 150, 120);
            return;
        }
        const scaleX = 150 / bounds.width;
        const scaleY = 120 / bounds.height;
        const scale = Math.min(scaleX, scaleY);
        const offsetX = (150 - bounds.width * scale) / 2 - bounds.left * scale;
        const offsetY = (120 - bounds.height * scale) / 2 - bounds.top * scale;
        ctx.fillStyle = '#1E1E1E';
        ctx.fillRect(0, 0, 150, 120);
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                layer === previewLayer || layer === gripLayer) continue;
            layer.children.forEach(item => {
                if (isLineItem(item)) {
                    const p1 = item.segments[0].point, p2 = item.segments[1].point;
                    ctx.beginPath();
                    ctx.moveTo(p1.x * scale + offsetX, p1.y * scale + offsetY);
                    ctx.lineTo(p2.x * scale + offsetX, p2.y * scale + offsetY);
                    ctx.stroke();
                } else if (isCircleItem(item)) {
                    const c = item.position;
                    ctx.beginPath();
                    ctx.arc(c.x * scale + offsetX, c.y * scale + offsetY, getCircleRadius(item) * scale, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (item instanceof Path && item.segments && item.segments.length > 1) {
                    ctx.beginPath();
                    item.segments.forEach((s, idx) => {
                        const x = s.point.x * scale + offsetX;
                        const y = s.point.y * scale + offsetY;
                        if (idx === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    if (item.closed) ctx.closePath();
                    ctx.stroke();
                }
            });
        }
        const vx = view.center.x - view.size.width / 2 / view.zoom;
        const vy = view.center.y - view.size.height / 2 / view.zoom;
        const vw = view.size.width / view.zoom;
        const vh = view.size.height / view.zoom;
        ctx.strokeStyle = '#00BFFF';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(vx * scale + offsetX, vy * scale + offsetY, vw * scale, vh * scale);
    }
    view.on('change', () => {
        if (navContainer.classList.contains('visible')) updateNavigator();
    });

        dt.style.pointerEvents = 'none';

        dt.style.color = '#4FC3F7';
        dt.style.padding = '3px 9px';

    // ═══════════════════════════════════════════════════════════════
    // [41] REDIMENSIONADO ROBUSTO
    // ═══════════════════════════════════════════════════════════════
    let resizeRAF = null;
    function syncViewSize() {
        const container = document.getElementById('canvas-container');
        const w = container.clientWidth;
        const h = container.clientHeight;
        if (w <= 0 || h <= 0) return;
        if (view.viewSize.width === w && view.viewSize.height === h) return;
        const center = view.center;
        const zoom = view.zoom;
        view.viewSize = new paper.Size(w, h);
        view.center = center;
        view.zoom = zoom;
        drawGrid();
        view.update();
    }
    const canvasContainerEl = document.getElementById('canvas-container');
    if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
            if (resizeRAF) cancelAnimationFrame(resizeRAF);
            resizeRAF = requestAnimationFrame(syncViewSize);
        });
        ro.observe(canvasContainerEl);
    }
    window.addEventListener('resize', syncViewSize);
    const propertiesPanelEl = document.getElementById('properties-panel');
    if (window.MutationObserver) {
        const mo = new MutationObserver(() => { requestAnimationFrame(syncViewSize); });
        mo.observe(propertiesPanelEl, { attributes: true, attributeFilter: ['class'] });
    }
