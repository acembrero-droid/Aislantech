    <!-- ═══════════════════════════════════════════════════════════
         SECCIÓN: Librería Paper.js
         ═══════════════════════════════════════════════════════════ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <script>
    /* ================================================================
       CAD Pro – Script principal
       Convenio de ejes:
         · Internamente paper.js usa Y hacia ABAJO.
         · De cara al usuario, Y+ = ARRIBA (convenio AutoCAD / matemático).
         · Todo lo que se MUESTRA o se INTRODUCE al usuario pasa por ±.
         · Snaps, grips, geometría interna y DXF no cambian.
       ================================================================ */

    // ═══════════════════════════════════════════════════════════════
    // [1] SETUP PAPER.JS
    // ═══════════════════════════════════════════════════════════════
    paper.setup('myCanvas');
    paper.settings.handleSize = 7;
    const { project, view, Path, Point, Group, Layer, Rectangle, Color, PointText, Size } = paper;
    project.selectedColor = new Color(0.31, 0.76, 0.97);

    // ═══════════════════════════════════════════════════════════════
    // [2] CAPAS (usuario + utilidades)
    // ═══════════════════════════════════════════════════════════════
    const layers = {};

    function safeName(original) {
        let name = original.replace(/[^a-zA-Z0-9_\-]/g, '_');
        if (/^\d/.test(name)) name = 'L_' + name;
        return name;
    }

    function createLayer(originalName, color = '#FFFFFF') {
        const internal = safeName(originalName);
        if (layers[internal]) return layers[internal];
        const layer = new Layer();
        layer.name = internal;
        layer.data = { originalName: internal, visible: true, locked: false, color: color };
        project.addLayer(layer);
        layers[internal] = layer;
        return layer;
    }
    const defaultLayer = createLayer('0', '#FFFFFF');

    const gridLayer      = new Layer(); gridLayer.name = 'grid';        project.addLayer(gridLayer); gridLayer.sendToBack();
    const guideLayer     = new Layer(); guideLayer.name = 'guides';     project.addLayer(guideLayer);
    const snapLayer      = new Layer(); snapLayer.name = 'snaps';       project.addLayer(snapLayer);
    const selectionLayer = new Layer(); selectionLayer.name = 'selection'; project.addLayer(selectionLayer);
    const previewLayer   = new Layer(); previewLayer.name = 'preview';  project.addLayer(previewLayer);
    const gripLayer      = new Layer(); gripLayer.name = 'grips';       project.addLayer(gripLayer);

    let activeLayer = defaultLayer;
    project.activeLayer = activeLayer;

    // ═══════════════════════════════════════════════════════════════
    // [3] TIPOS DE ENTIDAD Y HELPERS DE GEOMETRÍA
    // ═══════════════════════════════════════════════════════════════
    function isLineItem(item)     { return !!(item && item.data && item.data.shapeType === 'line'); }
    function isCircleItem(item)   { return !!(item && item.data && item.data.shapeType === 'circle'); }
    function isPolylineItem(item) { return !!(item && item.data && item.data.shapeType === 'polyline'); }
    function isArcItem(item)      { return !!(item && item.data && item.data.shapeType === 'arc'); }
    function tagShape(item, shapeType) {
        if (!item.data) item.data = {};
        item.data.shapeType = shapeType;
        return item;
    }

    function getCircleRadius(item) {
        if (item && item.data && typeof item.data.radius === 'number') return item.data.radius;
        return item && item.bounds ? item.bounds.width / 2 : 0;
    }
    function resizeCircle(item, newRadius) {
        if (newRadius <= 0) return item;
        const wasSelected = state.selectedItems.includes(item);
        const newCircle = new Path.Circle(item.position, newRadius);
        newCircle.data = Object.assign({}, item.data, { radius: newRadius });
        newCircle.strokeColor = item.strokeColor;
        newCircle.strokeWidth = item.strokeWidth;
        newCircle.fillColor = item.fillColor;
        item.parent.insertChild(item.index, newCircle);
        item.remove();
        if (wasSelected) {
            state.selectedItems = state.selectedItems.map(i => i === item ? newCircle : i);
            newCircle.selected = true;
            newCircle.shadowColor = new Color('#00BFFF');
            newCircle.shadowBlur = 8;
            newCircle.shadowOffset = new Point(0, 0);
        }
        return newCircle;
    }

    // Matriz de reflexión respecto a la recta p1→p2 (para MIRROR)
    function reflectMatrix(p1, p2) {
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len2 = dx * dx + dy * dy;
        if (len2 < 1e-12) return new paper.Matrix(1, 0, 0, 1, 0, 0);
        const inv = 1 / Math.sqrt(len2);
        const ux = dx * inv;
        const uy = dy * inv;
        const a = 2 * ux * ux - 1;
        const b = 2 * ux * uy;
        const c = 2 * ux * uy;
        const d = 2 * uy * uy - 1;
        const tx = p1.x - a * p1.x - c * p1.y;
        const ty = p1.y - b * p1.x - d * p1.y;
        return new paper.Matrix(a, b, c, d, tx, ty);
    }

    // ═══════════════════════════════════════════════════════════════
    // [4] ESTADO GLOBAL
    // ═══════════════════════════════════════════════════════════════
    const state = {
        currentCommand: null, step: 0, collectedPoints: [], selectedItems: [],
        basePoint: null, originalPositions: [], dragStartPoint: null,
        isDragging: false, hasMoved: false, selecting: false, selectionRect: null,
        selectStartPoint: null, selectMode: 'window', ortho: false, polar: false,
        polarIncrement: 15, lwt: false, snapEnabled: true,
        lastMousePoint: new Point(0, 0), expectingPoint: false, dynamicLastPoint: null,
        panning: false, panStartPoint: null, commandHistory: [], historyIdx: -1,
        cmdLog: [], gridVisible: true, history: [], redoStack: [],
        trimBoundary: null, extendBoundary: null, startAngle: 0, referencePoint: null,
        waitingForNumber: false, offsetDistance: 0, offsetTarget: null, offsetSide: null,
        lastCommand: null, shiftKeyDown: false, trackGuides: null, pendingCommand: null,
        copySourceItems: [], gripDrag: null, gripDragStart: null, gripOriginalSegments: null,
        hoveredItem: null, acquiredPoints: [], trackHoverPoint: null,
        pickingPrintWindow: false, printPickStart: null, printPickRect: null,
        circleDiameterMode: false, lineSegmentPaths: [],
        lastClientX: 0, lastClientY: 0,
    };
    let trackHoverTimer = null;
    const TRACK_ACQUIRE_DELAY = 650;

    // ═══════════════════════════════════════════════════════════════
    // [5] GROSOR DE LÍNEA CONSTANTE EN PANTALLA
    // ═══════════════════════════════════════════════════════════════
    const LINE_WEIGHT_PX = 1.3;
    const LWT_WEIGHT_MULTIPLIER = 2.4;
    function currentStrokeWidth() {
        return (LINE_WEIGHT_PX * (state.lwt ? LWT_WEIGHT_MULTIPLIER : 1)) / view.zoom;
    }
    function refreshStrokeWidths() {
        const w = currentStrokeWidth();
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer ||
                layer === selectionLayer || layer === previewLayer || layer === gripLayer) continue;
            layer.children.forEach(item => { item.strokeWidth = w; });
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // [6] UI – RIBBON, FLYOUT, COMBO DE CAPAS
    // ═══════════════════════════════════════════════════════════════
    document.querySelectorAll('#ribbon-tabs button').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('#ribbon-tabs button').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const tabName = tab.dataset.tab;
            document.querySelectorAll('.ribbon-group').forEach(g => {
                g.style.display = (g.dataset.tab === tabName) ? 'flex' : 'none';
            });
        });
    });

    document.querySelectorAll('.ribbon-btn[data-cmd]').forEach(btn => {
        btn.addEventListener('click', () => {
            const cmd = btn.dataset.cmd;
            if (cmd === 'TRIM' || cmd === 'EXTEND') {
                if (!state.selectedItems.length) { setPrompt('Selecciona un objeto como límite'); return; }
            }
            if (cmd === 'JOIN') {
                if (!state.selectedItems.length || state.selectedItems.length < 2) {
                    setPrompt('Selecciona al menos dos líneas/polilíneas'); return;
                }
            }
            executeCommand(cmd);
            document.querySelectorAll('.ribbon-btn[data-cmd]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    const moreModifyBtn  = document.getElementById('ribbon-more-modify');
    const moreModifyMenu = document.getElementById('ribbon-more-modify-menu');
    if (moreModifyBtn && moreModifyMenu) {
        moreModifyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = moreModifyMenu.classList.toggle('open');
            moreModifyBtn.classList.toggle('active', isOpen);
        });
        moreModifyMenu.querySelectorAll('[data-cmd]').forEach(opt => {
            opt.addEventListener('click', () => {
                moreModifyMenu.classList.remove('open');
                moreModifyBtn.classList.remove('active');
                executeCommand(opt.dataset.cmd);
            });
        });
        document.addEventListener('click', () => {
            moreModifyMenu.classList.remove('open');
            moreModifyBtn.classList.remove('active');
        });
    }

    const layerDropdownBtn = document.getElementById('layer-dropdown');
    const layerComboMenu   = document.getElementById('layer-combo-menu');
    layerDropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        layerComboMenu.classList.toggle('open');
    });
    layerComboMenu.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => { layerComboMenu.classList.remove('open'); });

    // ═══════════════════════════════════════════════════════════════
    // [7] PANEL DE CAPAS
    // ═══════════════════════════════════════════════════════════════
    function renderLayerList() {
        const list = document.getElementById('layer-list');
        list.innerHTML = '';
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                layer === previewLayer || layer === gripLayer) continue;
            const li = document.createElement('li');
            if (layer === activeLayer) li.classList.add('active');
            if (!layer.data.visible) li.style.opacity = '0.4';
            const color = layer.data.color || '#FFFFFF';
            li.innerHTML = `
                <span class="color-swatch" style="background:${color}" data-internal="${internal}"></span>
                <span class="layer-name">${layer.data.originalName}</span>
                <span class="layer-controls">
                    <button class="vis-toggle" title="Visibilidad">${layer.data.visible ? '👁' : '🚫'}</button>
                    <button class="lock-toggle" title="Bloquear">${layer.data.locked ? '🔒' : '🔓'}</button>
                </span>
            `;
            li.addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('.color-swatch')) return;
                setActiveLayer(internal);
            });
            const swatch = li.querySelector('.color-swatch');
            swatch.addEventListener('click', (e) => {
                e.stopPropagation();
                const picker = document.getElementById('color-picker-hidden');
                picker.value = layer.data.color || '#FFFFFF';
                picker.style.display = 'block';
                picker.focus();
                picker.click();
                picker.oninput = () => {
                    layer.data.color = picker.value;
                    swatch.style.background = picker.value;
                    renderLayerList();
                };
                picker.onblur = () => {
                    picker.style.display = 'none';
                    picker.oninput = null;
                };
            });
            li.querySelector('.vis-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleLayerVisibility(internal);
            });
            li.querySelector('.lock-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleLayerLock(internal);
            });
            list.appendChild(li);
        }
        document.getElementById('current-layer-name').textContent = activeLayer.data.originalName;
        document.getElementById('current-layer-swatch').style.background = activeLayer.data.color || '#FFFFFF';
        renderLayerCombo();
        updateLayerSelect();
    }

    function renderLayerCombo() {
        const menu = document.getElementById('layer-combo-menu');
        menu.innerHTML = '';
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                layer === previewLayer || layer === gripLayer) continue;
            const btn = document.createElement('button');
            btn.className = 'lcm-item' + (layer === activeLayer ? ' active' : '');
            const color = layer.data.color || '#FFFFFF';
            btn.innerHTML = `<span class="lcm-swatch" style="background:${color}"></span><span>${layer.data.originalName}</span>`;
            btn.addEventListener('click', () => {
                setActiveLayer(internal);
                document.getElementById('layer-combo-menu').classList.remove('open');
            });
            menu.appendChild(btn);
        }
    }

    function setActiveLayer(internal) {
        if (layers[internal]) {
            activeLayer = layers[internal];
            project.activeLayer = activeLayer;
            renderLayerList();
            updateProperties();
        }
    }
    function toggleLayerVisibility(internal) {
        const l = layers[internal];
        l.data.visible = !l.data.visible;
        l.visible = l.data.visible;
        invalidateSnapCache();
        renderLayerList();
    }
    function toggleLayerLock(internal) {
        const l = layers[internal];
        l.data.locked = !l.data.locked;
        invalidateSnapCache();
        renderLayerList();
    }

    document.getElementById('add-layer-btn').addEventListener('click', () => {
        const name = prompt('Nombre de la nueva capa:');
        if (name) {
            const safe = safeName(name);
            if (!layers[safe]) {
                const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6', '#FF9F43', '#00D2D3', '#54A0FF'];
                const col = colors[Object.keys(layers).length % colors.length];
                createLayer(safe, col);
                setActiveLayer(safe);
                renderLayerList();
            } else alert('La capa ya existe');
        }
    });

    // ═══════════════════════════════════════════════════════════════
    // [8] PANEL DE PROPIEDADES
    //     · Cambio de capa FUNCIONA (usa newLayer.addChild).
    //     · Coordenadas Y mostradas/aceptadas en Y-usuario (Y+ = arriba).
    // ═══════════════════════════════════════════════════════════════
    function updateProperties() {
        const panel = document.getElementById('properties-panel');
        const sel = state.selectedItems;
        if (sel.length === 0) { panel.classList.remove('visible'); return; }
        panel.classList.add('visible');
        const item = sel[0];
        const container = document.getElementById('props-content');
        container.innerHTML = '';

        // ── Capa ──
        const layerRow = document.createElement('div');
        layerRow.className = 'prop-row';
        layerRow.innerHTML = `<span class="prop-label">Capa</span>`;
        const layerSelect = document.createElement('select');
        layerSelect.className = 'prop-value';
        for (let internal in layers) {
            const l = layers[internal];
            if (l === gridLayer || l === guideLayer || l === snapLayer || l === selectionLayer || l === previewLayer || l === gripLayer) continue;
            const opt = document.createElement('option');
            opt.value = internal;
            opt.textContent = l.data.originalName;
            if (item.layer && item.layer.name === internal) opt.selected = true;
            layerSelect.appendChild(opt);
        }
        layerSelect.addEventListener('change', (e) => {
            const newLayer = layers[e.target.value];
            if (!newLayer) return;
            if (newLayer.data.locked) {
                setPrompt('Capa bloqueada. Desbloquéala primero.');
                updateProperties();
                return;
            }
            saveState();
            // En paper.js, item.layer es de SOLO LECTURA. Hay que usar addChild().
            state.selectedItems.forEach(it => {
                if (it.layer !== newLayer) newLayer.addChild(it);
            });
            invalidateSnapCache();
            renderLayerList();
            updateProperties();
            renderGrips();
            view.update();
            setPrompt(`${state.selectedItems.length} objeto(s) movido(s) a capa "${newLayer.data.originalName}"`);
        });
        layerRow.appendChild(layerSelect);
        container.appendChild(layerRow);

        // ── Color ──
        const colorRow = document.createElement('div');
        colorRow.className = 'prop-row';
        colorRow.innerHTML = `<span class="prop-label">Color</span>`;
        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.className = 'prop-value';
        colorInput.value = item.strokeColor ? item.strokeColor.toCSS(true) : '#FFFFFF';
        colorInput.addEventListener('input', (e) => {
            saveState();
            state.selectedItems.forEach(it => { it.strokeColor = new Color(e.target.value); });
            updateProperties();
        });
        colorRow.appendChild(colorInput);
        container.appendChild(colorRow);

        // ── Tipo ──
        let type = 'Desconocido';
        if (isLineItem(item)) type = 'Línea';
        else if (isCircleItem(item)) type = 'Círculo';
        else if (isArcItem(item)) type = 'Arco';
        else if (item instanceof Path) type = 'Polilínea';
        const typeRow = document.createElement('div');
        typeRow.className = 'prop-row';
        typeRow.innerHTML = `<span class="prop-label">Tipo</span><span class="prop-value">${type}</span>`;
        container.appendChild(typeRow);

        // ── Coordenadas ──
        if (isLineItem(item)) {
            const p1 = item.segments[0].point;
            const p2 = item.segments[1].point;
            const makeInput = (label, getter, setter) => {
                const row = document.createElement('div');
                row.className = 'prop-row';
                row.innerHTML = `<span class="prop-label">${label}</span>`;
                const inp = document.createElement('input');
                inp.type = 'number'; inp.step = 0.001; inp.className = 'prop-value';
                inp.value = getter();
                inp.addEventListener('change', () => {
                    const v = parseFloat(inp.value);
                    if (!isNaN(v)) { saveState(); setter(v); updateProperties(); }
                });
                row.appendChild(inp);
                container.appendChild(row);
            };
            makeInput('Inicio X', () => p1.x, v => item.segments[0].point.x = v);
            makeInput('Inicio Y', () => -p1.y, v => item.segments[0].point.y = -v);
            makeInput('Fin X',    () => p2.x, v => item.segments[1].point.x = v);
            makeInput('Fin Y',    () => -p2.y, v => item.segments[1].point.y = -v);
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const lenRow = document.createElement('div');
            lenRow.className = 'prop-row';
            lenRow.innerHTML = `<span class="prop-label">Longitud</span><span class="prop-value">${Math.sqrt(dx*dx+dy*dy).toFixed(3)}</span>`;
            container.appendChild(lenRow);
        } else if (isCircleItem(item)) {
            const c = item.position;
            const makeInput = (label, getter, setter) => {
                const row = document.createElement('div');
                row.className = 'prop-row';
                row.innerHTML = `<span class="prop-label">${label}</span>`;
                const inp = document.createElement('input');
                inp.type = 'number'; inp.step = 0.001; inp.className = 'prop-value';
                inp.value = getter();
                inp.addEventListener('change', () => {
                    const v = parseFloat(inp.value);
                    if (!isNaN(v)) { saveState(); setter(v); updateProperties(); }
                });
                row.appendChild(inp);
                container.appendChild(row);
            };
            makeInput('Centro X', () => c.x, v => item.position.x = v);
            makeInput('Centro Y', () => -c.y, v => item.position.y = -v);
            const radRow = document.createElement('div');
            radRow.className = 'prop-row';
            radRow.innerHTML = `<span class="prop-label">Radio</span>`;
            const rad = document.createElement('input');
            rad.type = 'number'; rad.step = 0.001; rad.min = 0.001; rad.className = 'prop-value';
            rad.value = getCircleRadius(item);
            rad.addEventListener('change', () => {
                const v = parseFloat(rad.value);
                if (!isNaN(v) && v > 0) { saveState(); resizeCircle(item, v); updateProperties(); renderGrips(); }
            });
            radRow.appendChild(rad);
            container.appendChild(radRow);
        }
    }

    function updateLayerSelect() {
        const selects = document.querySelectorAll('#props-content select');
        selects.forEach(sel => {
            const currentLayer = state.selectedItems[0]?.layer;
            if (currentLayer) {
                for (let opt of sel.options) {
                    if (opt.value === currentLayer.name) { opt.selected = true; break; }
                }
            }
        });
    }

    // ═══════════════════════════════════════════════════════════════
    // [9] PROMPT Y LOG DE COMANDOS
    // ═══════════════════════════════════════════════════════════════
    const promptEl = document.getElementById('cmd-prompt');
    const statusEl = document.getElementById('cmd-status');

    function setPrompt(text) {
        if (promptEl) promptEl.textContent = text + ' ';
        if (statusEl) statusEl.textContent = text;
        state.cmdLog.push(text);
        if (state.cmdLog.length > 300) state.cmdLog.shift();
        const body = document.getElementById('cmd-history-body');
        if (body && document.getElementById('cmd-history-panel').classList.contains('open')) renderCmdHistory();
    }
    function renderCmdHistory() {
        const body = document.getElementById('cmd-history-body');
        if (!body) return;
        body.innerHTML = state.cmdLog.map(l => `<div>${l.replace(/</g, '&lt;')}</div>`).join('');
        body.scrollTop = body.scrollHeight;
    }

    function resetStateCmd() {
        state.currentCommand = null;
        state.step = 0;
        state.collectedPoints = [];
        state.basePoint = null;
        state.expectingPoint = false;
        state.dynamicLastPoint = null;
        state.originalPositions = [];
        state.isDragging = false;
        state.hasMoved = false;
        state.selecting = false;
        state.trimBoundary = null;
        state.extendBoundary = null;
        state.waitingForNumber = false;
        state.offsetDistance = 0;
        highlightOffsetTarget(state.offsetTarget, false);
        state.offsetTarget = null;
        state.pendingCommand = null;
        state.copySourceItems = [];
        state.lineSegmentPaths = [];
        state.circleDiameterMode = false;
        releaseTrackPoints();
        if (state.selectionRect) { state.selectionRect.remove(); state.selectionRect = null; }
        guideLayer.removeChildren();
        selectionLayer.removeChildren();
        previewLayer.removeChildren();
        const dt = document.getElementById('dynamic-tooltip');
        if (dt) dt.style.display = 'none';
        setPrompt('Comando:');
        document.getElementById('cmd-input').value = '';
        document.querySelectorAll('.ribbon-btn[data-cmd]').forEach(b => b.classList.remove('active'));
        renderGrips();
    }

    // ═══════════════════════════════════════════════════════════════
    // [10] SELECCIÓN
    // ═══════════════════════════════════════════════════════════════
    function clearSelection() {
        state.selectedItems.forEach(i => { i.selected = false; i.shadowColor = null; });
        state.selectedItems = [];
        updateProperties();
        renderGrips();
    }
    function addToSelection(item, silent) {
        if (!state.selectedItems.includes(item)) {
            state.selectedItems.push(item);
            item.selected = true;
            item.shadowColor = new Color('#00BFFF');
            item.shadowBlur = 8;
            item.shadowOffset = new Point(0, 0);
        }
        if (!silent) { updateProperties(); renderGrips(); }
    }
    function refreshSelectionHighlight() {
        const heavy = state.selectedItems.length > 150;
        state.selectedItems.forEach(item => { item.shadowBlur = heavy ? 0 : 8; });
    }
    function setSingleSelection(item) {
        clearSelection();
        if (item) {
            state.selectedItems.push(item);
            item.selected = true;
            item.shadowColor = new Color('#00BFFF');
            item.shadowBlur = 8;
            item.shadowOffset = new Point(0, 0);
            updateProperties();
        }
        renderGrips();
    }

    // ═══════════════════════════════════════════════════════════════
    // [11] GRIPS (pinzamientos)
    // ═══════════════════════════════════════════════════════════════
    function addGripMarker(point, data) {
        const r = 4.5 / view.zoom;
        const marker = new Path.Rectangle(new paper.Rectangle(point.x - r, point.y - r, r * 2, r * 2));
        const isHot = state.gripDrag && state.gripDrag.item === data.item &&
            state.gripDrag.type === data.type && state.gripDrag.index === data.index;
        marker.strokeColor = new Color('#0B5FA5');
        marker.strokeWidth = 1 / view.zoom;
        marker.fillColor = isHot ? new Color('#FF6A00') : new Color('#2196F3');
        marker.data.grip = data;
        gripLayer.addChild(marker);
    }
    const GRIP_OBJECT_LIMIT = 150;
    function renderGrips() {
        gripLayer.removeChildren();
        if (state.currentCommand || state.pendingCommand) return;
        if (!state.selectedItems.length) return;
        if (state.selectedItems.length > GRIP_OBJECT_LIMIT) return;
        state.selectedItems.forEach(item => {
            if (!item || !item.layer) return;
            if (isCircleItem(item)) {
                addGripMarker(item.position, { item, type: 'circle-center', index: -1 });
                const r = getCircleRadius(item);
                addGripMarker(item.position.add(new Point(r, 0)), { item, type: 'circle-radius', index: 0 });
            } else if (item instanceof Path && item.segments && item.segments.length) {
                const segs = item.segments;
                segs.forEach((seg, idx) => {
                    addGripMarker(seg.point, { item, type: 'segment', index: idx });
                });
                if (segs.length === 2 && !item.closed) {
                    const mid = segs[0].point.add(segs[1].point).divide(2);
                    addGripMarker(mid, { item, type: 'move', index: -1 });
                }
            }
        });
    }

    // ═══════════════════════════════════════════════════════════════
    // [12] FLUJO VERBO-SUSTANTIVO (modificar con/sin selección previa)
    // ═══════════════════════════════════════════════════════════════
    function beginModifyCommand(cmd, promptText) {
        if (state.selectedItems.length) {
            proceedModifyCommand(cmd);
        } else {
            resetStateCmd();
            state.currentCommand = cmd;
            state.pendingCommand = cmd;
            state.expectingPoint = false;
            setPrompt(`${promptText}: Selecciona objetos (Enter para terminar)`);
        }
    }
    function finalizePendingSelection() {
        const cmd = state.pendingCommand;
        if (!cmd) return false;
        state.pendingCommand = null;
        if (!state.selectedItems.length) {
            setPrompt('0 objetos seleccionados. Comando cancelado.');
            state.currentCommand = null;
            return true;
        }
        proceedModifyCommand(cmd);
        return true;
    }
    function proceedModifyCommand(cmd) {
        switch (cmd) {
            case 'MOVE':   startCommand('MOVE',   'MOVE: Punto base');   break;
            case 'COPY':   startCommand('COPY',   'COPY: Punto base');   break;
            case 'ROTATE': startCommand('ROTATE', 'ROTATE: Punto base'); break;
            case 'SCALE':  startCommand('SCALE',  'SCALE: Punto base');  break;
            case 'MIRROR': startCommand('MIRROR', 'MIRROR: Primer punto del eje de simetría'); break;
            case 'ERASE':
                saveState();
                state.selectedItems.forEach(i => i.remove());
                clearSelection();
                state.currentCommand = null;
                setPrompt('Objetos borrados');
                break;
            case 'JOIN':
                joinSelected();
                state.currentCommand = null;
                renderGrips();
                break;
            case 'TRIM':
                state.trimBoundary = state.selectedItems.slice();
                clearSelection();
                state.currentCommand = 'TRIM';
                state.step = 1;
                state.expectingPoint = false;
                setPrompt('TRIM: Haz clic en la parte a recortar (Enter/ESC para salir)');
                break;
            case 'EXTEND':
                state.extendBoundary = state.selectedItems.slice();
                clearSelection();
                state.currentCommand = 'EXTEND';
                state.step = 1;
                state.expectingPoint = false;
                setPrompt('EXTEND: Haz clic en el extremo a extender (Enter/ESC para salir)');
                break;
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // [13] HIT TEST
    // ═══════════════════════════════════════════════════════════════
    function hitTestContent(pt, extraOptions) {
        const options = Object.assign({
            tolerance: 8 / view.zoom,
            stroke: true, fill: true, segments: true,
            match: (result) => {
                const l = result.item.layer;
                return l !== gridLayer && l !== guideLayer && l !== snapLayer && l !== selectionLayer &&
                    l !== previewLayer && l !== gripLayer;
            }
        }, extraOptions || {});
        return project.hitTest(pt, options);
    }

    // ═══════════════════════════════════════════════════════════════
    // [14] CACHÉ DE SNAP Y OTRACK
    // ═══════════════════════════════════════════════════════════════
    let _snapCandidatesCache = null;
    let _snapCandidatesCacheExclude = undefined;

    function sameExcludeSet(a, b) {
        if (a === b) return true;
        if (!a || !b) return false;
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
        return true;
    }
    function invalidateSnapCache() {
        _snapCandidatesCache = null;
        _snapCandidatesCacheExclude = undefined;
    }
    function collectSnapCandidates(excludeItems) {
        if (_snapCandidatesCache && sameExcludeSet(_snapCandidatesCacheExclude, excludeItems)) return _snapCandidatesCache;
        const candidates = [];
        for (let internal in layers) {
            const layer = layers[internal];
            if (!layer.data.visible || layer.data.locked) continue;
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                layer === previewLayer || layer === gripLayer) continue;
            layer.children.forEach(item => {
                if (excludeItems && excludeItems.includes(item)) return;
                if (item instanceof Path) {
                    item.segments.forEach(seg => candidates.push({ point: seg.point, type: 'endpoint' }));
                    for (let i = 0; i < item.segments.length; i++) {
                        const s1 = item.segments[i], s2 = item.segments[(i + 1) % item.segments.length];
                        if (s1.handleOut.length === 0 && s2.handleIn.length === 0) {
                            candidates.push({ point: s1.point.add(s2.point).divide(2), type: 'midpoint' });
                        }
                    }
                }
                if (isCircleItem(item)) candidates.push({ point: item.position, type: 'center' });
            });
        }
        _snapCandidatesCache = candidates;
        _snapCandidatesCacheExclude = excludeItems;
        return candidates;
    }
    function getSnapPoint(mousePoint, excludeItems) {
        if (!state.snapEnabled) return null;
        const tol = 10 / view.zoom;
        let best = null, bestDist = tol, bestType = null;
        const candidates = collectSnapCandidates(excludeItems);
        for (let i = 0; i < candidates.length; i++) {
            const d = candidates[i].point.getDistance(mousePoint);
            if (d < bestDist) { bestDist = d; best = candidates[i].point; bestType = candidates[i].type; }
        }
        if (!best) return null;
        return { point: best, type: bestType };
    }
    function collectKeyPoints(excludeItems) {
        return collectSnapCandidates(excludeItems).map(c => c.point);
    }

    function acquireTrackPoint(pt) {
        if (state.acquiredPoints.some(p => p.getDistance(pt) < 1e-6)) return;
        state.acquiredPoints.push(pt.clone());
        if (state.acquiredPoints.length > 2) state.acquiredPoints.shift();
        setPrompt('Referencia adquirida — mueve el ratón para rastrear, o teclea una distancia (ESC para soltar)');
    }
    function releaseTrackPoints() {
        state.acquiredPoints = [];
        state.trackHoverPoint = null;
        if (trackHoverTimer) { clearTimeout(trackHoverTimer); trackHoverTimer = null; }
    }
    function updateTrackAcquisition(snap) {
        if (!(state.currentCommand && state.expectingPoint) || !state.snapEnabled) {
            if (trackHoverTimer) { clearTimeout(trackHoverTimer); trackHoverTimer = null; }
            state.trackHoverPoint = null;
            return;
        }
        const same = state.trackHoverPoint && snap && state.trackHoverPoint.getDistance(snap.point) < 1e-6;
        if (same) return;
        if (trackHoverTimer) { clearTimeout(trackHoverTimer); trackHoverTimer = null; }
        state.trackHoverPoint = snap ? snap.point : null;
        if (snap) {
            const target = snap.point.clone();
            trackHoverTimer = setTimeout(() => {
                acquireTrackPoint(target);
                trackHoverTimer = null;
            }, TRACK_ACQUIRE_DELAY);
        }
    }
    function computeAlignmentGuides(cursor, base, excludeItems) {
        const tol = 7 / view.zoom;
        let vBest = null, vBestDist = tol;
        let hBest = null, hBestDist = tol;
        if (state.acquiredPoints && state.acquiredPoints.length) {
            state.acquiredPoints.forEach(p => {
                const dx = Math.abs(p.x - cursor.x);
                if (dx < vBestDist) { vBestDist = dx; vBest = p; }
                const dy = Math.abs(p.y - cursor.y);
                if (dy < hBestDist) { hBestDist = dy; hBest = p; }
            });
            return { v: vBest, h: hBest, acquired: true };
        }
        const keyPoints = collectKeyPoints(excludeItems);
        keyPoints.forEach(p => {
            if (base && p.getDistance(base) < 1e-6) return;
            const dx = Math.abs(p.x - cursor.x);
            if (dx < vBestDist) { vBestDist = dx; vBest = p; }
            const dy = Math.abs(p.y - cursor.y);
            if (dy < hBestDist) { hBestDist = dy; hBest = p; }
        });
        if (!vBest && !hBest) return null;
        return { v: vBest, h: hBest };
    }
    function renderAcquiredMarkers() {
        if (!state.acquiredPoints || !state.acquiredPoints.length) return;
        const r = 4.5 / view.zoom;
        const c = new Color(0.32, 0.85, 0.45);
        state.acquiredPoints.forEach(p => {
            const m1 = new Path.Line(p.add(new Point(-r, 0)), p.add(new Point(r, 0)));
            const m2 = new Path.Line(p.add(new Point(0, -r)), p.add(new Point(0, r)));
            [m1, m2].forEach(m => {
                m.strokeColor = c;
                m.strokeWidth = 1.8 / view.zoom;
                guideLayer.addChild(m);
            });
        });
    }
    function renderTrackingGuides(guides, resolvedPoint) {
        renderAcquiredMarkers();
        if (!guides) return;
        const b = view.bounds;
        const r = 4.5 / view.zoom;
        const guideColor = new Color(0.91, 0.64, 0.24);
        if (guides.v) {
            const line = new Path.Line(new Point(guides.v.x, b.top), new Point(guides.v.x, b.bottom));
            line.strokeColor = guideColor;
            line.strokeWidth = 1 / view.zoom;
            line.dashArray = [6 / view.zoom, 5 / view.zoom];
            guideLayer.addChild(line);
            const mark = new Path.Circle(guides.v, r * 0.6);
            mark.strokeColor = guideColor;
            mark.strokeWidth = 1.4 / view.zoom;
            mark.fillColor = null;
            guideLayer.addChild(mark);
        }
        if (guides.h) {
            const line = new Path.Line(new Point(b.left, guides.h.y), new Point(b.right, guides.h.y));
            line.strokeColor = guideColor;
            line.strokeWidth = 1 / view.zoom;
            line.dashArray = [6 / view.zoom, 5 / view.zoom];
            guideLayer.addChild(line);
            const mark = new Path.Circle(guides.h, r * 0.6);
            mark.strokeColor = guideColor;
            mark.strokeWidth = 1.4 / view.zoom;
            mark.fillColor = null;
            guideLayer.addChild(mark);
        }
        if (guides.v && guides.h) {
            const cross = new Path([resolvedPoint.add(new Point(-r, -r)), resolvedPoint.add(new Point(r, r))]);
            const cross2 = new Path([resolvedPoint.add(new Point(-r, r)), resolvedPoint.add(new Point(r, -r))]);
            [cross, cross2].forEach(c => {
                c.strokeColor = guideColor;
                c.strokeWidth = 1.6 / view.zoom;
                guideLayer.addChild(c);
            });
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // [15] RESOLUCIÓN DE PUNTO (snap + tracking + ortho/polar)
    // ═══════════════════════════════════════════════════════════════
    function resolvePoint(raw, base, cmd, excludeItems) {
        let pt = raw;
        const snap = getSnapPoint(pt, excludeItems);
        if (snap) {
            state.trackGuides = null;
            return snap.point;
        }
        const trackingCmds = ['LINE', 'CIRCLE', 'RECTANG', 'ARC', 'MOVE', 'COPY', 'ROTATE', 'SCALE', 'MIRROR'];
        let guides = null;
        if (base && trackingCmds.includes(cmd)) {
            guides = computeAlignmentGuides(pt, base, excludeItems);
            if (guides) {
                if (guides.v) pt = new Point(guides.v.x, pt.y);
                if (guides.h) pt = new Point(pt.x, guides.h.y);
            }
        }
        state.trackGuides = guides;
        const orthoCmds = ['LINE', 'MOVE', 'COPY', 'ARC', 'ROTATE', 'SCALE', 'MIRROR'];
        const orthoActive = state.shiftKeyDown ? !state.ortho : state.ortho;
        const axisLockedByTracking = guides && (guides.v || guides.h);
        if (base && orthoCmds.includes(cmd) && !axisLockedByTracking) {
            if (orthoActive) {
                pt = orthoProject(base, pt);
            } else if (state.polar) {
                const d = pt.subtract(base);
                const dist = d.length;
                if (dist > 0) {
                    const step = state.polarIncrement || 15;
                    const angleDeg = Math.round(d.angle / step) * step;
                    const rad = angleDeg * Math.PI / 180;
                    pt = base.add(new Point(dist * Math.cos(rad), dist * Math.sin(rad)));
                }
            }
        }
        return pt;
    }
    function orthoProject(base, target) {
        const d = target.subtract(base);
        return Math.abs(d.x) > Math.abs(d.y) ? new Point(target.x, base.y) : new Point(base.x, target.y);
    }

    // ═══════════════════════════════════════════════════════════════
    // [16] PARSEO DE ENTRADA ESTILO AUTOCAD (Y+ arriba)
    //     · "X,Y"      → Y usuario (positiva = arriba)
    //     · "@dX,dY"   → desplazamiento en Y usuario
    //     · "@d<áng"   → ángulo CCW desde X+ (antihorario)
    //     · "d"        → distancia sobre dirección del ratón
    // ═══════════════════════════════════════════════════════════════
    function parseDynamicInput(input, lastPoint) {
        input = input.trim();
        if (!input) return null;
        const relative = input.startsWith('@');
        const body = relative ? input.slice(1).trim() : input;

        const cartMatch = body.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
        if (cartMatch) {
            const a = parseFloat(cartMatch[1]);
            const b = parseFloat(cartMatch[2]);
            if (relative) {
                if (!lastPoint) return null;
                return lastPoint.add(new Point(a, -b));
            }
            return new Point(a, -b);
        }
        const polarMatch = body.match(/^(-?\d+(?:\.\d+)?)\s*<\s*(-?\d+(?:\.\d+)?)$/);
        if (polarMatch) {
            if (!lastPoint) return null;
            const dist = parseFloat(polarMatch[1]);
            const angleDeg = parseFloat(polarMatch[2]);
            const rad = angleDeg * Math.PI / 180;
            return lastPoint.add(new Point(dist * Math.cos(rad), -dist * Math.sin(rad)));
        }
        if (/^-?\d+(\.\d+)?$/.test(body)) {
            const dist = parseFloat(body);
            const g = state.trackGuides;
            if (g && g.acquired && (g.v || g.h) && !(g.v && g.h)) {
                if (g.v) {
                    const dirY = state.lastMousePoint.y >= g.v.y ? 1 : -1;
                    return new Point(g.v.x, g.v.y + dist * dirY);
                } else {
                    const dirX = state.lastMousePoint.x >= g.h.x ? 1 : -1;
                    return new Point(g.h.x + dist * dirX, g.h.y);
                }
            }
            if (!lastPoint) return null;
            const dir = state.lastMousePoint.subtract(lastPoint);
            const orthoActive = state.shiftKeyDown ? !state.ortho : state.ortho;
            let angleRad;
            if (orthoActive) {
                if (Math.abs(dir.x) > Math.abs(dir.y)) angleRad = dir.x >= 0 ? 0 : Math.PI;
                else angleRad = dir.y >= 0 ? Math.PI / 2 : -Math.PI / 2;
            } else if (state.polar && dir.length > 0) {
                const step = state.polarIncrement || 15;
                const angleDeg = Math.round(dir.angle / step) * step;
                angleRad = angleDeg * Math.PI / 180;
            } else {
                angleRad = dir.length === 0 ? 0 : dir.angle * Math.PI / 180;
            }
            return lastPoint.add(new Point(dist * Math.cos(angleRad), dist * Math.sin(angleRad)));
        }
        return null;
    }

    // ═══════════════════════════════════════════════════════════════
    // [17] EJECUTAR COMANDOS
    // ═══════════════════════════════════════════════════════════════
    function executeCommand(cmd) {
        if (state.currentCommand) resetStateCmd();
        const cmdMap = {
            'L': 'LINE', 'LINE': 'LINE', 'C': 'CIRCLE', 'CIRCLE': 'CIRCLE',
            'REC': 'RECTANG', 'RECTANG': 'RECTANG', 'A': 'ARC', 'ARC': 'ARC',
            'M': 'MOVE', 'MOVE': 'MOVE', 'CO': 'COPY', 'COPY': 'COPY',
            'RO': 'ROTATE', 'ROTATE': 'ROTATE', 'SC': 'SCALE', 'SCALE': 'SCALE',
            'E': 'ERASE', 'ERASE': 'ERASE', 'O': 'OFFSET', 'OFFSET': 'OFFSET',
            'TR': 'TRIM', 'TRIM': 'TRIM', 'EX': 'EXTEND', 'EXTEND': 'EXTEND',
            'J': 'JOIN', 'JOIN': 'JOIN', 'MI': 'MIRROR', 'MIRROR': 'MIRROR',
            'UNDO': 'UNDO', 'REDO': 'REDO'
        };
        const fullCmd = cmdMap[cmd.toUpperCase()] || cmd.toUpperCase();
        const repeatableCmds = ['LINE', 'CIRCLE', 'RECTANG', 'ARC', 'MOVE', 'COPY', 'ROTATE', 'SCALE', 'OFFSET', 'TRIM', 'EXTEND', 'JOIN', 'ERASE', 'MIRROR'];
        if (repeatableCmds.includes(fullCmd)) state.lastCommand = fullCmd;

        switch (fullCmd) {
            case 'LINE':    startCommand('LINE',    'LINE: Primer punto');         break;
            case 'CIRCLE':  startCommand('CIRCLE',  'CIRCLE: Centro');             break;
            case 'RECTANG': startCommand('RECTANG', 'RECTANG: Primera esquina');   break;
            case 'ARC':     startCommand('ARC',     'ARC: Punto inicial');         break;
            case 'MOVE':    beginModifyCommand('MOVE', 'MOVE');                    break;
            case 'COPY':    beginModifyCommand('COPY', 'COPY');                    break;
            case 'ROTATE':  beginModifyCommand('ROTATE', 'ROTATE');                break;
            case 'SCALE':   beginModifyCommand('SCALE', 'SCALE');                  break;
            case 'MIRROR':  beginModifyCommand('MIRROR', 'MIRROR');                break;
            case 'OFFSET':
                clearSelection();
                state.currentCommand = 'OFFSET';
                state.step = 1;
                state.waitingForNumber = true;
                state.offsetTarget = null;
                setPrompt('OFFSET: Distancia (número+Enter)');
                document.getElementById('cmd-input').focus();
                break;
            case 'TRIM':    beginModifyCommand('TRIM', 'TRIM: Selecciona los límites');     break;
            case 'EXTEND':  beginModifyCommand('EXTEND', 'EXTEND: Selecciona los límites'); break;
            case 'JOIN':    beginModifyCommand('JOIN', 'JOIN: Selecciona los objetos a unir'); break;
            case 'ERASE':   beginModifyCommand('ERASE', 'ERASE');                            break;
            case 'UNDO':    undo(); break;
            case 'REDO':    redo(); break;
            default: setPrompt('Comando desconocido');
        }
    }

    function startCommand(cmd, prompt) {
        state.currentCommand = cmd;
        state.step = 1;
        setPrompt(prompt);
        state.expectingPoint = true;
        state.dynamicLastPoint = null;
        previewLayer.removeChildren();
        gripLayer.removeChildren();
        releaseTrackPoints();
    }

    // ═══════════════════════════════════════════════════════════════
    // [18] HISTORIAL (deshacer / rehacer)
    // ═══════════════════════════════════════════════════════════════
    function snapshotCurrent() {
        const snap = { activeLayerName: activeLayer.name, layers: {} };
        for (let internal in layers) {
            const layer = layers[internal];
            if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer || layer === previewLayer || layer === gripLayer) continue;
            snap.layers[internal] = {
                name: layer.data.originalName,
                visible: layer.data.visible,
                locked: layer.data.locked,
                color: layer.data.color || '#FFFFFF',
                items: layer.children.map(item => item.exportJSON({ asString: false }))
            };
        }
        return snap;
    }
    function saveState() {
        state.history.push(snapshotCurrent());
        state.redoStack = [];
        if (state.history.length > 50) state.history.shift();
        invalidateSnapCache();
    }
    function restoreState(snap) {
        invalidateSnapCache();
        state.selectedItems = [];
        resetStateCmd();
        for (let internal in layers) {
            const l = layers[internal];
            if (l !== gridLayer && l !== guideLayer && l !== snapLayer && l !== selectionLayer && l !== previewLayer)
                l.removeChildren();
        }
        for (let internal in snap.layers) {
            const data = snap.layers[internal];
            if (!layers[internal]) createLayer(data.name);
            const layer = layers[internal];
            layer.data.visible = data.visible;
            layer.data.locked = data.locked;
            if (data.color) layer.data.color = data.color;
            layer.visible = data.visible;
            data.items.forEach(itemJson => {
                const item = new Path();
                item.importJSON(itemJson);
                layer.addChild(item);
            });
        }
        if (snap.activeLayerName && layers[snap.activeLayerName]) {
            activeLayer = layers[snap.activeLayerName];
            project.activeLayer = activeLayer;
        } else {
            activeLayer = defaultLayer;
            project.activeLayer = activeLayer;
        }
        view.update();
        renderLayerList();
        drawGrid();
        refreshStrokeWidths();
        renderGrips();
        updateProperties();
        previewLayer.removeChildren();
        guideLayer.removeChildren();
        selectionLayer.removeChildren();
        const dt = document.getElementById('dynamic-tooltip');
        if (dt) dt.style.display = 'none';
    }
    function undo() {
        if (!state.history.length) { setPrompt('No hay más acciones para deshacer'); return; }
        const prev = state.history.pop();
        state.redoStack.push(snapshotCurrent());
        if (state.redoStack.length > 50) state.redoStack.shift();
        restoreState(prev);
        setPrompt('Deshacer');
        view.update(); updateProperties(); renderLayerList();
    }
    function redo() {
        if (!state.redoStack.length) { setPrompt('No hay más acciones para rehacer'); return; }
        const next = state.redoStack.pop();
        state.history.push(snapshotCurrent());
        if (state.history.length > 50) state.history.shift();
        restoreState(next);
        setPrompt('Rehacer');
        view.update(); updateProperties(); renderLayerList();
    }

    // ═══════════════════════════════════════════════════════════════
    // [19] HANDLER DE PUNTOS (dibujo y comandos de modificación)
    // ═══════════════════════════════════════════════════════════════
    function handlePointInput(point) {
        if (!state.currentCommand) return;
        const cmd = state.currentCommand;
        releaseTrackPoints();

        if (cmd === 'LINE') {
            state.collectedPoints.push(point);
            if (state.collectedPoints.length >= 2) {
                saveState();
                const p1 = state.collectedPoints[state.collectedPoints.length - 2];
                const p2 = point;
                const line = new Path.Line(p1, p2);
                line.strokeColor = 'white';
                line.strokeWidth = currentStrokeWidth();
                tagShape(line, 'line');
                activeLayer.addChild(line);
                state.lineSegmentPaths.push(line);
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('LINE: Siguiente punto (Enter/ESC terminar · C cerrar · U deshacer tramo)');
            } else {
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('LINE: Siguiente punto');
            }
        } else if (cmd === 'CIRCLE') {
            if (state.step === 1) {
                state.collectedPoints.push(point);
                state.step = 2;
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('CIRCLE: Radio (o escribe D para indicar el diámetro)');
            } else {
                saveState();
                const c = state.collectedPoints[0];
                let r = c.getDistance(point);
                if (state.circleDiameterMode) r = r / 2;
                const circle = new Path.Circle(c, r);
                circle.strokeColor = 'white';
                circle.strokeWidth = currentStrokeWidth();
                tagShape(circle, 'circle');
                circle.data.radius = r;
                activeLayer.addChild(circle);
                resetStateCmd();
            }
        } else if (cmd === 'RECTANG') {
            state.collectedPoints.push(point);
            if (state.collectedPoints.length === 2) {
                saveState();
                const rect = new Path.Rectangle(state.collectedPoints[0], state.collectedPoints[1]);
                rect.strokeColor = 'white';
                rect.strokeWidth = currentStrokeWidth();
                tagShape(rect, 'polyline');
                activeLayer.addChild(rect);
                resetStateCmd();
            } else {
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('RECTANG: Esquina opuesta');
            }
        } else if (cmd === 'ARC') {
            state.collectedPoints.push(point);
            if (state.collectedPoints.length === 1) {
                state.step = 2;
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('ARC: Punto de paso (segundo punto)');
            } else if (state.collectedPoints.length === 2) {
                state.step = 3;
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('ARC: Punto final');
            } else {
                saveState();
                try {
                    const arc = new Path.Arc(state.collectedPoints[0], state.collectedPoints[1], point);
                    arc.strokeColor = 'white';
                    arc.strokeWidth = currentStrokeWidth();
                    tagShape(arc, 'arc');
                    activeLayer.addChild(arc);
                    setPrompt('Arco creado');
                } catch (err) {
                    setPrompt('Puntos no válidos para un arco (colineales). Inténtalo de nuevo.');
                }
                resetStateCmd();
            }
        } else if (cmd === 'MOVE') {
            if (state.step === 1) {
                state.basePoint = point;
                state.step = 2;
                state.originalPositions = state.selectedItems.map(it => it.position.clone());
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('MOVE: Arrastra, haz clic o escribe distancia');
            } else {
                saveState();
                const delta = point.subtract(state.basePoint);
                state.selectedItems.forEach((item, idx) => item.position = state.originalPositions[idx].add(delta));
                resetStateCmd();
            }
        } else if (cmd === 'COPY') {
            if (state.step === 1) {
                state.basePoint = point;
                state.copySourceItems = state.selectedItems.slice();
                state.step = 2;
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('COPY: Punto de destino (Enter/ESC para terminar)');
            } else {
                saveState();
                const delta = point.subtract(state.basePoint);
                const newClones = [];
                state.copySourceItems.forEach(item => {
                    const clone = item.clone();
                    clone.strokeColor = item.strokeColor;
                    clone.strokeWidth = currentStrokeWidth();
                    clone.fillColor = item.fillColor;
                    clone.position = item.position.add(delta);
                    (item.layer || activeLayer).addChild(clone);
                    newClones.push(clone);
                });
                clearSelection();
                newClones.forEach(c => addToSelection(c));
                state.dynamicLastPoint = state.basePoint;
                setPrompt('COPY: Otro punto de destino (Enter/ESC para terminar)');
            }
        } else if (cmd === 'ROTATE') {
            if (state.step === 1) {
                state.basePoint = point;
                state.step = 2;
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                state.startAngle = state.lastMousePoint.subtract(state.basePoint).angle;
                setPrompt('ROTATE: Mueve y haz clic para girar, o escribe el ángulo en grados (CCW)');
            } else {
                saveState();
                const currentAngle = point.subtract(state.basePoint).angle;
                const delta = currentAngle - state.startAngle;
                state.selectedItems.forEach(i => i.rotate(delta, state.basePoint));
                resetStateCmd();
                let angleDeg = (-delta) % 360;
                if (angleDeg < 0) angleDeg += 360;
                setPrompt(`Rotado ${angleDeg.toFixed(2)}° (CCW)`);
            }
        } else if (cmd === 'SCALE') {
            if (state.step === 1) {
                state.basePoint = point;
                state.step = 2;
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                state.referencePoint = state.lastMousePoint;
                setPrompt('SCALE: Mueve y haz clic para escalar, o escribe el factor');
            } else {
                saveState();
                const refDist = state.referencePoint.subtract(state.basePoint).length || 1;
                const curDist = point.subtract(state.basePoint).length;
                const sf = curDist / refDist;
                state.selectedItems.forEach(i => i.scale(sf, state.basePoint));
                resetStateCmd();
                setPrompt(`Escalado x${sf.toFixed(3)}`);
            }
        } else if (cmd === 'MIRROR') {
            if (state.step === 1) {
                state.basePoint = point;
                state.step = 2;
                state.expectingPoint = true;
                state.dynamicLastPoint = point;
                setPrompt('MIRROR: Segundo punto del eje de simetría');
            } else if (state.step === 2) {
                const axisStart = state.basePoint;
                const axisEnd = point;
                if (axisStart.getDistance(axisEnd) < 1e-6) {
                    setPrompt('Eje inválido: los dos puntos coinciden. Vuelve a indicar el segundo punto.');
                    return;
                }
                saveState();
                const matrix = reflectMatrix(axisStart, axisEnd);
                const mirrored = [];
                state.selectedItems.forEach(item => {
                    const clone = item.clone();
                    clone.data = Object.assign({}, item.data);
                    clone.transform(matrix);
                    clone.strokeColor = item.strokeColor;
                    clone.strokeWidth = currentStrokeWidth();
                    clone.fillColor = item.fillColor;
                    (item.layer || activeLayer).addChild(clone);
                    mirrored.push(clone);
                });
                clearSelection();
                mirrored.forEach(c => addToSelection(c, true));
                refreshSelectionHighlight();
                updateProperties();
                renderGrips();
                resetStateCmd();
                setPrompt(`${mirrored.length} objeto(s) reflejado(s) por simetría (originales conservados)`);
                invalidateSnapCache();
                view.update();
            }
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // [20] JOIN
    // ═══════════════════════════════════════════════════════════════
    function joinSelected() {
        const items = state.selectedItems.filter(i => i instanceof Path && i.segments.length > 0);
        if (items.length < 2) { setPrompt('Selecciona al menos dos líneas/polilíneas/arcos'); return; }
        const tolerance = 5 / view.zoom;
        saveState();
        const pool = items.slice();
        const chains = [];
        while (pool.length > 0) {
            let chain = pool.shift();
            let changed = true;
            while (changed && pool.length > 0) {
                changed = false;
                for (let i = pool.length - 1; i >= 0; i--) {
                    const candidate = pool[i];
                    const chainStart = chain.firstSegment.point;
                    const chainEnd = chain.lastSegment.point;
                    const candStart = candidate.firstSegment.point;
                    const candEnd = candidate.lastSegment.point;
                    if (chainEnd.getDistance(candStart) < tolerance ||
                        chainEnd.getDistance(candEnd) < tolerance ||
                        chainStart.getDistance(candStart) < tolerance ||
                        chainStart.getDistance(candEnd) < tolerance) {
                        chain.join(candidate, tolerance);
                        pool.splice(i, 1);
                        changed = true;
                    }
                }
            }
            chains.push(chain);
        }
        chains.forEach(path => {
            path.strokeColor = 'white';
            path.strokeWidth = currentStrokeWidth();
            const hasCurves = path.curves.some(c => !c.isStraight());
            tagShape(path, hasCurves ? 'arc' : 'polyline');
        });
        clearSelection();
        chains.forEach(p => addToSelection(p));
        setPrompt(`${chains.length} trazado(s) unido(s) (curvas preservadas)`);
    }

    // ═══════════════════════════════════════════════════════════════
    // [21] TRIM / EXTEND
    // ═══════════════════════════════════════════════════════════════
    function handleTrimExtendClick(event) {
        const pt = event.point;
        const hit = hitTestContent(pt);
        if (!hit || !hit.item) { setPrompt('Selecciona un objeto'); return; }
        const item = hit.item;
        if (state.currentCommand === 'TRIM') {
            trimObject(item, state.trimBoundary, pt);
            setPrompt('TRIM: Selecciona otro objeto o ESC para salir');
        } else if (state.currentCommand === 'EXTEND') {
            extendObject(item, state.extendBoundary, pt);
            setPrompt('EXTEND: Selecciona otro objeto o ESC para salir');
        }
    }
    function trimObject(item, boundaries, clickPoint) {
        if (!isLineItem(item)) { setPrompt('Solo se pueden recortar líneas'); return; }
        const bList = (Array.isArray(boundaries) ? boundaries : [boundaries]).filter(b => b && b !== item);
        if (!bList.length) { setPrompt('No hay límites válidos'); return; }
        let cutPt = null, bestD = Infinity;
        bList.forEach(boundary => {
            const inters = item.getIntersections(boundary);
            inters.forEach(it => {
                const d = it.point.getDistance(clickPoint);
                if (d < bestD) { bestD = d; cutPt = it.point; }
            });
        });
        if (!cutPt) { setPrompt('No hay intersección con los límites'); return; }
        const p1 = item.segments[0].point;
        const p2 = item.segments[1].point;
        const d1 = p1.getDistance(clickPoint);
        const d2 = p2.getDistance(clickPoint);
        saveState();
        if (d1 < d2) item.segments[0].point = cutPt;
        else item.segments[1].point = cutPt;
        setPrompt('Línea recortada');
    }
    function extendObject(item, boundaries, clickPoint) {
        if (!isLineItem(item)) { setPrompt('Solo se pueden alargar líneas'); return; }
        const bList = (Array.isArray(boundaries) ? boundaries : [boundaries]).filter(b => b && b !== item);
        if (!bList.length) { setPrompt('No hay límites válidos'); return; }
        const p1 = item.segments[0].point;
        const p2 = item.segments[1].point;
        const d1 = p1.getDistance(clickPoint);
        const d2 = p2.getDistance(clickPoint);
        let start, dir;
        if (d1 < d2) { start = p1; dir = p1.subtract(p2).normalize(); }
        else { start = p2; dir = p2.subtract(p1).normalize(); }
        const rayStart = start.add(dir.multiply(-10000));
        const rayEnd = start.add(dir.multiply(10000));
        const ray = new Path.Line(rayStart, rayEnd);
        let best = null, bestDist = Infinity;
        bList.forEach(boundary => {
            const inters = ray.getIntersections(boundary);
            inters.forEach(inter => {
                const d = inter.point.getDistance(start);
                if (d < bestDist && d > 0.01) { bestDist = d; best = inter.point; }
            });
        });
        ray.remove();
        if (!best) { setPrompt('No se encontró punto de extensión válido'); return; }
        saveState();
        if (d1 < d2) item.segments[0].point = best;
        else item.segments[1].point = best;
        setPrompt('Línea extendida');
    }

    // ═══════════════════════════════════════════════════════════════
    // [22] OFFSET
    // ═══════════════════════════════════════════════════════════════
    function lineLineIntersection(p1, p2, p3, p4) {
        const d1 = p2.subtract(p1), d2 = p4.subtract(p3);
        const denom = d1.cross(d2);
        if (Math.abs(denom) < 1e-9) return null;
        const t = p3.subtract(p1).cross(d2) / denom;
        return p1.add(d1.multiply(t));
    }
    function circumcenter(p1, p2, p3) {
        const ax = p1.x, ay = p1.y, bx = p2.x, by = p2.y, cx = p3.x, cy = p3.y;
        const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
        if (Math.abs(d) < 1e-9) return null;
        const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / d;
        const uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / d;
        return new Point(ux, uy);
    }
    function offsetPolyline(item, dist, clickPt) {
        const pts = item.segments.map(s => s.point);
        const n = pts.length;
        if (n < 2) return null;
        const closed = item.closed;
        let side = 1;
        if (closed) side = item.contains(clickPt) ? 1 : -1;
        else {
            let bestD = Infinity, bestSide = 1;
            for (let i = 0; i < n - 1; i++) {
                const a = pts[i], b = pts[i + 1];
                const dir = b.subtract(a).normalize();
                const normal = dir.rotate(90);
                const mid = a.add(b).divide(2);
                const d = mid.getDistance(clickPt);
                if (d < bestD) { bestD = d; bestSide = clickPt.subtract(mid).dot(normal) > 0 ? 1 : -1; }
            }
            side = bestSide;
        }
        const edgeCount = closed ? n : n - 1;
        const offsetEdges = [];
        for (let i = 0; i < edgeCount; i++) {
            const a = pts[i];
            const b = pts[(i + 1) % n];
            const dir = b.subtract(a).normalize();
            const normal = dir.rotate(90).multiply(dist * side);
            offsetEdges.push({ a: a.add(normal), b: b.add(normal) });
        }
        const newPts = [];
        for (let i = 0; i < offsetEdges.length; i++) {
            const cur = offsetEdges[i];
            if (!closed && i === 0) { newPts.push(cur.a); continue; }
            const prevIdx = (i - 1 + offsetEdges.length) % offsetEdges.length;
            const prev = offsetEdges[prevIdx];
            const corner = lineLineIntersection(prev.a, prev.b, cur.a, cur.b);
            newPts.push(corner || cur.a);
        }
        if (!closed) newPts.push(offsetEdges[offsetEdges.length - 1].b);
        const newPath = new Path(newPts);
        newPath.closed = closed;
        return newPath;
    }
    function highlightOffsetTarget(item, on) {
        if (!item) return;
        if (on) {
            item.shadowColor = new Color('#E8A33D');
            item.shadowBlur = 10;
            item.shadowOffset = new Point(0, 0);
        } else if (!state.selectedItems.includes(item)) {
            item.shadowColor = null;
        }
    }
    function handleOffsetSelectClick(event) {
        const hit = hitTestContent(event.point);
        if (!hit || !hit.item) { setPrompt('No se encontró ningún objeto (Enter/ESC para salir)'); return; }
        const item = hit.item;
        if (!isLineItem(item) && !isCircleItem(item) && !isPolylineItem(item)) {
            setPrompt('Offset solo funciona con líneas, círculos, rectángulos o polilíneas');
            return;
        }
        state.offsetTarget = item;
        highlightOffsetTarget(item, true);
        state.step = 3;
        setPrompt(`OFFSET: Distancia ${state.offsetDistance}. Especifica el lado del offset (Enter/ESC para salir)`);
    }
    function handleOffsetSideClick(event) {
        const item = state.offsetTarget;
        const pt = event.point;
        const dist = state.offsetDistance;
        if (!item || dist <= 0) { resetOffsetToSelect(); return; }
        saveState();
        if (isLineItem(item)) {
            const p1 = item.segments[0].point;
            const p2 = item.segments[1].point;
            const dir = p2.subtract(p1).normalize();
            const normal = dir.rotate(90).multiply(dist);
            const mid = p1.add(p2).divide(2);
            const toClick = pt.subtract(mid);
            const side = toClick.dot(normal) > 0 ? 1 : -1;
            const offsetNormal = normal.multiply(side);
            const newLine = new Path.Line(p1.add(offsetNormal), p2.add(offsetNormal));
            newLine.strokeColor = item.strokeColor || 'white';
            newLine.strokeWidth = currentStrokeWidth();
            tagShape(newLine, 'line');
            activeLayer.addChild(newLine);
        } else if (isCircleItem(item)) {
            const r0 = getCircleRadius(item);
            const inside = pt.getDistance(item.position) < r0;
            const newRadius = inside ? r0 - dist : r0 + dist;
            if (newRadius <= 0) { setPrompt('El offset elimina el círculo (radio ≤ 0). Elige otro lado o distancia.'); return; }
            const newCircle = new Path.Circle(item.position, newRadius);
            newCircle.strokeColor = item.strokeColor || 'white';
            newCircle.strokeWidth = currentStrokeWidth();
            tagShape(newCircle, 'circle');
            newCircle.data.radius = newRadius;
            activeLayer.addChild(newCircle);
        } else if (isPolylineItem(item)) {
            const newPoly = offsetPolyline(item, dist, pt);
            if (!newPoly) { setPrompt('No se pudo calcular el offset de esta polilínea'); return; }
            newPoly.strokeColor = item.strokeColor || 'white';
            newPoly.strokeWidth = currentStrokeWidth();
            tagShape(newPoly, 'polyline');
            activeLayer.addChild(newPoly);
        }
        resetOffsetToSelect(`Offset creado (dist ${dist}). Selecciona otro objeto o Enter/ESC para salir`);
    }
    function resetOffsetToSelect(message) {
        highlightOffsetTarget(state.offsetTarget, false);
        state.offsetTarget = null;
        state.step = 2;
        previewLayer.removeChildren();
        setPrompt(message || `OFFSET: Distancia ${state.offsetDistance}. Selecciona objeto a desplazar (Enter/ESC para salir)`);
    }

    // ═══════════════════════════════════════════════════════════════
    // [23] EVENTOS DE RATÓN
    // ═══════════════════════════════════════════════════════════════
    let snapMarker = null;
    let middleClickTimer = null;

    function onMouseDown(event) {
        state.lastMousePoint = event.point;
        if (state.pickingPrintWindow) {
            state.printPickStart = event.point;
            state.printPickRect = new Rectangle(event.point, event.point);
            return;
        }
        if (event.event.button === 1) {
            event.event.preventDefault();
            if (middleClickTimer) {
                clearTimeout(middleClickTimer);
                middleClickTimer = null;
                zoomExtents();
            } else {
                middleClickTimer = setTimeout(() => {
                    middleClickTimer = null;
                    state.panning = true;
                    state.panStartPoint = event.point;
                }, 300);
            }
            return;
        }
        if (event.event.button === 0 && event.event.altKey) {
            state.panning = true;
            state.panStartPoint = event.point;
            return;
        }
        if (state.waitingForNumber) return;

        if (!state.currentCommand && state.selectedItems.length) {
            const gripTol = 6 / view.zoom;
            const gripHit = gripLayer.hitTest(event.point, { fill: true, stroke: true, tolerance: gripTol });
            if (gripHit && gripHit.item && gripHit.item.data && gripHit.item.data.grip) {
                const grip = gripHit.item.data.grip;
                saveState();
                state.gripDrag = grip;
                state.gripDragStart = event.point;
                if (grip.type === 'move') {
                    state.gripOriginalSegments = grip.item.segments.map(s => s.point.clone());
                }
                renderGrips();
                return;
            }
        }

        if (state.currentCommand && state.expectingPoint) {
            const moveExclude = ((state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') && state.step >= 2) ?
                state.selectedItems : null;
            const resolved = resolvePoint(event.point, state.dynamicLastPoint, state.currentCommand, moveExclude);
            handlePointInput(resolved);
            return;
        }

        if ((state.currentCommand === 'TRIM' || state.currentCommand === 'EXTEND') && !state.pendingCommand) {
            handleTrimExtendClick(event);
            return;
        }
        if (state.currentCommand === 'OFFSET' && state.step === 2) { handleOffsetSelectClick(event); return; }
        if (state.currentCommand === 'OFFSET' && state.step === 3) { handleOffsetSideClick(event); return; }

        const hit = hitTestContent(event.point);
        if (hit && hit.item) {
            const item = hit.item;
            if (state.pendingCommand) {
                if (state.selectedItems.includes(item)) {
                    item.selected = false;
                    item.shadowColor = null;
                    state.selectedItems = state.selectedItems.filter(i => i !== item);
                } else {
                    addToSelection(item);
                }
                setPrompt(`${state.pendingCommand}: Selecciona objetos — ${state.selectedItems.length} encontrado(s) (Enter para terminar)`);
                return;
            }
            if (state.selectedItems.includes(item)) {
                state.isDragging = true;
                state.dragStartPoint = event.point;
                state.originalPositions = state.selectedItems.map(it => it.position.clone());
                state.hasMoved = false;
                state.dynamicLastPoint = event.point;
            } else {
                setSingleSelection(item);
                state.isDragging = true;
                state.dragStartPoint = event.point;
                state.originalPositions = [item.position.clone()];
                state.hasMoved = false;
                state.dynamicLastPoint = event.point;
            }
            setPrompt(`Seleccionados: ${state.selectedItems.length}`);
        } else {
            if (!state.pendingCommand) clearSelection();
            state.selecting = true;
            state.selectStartPoint = event.point;
            state.selectMode = 'window';
            state.selectionRect = new Rectangle(event.point, event.point);
            drawSelectionRect();
        }
    }

    function onMouseDrag(event) {
        state.lastMousePoint = event.point;
        state.lastClientX = event.event.clientX;
        state.lastClientY = event.event.clientY;
        updateCoords(event.point);

        if (state.pickingPrintWindow) {
            if (!state.printPickStart) return;
            state.printPickRect = new Rectangle(state.printPickStart, event.point);
            selectionLayer.removeChildren();
            const rectPath = new Path.Rectangle(state.printPickRect);
            rectPath.strokeColor = new Color('#4FC3F7');
            rectPath.strokeWidth = 1.5 / view.zoom;
            rectPath.dashArray = [6 / view.zoom, 4 / view.zoom];
            rectPath.fillColor = new Color(0.31, 0.76, 0.97, 0.08);
            selectionLayer.addChild(rectPath);
            return;
        }
        if (state.panning) {
            const delta = event.point.subtract(state.panStartPoint);
            view.center = view.center.subtract(delta);
            state.panStartPoint = event.point;
            drawGridThrottled();
            return;
        }
        updateDynamicPreview(event);

        if (state.gripDrag) {
            const grip = state.gripDrag;
            const item = grip.item;
            if (grip.type === 'segment') {
                let base = null;
                if (item.segments.length === 2) base = item.segments[1 - grip.index].point;
                const resolved = resolvePoint(event.point, base, 'LINE', [item]);
                item.segments[grip.index].point = resolved;
                renderTrackingGuides(state.trackGuides, resolved);
                const text = base ?
                    `Distancia: ${base.getDistance(resolved).toFixed(3)}  ∠: ${(-(resolved.subtract(base).angle)).toFixed(1)}°` :
                    `X: ${resolved.x.toFixed(3)}, Y: ${(-resolved.y).toFixed(3)}`;
                showTooltipAt(event.event.clientX, event.event.clientY, text);
            } else if (grip.type === 'move') {
                const delta = event.point.subtract(state.gripDragStart);
                item.segments.forEach((s, i) => { s.point = state.gripOriginalSegments[i].add(delta); });
                showTooltipAt(event.event.clientX, event.event.clientY, `Distancia: ${delta.length.toFixed(3)}  ∠: ${delta.length > 0 ? (-delta.angle).toFixed(1) : 0}°`);
            } else if (grip.type === 'circle-center') {
                const resolved = resolvePoint(event.point, null, 'MOVE', [item]);
                item.position = resolved;
                showTooltipAt(event.event.clientX, event.event.clientY, `X: ${resolved.x.toFixed(3)}, Y: ${(-resolved.y).toFixed(3)}`);
            } else if (grip.type === 'circle-radius') {
                const resolved = resolvePoint(event.point, item.position, 'LINE', [item]);
                const newR = item.position.getDistance(resolved);
                if (newR > 0.001) {
                    const newItem = resizeCircle(item, newR);
                    state.gripDrag.item = newItem;
                }
