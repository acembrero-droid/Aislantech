<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Pro – Exportación DXF R12 (AutoCAD compatible)</title>
    <style>
        /* ===== Paleta oscura estilo AutoCAD ===== */
        :root {
            --bg-main: #1A1A1A;
            --bg-canvas: #16181A;
            --bg-ribbon: #232323;
            --bg-ribbon-2: #2A2A2A;
            --bg-panel: #262626;
            --bg-button: #333333;
            --bg-hover: #3E3E3E;
            --bg-pressed: #1567C4;
            --bg-selection: #1567C4;
            --text-primary: #D9D9D9;
            --text-secondary: #8C8C8C;
            --text-dim: #6B6B6B;
            --border-color: #383838;
            --border-light: #454545;
            --accent-blue: #4FC3F7;
            --accent-amber: #E8A33D;
            --accent-green: #57C46B;
            --shadow: 0 3px 10px rgba(0,0,0,0.5);
            --transition: all 0.12s ease;
            --font-ui: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Cascadia Mono', 'Consolas', 'SF Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-ui);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            font-size: 13px;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        /* ===== Barra de acceso rápido ===== */
        #quick-access {
            background: linear-gradient(to bottom, #2C2C2C, #202020);
            border-bottom: 1px solid var(--border-color);
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 2px;
            height: 30px;
        }
        #quick-access .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 10px;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.4px;
        }
        #quick-access .brand svg { width: 16px; height: 16px; }
        #quick-access button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            width: 26px;
            height: 24px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        #quick-access button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        #quick-access button:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
        #quick-access button:active { background: var(--bg-pressed); color: #fff; }
        #quick-access .separator { width: 1px; height: 18px; background: var(--border-color); margin: 0 6px; }
        #quick-access .file-input-hidden { display: none; }

        /* ===== Ribbon ===== */
        #ribbon {
            background: var(--bg-ribbon);
            border-bottom: 1px solid var(--border-color);
            padding: 0 8px;
            display: flex;
            flex-direction: column;
        }
        #ribbon-tabs {
            display: flex;
            gap: 2px;
            padding: 5px 0 0 2px;
            height: 26px;
            align-items: flex-end;
        }
        #ribbon-tabs button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 5px 14px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px 3px 0 0;
            transition: var(--transition);
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        #ribbon-tabs button:hover { background: var(--bg-hover); color: var(--text-primary); }
        #ribbon-tabs button.active { background: var(--bg-panel); color: var(--accent-blue); box-shadow: inset 0 -2px 0 var(--accent-blue); }
        #ribbon-content {
            background: var(--bg-panel);
            padding: 5px 10px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-wrap: wrap;
            gap: 2px 8px;
            min-height: 50px;
            align-items: stretch;
        }
        .ribbon-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 2px 10px 0;
            border-right: 1px solid var(--border-color);
        }
        .ribbon-group:last-child { border-right: none; }
        .ribbon-group .ribbon-group-btns { display: flex; align-items: flex-start; gap: 1px; }
        .ribbon-group label {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.6px;
            font-weight: 600;
            order: 2;
            width: 100%;
            text-align: center;
        }
        .ribbon-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-primary);
            padding: 4px 9px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9.5px;
            transition: var(--transition);
            min-width: 42px;
            gap: 3px;
            position: relative;
        }
        .ribbon-btn svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ribbon-btn svg.fill { fill: currentColor; stroke: none; }
        .ribbon-btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
        .ribbon-btn.active { background: var(--bg-selection); color: white; border-color: var(--bg-selection); }
        .ribbon-btn .tooltip {
            display: none;
            position: absolute;
            top: 100%;
            margin-top: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: #eee;
            padding: 3px 8px;
            border: 1px solid var(--border-light);
            border-radius: 3px;
            font-size: 10px;
            font-family: var(--font-mono);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1000;
            box-shadow: var(--shadow);
        }
        .ribbon-btn:hover .tooltip { display: block; }

        /* ===== Flyout de la cinta (botones con menú desplegable) ===== */
        .ribbon-flyout { position: relative; }
        .ribbon-flyout-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            margin-bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            box-shadow: var(--shadow);
            padding: 4px;
            min-width: 150px;
            z-index: 1000;
        }
        .ribbon-flyout-menu.open { display: block; }
        .ribbon-flyout-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11.5px;
            text-align: left;
            white-space: nowrap;
        }
        .ribbon-flyout-menu button:hover { background: var(--bg-hover); }
        .ribbon-flyout-menu button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .ribbon-flyout-menu button .fk { margin-left: auto; color: var(--text-dim); font-family: var(--font-mono); font-size: 10px; }

        /* ===== Layout principal ===== */
        #main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ===== Panel de capas ===== */
        #layer-panel {
            width: 200px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        #layer-panel h3 {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.7px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #layer-panel h3 button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        #layer-panel h3 button:hover { color: var(--text-primary); }
        #layer-list {
            list-style: none;
            flex: 1;
            overflow-y: auto;
        }
        #layer-list li {
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: var(--transition);
            margin-bottom: 1px;
        }
        #layer-list li:hover { background: var(--bg-hover); }
        #layer-list li.active { background: var(--bg-selection); color: white; }
        #layer-list li .color-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            cursor: pointer;
        }
        #layer-list li .color-swatch:hover { transform: scale(1.1); }
        #layer-list li .layer-name { flex: 1; }
        #layer-list li .layer-controls { display: flex; gap: 2px; }
        #layer-list li .layer-controls button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 0 2px;
            transition: var(--transition);
        }
        #layer-list li .layer-controls button:hover { color: var(--text-primary); }

        /* ===== Canvas ===== */
        #canvas-container {
            flex: 1;
            position: relative;
            background: var(--bg-main);
            overflow: hidden;
        }
        #myCanvas { width: 100%; height: 100%; display: block; cursor: none; background: var(--bg-canvas); }

        /* ===== Menú contextual (clic derecho) ===== */
        #context-menu {
            position: fixed;
            display: none;
            z-index: 2000;
            background: #232323;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            box-shadow: var(--shadow);
            padding: 4px;
            min-width: 190px;
            font-size: 12px;
        }
        #context-menu .cm-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 10px;
            border-radius: 3px;
            color: var(--text-primary);
            cursor: pointer;
            white-space: nowrap;
        }
        #context-menu .cm-item:hover { background: var(--bg-selection); color: #fff; }
        #context-menu .cm-item.disabled { color: var(--text-dim); cursor: default; }
        #context-menu .cm-item.disabled:hover { background: transparent; color: var(--text-dim); }
        #context-menu .cm-key { color: var(--text-dim); font-family: var(--font-mono); font-size: 10.5px; }
        #context-menu .cm-item:hover .cm-key { color: rgba(255,255,255,0.75); }
        #context-menu .cm-sep { height: 1px; background: var(--border-color); margin: 4px 2px; }

        /* ===== Panel de propiedades (interactivo) ===== */
        #properties-panel {
            width: 280px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            padding: 10px 12px;
            flex-shrink: 0;
            overflow-y: auto;
            display: none;
        }
        #properties-panel.visible {
            display: block;
            animation: slideIn 0.2s ease;
        }
        #properties-panel h3 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .prop-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }
        .prop-label { color: var(--text-secondary); flex: 0 0 80px; }
        .prop-value {
            flex: 1;
            text-align: right;
            color: var(--text-primary);
            font-weight: 500;
        }
        .prop-value select,
        .prop-value input {
            background: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 2px 4px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .prop-value input[type="color"] {
            padding: 0;
            height: 24px;
            width: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .prop-value input[type="number"] {
            width: 80px;
            text-align: right;
        }
        .prop-value .coord-group {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }
        .prop-value .coord-group input {
            width: 60px;
        }

        /* ===== Barra inferior ===== */
        #status-bar {
            height: 28px;
            background: var(--bg-ribbon);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 2px;
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        #status-bar .status-group { display: flex; align-items: center; gap: 2px; }
        #status-bar .status-group .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
        #status-bar .status-group button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 3px 9px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: var(--transition);
        }
        #status-bar .status-group button:hover { background: var(--bg-hover); color: var(--text-primary); }
        #status-bar .status-group button.active { background: rgba(79,195,247,0.15); border-color: var(--accent-blue); color: var(--accent-blue); }
        #status-bar .status-group button svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; margin-right: 4px; }
        #status-bar .status-sep { width: 1px; height: 16px; background: var(--border-color); margin: 0 6px; flex-shrink: 0; }
        #status-bar .coords {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-primary);
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 3px 10px;
            flex-shrink: 0;
        }
        #status-bar .status-scroll {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto;
            overflow: hidden;
        }
        #status-bar .zoom-indicator { font-size: 11px; color: var(--text-secondary); margin-left: 10px; font-family: var(--font-mono); flex-shrink: 0; }
        #cmd-history-toggle {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 3px 7px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        #cmd-history-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
        #cmd-history-toggle.active { color: var(--accent-blue); border-color: var(--accent-blue); }

        /* ===== Ventana de texto de comandos (F2), estilo AutoCAD ===== */
        #cmd-history-panel {
            position: fixed;
            left: 0; right: 0;
            bottom: 54px;
            height: 240px;
            background: #0c0c0c;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -6px 18px rgba(0,0,0,0.5);
            z-index: 900;
            display: none;
            flex-direction: column;
        }
        #cmd-history-panel.open { display: flex; }
        #cmd-history-panel .cmh-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            background: var(--bg-ribbon);
            border-bottom: 1px solid var(--border-color);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            flex-shrink: 0;
        }
        #cmd-history-panel .cmh-head button { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; }
        #cmd-history-panel .cmh-head button:hover { color: var(--text-primary); }
        #cmd-history-panel .cmh-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #b9b9b9;
            line-height: 1.6;
        }
        #cmd-history-panel .cmh-body div:last-child { color: var(--accent-blue); }

        /* ===== Línea de comandos ===== */
        #command-line {
            height: 26px;
            background: #101010;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
        }
        #cmd-prompt {
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 12.5px;
            font-family: var(--font-mono);
            min-width: 66px;
        }
        #cmd-input {
            flex: 1;
            background: transparent;
            color: var(--text-primary);
            border: none;
            outline: none;
            font-size: 12.5px;
            font-family: var(--font-mono);
            padding: 2px 0;
            letter-spacing: 0.2px;
        }
        #cmd-input::placeholder { color: var(--text-dim); }
        #cmd-status {
            color: var(--text-dim);
            font-size: 11px;
            font-family: var(--font-mono);
            min-width: 100px;
            text-align: right;
        }

        /* ===== Mini mapa (Navigator) ===== */
        #navigator {
            position: absolute;
            bottom: 40px;
            right: 16px;
            width: 150px;
            height: 120px;
            background: rgba(30,30,30,0.85);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            z-index: 100;
            box-shadow: var(--shadow);
            display: none;
        }
        #navigator canvas { width: 100%; height: 100%; display: block; }
        #navigator.visible { display: block; animation: fadeIn 0.2s ease; }

        /* ===== Crosshair (estilo AutoCAD, líneas a pantalla completa) ===== */
        .crosshair {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 50;
            display: none;
        }
        .crosshair-line {
            position: absolute;
            background: rgba(217,217,217,0.45);
        }
        .crosshair-line.h { width: 100vw; height: 1px; left: 0; }
        .crosshair-line.v { width: 1px; height: 100vh; top: 0; }
        .crosshair-box {
            position: absolute;
            width: 9px;
            height: 9px;
            margin: -5px 0 0 -5px;
            border: 1px solid var(--accent-blue);
            background: rgba(79,195,247,0.10);
        }

        /* ===== Color picker oculto ===== */
        #color-picker-hidden { display: none; position: fixed; z-index: 9999; }

        /* ===== Animaciones ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .fade-in { animation: fadeIn 0.15s ease; }
        .slide-in { animation: slideIn 0.2s ease; }

        /* ===== Responsive ===== */
        @media (max-width: 1024px) {
            #layer-panel { width: 160px; }
            #properties-panel { width: 220px; }
            #ribbon-content { gap: 4px 10px; padding: 4px 6px; }
            .ribbon-btn { min-width: 34px; padding: 2px 4px; }
            .ribbon-btn svg { width: 16px; height: 16px; }
        }
        @media (max-width: 768px) {
            #layer-panel, #properties-panel { display: none; }
            #ribbon-tabs button { font-size: 10px; padding: 2px 8px; }
            .ribbon-group label { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== Barra de acceso rápido ===== -->
    <div id="quick-access">
        <span class="brand">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 15V9l4 6V9l4 6"/></svg>
            CAD&nbsp;Pro
        </span>
        <div class="separator"></div>
        <button title="Nuevo (Ctrl+N)"><svg viewBox="0 0 24 24"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/></svg></button>
        <button id="qa-open" title="Importar DXF (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
        <button id="qa-save" title="Exportar DXF (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg></button>
        <div class="separator"></div>
        <button id="qa-undo" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M3 11h11a5 5 0 0 1 0 10h-3"/><path d="M8 6 3 11l5 5"/></svg></button>
        <button id="qa-redo" title="Rehacer (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M21 11H10a5 5 0 0 0 0 10h3"/><path d="M16 6l5 5-5 5"/></svg></button>
        <div class="separator"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js">
    </script>
    <script>
        // ============================================================
        //  PAPER.JS SETUP
        // ============================================================
        paper.setup('myCanvas');
        paper.settings.handleSize = 7;
        const {
            project,
            view,
            Path,
            Point,
            Group,
            Layer,
            Rectangle,
            Color,
            PointText,
            Size
        } = paper;
        project.selectedColor = new Color(0.31, 0.76, 0.97); // grips estilo AutoCAD

        // ============================================================
        //  CAPAS
        // ============================================================
        const layers = {};

        function safeName(original) {
            let name = original.replace(/[^a-zA-Z0-9_\-]/g, '_');
            if (/^\d/.test(name)) name = 'L_' + name;
            return name;
        }

        function createLayer(originalName, color = '#FFFFFF') {
            const internal = safeName(originalName);
            if (layers[internal]) return layers[internal];
            const layer = new Layer();
            layer.name = internal;
            layer.data = { originalName: internal, visible: true, locked: false, color: color };
            project.addLayer(layer);
            layers[internal] = layer;
            return layer;
        }
        const defaultLayer = createLayer('0', '#FFFFFF');

        // Capas especiales
        const gridLayer = new Layer();
        gridLayer.name = 'grid';
        project.addLayer(gridLayer);
        gridLayer.sendToBack();

        const guideLayer = new Layer();
        guideLayer.name = 'guides';
        project.addLayer(guideLayer);

        const snapLayer = new Layer();
        snapLayer.name = 'snaps';
        project.addLayer(snapLayer);

        const selectionLayer = new Layer();
        selectionLayer.name = 'selection';
        project.addLayer(selectionLayer);

        const previewLayer = new Layer();
        previewLayer.name = 'preview';
        project.addLayer(previewLayer);

        const gripLayer = new Layer();
        gripLayer.name = 'grips';
        project.addLayer(gripLayer);

        let activeLayer = defaultLayer;
        project.activeLayer = activeLayer;

        // ============================================================
        //  DETECCIÓN DE TIPO DE ENTIDAD
        // ============================================================
        function isLineItem(item) {
            return !!(item && item.data && item.data.shapeType === 'line');
        }
        function isCircleItem(item) {
            return !!(item && item.data && item.data.shapeType === 'circle');
        }
        function isPolylineItem(item) {
            return !!(item && item.data && item.data.shapeType === 'polyline');
        }
        function isArcItem(item) {
            return !!(item && item.data && item.data.shapeType === 'arc');
        }
        function tagShape(item, shapeType) {
            if (!item.data) item.data = {};
            item.data.shapeType = shapeType;
            return item;
        }

        // Los círculos se crean con Path.Circle (una aproximación bezier, sin una
        // propiedad "radio" real ni redimensionable). El radio se guarda de forma
        // persistente en item.data.radius, y para cambiar el tamaño hay que
        // reconstruir la geometría con esta función.
        function getCircleRadius(item) {
            if (item && item.data && typeof item.data.radius === 'number') return item.data.radius;
            return item && item.bounds ? item.bounds.width / 2 : 0;
        }
        function resizeCircle(item, newRadius) {
            if (newRadius <= 0) return item;
            const wasSelected = state.selectedItems.includes(item);
            const newCircle = new Path.Circle(item.position, newRadius);
            newCircle.data = Object.assign({}, item.data, { radius: newRadius });
            newCircle.strokeColor = item.strokeColor;
            newCircle.strokeWidth = item.strokeWidth;
            newCircle.fillColor = item.fillColor;
            item.parent.insertChild(item.index, newCircle);
            item.remove();
            if (wasSelected) {
                state.selectedItems = state.selectedItems.map(i => i === item ? newCircle : i);
                newCircle.selected = true;
                newCircle.shadowColor = new Color('#00BFFF');
                newCircle.shadowBlur = 8;
                newCircle.shadowOffset = new Point(0, 0);
            }
            return newCircle;
        }

        // ============================================================
        //  ESTADO GLOBAL
        // ============================================================
        const state = {
            currentCommand: null,
            step: 0,
            collectedPoints: [],
            selectedItems: [],
            basePoint: null,
            originalPositions: [],
            dragStartPoint: null,
            isDragging: false,
            hasMoved: false,
            selecting: false,
            selectionRect: null,
            selectStartPoint: null,
            selectMode: 'window',
            ortho: false,
            polar: false,
            polarIncrement: 15,
            lwt: false,
            snapEnabled: true,
            lastMousePoint: new Point(0, 0),
            expectingPoint: false,
            dynamicLastPoint: null,
            panning: false,
            panStartPoint: null,
            commandHistory: [],
            historyIdx: -1,
            cmdLog: [],
            gridVisible: true,
            history: [],
            redoStack: [],
            trimBoundary: null,
            extendBoundary: null,
            startAngle: 0,
            referencePoint: null,
            waitingForNumber: false,
            offsetDistance: 0,
            offsetTarget: null,
            offsetSide: null,
            lastCommand: null,
            shiftKeyDown: false,
            trackGuides: null,
            pendingCommand: null,
            copySourceItems: [],
            gripDrag: null,
            gripDragStart: null,
            gripOriginalSegments: null,
            hoveredItem: null,
        };

        // ============================================================
        //  GROSOR DE LÍNEA CONSTANTE EN PANTALLA (independiente del zoom)
        // ============================================================
        const LINE_WEIGHT_PX = 1.3;
        const LWT_WEIGHT_MULTIPLIER = 2.4;
        function currentStrokeWidth() {
            return (LINE_WEIGHT_PX * (state.lwt ? LWT_WEIGHT_MULTIPLIER : 1)) / view.zoom;
        }
        function refreshStrokeWidths() {
            const w = currentStrokeWidth();
            for (let internal in layers) {
                const layer = layers[internal];
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer ||
                    layer === selectionLayer || layer === previewLayer || layer === gripLayer) continue;
                layer.children.forEach(item => { item.strokeWidth = w; });
            }
        }

        // ============================================================
        //  UI: RIBBON Y PANELES
        // ============================================================
        document.querySelectorAll('#ribbon-tabs button').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('#ribbon-tabs button').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabName = tab.dataset.tab;
                document.querySelectorAll('.ribbon-group').forEach(g => {
                    g.style.display = (g.dataset.tab === tabName) ? 'flex' : 'none';
                });
            });
        });

        document.querySelectorAll('.ribbon-btn[data-cmd]').forEach(btn => {
            btn.addEventListener('click', () => {
                const cmd = btn.dataset.cmd;
                if (cmd === 'TRIM' || cmd === 'EXTEND') {
                    if (!state.selectedItems.length) {
                        setPrompt('Selecciona un objeto como límite');
                        return;
                    }
                }
                if (cmd === 'JOIN') {
                    if (!state.selectedItems.length || state.selectedItems.length < 2) {
                        setPrompt('Selecciona al menos dos líneas/polilíneas');
                        return;
                    }
                }
                executeCommand(cmd);
                document.querySelectorAll('.ribbon-btn[data-cmd]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        const moreModifyBtn = document.getElementById('ribbon-more-modify');
        const moreModifyMenu = document.getElementById('ribbon-more-modify-menu');
        if (moreModifyBtn && moreModifyMenu) {
            moreModifyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = moreModifyMenu.classList.toggle('open');
                moreModifyBtn.classList.toggle('active', isOpen);
            });
            moreModifyMenu.querySelectorAll('[data-cmd]').forEach(opt => {
                opt.addEventListener('click', () => {
                    moreModifyMenu.classList.remove('open');
                    moreModifyBtn.classList.remove('active');
                    executeCommand(opt.dataset.cmd);
                });
            });
            document.addEventListener('click', () => {
                moreModifyMenu.classList.remove('open');
                moreModifyBtn.classList.remove('active');
            });
        }

        // ============================================================
        //  PANEL DE CAPAS
        // ============================================================
        function renderLayerList() {
            const list = document.getElementById('layer-list');
            list.innerHTML = '';
            for (let internal in layers) {
                const layer = layers[internal];
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                    layer === previewLayer || layer === gripLayer) continue;
                const li = document.createElement('li');
                if (layer === activeLayer) li.classList.add('active');
                if (!layer.data.visible) li.style.opacity = '0.4';
                const color = layer.data.color || '#FFFFFF';
                li.innerHTML = `
                    <span class="color-swatch" style="background:${color}" data-internal="${internal}"></span>
                    <span class="layer-name">${layer.data.originalName}</span>
                    <span class="layer-controls">
                        <button class="vis-toggle" title="Visibilidad">${layer.data.visible ? '👁' : '🚫'}</button>
                        <button class="lock-toggle" title="Bloquear">${layer.data.locked ? '🔒' : '🔓'}</button>
                    </span>
                `;
                li.addEventListener('click', (e) => {
                    if (e.target.closest('button') || e.target.closest('.color-swatch')) return;
                    setActiveLayer(internal);
                });
                const swatch = li.querySelector('.color-swatch');
                swatch.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const picker = document.getElementById('color-picker-hidden');
                    picker.value = layer.data.color || '#FFFFFF';
                    picker.style.display = 'block';
                    picker.focus();
                    picker.click();
                    picker.oninput = () => {
                        layer.data.color = picker.value;
                        swatch.style.background = picker.value;
                        renderLayerList();
                    };
                    picker.onblur = () => {
                        picker.style.display = 'none';
                        picker.oninput = null;
                    };
                });
                li.querySelector('.vis-toggle').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleLayerVisibility(internal);
                });
                li.querySelector('.lock-toggle').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleLayerLock(internal);
                });
                list.appendChild(li);
            }
            document.getElementById('current-layer-name').textContent = activeLayer.data.originalName;
            updateLayerSelect();
        }

        function setActiveLayer(internal) {
            if (layers[internal]) {
                activeLayer = layers[internal];
                project.activeLayer = activeLayer;
                renderLayerList();
                updateProperties();
            }
        }

        function toggleLayerVisibility(internal) {
            const l = layers[internal];
            l.data.visible = !l.data.visible;
            l.visible = l.data.visible;
            renderLayerList();
        }

        function toggleLayerLock(internal) {
            const l = layers[internal];
            l.data.locked = !l.data.locked;
            renderLayerList();
        }

        document.getElementById('add-layer-btn').addEventListener('click', () => {
            const name = prompt('Nombre de la nueva capa:');
            if (name) {
                const safe = safeName(name);
                if (!layers[safe]) {
                    const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6', '#FF9F43', '#00D2D3', '#54A0FF'];
                    const col = colors[Object.keys(layers).length % colors.length];
                    createLayer(safe, col);
                    setActiveLayer(safe);
                    renderLayerList();
                } else alert('La capa ya existe');
            }
        });

        // ============================================================
        //  PANEL DE PROPIEDADES INTERACTIVO
        // ============================================================
        function updateProperties() {
            const panel = document.getElementById('properties-panel');
            const sel = state.selectedItems;
            if (sel.length === 0) {
                panel.classList.remove('visible');
                return;
            }
            panel.classList.add('visible');
            const item = sel[0];
            const container = document.getElementById('props-content');
            container.innerHTML = '';

            // --- Capa (select) ---

            layerRow.className = 'prop-row';
            layerRow.innerHTML = `<span class="prop-label">Capa</span>`;
            const layerSelect = document.createElement('select');
            layerSelect.className = 'prop-value';
            for (let internal in layers) {
                const l = layers[internal];
                if (l === gridLayer || l === guideLayer || l === snapLayer || l === selectionLayer || l === previewLayer)
                    continue;
                const opt = document.createElement('option');
                opt.value = internal;
                opt.textContent = l.data.originalName;
                if (item.layer && item.layer.name === internal) opt.selected = true;
                layerSelect.appendChild(opt);
            }
            layerSelect.addEventListener('change', (e) => {
                const newLayer = layers[e.target.value];
                if (newLayer && !newLayer.data.locked) {
                    saveState();
                    item.layer = newLayer;
                    renderLayerList();
                    updateProperties();
                } else {
                    setPrompt('Capa bloqueada o no existe');
                }

            layerRow.appendChild(layerSelect);
            container.appendChild(layerRow);

            // --- Color (strokeColor) ---

            colorInput.className = 'prop-value';
            colorInput.value = item.strokeColor ? item.strokeColor.toCSS(true) : '#FFFFFF';
            colorInput.addEventListener('input', (e) => {

            // --- Tipo y otros datos (solo lectura) ---

                container.appendChild(startRow);

                const startYRow = document.createElement('div');
                startYRow.className = 'prop-row';

                startY.className = 'prop-value';

                cx.addEventListener('change', () => {

                rad.addEventListener('change', () => {
                    const val = parseFloat(rad.value);
                    if (!isNaN(val) && val > 0) {

        function updateLayerSelect() {
            const selects = document.querySelectorAll('#props-content select');
            selects.forEach(sel => {
                const currentLayer = state.selectedItems[0]?.layer;
                if (currentLayer) {
                    for (let opt of sel.options) {
                        if (opt.value === currentLayer.name) {
                            opt.selected = true;
                            break;
                        }
                    }
                }
            });
        }

        // ============================================================
        //  PROMPT Y ESTADO
        // ============================================================
        const promptEl = document.getElementById('cmd-prompt');
        const statusEl = document.getElementById('cmd-status');

        function setPrompt(text) {
            if (promptEl) promptEl.textContent = text + ' ';
            if (statusEl) statusEl.textContent = text;
            const oldStatus = document.getElementById('status');
            if (oldStatus) oldStatus.textContent = text;
            state.cmdLog.push(text);
            if (state.cmdLog.length > 300) state.cmdLog.shift();
            const body = document.getElementById('cmd-history-body');
            if (body && document.getElementById('cmd-history-panel').classList.contains('open')) {
                renderCmdHistory();
            }
        }

        function renderCmdHistory() {
            const body = document.getElementById('cmd-history-body');
            if (!body) return;
            body.innerHTML = state.cmdLog.map(l => `<div>${l.replace(/</g, '&lt;')}</div>`).join('');
            body.scrollTop = body.scrollHeight;
        }

        function resetStateCmd() {
            state.currentCommand = null;
            state.step = 0;
            state.collectedPoints = [];
            state.basePoint = null;
            state.expectingPoint = false;
            state.dynamicLastPoint = null;
            state.originalPositions = [];
            state.isDragging = false;
            state.hasMoved = false;
            state.selecting = false;
            state.trimBoundary = null;
            state.extendBoundary = null;
            state.waitingForNumber = false;
            state.offsetDistance = 0;
            highlightOffsetTarget(state.offsetTarget, false);
            state.offsetTarget = null;
            state.pendingCommand = null;
            state.copySourceItems = [];
            if (state.selectionRect) { state.selectionRect.remove();
                state.selectionRect = null; }
            guideLayer.removeChildren();
            selectionLayer.removeChildren();
            previewLayer.removeChildren();
            document.getElementById('dynamic-tooltip').style.display = 'none';
            setPrompt('Comando:');
            document.getElementById('cmd-input').value = '';
            document.querySelectorAll('.ribbon-btn[data-cmd]').forEach(b => b.classList.remove('active'));
            renderGrips();
        }

        function clearSelection() {
            state.selectedItems.forEach(i => {
                i.selected = false;
                i.shadowColor = null;
            });
            state.selectedItems = [];
            updateProperties();
            renderGrips();
        }

        function addToSelection(item) {
            if (!state.selectedItems.includes(item)) {
                state.selectedItems.push(item);
                item.selected = true;
                item.shadowColor = new Color('#00BFFF');
                item.shadowBlur = 8;
                item.shadowOffset = new Point(0, 0);
            }
            updateProperties();
            renderGrips();
        }

        function setSingleSelection(item) {
            clearSelection();
            if (item) {
                state.selectedItems.push(item);
                item.selected = true;
                item.shadowColor = new Color('#00BFFF');
                item.shadowBlur = 8;
                item.shadowOffset = new Point(0, 0);
                updateProperties();
            }
            renderGrips();
        }

        // ============================================================
        //  GRIPS (pinzamientos) — edición directa como en AutoCAD: al
        //  seleccionar un objeto (sin ningún comando activo) aparecen
        //  cuadraditos azules en sus puntos clave que se pueden arrastrar
        //  para reformar la geometría sin invocar ningún comando.
        // ============================================================
        function addGripMarker(point, data) {
            const r = 4.5 / view.zoom;
            const marker = new Path.Rectangle(new paper.Rectangle(point.x - r, point.y - r, r * 2, r * 2));
            const isHot = state.gripDrag && state.gripDrag.item === data.item &&
                state.gripDrag.type === data.type && state.gripDrag.index === data.index;
            marker.strokeColor = new Color('#0B5FA5');
            marker.strokeWidth = 1 / view.zoom;
            marker.fillColor = isHot ? new Color('#FF6A00') : new Color('#2196F3');
            marker.data.grip = data;
            gripLayer.addChild(marker);
        }

        function renderGrips() {
            gripLayer.removeChildren();
            if (state.currentCommand || state.pendingCommand) return;
            if (!state.selectedItems.length) return;
            state.selectedItems.forEach(item => {
                if (!item || !item.layer) return;
                if (isCircleItem(item)) {
                    addGripMarker(item.position, { item, type: 'circle-center', index: -1 });
                    const r = getCircleRadius(item);
                    addGripMarker(item.position.add(new Point(r, 0)), { item, type: 'circle-radius', index: 0 });
                } else if (item instanceof Path && item.segments && item.segments.length) {
                    const segs = item.segments;
                    segs.forEach((seg, idx) => {
                        addGripMarker(seg.point, { item, type: 'segment', index: idx });
                    });
                    if (segs.length === 2 && !item.closed) {
                        const mid = segs[0].point.add(segs[1].point).divide(2);
                        addGripMarker(mid, { item, type: 'move', index: -1 });
                    }
                }
            });
        }

        // ============================================================
        //  FLUJO "VERBO-SUSTANTIVO" (como en AutoCAD): si el comando de
        //  edición se invoca sin nada seleccionado, se entra en modo
        //  "Selecciona objetos" y se confirma con Enter/Espacio.
        // ============================================================
        function beginModifyCommand(cmd, promptText) {
            if (state.selectedItems.length) {
                proceedModifyCommand(cmd);
            } else {
                resetStateCmd();
                state.currentCommand = cmd;
                state.pendingCommand = cmd;
                state.expectingPoint = false;
                setPrompt(`${promptText}: Selecciona objetos (Enter para terminar)`);
            }
        }

        function finalizePendingSelection() {
            const cmd = state.pendingCommand;
            if (!cmd) return false;
            state.pendingCommand = null;
            if (!state.selectedItems.length) {
                setPrompt('0 objetos seleccionados. Comando cancelado.');
                state.currentCommand = null;
                return true;
            }
            proceedModifyCommand(cmd);
            return true;
        }

        function proceedModifyCommand(cmd) {
            switch (cmd) {
                case 'MOVE':
                    startCommand('MOVE', 'MOVE: Punto base');
                    break;
                case 'COPY':
                    startCommand('COPY', 'COPY: Punto base');
                    break;
                case 'ROTATE':
                    startCommand('ROTATE', 'ROTATE: Punto base');
                    break;
                case 'SCALE':
                    startCommand('SCALE', 'SCALE: Punto base');
                    break;
                case 'ERASE':
                    saveState();
                    state.selectedItems.forEach(i => i.remove());
                    clearSelection();
                    state.currentCommand = null;
                    setPrompt('Objetos borrados');
                    break;
                case 'JOIN':
                    joinSelected();
                    state.currentCommand = null;
                    renderGrips();
                    break;
                case 'TRIM':
                    state.trimBoundary = state.selectedItems.slice();
                    clearSelection();
                    state.currentCommand = 'TRIM';
                    state.step = 1;
                    state.expectingPoint = false;
                    setPrompt('TRIM: Haz clic en la parte a recortar (Enter/ESC para salir)');
                    break;
                case 'EXTEND':
                    state.extendBoundary = state.selectedItems.slice();
                    clearSelection();
                    state.currentCommand = 'EXTEND';
                    state.step = 1;
                    state.expectingPoint = false;
                    setPrompt('EXTEND: Haz clic en el extremo a extender (Enter/ESC para salir)');
                    break;
            }
        }

        // ============================================================
        //  HIT-TEST DE OBJETOS DEL DIBUJO
        // ============================================================
        function hitTestContent(pt, extraOptions) {
            const options = Object.assign({
                tolerance: 8 / view.zoom,
                stroke: true,
                fill: true,
                segments: true,
                match: (result) => {
                    const l = result.item.layer;
                    return l !== gridLayer && l !== guideLayer && l !== snapLayer && l !== selectionLayer &&
                        l !== previewLayer && l !== gripLayer;
                }
            }, extraOptions || {});
            return project.hitTest(pt, options);
        }

        function getSnapPoint(mousePoint, excludeItems) {
            if (!state.snapEnabled) return null;
            const tol = 10 / view.zoom;
            let best = null,
                bestDist = tol,
                bestType = null;
            for (let internal in layers) {
                const layer = layers[internal];
                if (!layer.data.visible || layer.data.locked) continue;
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                    layer === previewLayer || layer === gripLayer) continue;
                layer.children.forEach(item => {
                    if (excludeItems && excludeItems.includes(item)) return;
                    if (item instanceof Path) {
                        item.segments.forEach(seg => {
                            const d = seg.point.getDistance(mousePoint);
                            if (d < bestDist) { bestDist = d;
                                best = seg.point; bestType = 'endpoint'; }
                        });
                        for (let i = 0; i < item.segments.length; i++) {
                            const s1 = item.segments[i],
                                s2 = item.segments[(i + 1) % item.segments.length];
                            if (s1.handleOut.length === 0 && s2.handleIn.length === 0) {
                                const mid = s1.point.add(s2.point).divide(2);
                                const d = mid.getDistance(mousePoint);
                                if (d < bestDist) { bestDist = d;
                                    best = mid; bestType = 'midpoint'; }
                            }
                        }
                    }
                    if (isCircleItem(item)) {
                        const d = item.position.getDistance(mousePoint);
                        if (d < bestDist) { bestDist = d;
                            best = item.position; bestType = 'center'; }
                    }
                });
            }
            if (!best) return null;
            return { point: best, type: bestType };
        }

        // ============================================================
        //  RASTREO DE PUNTOS (OBJECT SNAP TRACKING, estilo AutoCAD)
        //  Detecta si el cursor está alineado en X o en Y con algún
        //  punto clave del dibujo (extremo, punto medio o centro) y
        //  devuelve las guías de alineación encontradas.
        // ============================================================
        function collectKeyPoints(excludeItems) {
            const pts = [];
            for (let internal in layers) {
                const layer = layers[internal];
                if (!layer.data.visible || layer.data.locked) continue;
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                    layer === previewLayer || layer === gripLayer) continue;
                layer.children.forEach(item => {
                    if (excludeItems && excludeItems.includes(item)) return;
                    if (item instanceof Path) {
                        item.segments.forEach(seg => pts.push(seg.point));
                        for (let i = 0; i < item.segments.length; i++) {
                            const s1 = item.segments[i],
                                s2 = item.segments[(i + 1) % item.segments.length];
                            if (s1.handleOut.length === 0 && s2.handleIn.length === 0) {
                                pts.push(s1.point.add(s2.point).divide(2));
                            }
                        }
                    }
                    if (isCircleItem(item)) pts.push(item.position);
                });
            }
            return pts;
        }

        function computeAlignmentGuides(cursor, base, excludeItems) {
            const tol = 7 / view.zoom;
            let vBest = null, vBestDist = tol;
            let hBest = null, hBestDist = tol;
            const keyPoints = collectKeyPoints(excludeItems);
            keyPoints.forEach(p => {
                if (base && p.getDistance(base) < 1e-6) return;
                const dx = Math.abs(p.x - cursor.x);
                if (dx < vBestDist) { vBestDist = dx; vBest = p; }
                const dy = Math.abs(p.y - cursor.y);
                if (dy < hBestDist) { hBestDist = dy; hBest = p; }
            });
            if (!vBest && !hBest) return null;
            return { v: vBest, h: hBest };
        }

        function renderTrackingGuides(guides, resolvedPoint) {
            if (!guides) return;
            const b = view.bounds;
            const r = 4.5 / view.zoom;
            const guideColor = new Color(0.91, 0.64, 0.24);
            if (guides.v) {
                const line = new Path.Line(new Point(guides.v.x, b.top), new Point(guides.v.x, b.bottom));
                line.strokeColor = guideColor;
                line.strokeWidth = 1 / view.zoom;
                line.dashArray = [6 / view.zoom, 5 / view.zoom];
                guideLayer.addChild(line);
                const mark = new Path.Circle(guides.v, r * 0.6);
                mark.strokeColor = guideColor;
                mark.strokeWidth = 1.4 / view.zoom;
                mark.fillColor = null;
                guideLayer.addChild(mark);
            }
            if (guides.h) {
                const line = new Path.Line(new Point(b.left, guides.h.y), new Point(b.right, guides.h.y));
                line.strokeColor = guideColor;
                line.strokeWidth = 1 / view.zoom;
                line.dashArray = [6 / view.zoom, 5 / view.zoom];
                guideLayer.addChild(line);
                const mark = new Path.Circle(guides.h, r * 0.6);
                mark.strokeColor = guideColor;
                mark.strokeWidth = 1.4 / view.zoom;
                mark.fillColor = null;
                guideLayer.addChild(mark);
            }
            if (guides.v && guides.h) {
                const cross = new Path([
                    resolvedPoint.add(new Point(-r, -r)), resolvedPoint.add(new Point(r, r))
                ]);
                const cross2 = new Path([
                    resolvedPoint.add(new Point(-r, r)), resolvedPoint.add(new Point(r, -r))
                ]);
                [cross, cross2].forEach(c => {
                    c.strokeColor = guideColor;
                    c.strokeWidth = 1.6 / view.zoom;
                    guideLayer.addChild(c);
                });
            }
        }

        function resolvePoint(raw, base, cmd, excludeItems) {
            let pt = raw;
            const snap = getSnapPoint(pt, excludeItems);
            if (snap) {
                state.trackGuides = null;
                return snap.point;
            }

            const trackingCmds = ['LINE', 'CIRCLE', 'RECTANG', 'ARC', 'MOVE', 'COPY'];
            let guides = null;
            if (base && trackingCmds.includes(cmd)) {
                guides = computeAlignmentGuides(pt, base, excludeItems);
                if (guides) {
                    if (guides.v) pt = new Point(guides.v.x, pt.y);
                    if (guides.h) pt = new Point(pt.x, guides.h.y);
                }
            }
            state.trackGuides = guides;

            const orthoCmds = ['LINE', 'MOVE', 'COPY', 'ARC'];
            const orthoActive = state.shiftKeyDown ? !state.ortho : state.ortho;
            const axisLockedByTracking = guides && (guides.v || guides.h);
            if (base && orthoCmds.includes(cmd) && !axisLockedByTracking) {
                if (orthoActive) {
                    pt = orthoProject(base, pt);
                } else if (state.polar) {
                    const d = pt.subtract(base);
                    const dist = d.length;
                    if (dist > 0) {
                        const step = state.polarIncrement || 15;
                        const angleDeg = Math.round(d.angle / step) * step;
                        const rad = angleDeg * Math.PI / 180;
                        pt = base.add(new Point(dist * Math.cos(rad), dist * Math.sin(rad)));
                    }
                }
            }
            return pt;
        }

        function orthoProject(base, target) {
            const d = target.subtract(base);
            return Math.abs(d.x) > Math.abs(d.y) ? new Point(target.x, base.y) : new Point(base.x, target.y);
        }

        // ============================================================
        //  PARSEAR ENTRADA DE TECLADO ESTILO AUTOCAD
        // ============================================================
        function parseDynamicInput(input, lastPoint) {
            input = input.trim();
            if (!input) return null;

            const relative = input.startsWith('@');
            const body = relative ? input.slice(1).trim() : input;

            const cartMatch = body.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
            if (cartMatch) {
                const a = parseFloat(cartMatch[1]);
                const b = parseFloat(cartMatch[2]);
                if (relative) {
                    if (!lastPoint) return null;
                    return lastPoint.add(new Point(a, b));
                }
                return new Point(a, b);
            }

            const polarMatch = body.match(/^(-?\d+(?:\.\d+)?)\s*<\s*(-?\d+(?:\.\d+)?)$/);
            if (polarMatch) {
                if (!lastPoint) return null;
                const dist = parseFloat(polarMatch[1]);
                const angleDeg = parseFloat(polarMatch[2]);
                const rad = angleDeg * Math.PI / 180;
                return lastPoint.add(new Point(dist * Math.cos(rad), dist * Math.sin(rad)));
            }

            if (/^-?\d+(\.\d+)?$/.test(body)) {
                if (!lastPoint) return null;
                const dist = parseFloat(body);
                const dir = state.lastMousePoint.subtract(lastPoint);
                const orthoActive = state.shiftKeyDown ? !state.ortho : state.ortho;
                let angleRad;
                if (orthoActive) {
                    if (Math.abs(dir.x) > Math.abs(dir.y)) angleRad = dir.x >= 0 ? 0 : Math.PI;
                    else angleRad = dir.y >= 0 ? Math.PI / 2 : -Math.PI / 2;
                } else if (state.polar && dir.length > 0) {
                    // Ajusta el ángulo del ratón al incremento polar más cercano (5°, 15°, etc.)
                    const step = state.polarIncrement || 15;
                    const angleDeg = Math.round(dir.angle / step) * step;
                    angleRad = angleDeg * Math.PI / 180;
                } else {
                    angleRad = dir.length === 0 ? 0 : dir.angle * Math.PI / 180;
                }
                return lastPoint.add(new Point(dist * Math.cos(angleRad), dist * Math.sin(angleRad)));
            }

            return null;
        }

        // ============================================================
        //  EJECUTAR COMANDO
        // ============================================================
        function executeCommand(cmd) {
            if (state.currentCommand) resetStateCmd();
            const cmdMap = {
                'L': 'LINE',
                'LINE': 'LINE',
                'C': 'CIRCLE',
                'CIRCLE': 'CIRCLE',
                'REC': 'RECTANG',
                'RECTANG': 'RECTANG',
                'A': 'ARC',
                'ARC': 'ARC',
                'M': 'MOVE',
                'MOVE': 'MOVE',
                'CO': 'COPY',
                'COPY': 'COPY',
                'RO': 'ROTATE',
                'ROTATE': 'ROTATE',
                'SC': 'SCALE',
                'SCALE': 'SCALE',
                'E': 'ERASE',
                'ERASE': 'ERASE',
                'O': 'OFFSET',
                'OFFSET': 'OFFSET',
                'TR': 'TRIM',
                'TRIM': 'TRIM',
                'EX': 'EXTEND',
                'EXTEND': 'EXTEND',
                'J': 'JOIN',
                'JOIN': 'JOIN',
                'UNDO': 'UNDO',
                'REDO': 'REDO'
            };
            const fullCmd = cmdMap[cmd.toUpperCase()] || cmd.toUpperCase();
            const repeatableCmds = ['LINE', 'CIRCLE', 'RECTANG', 'ARC', 'MOVE', 'COPY', 'ROTATE', 'SCALE', 'OFFSET', 'TRIM', 'EXTEND', 'JOIN', 'ERASE'];
            if (repeatableCmds.includes(fullCmd)) {
                state.lastCommand = fullCmd;
            }

            switch (fullCmd) {
                case 'LINE':
                    startCommand('LINE', 'LINE: Primer punto');
                    break;
                case 'CIRCLE':
                    startCommand('CIRCLE', 'CIRCLE: Centro');
                    break;
                case 'RECTANG':
                    startCommand('RECTANG', 'RECTANG: Primera esquina');
                    break;
                case 'ARC':
                    startCommand('ARC', 'ARC: Punto inicial');
                    break;
                case 'MOVE':
                    beginModifyCommand('MOVE', 'MOVE');
                    break;
                case 'COPY':
                    beginModifyCommand('COPY', 'COPY');
                    break;
                case 'ROTATE':
                    beginModifyCommand('ROTATE', 'ROTATE');
                    break;
                case 'SCALE':
                    beginModifyCommand('SCALE', 'SCALE');
                    break;
                case 'OFFSET':
                    clearSelection();
                    state.currentCommand = 'OFFSET';
                    state.step = 1;
                    state.waitingForNumber = true;
                    state.offsetTarget = null;
                    setPrompt('OFFSET: Distancia (número+Enter)');
                    document.getElementById('cmd-input').focus();
                    break;
                case 'TRIM':
                    beginModifyCommand('TRIM', 'TRIM: Selecciona los límites');
                    break;
                case 'EXTEND':
                    beginModifyCommand('EXTEND', 'EXTEND: Selecciona los límites');
                    break;
                case 'JOIN':
                    beginModifyCommand('JOIN', 'JOIN: Selecciona los objetos a unir');
                    break;
                case 'ERASE':
                    beginModifyCommand('ERASE', 'ERASE');
                    break;
                case 'UNDO':
                    undo();
                    break;
                case 'REDO':
                    redo();
                    break;
                default:
                    setPrompt('Comando desconocido');
            }
        }

        function startCommand(cmd, prompt) {
            state.currentCommand = cmd;
            state.step = 1;
            setPrompt(prompt);
            state.expectingPoint = true;
            state.dynamicLastPoint = null;
            previewLayer.removeChildren();
            gripLayer.removeChildren();
        }

        // ============================================================
        //  HISTORIAL (CORREGIDO)
        // ============================================================
        function snapshotCurrent() {
            const snap = {
                activeLayerName: activeLayer.name,
                layers: {}
            };
            for (let internal in layers) {
                const layer = layers[internal];
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer || layer === previewLayer || layer === gripLayer) continue;
                snap.layers[internal] = {
                    name: layer.data.originalName,
                    visible: layer.data.visible,
                    locked: layer.data.locked,
                    color: layer.data.color || '#FFFFFF',
                    items: layer.children.map(item => item.exportJSON({ asString: false }))
                };
            }
            return snap;
        }

        function saveState() {
            // Guarda el estado ACTUAL (antes de aplicar el cambio que viene a continuación).
            // Cualquier acción nueva invalida la pila de rehacer, como en cualquier editor.
            state.history.push(snapshotCurrent());
            state.redoStack = [];
            if (state.history.length > 50) state.history.shift();
        }

        function restoreState(snap) {
            state.selectedItems = [];
            resetStateCmd();
            for (let internal in layers) {
                const l = layers[internal];
                if (l !== gridLayer && l !== guideLayer && l !== snapLayer && l !== selectionLayer && l !== previewLayer)
                    l.removeChildren();
            }
            for (let internal in snap.layers) {
                const data = snap.layers[internal];
                if (!layers[internal]) createLayer(data.name);
                const layer = layers[internal];
                layer.data.visible = data.visible;
                layer.data.locked = data.locked;
                if (data.color) layer.data.color = data.color;
                layer.visible = data.visible;
                data.items.forEach(itemJson => {
                    const item = new Path();
                    item.importJSON(itemJson);
                    layer.addChild(item);
                });
            }
            // Restaurar la capa activa
            if (snap.activeLayerName && layers[snap.activeLayerName]) {
                activeLayer = layers[snap.activeLayerName];
                project.activeLayer = activeLayer;
            } else {
                activeLayer = defaultLayer;
                project.activeLayer = activeLayer;
            }
            view.update();
            renderLayerList();
            drawGrid();
            refreshStrokeWidths();
            renderGrips();
            updateProperties();
            previewLayer.removeChildren();
            guideLayer.removeChildren();
            selectionLayer.removeChildren();
            document.getElementById('dynamic-tooltip').style.display = 'none';
        }

        function undo() {
            if (!state.history.length) { setPrompt('No hay más acciones para deshacer'); return; }
            const prev = state.history.pop();
            state.redoStack.push(snapshotCurrent());
            if (state.redoStack.length > 50) state.redoStack.shift();
            restoreState(prev);
            setPrompt('Deshacer');
            view.update();
            updateProperties();
            renderLayerList();
        }

        function redo() {
            if (!state.redoStack.length) { setPrompt('No hay más acciones para rehacer'); return; }
            const next = state.redoStack.pop();
            state.history.push(snapshotCurrent());
            if (state.history.length > 50) state.history.shift();
            restoreState(next);
            setPrompt('Rehacer');
            view.update();
            updateProperties();
            renderLayerList();
        }

        // ============================================================
        //  HANDLER DE PUNTOS (DIBUJO)
        // ============================================================
        function handlePointInput(point) {
            if (!state.currentCommand) return;
            const cmd = state.currentCommand;

            if (cmd === 'LINE') {
                state.collectedPoints.push(point);
                if (state.collectedPoints.length >= 2) {
                    saveState();
                    const p1 = state.collectedPoints[state.collectedPoints.length - 2];
                    const p2 = point;
                    const line = new Path.Line(p1, p2);
                    line.strokeColor = 'white';
                    line.strokeWidth = currentStrokeWidth();
                    tagShape(line, 'line');
                    activeLayer.addChild(line);
                    // Sigue encadenando segmentos desde el último punto, como en
                    // AutoCAD ("Especifique el siguiente punto o [Cerrar/Deshacer]"),
                    // hasta Enter/ESC, o "C" para cerrar contra el punto inicial.
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('LINE: Siguiente punto (Enter/ESC para terminar, C para cerrar)');
                } else {
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('LINE: Siguiente punto');
                }
            } else if (cmd === 'CIRCLE') {
                if (state.step === 1) {
                    state.collectedPoints.push(point);
                    state.step = 2;
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('CIRCLE: Radio');
                } else {
                    saveState();
                    const c = state.collectedPoints[0];
                    const r = c.getDistance(point);
                    const circle = new Path.Circle(c, r);
                    circle.strokeColor = 'white';
                    circle.strokeWidth = currentStrokeWidth();
                    tagShape(circle, 'circle');
                    circle.data.radius = r;
                    activeLayer.addChild(circle);
                    resetStateCmd();
                    previewLayer.removeChildren();
                    document.getElementById('dynamic-tooltip').style.display = 'none';
                }
            } else if (cmd === 'RECTANG') {
                state.collectedPoints.push(point);
                if (state.collectedPoints.length === 2) {
                    saveState();
                    const rect = new Path.Rectangle(state.collectedPoints[0], state.collectedPoints[1]);
                    rect.strokeColor = 'white';
                    rect.strokeWidth = currentStrokeWidth();
                    tagShape(rect, 'polyline');
                    activeLayer.addChild(rect);
                    resetStateCmd();
                    previewLayer.removeChildren();
                    document.getElementById('dynamic-tooltip').style.display = 'none';
                } else {
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('RECTANG: Esquina opuesta');
                }
            } else if (cmd === 'ARC') {
                state.collectedPoints.push(point);
                if (state.collectedPoints.length === 1) {
                    state.step = 2;
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('ARC: Punto de paso (segundo punto)');
                } else if (state.collectedPoints.length === 2) {
                    state.step = 3;
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('ARC: Punto final');
                } else {
                    saveState();
                    try {
                        const arc = new Path.Arc(state.collectedPoints[0], state.collectedPoints[1], point);
                        arc.strokeColor = 'white';
                        arc.strokeWidth = currentStrokeWidth();
                        tagShape(arc, 'arc');
                        activeLayer.addChild(arc);
                        setPrompt('Arco creado');
                    } catch (err) {
                        setPrompt('Puntos no válidos para un arco (colineales). Inténtalo de nuevo.');
                    }
                    resetStateCmd();
                    previewLayer.removeChildren();
                    document.getElementById('dynamic-tooltip').style.display = 'none';
                }
            } else if (cmd === 'MOVE') {
                if (state.step === 1) {
                    state.basePoint = point;
                    state.step = 2;
                    state.originalPositions = state.selectedItems.map(it => it.position.clone());
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('MOVE: Arrastra, haz clic o escribe distancia');
                } else {
                    saveState();
                    const delta = point.subtract(state.basePoint);
                    state.selectedItems.forEach((item, idx) => item.position = state.originalPositions[idx].add(
                    delta));
                    resetStateCmd();
                    previewLayer.removeChildren();
                    document.getElementById('dynamic-tooltip').style.display = 'none';
                }
            } else if (cmd === 'COPY') {
                if (state.step === 1) {
                    state.basePoint = point;
                    state.copySourceItems = state.selectedItems.slice();
                    state.step = 2;
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    setPrompt('COPY: Punto de destino (Enter/ESC para terminar)');
                } else {
                    saveState();
                    const delta = point.subtract(state.basePoint);
                    const newClones = [];
                    state.copySourceItems.forEach(item => {
                        const clone = item.clone();
                        clone.strokeColor = item.strokeColor;
                        clone.strokeWidth = currentStrokeWidth();
                        clone.fillColor = item.fillColor;
                        clone.position = item.position.add(delta);
                        activeLayer.addChild(clone);
                        newClones.push(clone);
                    });
                    clearSelection();
                    newClones.forEach(c => addToSelection(c));
                    // Sigue en modo COPY para seguir copiando desde el MISMO punto base
                    // (comportamiento "Multiple" por defecto de AutoCAD), hasta Enter/ESC.
                    state.dynamicLastPoint = state.basePoint;
                    setPrompt('COPY: Otro punto de destino (Enter/ESC para terminar)');
                }
            } else if (cmd === 'ROTATE') {
                if (state.step === 1) {
                    state.basePoint = point;
                    state.step = 2;
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    state.startAngle = state.lastMousePoint.subtract(state.basePoint).angle;
                    setPrompt('ROTATE: Mueve y haz clic para girar, o escribe el ángulo en grados');
                } else {
                    saveState();
                    const currentAngle = point.subtract(state.basePoint).angle;
                    const delta = currentAngle - state.startAngle;
                    state.selectedItems.forEach(i => i.rotate(delta, state.basePoint));
                    resetStateCmd();
                    previewLayer.removeChildren();
                    document.getElementById('dynamic-tooltip').style.display = 'none';
                    let angleDeg = delta % 360;
                    if (angleDeg < 0) angleDeg += 360;
                    setPrompt(`Rotado ${angleDeg.toFixed(2)}°`);
                }
            } else if (cmd === 'SCALE') {
                if (state.step === 1) {
                    state.basePoint = point;
                    state.step = 2;
                    state.expectingPoint = true;
                    state.dynamicLastPoint = point;
                    state.referencePoint = state.lastMousePoint;
                    setPrompt('SCALE: Mueve y haz clic para escalar, o escribe el factor');
                } else {
                    saveState();
                    const refDist = state.referencePoint.subtract(state.basePoint).length || 1;
                    const curDist = point.subtract(state.basePoint).length;
