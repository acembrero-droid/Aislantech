                    const sf = curDist / refDist;
                    state.selectedItems.forEach(i => i.scale(sf, state.basePoint));
                    resetStateCmd();
                    previewLayer.removeChildren();
                    document.getElementById('dynamic-tooltip').style.display = 'none';
                    setPrompt(`Escalado x${sf.toFixed(3)}`);
                }
            }
        }

        // ============================================================
        //  JOIN (UNIR)
        // ============================================================
        function joinSelected() {
            const items = state.selectedItems.filter(i => i instanceof Path && i.segments.length > 0);
            if (items.length < 2) {
                setPrompt('Selecciona al menos dos líneas/polilíneas/arcos');
                return;
            }
            const tolerance = 5 / view.zoom;
            saveState();

            const pool = items.slice();
            const chains = [];
            while (pool.length > 0) {
                let chain = pool.shift();
                let changed = true;
                while (changed && pool.length > 0) {
                    changed = false;
                    for (let i = pool.length - 1; i >= 0; i--) {
                        const candidate = pool[i];
                        const chainStart = chain.firstSegment.point;
                        const chainEnd = chain.lastSegment.point;
                        const candStart = candidate.firstSegment.point;
                        const candEnd = candidate.lastSegment.point;
                        if (chainEnd.getDistance(candStart) < tolerance ||
                            chainEnd.getDistance(candEnd) < tolerance ||
                            chainStart.getDistance(candStart) < tolerance ||
                            chainStart.getDistance(candEnd) < tolerance) {
                            chain.join(candidate, tolerance);
                            pool.splice(i, 1);
                            changed = true;
                        }
                    }
                }
                chains.push(chain);
            }

            chains.forEach(path => {
                path.strokeColor = 'white';
                path.strokeWidth = currentStrokeWidth();
                const hasCurves = path.curves.some(c => !c.isStraight());
                tagShape(path, hasCurves ? 'arc' : 'polyline');
            });

            clearSelection();
            chains.forEach(p => addToSelection(p));
            setPrompt(`${chains.length} trazado(s) unido(s) (curvas preservadas)`);
        }

        // ============================================================
        //  TRIM / EXTEND
        // ============================================================
        function handleTrimExtendClick(event) {
            const pt = event.point;
            const hit = hitTestContent(pt);
            if (!hit || !hit.item) { setPrompt('Selecciona un objeto'); return; }
            const item = hit.item;
            if (state.currentCommand === 'TRIM') {
                trimObject(item, state.trimBoundary, pt);
                setPrompt('TRIM: Selecciona otro objeto o ESC para salir');
            } else if (state.currentCommand === 'EXTEND') {
                extendObject(item, state.extendBoundary, pt);
                setPrompt('EXTEND: Selecciona otro objeto o ESC para salir');
            }
        }

        function trimObject(item, boundaries, clickPoint) {
            if (!isLineItem(item)) {
                setPrompt('Solo se pueden recortar líneas (el objeto límite puede ser línea, círculo, arco o polilínea)');
                return;
            }
            const bList = (Array.isArray(boundaries) ? boundaries : [boundaries]).filter(b => b && b !== item);
            if (!bList.length) { setPrompt('No hay límites válidos'); return; }
            let cutPt = null,
                bestD = Infinity;
            bList.forEach(boundary => {
                const inters = item.getIntersections(boundary);
                inters.forEach(it => {
                    const d = it.point.getDistance(clickPoint);
                    if (d < bestD) { bestD = d;
                        cutPt = it.point; }
                });
            });
            if (!cutPt) { setPrompt('No hay intersección con los límites'); return; }
            const p1 = item.segments[0].point;
            const p2 = item.segments[1].point;
            const d1 = p1.getDistance(clickPoint);
            const d2 = p2.getDistance(clickPoint);
            saveState();
            if (d1 < d2) {
                item.segments[0].point = cutPt;
            } else {
                item.segments[1].point = cutPt;
            }
            setPrompt('Línea recortada');
        }

        function extendObject(item, boundaries, clickPoint) {
            if (!isLineItem(item)) {
                setPrompt('Solo se pueden alargar líneas (el límite puede ser línea, círculo, arco o polilínea)');
                return;
            }
            const bList = (Array.isArray(boundaries) ? boundaries : [boundaries]).filter(b => b && b !== item);
            if (!bList.length) { setPrompt('No hay límites válidos'); return; }
            const p1 = item.segments[0].point;
            const p2 = item.segments[1].point;
            const d1 = p1.getDistance(clickPoint);
            const d2 = p2.getDistance(clickPoint);
            let start, dir;
            if (d1 < d2) {
                start = p1;
                dir = p1.subtract(p2).normalize();
            } else {
                start = p2;
                dir = p2.subtract(p1).normalize();
            }
            const rayStart = start.add(dir.multiply(-10000));
            const rayEnd = start.add(dir.multiply(10000));
            const ray = new Path.Line(rayStart, rayEnd);
            let best = null,
                bestDist = Infinity;
            bList.forEach(boundary => {
                const inters = ray.getIntersections(boundary);
                inters.forEach(inter => {
                    const d = inter.point.getDistance(start);
                    if (d < bestDist && d > 0.01) { bestDist = d;
                        best = inter.point; }
                });
            });
            ray.remove();
            if (!best) { setPrompt('No se encontró punto de extensión válido'); return; }
            saveState();
            if (d1 < d2) {
                item.segments[0].point = best;
            } else {
                item.segments[1].point = best;
            }
            setPrompt('Línea extendida');
        }

        // ============================================================
        //  OFFSET
        // ============================================================
        function lineLineIntersection(p1, p2, p3, p4) {
            const d1 = p2.subtract(p1),
                d2 = p4.subtract(p3);
            const denom = d1.cross(d2);
            if (Math.abs(denom) < 1e-9) return null;
            const t = p3.subtract(p1).cross(d2) / denom;
            return p1.add(d1.multiply(t));
        }

        function circumcenter(p1, p2, p3) {
            const ax = p1.x,
                ay = p1.y,
                bx = p2.x,
                by = p2.y,
                cx = p3.x,
                cy = p3.y;
            const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
            if (Math.abs(d) < 1e-9) return null;
            const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (
                ay - by)) / d;
            const uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (
                bx - ax)) / d;
            return new Point(ux, uy);
        }

        function offsetPolyline(item, dist, clickPt) {
            const pts = item.segments.map(s => s.point);
            const n = pts.length;
            if (n < 2) return null;
            const closed = item.closed;

            let side = 1;
            if (closed) {
                side = item.contains(clickPt) ? 1 : -1;
            } else {
                let bestD = Infinity,
                    bestSide = 1;
                for (let i = 0; i < n - 1; i++) {
                    const a = pts[i],
                        b = pts[i + 1];
                    const dir = b.subtract(a).normalize();
                    const normal = dir.rotate(90);
                    const mid = a.add(b).divide(2);
                    const d = mid.getDistance(clickPt);
                    if (d < bestD) { bestD = d;
                        bestSide = clickPt.subtract(mid).dot(normal) > 0 ? 1 : -1; }
                }
                side = bestSide;
            }

            const edgeCount = closed ? n : n - 1;
            const offsetEdges = [];
            for (let i = 0; i < edgeCount; i++) {
                const a = pts[i];
                const b = pts[(i + 1) % n];
                const dir = b.subtract(a).normalize();
                const normal = dir.rotate(90).multiply(dist * side);
                offsetEdges.push({ a: a.add(normal), b: b.add(normal) });
            }

            const newPts = [];
            for (let i = 0; i < offsetEdges.length; i++) {
                const cur = offsetEdges[i];
                if (!closed && i === 0) { newPts.push(cur.a); continue; }
                const prevIdx = (i - 1 + offsetEdges.length) % offsetEdges.length;
                const prev = offsetEdges[prevIdx];
                const corner = lineLineIntersection(prev.a, prev.b, cur.a, cur.b);
                newPts.push(corner || cur.a);
            }
            if (!closed) newPts.push(offsetEdges[offsetEdges.length - 1].b);

            const newPath = new Path(newPts);
            newPath.closed = closed;
            return newPath;
        }

        function highlightOffsetTarget(item, on) {
            if (!item) return;
            if (on) {
                item.shadowColor = new Color('#E8A33D');
                item.shadowBlur = 10;
                item.shadowOffset = new Point(0, 0);
            } else if (!state.selectedItems.includes(item)) {
                item.shadowColor = null;
            }
        }

        function handleOffsetSelectClick(event) {
            const hit = hitTestContent(event.point);
            if (!hit || !hit.item) {
                setPrompt('No se encontró ningún objeto. Selecciona una línea, círculo o polilínea (Enter/ESC para salir)');
                return;
            }
            const item = hit.item;
            if (!isLineItem(item) && !isCircleItem(item) && !isPolylineItem(item)) {
                setPrompt('Offset solo funciona con líneas, círculos, rectángulos o polilíneas');
                return;
            }
            state.offsetTarget = item;
            highlightOffsetTarget(item, true);
            state.step = 3;
            setPrompt(`OFFSET: Distancia ${state.offsetDistance}. Especifica el lado del offset (Enter/ESC para salir)`);
        }

        function handleOffsetSideClick(event) {
            const item = state.offsetTarget;
            const pt = event.point;
            const dist = state.offsetDistance;
            if (!item || dist <= 0) { resetOffsetToSelect(); return; }

            saveState();
            if (isLineItem(item)) {
                const p1 = item.segments[0].point;
                const p2 = item.segments[1].point;
                const dir = p2.subtract(p1).normalize();
                const normal = dir.rotate(90).multiply(dist);
                const mid = p1.add(p2).divide(2);
                const toClick = pt.subtract(mid);
                const side = toClick.dot(normal) > 0 ? 1 : -1;
                const offsetNormal = normal.multiply(side);
                const newP1 = p1.add(offsetNormal);
                const newP2 = p2.add(offsetNormal);
                const newLine = new Path.Line(newP1, newP2);
                newLine.strokeColor = item.strokeColor || 'white';
                newLine.strokeWidth = currentStrokeWidth();
                tagShape(newLine, 'line');
                activeLayer.addChild(newLine);
            } else if (isCircleItem(item)) {
                const r0 = getCircleRadius(item);
                const inside = pt.getDistance(item.position) < r0;
                const newRadius = inside ? r0 - dist : r0 + dist;
                if (newRadius <= 0) { setPrompt('El offset elimina el círculo (radio ≤ 0). Elige otro lado o distancia.'); return; }
                const newCircle = new Path.Circle(item.position, newRadius);
                newCircle.strokeColor = item.strokeColor || 'white';
                newCircle.strokeWidth = currentStrokeWidth();
                tagShape(newCircle, 'circle');
                newCircle.data.radius = newRadius;
                activeLayer.addChild(newCircle);
            } else if (isPolylineItem(item)) {
                const newPoly = offsetPolyline(item, dist, pt);
                if (!newPoly) { setPrompt('No se pudo calcular el offset de esta polilínea'); return; }
                newPoly.strokeColor = item.strokeColor || 'white';
                newPoly.strokeWidth = currentStrokeWidth();
                tagShape(newPoly, 'polyline');
                activeLayer.addChild(newPoly);
            }
            resetOffsetToSelect(`Offset creado (dist ${dist}). Selecciona otro objeto o Enter/ESC para salir`);
        }

        function resetOffsetToSelect(message) {
            highlightOffsetTarget(state.offsetTarget, false);
            state.offsetTarget = null;
            state.step = 2;
            previewLayer.removeChildren();
            setPrompt(message || `OFFSET: Distancia ${state.offsetDistance}. Selecciona objeto a desplazar (Enter/ESC para salir)`);
            // Se mantiene en modo OFFSET con la misma distancia, como en AutoCAD
            // ("Select object to offset or [Exit/Undo] <Exit>:"), hasta Enter/ESC.
        }

        // ============================================================
        //  EVENTOS DE RATÓN (PAPER.JS TOOL)
        // ============================================================
        let snapMarker = null;
        let middleClickTimer = null;

        function onMouseDown(event) {
            state.lastMousePoint = event.point;

            if (event.event.button === 1) {
                event.event.preventDefault();
                if (middleClickTimer) {
                    clearTimeout(middleClickTimer);
                    middleClickTimer = null;
                    zoomExtents();
                } else {
                    middleClickTimer = setTimeout(() => {
                        middleClickTimer = null;
                        state.panning = true;
                        state.panStartPoint = event.point;
                    }, 300);
                }
                return;
            }
            if (event.event.button === 0 && event.event.altKey) {
                state.panning = true;
                state.panStartPoint = event.point;
                return;
            }

            if (state.waitingForNumber) {
                return;
            }

            // GRIPS: si no hay ningún comando activo y el clic cae sobre un grip
            // del objeto seleccionado, empieza la edición directa (estirar/mover),
            // igual que en AutoCAD, sin necesidad de invocar ningún comando.
            if (!state.currentCommand && state.selectedItems.length) {
                const gripTol = 6 / view.zoom;
                const gripHit = gripLayer.hitTest(event.point, { fill: true, stroke: true, tolerance: gripTol });
                if (gripHit && gripHit.item && gripHit.item.data && gripHit.item.data.grip) {
                    const grip = gripHit.item.data.grip;
                    saveState();
                    state.gripDrag = grip;
                    state.gripDragStart = event.point;
                    if (grip.type === 'move') {
                        state.gripOriginalSegments = grip.item.segments.map(s => s.point.clone());
                    }
                    renderGrips();
                    return;
                }
            }

            if (state.currentCommand && state.expectingPoint) {
                // Al elegir el punto BASE (paso 1) se permite enganchar a los propios
                // puntos del objeto que se va a mover/copiar, como en AutoCAD. Solo se
                // excluye la selección al elegir el punto de DESTINO (paso 2+).
                const moveExclude = ((state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') && state.step >= 2) ?
                    state.selectedItems : null;
                const resolved = resolvePoint(event.point, state.dynamicLastPoint, state.currentCommand, moveExclude);
                handlePointInput(resolved);
                return;
            }

            if ((state.currentCommand === 'TRIM' || state.currentCommand === 'EXTEND') && !state.pendingCommand) {
                handleTrimExtendClick(event);
                return;
            }

            if (state.currentCommand === 'OFFSET' && state.step === 2) {
                handleOffsetSelectClick(event);
                return;
            }
            if (state.currentCommand === 'OFFSET' && state.step === 3) {
                handleOffsetSideClick(event);
                return;
            }

            const hit = hitTestContent(event.point);
            if (hit && hit.item) {
                const item = hit.item;
                if (state.pendingCommand) {
                    // Modo "Selecciona objetos" (verbo-sustantivo): cada clic
                    // AÑADE a la selección en vez de reemplazarla, como en AutoCAD.
                    if (state.selectedItems.includes(item)) {
                        item.selected = false;
                        item.shadowColor = null;
                        state.selectedItems = state.selectedItems.filter(i => i !== item);
                    } else {
                        addToSelection(item);
                    }
                    setPrompt(`${state.pendingCommand}: Selecciona objetos — ${state.selectedItems.length} encontrado(s) (Enter para terminar)`);
                    return;
                }
                if (state.selectedItems.includes(item)) {
                    state.isDragging = true;
                    state.dragStartPoint = event.point;
                    state.originalPositions = state.selectedItems.map(it => it.position.clone());
                    state.hasMoved = false;
                    state.dynamicLastPoint = event.point;
                } else {
                    setSingleSelection(item);
                    state.isDragging = true;
                    state.dragStartPoint = event.point;
                    state.originalPositions = [item.position.clone()];
                    state.hasMoved = false;
                    state.dynamicLastPoint = event.point;
                }
                setPrompt(`Seleccionados: ${state.selectedItems.length}`);
            } else {
                if (!state.pendingCommand) clearSelection();
                state.selecting = true;
                state.selectStartPoint = event.point;
                state.selectMode = 'window';
                state.selectionRect = new Rectangle(event.point, event.point);
                drawSelectionRect();
            }
        }

        function onMouseDrag(event) {
            state.lastMousePoint = event.point;
            state.lastClientX = event.event.clientX;
            state.lastClientY = event.event.clientY;
            updateCoords(event.point);
            updateDynamicPreview(event);

            if (state.panning) {
                const delta = event.point.subtract(state.panStartPoint);
                view.center = view.center.subtract(delta);
                state.panStartPoint = event.point;
                drawGrid();
                return;
            }

            if (state.gripDrag) {
                const grip = state.gripDrag;
                const item = grip.item;
                if (grip.type === 'segment') {
                    let base = null;
                    if (item.segments.length === 2) {
                        base = item.segments[1 - grip.index].point;
                    }
                    const resolved = resolvePoint(event.point, base, 'LINE', [item]);
                    item.segments[grip.index].point = resolved;
                    renderTrackingGuides(state.trackGuides, resolved);
                    const text = base ?
                        `Distancia: ${base.getDistance(resolved).toFixed(3)}  ∠: ${resolved.subtract(base).angle.toFixed(1)}°` :
                        `X: ${resolved.x.toFixed(3)}, Y: ${resolved.y.toFixed(3)}`;
                    showTooltipAt(event.event.clientX, event.event.clientY, text);
                } else if (grip.type === 'move') {
                    const delta = event.point.subtract(state.gripDragStart);
                    item.segments.forEach((s, i) => { s.point = state.gripOriginalSegments[i].add(delta); });
                    showTooltipAt(event.event.clientX, event.event.clientY,
                        `Distancia: ${delta.length.toFixed(3)}  ∠: ${delta.length > 0 ? delta.angle.toFixed(1) : 0}°`);
                } else if (grip.type === 'circle-center') {
                    const resolved = resolvePoint(event.point, null, 'MOVE', [item]);
                    item.position = resolved;
                    showTooltipAt(event.event.clientX, event.event.clientY, `X: ${resolved.x.toFixed(3)}, Y: ${resolved.y.toFixed(3)}`);
                } else if (grip.type === 'circle-radius') {
                    const resolved = resolvePoint(event.point, item.position, 'LINE', [item]);
                    const newR = item.position.getDistance(resolved);
                    if (newR > 0.001) {
                        const newItem = resizeCircle(item, newR);
                        state.gripDrag.item = newItem;
                    }
                    showTooltipAt(event.event.clientX, event.event.clientY, `Radio: ${newR.toFixed(3)}`);
                }
                renderGrips();
                return;
            }

            if (state.isDragging && state.selectedItems.length) {
                if (!state.hasMoved) {
                    // Se guarda el estado justo ANTES del primer desplazamiento real,
                    // para que Deshacer funcione correctamente al arrastrar con el ratón.
                    saveState();
                }
                const resolved = resolvePoint(event.point, state.dragStartPoint, 'MOVE', state.selectedItems);
                const moveDelta = resolved.subtract(state.dragStartPoint);
                state.selectedItems.forEach((item, idx) => item.position = state.originalPositions[idx].add(moveDelta));
                state.hasMoved = true;
                const dist = moveDelta.length;
                const ang = moveDelta.length > 0 ? moveDelta.angle : 0;
                showTooltipAt(event.event.clientX, event.event.clientY, `Distancia: ${dist.toFixed(3)}  ∠: ${ang.toFixed(1)}°`);
                renderTrackingGuides(state.trackGuides, resolved, state.dragStartPoint);
                return;
            }

            if (state.selecting) {
                state.selectionRect = new Rectangle(state.selectStartPoint, event.point);
                if (event.point.x > state.selectStartPoint.x) state.selectMode = 'window';
                else state.selectMode = 'crossing';
                drawSelectionRect();
            }
        }

        function onMouseUp(event) {
            if (state.panning) { state.panning = false; return; }

            if (state.gripDrag) {
                state.gripDrag = null;
                state.gripDragStart = null;
                state.gripOriginalSegments = null;
                guideLayer.removeChildren();
                document.getElementById('dynamic-tooltip').style.display = 'none';
                renderGrips();
                setPrompt('Listo');
                view.update();
                updateProperties();
                return;
            }

            if (state.isDragging) {
                state.isDragging = false;
                state.dragStartPoint = null;
                state.originalPositions = [];
                state.hasMoved = false;
                state.dynamicLastPoint = null;
                guideLayer.removeChildren();
                document.getElementById('dynamic-tooltip').style.display = 'none';
                previewLayer.removeChildren();
                return;
            }

            if (state.selecting) {
                state.selecting = false;
                if (state.selectionRect && state.selectStartPoint) {
                    const rect = state.selectionRect;
                    if (!state.pendingCommand) clearSelection();
                    const isWindow = state.selectMode === 'window';
                    for (let internal in layers) {
                        const layer = layers[internal];
                        if (!layer.data.visible || layer.data.locked) continue;
                        if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer ===
                            selectionLayer || layer === previewLayer || layer === gripLayer) continue;
                        layer.children.forEach(item => {
                            if (item.bounds) {
                                if (isWindow) {
                                    if (rect.contains(item.bounds)) addToSelection(item);
                                } else {
                                    if (rect.intersects(item.bounds)) addToSelection(item);
                                }
                            }
                        });
                    }
                    selectionLayer.removeChildren();
                    state.selectionRect = null;
                    state.selectStartPoint = null;
                    if (state.pendingCommand) {
                        setPrompt(`${state.pendingCommand}: Selecciona objetos — ${state.selectedItems.length} encontrado(s) (Enter para terminar)`);
                    } else {
                        setPrompt(`Seleccionados: ${state.selectedItems.length}`);
                    }
                    updateProperties();
                }
            }
        }

        function onMouseMove(event) {
            state.lastMousePoint = event.point;
            state.lastClientX = event.event.clientX;
            state.lastClientY = event.event.clientY;
            updateCoords(event.point);
            guideLayer.removeChildren();
            updateDynamicPreview(event);

            // Al elegir el punto BASE (paso 1) se permite enganchar a los propios
            // puntos del objeto que se va a mover/copiar, como en AutoCAD.
            const moveExclude = ((state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') && state.step >= 2) ?
                state.selectedItems : null;

            if (state.currentCommand && state.expectingPoint && state.dynamicLastPoint) {
                const base = state.dynamicLastPoint;
                const cursor = resolvePoint(event.point, base, state.currentCommand, moveExclude);
                const guideLine = new Path.Line(base, cursor);
                guideLine.strokeColor = 'gray';
                guideLine.strokeWidth = 1 / view.zoom;
                guideLayer.addChild(guideLine);
                renderTrackingGuides(state.trackGuides, cursor);
            }

            if (snapMarker) { snapMarker.remove();
                snapMarker = null; }
            if (state.snapEnabled && !state.selecting) {
                const snap = getSnapPoint(event.point, moveExclude);
                if (snap) {
                    const r = 5 / view.zoom;
                    const p = snap.point;
                    let marker;
                    // Glifos estilo AutoCAD: cuadrado = extremo, triángulo = punto medio, círculo = centro
                    if (snap.type === 'endpoint') {
                        marker = new Path.Rectangle(new paper.Rectangle(p.x - r, p.y - r, r * 2, r * 2));
                    } else if (snap.type === 'midpoint') {
                        marker = new Path([
                            p.add(new Point(0, -r * 1.15)),
                            p.add(new Point(r * 1.15, r * 0.85)),
                            p.add(new Point(-r * 1.15, r * 0.85))
                        ]);
                        marker.closed = true;
                    } else {
                        marker = new Path.Circle(p, r);
                    }
                    marker.strokeColor = new Color(0.91, 0.64, 0.24);
                    marker.strokeWidth = 1.6 / view.zoom;
                    marker.fillColor = null;
                    snapLayer.addChild(marker);
                    snapMarker = marker;
                }
            }

            // Resaltado al pasar el ratón (hover), como en AutoCAD: solo en reposo,
            // sin comando activo y sin estar arrastrando nada.
            if (!state.currentCommand && !state.pendingCommand && !state.selecting && !state.isDragging && !state.gripDrag) {
                const hit = hitTestContent(event.point);
                const newHover = (hit && hit.item) ? hit.item : null;
                if (newHover !== state.hoveredItem) {
                    if (state.hoveredItem && !state.selectedItems.includes(state.hoveredItem)) {
                        state.hoveredItem.shadowColor = null;
                    }
                    if (newHover && !state.selectedItems.includes(newHover)) {
                        newHover.shadowColor = new Color('#7FDBFF');
                        newHover.shadowBlur = 6;
                        newHover.shadowOffset = new Point(0, 0);
                    }
                    state.hoveredItem = newHover;
                }
            } else if (state.hoveredItem) {
                if (!state.selectedItems.includes(state.hoveredItem)) state.hoveredItem.shadowColor = null;
                state.hoveredItem = null;
            }
        }

        // ============================================================
        //  DYNAMIC PREVIEW
        // ============================================================
        function updateDynamicPreview(event) {
            previewLayer.removeChildren();
            const pt = event.point;

            if (state.currentCommand === 'OFFSET' && state.step === 3 && state.offsetTarget) {
                const item = state.offsetTarget;
                const dist = state.offsetDistance;
                let preview = null;
                if (isLineItem(item)) {
                    const p1 = item.segments[0].point;
                    const p2 = item.segments[1].point;
                    const dir = p2.subtract(p1).normalize();
                    const normal = dir.rotate(90).multiply(dist);
                    const mid = p1.add(p2).divide(2);
                    const side = pt.subtract(mid).dot(normal) > 0 ? 1 : -1;
                    const offsetNormal = normal.multiply(side);
                    preview = new Path.Line(p1.add(offsetNormal), p2.add(offsetNormal));
                } else if (isCircleItem(item)) {
                    const r0 = getCircleRadius(item);
                    const inside = pt.getDistance(item.position) < r0;
                    const newRadius = inside ? r0 - dist : r0 + dist;
                    if (newRadius > 0) preview = new Path.Circle(item.position, newRadius);
                } else if (isPolylineItem(item)) {
                    preview = offsetPolyline(item, dist, pt);
                }
                if (preview) {
                    preview.strokeColor = new Color('#E8A33D');
                    preview.strokeWidth = 1.2 / view.zoom;
                    preview.dashArray = [5, 4];
                    preview.fillColor = null;
                    previewLayer.addChild(preview);
                }
                showTooltipAt(event.event.clientX, event.event.clientY, `Offset: ${dist}`);
                return;
            }

            if (state.currentCommand && state.expectingPoint && state.dynamicLastPoint) {
                const base = state.dynamicLastPoint;
                const moveExclude = ((state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') && state.step >= 2) ?
                    state.selectedItems : null;
                const cursor = resolvePoint(pt, base, state.currentCommand, moveExclude);
                const dx = cursor.x - base.x;
                const dy = cursor.y - base.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;

                if (state.currentCommand === 'LINE') {
                    const line = new Path.Line(base, cursor);
                    line.strokeColor = new Color(0, 0.75, 1, 0.6);
                    line.strokeWidth = 1 / view.zoom;
                    line.dashArray = [4, 4];
                    previewLayer.addChild(line);
                    const text = `L: ${dist.toFixed(2)}  ∠: ${angle.toFixed(1)}°  ΔX: ${dx.toFixed(2)}  ΔY: ${dy.toFixed(2)}`;
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, text);
                } else if (state.currentCommand === 'CIRCLE') {
                    const circle = new Path.Circle(base, dist);
                    circle.strokeColor = new Color(0, 0.75, 1, 0.6);
                    circle.strokeWidth = 1 / view.zoom;
                    circle.dashArray = [4, 4];
                    previewLayer.addChild(circle);
                    const text = `Radio: ${dist.toFixed(2)}`;
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, text);
                } else if (state.currentCommand === 'RECTANG') {
                    const rect = new Path.Rectangle(base, cursor);
                    rect.strokeColor = new Color(0, 0.75, 1, 0.6);
                    rect.strokeWidth = 1 / view.zoom;
                    rect.dashArray = [4, 4];
                    previewLayer.addChild(rect);
                    const w = Math.abs(cursor.x - base.x);
                    const h = Math.abs(cursor.y - base.y);
                    const text = `Ancho: ${w.toFixed(2)}  Alto: ${h.toFixed(2)}`;
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, text);
                } else if (state.currentCommand === 'ARC') {
                    if (state.step === 2) {
                        const guide = new Path.Line(base, cursor);
                        guide.strokeColor = new Color(0, 0.75, 1, 0.6);
                        guide.strokeWidth = 1 / view.zoom;
                        guide.dashArray = [4, 4];
                        previewLayer.addChild(guide);
                        showTooltipAt(event.event.clientX, event.event.clientY - 30, `Dist: ${dist.toFixed(2)}`);
                    } else if (state.step === 3) {
                        try {
                            const arcPreview = new Path.Arc(state.collectedPoints[0], state.collectedPoints[1], cursor);
                            arcPreview.strokeColor = new Color(0, 0.75, 1, 0.6);
                            arcPreview.strokeWidth = 1 / view.zoom;
                            arcPreview.dashArray = [4, 4];
                            arcPreview.fillColor = null;
                            previewLayer.addChild(arcPreview);
                        } catch (err) { /* ignore */ }
                        showTooltipAt(event.event.clientX, event.event.clientY - 30, `Dist: ${dist.toFixed(2)}`);
                    }
                } else if (state.currentCommand === 'MOVE' || state.currentCommand === 'COPY') {
                    const line = new Path.Line(base, cursor);
                    line.strokeColor = new Color(0, 0.75, 1, 0.6);
                    line.strokeWidth = 1 / view.zoom;
                    line.dashArray = [4, 4];
                    previewLayer.addChild(line);
                    const previewSource = (state.currentCommand === 'COPY' && state.copySourceItems.length) ?
                        state.copySourceItems : state.selectedItems;
                    previewSource.forEach((item) => {
                        const clone = item.clone({ insert: false });
                        clone.position = clone.position.add(cursor.subtract(base));
                        clone.strokeColor = new Color(0, 0.75, 1, 0.6);
                        clone.dashArray = [4, 4];
                        clone.fillColor = null;
                        previewLayer.addChild(clone);
                    });
                    const text = `Distancia: ${dist.toFixed(2)}  ∠: ${angle.toFixed(1)}°`;
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, text);
                } else if (state.currentCommand === 'ROTATE') {
                    const currentAngle = cursor.subtract(state.basePoint).angle;
                    const delta = currentAngle - state.startAngle;
                    state.selectedItems.forEach(item => {
                        const clone = item.clone({ insert: false });
                        clone.rotate(delta, state.basePoint);
                        clone.strokeColor = new Color(0, 0.75, 1, 0.6);
                        clone.dashArray = [4, 4];
                        clone.fillColor = null;
                        previewLayer.addChild(clone);
                    });
                    let angleDeg = delta % 360;
                    if (angleDeg < 0) angleDeg += 360;
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, `Ángulo: ${angleDeg.toFixed(2)}°`);
                } else if (state.currentCommand === 'SCALE') {
                    const refDist = state.referencePoint.subtract(state.basePoint).length || 1;
                    const curDist = cursor.subtract(state.basePoint).length;
                    const sf = curDist / refDist;
                    state.selectedItems.forEach(item => {
                        const clone = item.clone({ insert: false });
                        clone.scale(sf, state.basePoint);
                        clone.strokeColor = new Color(0, 0.75, 1, 0.6);
                        clone.dashArray = [4, 4];
                        clone.fillColor = null;
                        previewLayer.addChild(clone);
                    });
                    showTooltipAt(event.event.clientX, event.event.clientY - 30, `Escala: ${sf.toFixed(3)}x`);
                }
            }
        }

        function showTooltipAt(clientX, clientY, text) {
            const el = document.getElementById('dynamic-tooltip');
            if (!el) return;
            el.style.left = (clientX + 15) + 'px';
            el.style.top = (clientY - 20) + 'px';
            el.textContent = text;
            el.style.display = 'block';
        }

        function updateCoords(pt) {
            document.getElementById('coords-display').textContent = `X: ${pt.x.toFixed(3)}, Y: ${pt.y.toFixed(3)}`;
            document.getElementById('zoom-display').textContent = `Zoom: ${view.zoom.toFixed(2)}x`;
        }

        function drawSelectionRect() {
            selectionLayer.removeChildren();
            if (state.selectionRect && state.selecting) {
                const rect = state.selectionRect;
                const path = new Path.Rectangle(rect);
                const isWindow = state.selectMode === 'window';
                path.fillColor = isWindow ? new Color(0, 0, 1, 0.1) : new Color(0, 1, 0, 0.1);
                path.strokeColor = isWindow ? 'blue' : 'green';
                path.strokeWidth = 1 / view.zoom;
                selectionLayer.addChild(path);
            }
        }

        // ============================================================
        //  GRID
        // ============================================================
        function drawGrid() {
            gridLayer.removeChildren();
            if (!state.gridVisible) return;
            const bounds = view.bounds;
            const zoom = view.zoom;
            let gridSpacing = 1;
            const targetPixels = 40;
            const pixelPerUnit = view.viewSize.width / (bounds.width || 1);
            let spacing = targetPixels / pixelPerUnit;
            const exp = Math.floor(Math.log10(spacing));
            const mant = spacing / Math.pow(10, exp);
            let rounded;
            if (mant < 1.5) rounded = 1;
            else if (mant < 3.5) rounded = 2;
            else if (mant < 7.5) rounded = 5;
            else rounded = 10;
            gridSpacing = rounded * Math.pow(10, exp);

            const left = Math.floor(bounds.left / gridSpacing) * gridSpacing - gridSpacing;
            const right = Math.ceil(bounds.right / gridSpacing) * gridSpacing + gridSpacing;
            const yMin = Math.min(bounds.top, bounds.bottom);
            const yMax = Math.max(bounds.top, bounds.bottom);
            const bottom = Math.floor(yMin / gridSpacing) * gridSpacing - gridSpacing;
            const top = Math.ceil(yMax / gridSpacing) * gridSpacing + gridSpacing;

            const pixelThin = 0.5;
            const pixelThick = 0.8;
            const pixelAxis = 1.2;
            const thinWidth = Math.min(pixelThin / zoom, 2);
            const thickWidth = Math.min(pixelThick / zoom, 2);
            const axisWidth = Math.min(pixelAxis / zoom, 2.5);

            const thinColor = new Color(0.25, 0.25, 0.25);
            const thickColor = new Color(0.35, 0.35, 0.35);
            const majorSpacing = gridSpacing * 5;

            for (let x = left; x <= right; x += gridSpacing) {
                const isMajor = (Math.abs(x) % majorSpacing < 0.001);
                const line = new Path.Line(new Point(x, bottom), new Point(x, top));
                line.strokeColor = (Math.abs(x) < 0.001) ? new Color(0.6, 0.6, 0.6) : (isMajor ? thickColor : thinColor);
                line.strokeWidth = (Math.abs(x) < 0.001) ? axisWidth : (isMajor ? thickWidth : thinWidth);
                gridLayer.addChild(line);
            }
            for (let y = bottom; y <= top; y += gridSpacing) {
                const isMajor = (Math.abs(y) % majorSpacing < 0.001);
                const line = new Path.Line(new Point(left, y), new Point(right, y));
                line.strokeColor = (Math.abs(y) < 0.001) ? new Color(0.6, 0.6, 0.6) : (isMajor ? thickColor : thinColor);
                line.strokeWidth = (Math.abs(y) < 0.001) ? axisWidth : (isMajor ? thickWidth : thinWidth);
                gridLayer.addChild(line);
            }
            const originColor = new Color(0.6, 0.6, 0.6);
            const axisX = new Path.Line(new Point(left, 0), new Point(right, 0));
            axisX.strokeColor = originColor;
            axisX.strokeWidth = axisWidth;
            gridLayer.addChild(axisX);
            const axisY = new Path.Line(new Point(0, bottom), new Point(0, top));
            axisY.strokeColor = originColor;
            axisY.strokeWidth = axisWidth;
            gridLayer.addChild(axisY);

            if (zoom > 0.3) {
                const size = 20 / zoom;
                const origin = new Point(bounds.left + size * 1.5, bounds.bottom - size * 1.5);
                const xArrow = new Path.Line(origin, new Point(origin.x + size, origin.y));
                xArrow.strokeColor = new Color(0.8, 0.2, 0.2);
                xArrow.strokeWidth = axisWidth;
                gridLayer.addChild(xArrow);
                const yArrow = new Path.Line(origin, new Point(origin.x, origin.y + size));
                yArrow.strokeColor = new Color(0.2, 0.8, 0.2);
                yArrow.strokeWidth = axisWidth;
                gridLayer.addChild(yArrow);
                const labelX = new PointText(new Point(origin.x + size + 4, origin.y - 2));
                labelX.content = 'X';
                labelX.fillColor = new Color(0.8, 0.2, 0.2);
                labelX.fontSize = Math.max(8, 10 / zoom);
                gridLayer.addChild(labelX);
                const labelY = new PointText(new Point(origin.x - 2, origin.y + size + 6));
                labelY.content = 'Y';
                labelY.fillColor = new Color(0.2, 0.8, 0.2);
                labelY.fontSize = Math.max(8, 10 / zoom);
                gridLayer.addChild(labelY);
            }
        }

        // ============================================================
        //  ZOOM
        // ============================================================
        function zoomExtents() {
            let allBounds = null;
            for (let internal in layers) {
                const layer = layers[internal];
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                    layer === previewLayer || layer === gripLayer) continue;
                if (layer.children.length > 0) {
                    const b = layer.bounds;
                    if (b.width > 0 || b.height > 0) allBounds = allBounds ? allBounds.unite(b) : b;
                }
            }
            if (allBounds) {
                const pad = 50;
                const sx = (view.size.width - pad * 2) / allBounds.width;
                const sy = (view.size.height - pad * 2) / allBounds.height;
                view.zoom = Math.min(sx, sy);
                view.center = allBounds.center;
            } else { view.zoom = 1;
                view.center = new Point(0, 0); }
            drawGrid();
            refreshStrokeWidths();
            renderGrips();
            view.update();
        }

        function onMouseWheel(event) {
            event.preventDefault();
            const mousePos = view.getEventPoint(event);
            if (!mousePos) return;
            const delta = Math.sign(event.deltaY) * -0.01;
            const oldZoom = view.zoom;
            let newZoom = oldZoom * (1 + delta);
            newZoom = Math.max(0.01, Math.min(100, newZoom));
            const ratio = newZoom / oldZoom;
            const newCenter = mousePos.add(view.center.subtract(mousePos).multiply(1 / ratio));
            view.zoom = newZoom;
            view.center = newCenter;
            drawGrid();
            refreshStrokeWidths();
            renderGrips();
            view.update();
        }

        // ============================================================
        //  IMPORTAR / EXPORTAR DXF (CORREGIDO)
        // ============================================================
        function getCurrentDrawingBounds() {
            let allBounds = null;
            for (let internal in layers) {
                const layer = layers[internal];
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                    layer === previewLayer || layer === gripLayer) continue;
                if (layer.children.length > 0) {
                    const b = layer.bounds;
                    if (b && (b.width > 0 || b.height > 0)) {
                        allBounds = allBounds ? allBounds.unite(b) : b;
                    }
                }
            }
            return allBounds;
        }

        function importDXF(file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const result = parseDXF(ev.target.result);
                    if (result && result.length > 0) {
                        setPrompt(`DXF importado: ${result.length} entidades`);
                        zoomExtents();
                    } else {
                        setPrompt('No se encontraron entidades válidas');
                    }
                } catch (err) {
                    console.error(err);
                    setPrompt('Error al importar: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function parseDXF(dxfText) {
            const lines = dxfText.split(/\r?\n/).map(l => l.trim());
            let i = 0;
            const itemsToAdd = [];
            while (i < lines.length && lines[i] !== 'ENTITIES' && lines[i] !== 'entities') i++;
            if (i >= lines.length) {
                setPrompt('No se encontró sección ENTITIES');
                return [];
            }
            i++;

            while (i < lines.length && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') {
                if (lines[i] === '0') {
                    const type = lines[i + 1] ? lines[i + 1].toUpperCase() : '';
                    i += 2;
                    const codes = [];
                    while (i < lines.length && lines[i] !== '0' && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') {
                        const code = parseInt(lines[i], 10);
                        const value = lines[i + 1] || '';
                        if (!isNaN(code)) codes.push({ code, value });
                        i += 2;
                    }
                    const get = (c) => parseFloat(codes.find(p => p.code === c)?.value);
                    const layerCode = codes.find(p => p.code === 8);
                    const originalLayerName = layerCode ? layerCode.value : '0';

                    try {
                        if (type === 'LINE') {
                            const x1 = get(10),
                                y1 = get(20),
                                x2 = get(11),
                                y2 = get(21);
                            if (!isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
                                const line = new Path.Line(new Point(x1, -y1), new Point(x2, -y2));
                                line.strokeColor = 'white';
                                line.strokeWidth = currentStrokeWidth();
                                tagShape(line, 'line');
                                itemsToAdd.push({ item: line, layer: originalLayerName });
                            }
                        } else if (type === 'CIRCLE') {
                            const cx = get(10),
                                cy = get(20),
                                r = get(40);
                            if (!isNaN(cx) && !isNaN(cy) && !isNaN(r) && r > 0) {
                                const circle = new Path.Circle(new Point(cx, -cy), r);
                                circle.strokeColor = 'white';
                                circle.strokeWidth = currentStrokeWidth();
                                tagShape(circle, 'circle');
                                circle.data.radius = r;
                                itemsToAdd.push({ item: circle, layer: originalLayerName });
                            }
                        } else if (type === 'ARC') {
                            const cx = get(10),
                                cy = get(20),
                                r = get(40);
                            const sa = get(50),
                                ea = get(51);
                            if (!isNaN(cx) && !isNaN(cy) && !isNaN(r) && r > 0 && !isNaN(sa) && !isNaN(ea)) {
                                // Convertir a radianes
                                const aRad = sa * Math.PI / 180;
                                const bRad = ea * Math.PI / 180;
                                let sweep = bRad - aRad;
                                if (sweep < 0) sweep += 2 * Math.PI;
                                const midRad = aRad + sweep / 2;
                                const fromDxf = new Point(cx + r * Math.cos(aRad), cy + r * Math.sin(aRad));
                                const toDxf = new Point(cx + r * Math.cos(bRad), cy + r * Math.sin(bRad));
                                const midDxf = new Point(cx + r * Math.cos(midRad), cy + r * Math.sin(midRad));
                                const from = new Point(fromDxf.x, -fromDxf.y);
                                const to = new Point(toDxf.x, -toDxf.y);
                                const through = new Point(midDxf.x, -midDxf.y);
                                const arc = new Path.Arc(from, through, to);
                                arc.strokeColor = 'white';
                                arc.strokeWidth = currentStrokeWidth();
                                tagShape(arc, 'arc');
                                itemsToAdd.push({ item: arc, layer: originalLayerName });
                            }
                        } else if (type === 'LWPOLYLINE') {
                            const vertsDxf = [];
                            const bulges = [];
                            for (let j = 0; j < codes.length; j++) {
                                const c = codes[j];
                                if (c.code === 10) {
                                    const x = parseFloat(c.value);
                                    let y = 0,
                                        bulge = 0;
                                    if (j + 1 < codes.length && codes[j + 1].code === 20) {
                                        y = parseFloat(codes[j + 1].value);
                                        j++;
                                    }
                                    if (j + 1 < codes.length && codes[j + 1].code === 42) {
                                        bulge = parseFloat(codes[j + 1].value);
                                        j++;
                                    }
                                    vertsDxf.push({ x, y });
                                    bulges.push(isNaN(bulge) ? 0 : bulge);
                                }
                            }
                            const closed = (parseInt(codes.find(p => p.code === 70)?.value || '0', 10) & 1) === 1;
                            if (vertsDxf.length > 1) {
                                const poly = buildPolyline(vertsDxf, bulges, closed);
                                if (poly) {
                                    poly.strokeColor = 'white';
                                    poly.strokeWidth = currentStrokeWidth();
                                    itemsToAdd.push({ item: poly, layer: originalLayerName });
                                }
                            }
                        } else if (type === 'POLYLINE') {
                            const closed = (parseInt(codes.find(p => p.code === 70)?.value || '0', 10) & 1) === 1;
                            const vertsDxf = [];
                            const bulges = [];
                            while (i < lines.length && lines[i] === '0') {
                                const subType = lines[i + 1] ? lines[i + 1].toUpperCase() : '';
                                if (subType === 'SEQEND') {
                                    i += 2;
                                    while (i < lines.length && lines[i] !== '0' && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') i += 2;
                                    break;
                                }
                                if (subType !== 'VERTEX') break;
                                i += 2;
                                const vcodes = [];
                                while (i < lines.length && lines[i] !== '0' && lines[i] !== 'ENDSEC' && lines[i] !== 'endsec') {
                                    const vcode = parseInt(lines[i], 10);
                                    const vvalue = lines[i + 1] || '';
                                    if (!isNaN(vcode)) vcodes.push({ code: vcode, value: vvalue });
                                    i += 2;
                                }
                                const vx = parseFloat(vcodes.find(p => p.code === 10)?.value);
                                const vy = parseFloat(vcodes.find(p => p.code === 20)?.value);
                                const vbulge = parseFloat(vcodes.find(p => p.code === 42)?.value);
                                if (!isNaN(vx) && !isNaN(vy)) {
                                    vertsDxf.push({ x: vx, y: vy });
                                    bulges.push(isNaN(vbulge) ? 0 : vbulge);
                                }
                            }
                            if (vertsDxf.length > 1) {
                                const poly = buildPolyline(vertsDxf, bulges, closed);
                                if (poly) {
                                    poly.strokeColor = 'white';
                                    poly.strokeWidth = currentStrokeWidth();
                                    itemsToAdd.push({ item: poly, layer: originalLayerName });
                                }
                            }
                        }
                    } catch (err) {
                        console.warn('Error al procesar entidad DXF:', err);
                    }
                } else {
                    i++;
                }
            }

            if (itemsToAdd.length === 0) return [];

            const currentBounds = getCurrentDrawingBounds();
            const tempGroup = new Group();
            itemsToAdd.forEach(({ item }) => tempGroup.addChild(item));
            const newBounds = tempGroup.bounds;
            tempGroup.removeChildren();
            tempGroup.remove();

            let offsetX = 0;
            if (currentBounds && newBounds && newBounds.width > 0) {
                const gap = 20;
                const targetLeft = currentBounds.right + gap;
                offsetX = targetLeft - newBounds.left;
            }
            if (offsetX !== 0) {
                itemsToAdd.forEach(({ item }) => item.translate(new Point(offsetX, 0)));
            }

            saveState();
            itemsToAdd.forEach(({ item, layer: originalLayerName }) => {
                const internal = safeName(originalLayerName);
                if (!layers[internal]) createLayer(internal);
                layers[internal].addChild(item);
            });
            renderLayerList();
            return itemsToAdd;
        }

        function buildPolyline(vertsDxf, bulges, closed) {
            if (vertsDxf.length < 2) return null;
            const path = new Path();
            path.moveTo(new Point(vertsDxf[0].x, -vertsDxf[0].y));
            for (let i = 0; i < vertsDxf.length; i++) {
                const nextIdx = (i + 1) % vertsDxf.length;
                if (i === vertsDxf.length - 1 && !closed) break;
                const bulge = bulges[i] || 0;
                if (i === vertsDxf.length - 1 && closed && bulge === 0) break;
                const p1 = vertsDxf[i],
                    p2 = vertsDxf[nextIdx];
                const pt1 = new Point(p1.x, -p1.y);
                const pt2 = new Point(p2.x, -p2.y);
                if (bulge === 0) {
                    path.lineTo(pt2);
                } else {
                    const chord = new Point(p2.x - p1.x, p2.y - p1.y);
                    const chordLen = chord.length;
                    if (chordLen < 1e-10) { path.lineTo(pt2); continue; }
                    const sagitta = bulge * chordLen / 2;
                    const radius = (chordLen * chordLen) / (8 * Math.abs(sagitta)) + Math.abs(sagitta) / 2;
                    const midPoint = new Point((p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
                    const perp = chord.rotate(bulge > 0 ? 90 : -90).normalize();
                    const centerDist = radius - Math.abs(sagitta);
                    const center = midPoint.add(perp.multiply(centerDist));
                    const startAngle = Math.atan2(p1.y - center.y, p1.x - center.x);
                    const endAngle = Math.atan2(p2.y - center.y, p2.x - center.x);
                    let sweep = endAngle - startAngle;
                    if (bulge > 0 && sweep < 0) sweep += 2 * Math.PI;
                    else if (bulge < 0 && sweep > 0) sweep -= 2 * Math.PI;
                    const midAngle = startAngle + sweep / 2;
                    const midDxf = new Point(center.x + radius * Math.cos(midAngle), center.y + radius * Math.sin(midAngle));
                    const through = new Point(midDxf.x, -midDxf.y);
                    path.arcTo(through, pt2);
                }
            }
            path.closed = closed;
            tagShape(path, 'polyline');
            return path;
        }

        // ============================================================
        //  EXPORTACIÓN DXF (R12) – CORREGIDO
        // ============================================================
        function exportDXF() {
            const dxf = generateDXF();
            if (!dxf) {
                setPrompt('No hay entidades para exportar');
                return;
            }
            const bom = '\uFEFF';
            const content = bom + dxf;
            const blob = new Blob([content], { type: 'application/dxf;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dibujo.dxf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setPrompt('DXF exportado correctamente (AutoCAD R12+)');
        }

        function generateDXF() {
            let dxf = '';
            dxf += '0\nSECTION\n2\nHEADER\n';
            dxf += '9\n$ACADVER\n1\nAC1009\n';
            dxf += '9\n$INSBASE\n10\n0.0\n20\n0.0\n30\n0.0\n';
            dxf += '9\n$EXTMIN\n10\n-1000.0\n20\n-1000.0\n30\n0.0\n';
            dxf += '9\n$EXTMAX\n10\n1000.0\n20\n1000.0\n30\n0.0\n';
            dxf += '9\n$LIMMIN\n10\n0.0\n20\n0.0\n';
            dxf += '9\n$LIMMAX\n10\n420.0\n20\n297.0\n';
            dxf += '0\nENDSEC\n';

            dxf += '0\nSECTION\n2\nTABLES\n';
            let layerNames = ['0'];
            for (let internal in layers) {
                const l = layers[internal];
                if (l !== gridLayer && l !== guideLayer && l !== snapLayer && l !== selectionLayer && l !== previewLayer && l !== gripLayer) {
                    const name = l.data.originalName || '0';
                    if (name !== '0' && !layerNames.includes(name)) layerNames.push(name);
                }
            }
            dxf += '0\nTABLE\n2\nLAYER\n70\n' + layerNames.length + '\n';
            layerNames.forEach(name => {
                dxf += '0\nLAYER\n';
                dxf += '2\n' + name + '\n';
                dxf += '70\n0\n';
                dxf += '62\n7\n';
                dxf += '6\nCONTINUOUS\n';
            });
            dxf += '0\nENDTAB\n';

            dxf += '0\nTABLE\n2\nLTYPE\n70\n1\n';
            dxf += '0\nLTYPE\n';
            dxf += '2\nCONTINUOUS\n';
            dxf += '70\n0\n';
            dxf += '3\nLínea continua\n';
            dxf += '72\n65\n';
            dxf += '73\n0\n';
            dxf += '40\n0.0\n';
            dxf += '0\nENDTAB\n';

            dxf += '0\nTABLE\n2\nSTYLE\n70\n1\n';
            dxf += '0\nSTYLE\n';
            dxf += '2\nSTANDARD\n';
            dxf += '70\n0\n';
            dxf += '40\n0.0\n';
            dxf += '41\n1.0\n';
            dxf += '50\n0.0\n';
            dxf += '71\n0\n';
            dxf += '42\n2.5\n';
            dxf += '3\narial.ttf\n';
            dxf += '4\n\n';
            dxf += '0\nENDTAB\n';
            dxf += '0\nENDSEC\n';

            dxf += '0\nSECTION\n2\nBLOCKS\n';
            dxf += '0\nENDSEC\n';

            dxf += '0\nSECTION\n2\nENTITIES\n';
            let hasEntities = false;
            for (let internal in layers) {
                const layer = layers[internal];
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                    layer === previewLayer || layer === gripLayer) continue;
                const layerName = layer.data.originalName || '0';
                layer.children.forEach(item => {
                    if (isLineItem(item)) {
                        const p1 = item.segments[0].point;
                        const p2 = item.segments[1].point;
                        dxf += '0\nLINE\n';
                        dxf += '8\n' + layerName + '\n';
                        dxf += '10\n' + p1.x.toFixed(6) + '\n';
                        dxf += '20\n' + (-p1.y).toFixed(6) + '\n';
                        dxf += '30\n0.0\n';
                        dxf += '11\n' + p2.x.toFixed(6) + '\n';
                        dxf += '21\n' + (-p2.y).toFixed(6) + '\n';
                        dxf += '31\n0.0\n';
                        hasEntities = true;
                    } else if (isCircleItem(item)) {
                        const c = item.position;
                        dxf += '0\nCIRCLE\n';
                        dxf += '8\n' + layerName + '\n';
                        dxf += '10\n' + c.x.toFixed(6) + '\n';
                        dxf += '20\n' + (-c.y).toFixed(6) + '\n';
                        dxf += '30\n0.0\n';
                        dxf += '40\n' + getCircleRadius(item).toFixed(6) + '\n';
                        hasEntities = true;
                    } else if (isArcItem(item) && item.segments.length > 1) {
                        // Reconstruir centro y ángulos (corregido)
                        const p0 = item.segments[0].point;
                        const p1 = item.segments[item.segments.length - 1].point;
                        const midIdx = Math.floor(item.segments.length / 2);
                        const mid = item.segments[midIdx].point;
                        const center = circumcenter(p0, mid, p1);
                        if (center) {
                            const radius = center.getDistance(p0);
                            const toDxfAngle = (p) => {
                                const dx = p.x - center.x;
                                const dy = -(p.y - center.y);
                                let a = Math.atan2(dy, dx) * 180 / Math.PI;
                                if (a < 0) a += 360;
                                return a;
                            };
                            let sa = toDxfAngle(p0);
                            let ea = toDxfAngle(p1);
                            const ma = toDxfAngle(mid);
                            let sweep = ea - sa;
                            if (sweep < 0) sweep += 360;
                            let midOffset = ma - sa;
                            if (midOffset < 0) midOffset += 360;
                            if (midOffset > sweep) {
                                const tmp = sa;
                                sa = ea;
                                ea = tmp;
                                sweep = 360 - sweep;
                            }
                            dxf += '0\nARC\n';
                            dxf += '8\n' + layerName + '\n';
                            dxf += '10\n' + center.x.toFixed(6) + '\n';
                            dxf += '20\n' + (-center.y).toFixed(6) + '\n';
                            dxf += '30\n0.0\n';
                            dxf += '40\n' + radius.toFixed(6) + '\n';
                            dxf += '50\n' + sa.toFixed(6) + '\n';
                            dxf += '51\n' + ea.toFixed(6) + '\n';
                            hasEntities = true;
                        }
                    } else if (item instanceof Path && item.segments.length > 1) {
                        const pts = item.segments.map(s => s.point);
                        if (pts.length < 2) return;
                        dxf += '0\nPOLYLINE\n';
                        dxf += '8\n' + layerName + '\n';
                        dxf += '66\n1\n';
                        dxf += '70\n' + (item.closed ? 1 : 0) + '\n';
                        dxf += '10\n0.0\n20\n0.0\n30\n0.0\n';
                        pts.forEach(p => {
                            dxf += '0\nVERTEX\n';
                            dxf += '8\n' + layerName + '\n';
                            dxf += '10\n' + p.x.toFixed(6) + '\n';
                            dxf += '20\n' + (-p.y).toFixed(6) + '\n';
                            dxf += '30\n0.0\n';
                            dxf += '70\n0\n';
                        });
                        dxf += '0\nSEQEND\n';
                        dxf += '8\n' + layerName + '\n';
                        hasEntities = true;
                    }
                });
            }
            dxf += '0\nENDSEC\n';
            dxf += '0\nEOF\n';
            return hasEntities ? dxf : null;
        }

            if (e.key === 'Enter') {
                const input = cmdInputEl.value.trim();
                if (!input && state.pendingCommand) {
                    finalizePendingSelection();
                    cmdInputEl.value = '';
                    e.preventDefault();
                    return;
                }
                if (!input && state.currentCommand === 'LINE' && state.expectingPoint &&
                    state.collectedPoints.length >= 2) {
                    setPrompt('LINE finalizado');
                    resetStateCmd();
                    cmdInputEl.value = '';
                    e.preventDefault();
                    return;
                }
                if (input.toUpperCase() === 'C' && state.currentCommand === 'LINE' && state.expectingPoint &&
                    state.collectedPoints.length >= 2) {
                    saveState();
                    const last = state.collectedPoints[state.collectedPoints.length - 1];
                    const first = state.collectedPoints[0];
                    const closeLine = new Path.Line(last, first);
                    closeLine.strokeColor = 'white';
                    closeLine.strokeWidth = currentStrokeWidth();
                    tagShape(closeLine, 'line');
                    activeLayer.addChild(closeLine);
                    setPrompt('LINE cerrado');
                    resetStateCmd();
                    cmdInputEl.value = '';
                    e.preventDefault();
                    return;

                if (!input && state.currentCommand && !state.expectingPoint &&
                    (state.currentCommand === 'TRIM' || state.currentCommand === 'EXTEND')) {
                    setPrompt(`${state.currentCommand} finalizado`);
                    resetStateCmd();
                    cmdInputEl.value = '';
                    e.preventDefault();
                    return;
                }
                if (!input && state.currentCommand === 'COPY' && state.step === 2) {
                    setPrompt('COPY finalizado');
                    resetStateCmd();
                    cmdInputEl.value = '';
                    e.preventDefault();
                    return;

                if (!input && state.currentCommand === 'OFFSET' && state.step >= 2) {
                    setPrompt('OFFSET finalizado');
                    resetStateCmd();
                    cmdInputEl.value = '';
                    e.preventDefault();
                    return;
                }
                if (input) {
                    state.commandHistory.push(input);
                    state.historyIdx = state.commandHistory.length;
                    if (state.waitingForNumber) {
                        const dist = parseFloat(input);
                        if (!isNaN(dist) && dist > 0) {
                            state.offsetDistance = dist;

                            state.step = 2;
                            setPrompt(`OFFSET: Distancia ${dist}. Selecciona objeto a desplazar (Enter/ESC para salir)`);
                            state.expectingPoint = false;
                        } else {
                            setPrompt('Distancia inválida. Introduce un número positivo.');
                        }
                        cmdInputEl.value = '';
                        e.preventDefault();
                        return;
                    }
                    if (state.currentCommand === 'ROTATE' && state.step === 2) {
                        const ang = parseFloat(input);
                        if (!isNaN(ang)) {
                            saveState();
                            state.selectedItems.forEach(i => i.rotate(ang, state.basePoint));
                            resetStateCmd();
                            previewLayer.removeChildren();

                        } else {

                        }
                        cmdInputEl.value = '';
                        e.preventDefault();
                        return;

                    if (state.currentCommand === 'SCALE' && state.step === 2) {
                        const sf = parseFloat(input);
                        if (!isNaN(sf) && sf > 0) {
                            saveState();
                            state.selectedItems.forEach(i => i.scale(sf, state.basePoint));
                            resetStateCmd();

                        e.preventDefault();

                        if (pt) handlePointInput(pt);
                        else setPrompt('Entrada no válida. Usa: X,Y  |  @dX,dY  |  @dist<ángulo  |  distancia');
                    } else {

                }
                cmdInputEl.value = '';
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (state.commandHistory.length > 0) {
                    if (state.historyIdx > 0) state.historyIdx--;
                    cmdInputEl.value = state.commandHistory[state.historyIdx] || '';

            } else if (e.key === 'ArrowDown') {
                e.preventDefault();

                    cmdInputEl.value = state.commandHistory[state.historyIdx] || '';

            // ================================================================
            //  ENTRADA DE TECLADO ESTILO AUTOCAD: cualquier tecla escrita en
            //  cualquier momento (con el foco en el lienzo o en cualquier parte
            //  de la app) se dirige automáticamente a la línea de comandos, tal
            //  como sucede en AutoCAD. Así, cualquier herramienta admite
            //  coordenadas, distancias y ángulos sin tener que hacer clic antes
            //  en el cuadro de comando.
            const active = document.activeElement;
            const alreadyTyping = active && active !== document.body &&
                (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
            if (!alreadyTyping && !e.ctrlKey && !e.metaKey && !e.altKey) {
                // ENTER o BARRA ESPACIADORA sin comando activo repiten el último comando
                if ((e.key === 'Enter' || e.key === ' ') && !state.currentCommand) {
                    if (state.lastCommand) {
                        e.preventDefault();
                        executeCommand(state.lastCommand);

                } else if ((e.key === 'Enter' || e.key === ' ') && state.pendingCommand) {
                    // Confirma la selección reunida y pasa al siguiente paso del comando (como en AutoCAD)
                    e.preventDefault();
                    finalizePendingSelection();
                } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand === 'LINE' &&
                    state.expectingPoint && state.collectedPoints.length >= 2) {
                    e.preventDefault();
                    setPrompt('LINE finalizado');
                    resetStateCmd();
                } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand && !state.expectingPoint &&
                    (state.currentCommand === 'TRIM' || state.currentCommand === 'EXTEND')) {
                    e.preventDefault();
                    setPrompt(`${state.currentCommand} finalizado`);

                } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand === 'COPY' && state.step === 2) {
                    e.preventDefault();
                    setPrompt('COPY finalizado');
                    resetStateCmd();
                } else if ((e.key === 'Enter' || e.key === ' ') && state.currentCommand === 'OFFSET' && state.step >= 2) {
                    e.preventDefault();

        function updateNavigator() {
            const ctx = navCanvas.getContext('2d');
            navCanvas.width = 150;
            navCanvas.height = 120;
            ctx.clearRect(0, 0, 150, 120);
            const bounds = getCurrentDrawingBounds();
            if (!bounds) {
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, 150, 120);
                return;
            }
            const scaleX = 150 / bounds.width;
            const scaleY = 120 / bounds.height;
            const scale = Math.min(scaleX, scaleY);
            const offsetX = (150 - bounds.width * scale) / 2 - bounds.left * scale;
            const offsetY = (120 - bounds.height * scale) / 2 - bounds.top * scale;
            ctx.fillStyle = '#1E1E1E';
            ctx.fillRect(0, 0, 150, 120);
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 1;
            for (let internal in layers) {
                const layer = layers[internal];
                if (layer === gridLayer || layer === guideLayer || layer === snapLayer || layer === selectionLayer ||
                    layer === previewLayer || layer === gripLayer) continue;
                layer.children.forEach(item => {
                    if (isLineItem(item)) {
                        const p1 = item.segments[0].point,
                            p2 = item.segments[1].point;
                        ctx.beginPath();
                        ctx.moveTo(p1.x * scale + offsetX, p1.y * scale + offsetY);
                        ctx.lineTo(p2.x * scale + offsetX, p2.y * scale + offsetY);
                        ctx.stroke();
                    } else if (isCircleItem(item)) {
                        const c = item.position;
                        ctx.beginPath();
                        ctx.arc(c.x * scale + offsetX, c.y * scale + offsetY, getCircleRadius(item) * scale, 0, Math.PI * 2);
                        ctx.stroke();
                    } else if (item instanceof Path && item.segments && item.segments.length > 1) {
                        ctx.beginPath();
                        item.segments.forEach((s, idx) => {
                            const x = s.point.x * scale + offsetX;
                            const y = s.point.y * scale + offsetY;
                            if (idx === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        });
                        if (item.closed) ctx.closePath();
                        ctx.stroke();
                    }
                });
            }
            const vx = view.center.x - view.size.width / 2 / view.zoom;
            const vy = view.center.y - view.size.height / 2 / view.zoom;
            const vw = view.size.width / view.zoom;
            const vh = view.size.height / view.zoom;
            ctx.strokeStyle = '#00BFFF';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(vx * scale + offsetX, vy * scale + offsetY, vw * scale, vh * scale);
        }

        function syncViewSize() {

            if (view.viewSize.width === w && view.viewSize.height === h) return;
            const center = view.center;

            view.zoom = zoom;
            drawGrid();
            view.update();
        }

        const canvasContainerEl = document.getElementById('canvas-container');
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(() => {
                if (resizeRAF) cancelAnimationFrame(resizeRAF);
                resizeRAF = requestAnimationFrame(syncViewSize);
            });
            ro.observe(canvasContainerEl);
        }
        window.addEventListener('resize', syncViewSize);

        const propertiesPanelEl = document.getElementById('properties-panel');
        if (window.MutationObserver) {
            const mo = new MutationObserver(() => {
                requestAnimationFrame(syncViewSize);
            });
            mo.observe(propertiesPanelEl, { attributes: true, attributeFilter: ['class'] });
        }

        syncViewSize();

        console.log('CAD Pro cargado y optimizado.');
    </script>
</body>
</html>
